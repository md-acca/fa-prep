<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FA Combined Mock</title>
<style>
  :root{
    --navy:#003366; --navy-light:#1a4d80; --accent:#0a66c2;
    --green:#1e7e34; --green-bg:#e6f4ea; --red:#c0392b; --red-bg:#fdecea;
    --amber:#9a6700; --amber-bg:#fff8e1; --grey:#f5f5f5; --border:#d9d9d9;
    --text:#1f2933; --muted:#5b6770;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);background:#eef1f4;line-height:1.55;}
  button{font-family:inherit;cursor:pointer;}

  /* ===== Top bar ===== */
  #topbar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:12px;}
  #topbar .title{font-weight:600;font-size:15px;letter-spacing:.3px;}
  #topbar .controls{display:flex;align-items:center;gap:10px;}
  #topbar button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);
    border-radius:6px;padding:6px 12px;font-size:13px;}
  #topbar button:hover{background:rgba(255,255,255,.22);}
  #timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;
    background:rgba(0,0,0,.2);padding:6px 12px;border-radius:6px;min-width:78px;text-align:center;}
  #timer.warn{background:var(--red);}

  /* ===== Sub-banner ===== */
  #subbanner{background:#fff;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;padding:8px 18px;font-size:14px;}
  #subbanner .qpos{font-weight:600;color:var(--navy);}
  #subbanner .right{display:flex;align-items:center;gap:14px;}
  #subbanner .marks{color:var(--muted);}
  #flagBtn{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--muted);}
  #flagBtn.flagged{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);font-weight:600;}

  /* ===== Layout ===== */
  #layout{display:flex;max-width:1180px;margin:0 auto;gap:18px;padding:18px;align-items:flex-start;}
  #navPanel{flex:0 0 200px;position:sticky;top:108px;background:#fff;border:1px solid var(--border);
    border-radius:10px;padding:14px;}
  #navPanel h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
  #navGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .navcell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;
    border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text);position:relative;}
  .navcell.answered{background:var(--navy);color:#fff;border-color:var(--navy);}
  .navcell.current{outline:3px solid var(--accent);outline-offset:1px;}
  .navcell.flagged::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--amber);}
  .navcell.mtq{border-style:dashed;}
  #navLegend{margin-top:12px;font-size:11px;color:var(--muted);display:grid;gap:4px;}
  #navLegend span{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-right:5px;}
  #navProgress{margin-top:12px;font-size:12px;color:var(--muted);}

  #main{flex:1;min-width:0;}
  .card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:22px 24px;}

  .scenario{background:var(--grey);border-left:4px solid var(--navy);border-radius:4px;
    padding:14px 16px;margin-bottom:18px;line-height:1.6;white-space:pre-wrap;font-size:13.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:auto;}
  .mtq-title{font-size:17px;font-weight:700;color:var(--navy);margin:0 0 4px;}
  .mtq-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;}

  .qtext{font-size:15.5px;font-weight:600;margin-bottom:16px;white-space:pre-wrap;}
  .part-block{border-top:1px solid var(--border);padding-top:18px;margin-top:18px;}
  .part-block:first-of-type{border-top:none;padding-top:0;margin-top:0;}
  .part-label{font-weight:700;color:var(--navy);margin-bottom:8px;font-size:14.5px;}
  .part-prompt{font-weight:500;margin-bottom:12px;white-space:pre-wrap;}

  /* Options */
  .opt{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--border);border-radius:8px;
    padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .12s,background .12s;}
  .opt:hover{border-color:var(--accent);background:#f7fafd;}
  .opt.selected{border-color:var(--navy);background:#eef4fb;}
  .opt input{margin-top:3px;flex:0 0 auto;}
  .opt .letter{font-weight:700;color:var(--navy);margin-right:2px;}
  .selectlabel{font-size:12.5px;color:var(--amber);background:var(--amber-bg);display:inline-block;
    padding:2px 9px;border-radius:20px;margin-bottom:10px;font-weight:600;}

  /* Number input */
  .numwrap{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .numprefix{font-weight:700;font-size:18px;color:var(--navy);}
  .numwrap input{font-size:16px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;width:200px;
    font-variant-numeric:tabular-nums;}
  .numwrap input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .numhint{font-size:12px;color:var(--muted);margin-bottom:6px;}

  /* Guess */
  .guess{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--muted);
    background:#fafbfc;border:1px dashed var(--border);border-radius:6px;padding:8px 11px;}
  .guess input{flex:0 0 auto;}

  /* Bottom nav */
  #bottomnav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px;}
  .btn{border-radius:8px;padding:11px 22px;font-size:14px;font-weight:600;border:1px solid var(--navy);}
  .btn.outline{background:#fff;color:var(--navy);}
  .btn.outline:disabled{opacity:.4;cursor:not-allowed;}
  .btn.filled{background:var(--navy);color:#fff;}
  .btn.filled:hover{background:var(--navy-light);}
  .btn.submit{background:var(--green);border-color:var(--green);color:#fff;}
  .btn.submit:hover{filter:brightness(1.07);}

  /* ===== Modal ===== */
  #modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;
    justify-content:center;z-index:100;padding:20px;}
  #modalOverlay.show{display:flex;}
  .modal{background:#fff;border-radius:12px;max-width:440px;width:100%;padding:26px;box-shadow:0 18px 50px rgba(0,0,0,.3);}
  .modal h2{margin:0 0 12px;font-size:19px;color:var(--navy);}
  .modal p{margin:0 0 18px;font-size:14px;color:var(--text);}
  .modal .actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;}

  /* Calculator */
  #calc{position:fixed;bottom:24px;right:24px;z-index:90;background:#fff;border:1px solid var(--border);
    border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.25);padding:14px;width:240px;display:none;}
  #calc.show{display:block;}
  #calcDisplay{width:100%;text-align:right;font-size:20px;padding:10px;border:1px solid var(--border);
    border-radius:8px;margin-bottom:10px;font-variant-numeric:tabular-nums;background:#f7f9fb;min-height:44px;
    overflow:hidden;}
  #calcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  #calcGrid button{padding:11px 0;font-size:15px;border:1px solid var(--border);border-radius:7px;background:#fff;}
  #calcGrid button:hover{background:#eef4fb;}
  #calcGrid button.op{background:var(--navy);color:#fff;border-color:var(--navy);}
  #calcGrid button.eq{background:var(--green);color:#fff;border-color:var(--green);}
  #calcGrid button.wide{grid-column:span 2;}
  #calcHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  #calcHead strong{font-size:13px;color:var(--navy);}
  #calcHead button{background:none;border:none;font-size:18px;color:var(--muted);line-height:1;}

  /* Pause overlay */
  #pauseOverlay{position:fixed;inset:0;background:rgba(0,51,102,.96);color:#fff;z-index:120;
    display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  #pauseOverlay.show{display:flex;}
  #pauseOverlay h1{font-size:30px;margin-bottom:8px;}
  #pauseOverlay p{font-size:15px;opacity:.85;margin-bottom:24px;}

  /* ===== Results ===== */
  #results{display:none;max-width:1000px;margin:0 auto;padding:18px;}
  #results.show{display:block;}
  .scorebanner{border-radius:14px;padding:28px;color:#fff;text-align:center;margin-bottom:20px;}
  .scorebanner.pass{background:linear-gradient(135deg,#1e7e34,#2faa4d);}
  .scorebanner.fail{background:linear-gradient(135deg,#a5302a,#c0392b);}
  .scorebanner .big{font-size:46px;font-weight:800;line-height:1;}
  .scorebanner .pct{font-size:20px;margin-top:6px;opacity:.95;}
  .scorebanner .verdict{font-size:15px;margin-top:10px;text-transform:uppercase;letter-spacing:1px;}
  .meta{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-size:13px;color:var(--muted);margin-bottom:20px;}
  .meta div{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 14px;}
  .resbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;}

  table.subtopic{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);
    border-radius:10px;overflow:hidden;margin-bottom:26px;font-size:13px;}
  table.subtopic th,table.subtopic td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);}
  table.subtopic th{background:var(--navy);color:#fff;font-weight:600;}
  table.subtopic tr:last-child td{border-bottom:none;}
  table.subtopic .pctcell{font-weight:700;}

  .rescard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;}
  .rescard .rhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;}
  .rescard .qnum{font-weight:700;color:var(--navy);font-size:15px;}
  .rescard .qsub{font-size:12px;color:var(--muted);}
  .rescard .verdict-pill{font-size:12px;font-weight:700;padding:3px 11px;border-radius:20px;white-space:nowrap;}
  .verdict-pill.right{background:var(--green-bg);color:var(--green);}
  .verdict-pill.wrong{background:var(--red-bg);color:var(--red);}
  .verdict-pill.partial{background:var(--amber-bg);color:var(--amber);}
  .rescard .qbody{font-size:14px;margin:10px 0;white-space:pre-wrap;}

  .resopt{border:1px solid var(--border);border-radius:7px;padding:9px 13px;margin-bottom:7px;font-size:13.5px;}
  .resopt.correct{background:var(--green-bg);border-color:var(--green);}
  .resopt.userwrong{background:var(--red-bg);border-color:var(--red);}
  .resopt .why{font-size:12.5px;color:var(--muted);margin-top:5px;}
  .resopt .tick{color:var(--green);font-weight:700;}
  .resopt .cross{color:var(--red);font-weight:700;}

  .numresult{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;}
  .numresult div{border-radius:8px;padding:9px 14px;font-size:13.5px;font-weight:600;}
  .numresult .ua{background:var(--red-bg);color:var(--red);border:1px solid var(--red);}
  .numresult .ua.ok{background:var(--green-bg);color:var(--green);border-color:var(--green);}
  .numresult .ca{background:var(--green-bg);color:var(--green);border:1px solid var(--green);}

  /* Layered explanation */
  .layers{margin-top:14px;border-top:1px dashed var(--border);padding-top:14px;}
  .layer{margin-bottom:11px;}
  .layer .ltitle{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);
    cursor:pointer;display:flex;align-items:center;gap:7px;user-select:none;}
  .layer .ltitle .chev{transition:transform .15s;}
  .layer.open .ltitle .chev{transform:rotate(90deg);}
  .layer .lbody{display:none;margin-top:7px;font-size:13.5px;}
  .layer.open .lbody{display:block;}
  .working{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#1f2933;color:#e8eef3;
    padding:13px 15px;border-radius:8px;white-space:pre-wrap;font-size:12.5px;line-height:1.55;overflow-x:auto;}
  .examiner{background:var(--amber-bg);border-left:3px solid var(--amber);padding:11px 14px;border-radius:4px;
    font-style:italic;font-size:13px;}
  .examiner::before{content:"📌 ";}
  .advanced{font-style:italic;color:var(--muted);font-size:12.5px;}
  .ifrs{font-size:13px;}
  .teacher{background:#eef4fb;border:1px solid #cfe0f2;border-radius:8px;padding:13px 15px;margin-top:12px;font-size:13px;}
  .teacher .tt{font-weight:700;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
  .revealAllBtn{font-size:12px;background:#fff;border:1px solid var(--accent);color:var(--accent);
    border-radius:6px;padding:5px 11px;margin-top:4px;}

  .mtq-part-result{border-top:1px solid var(--border);padding-top:14px;margin-top:14px;}
  .mtq-part-result:first-of-type{border-top:none;padding-top:0;margin-top:0;}

  @media(max-width:820px){
    #layout{flex-direction:column;}
    #navPanel{position:static;flex:1;width:100%;}
    #navGrid{grid-template-columns:repeat(10,1fr);}
  }

  /* ===== Print (mistakes PDF) ===== */
  @media print{
    body{background:#fff;}
    #topbar,#subbanner,#navPanel,#bottomnav,#calc,.resbtns,.meta,#testview,.revealAllBtn,.layer .ltitle{display:none !important;}
    #results{display:block !important;}
    .rescard{page-break-inside:avoid;border:1px solid #999;}
    .rescard.is-correct{display:none !important;}   /* only wrong answers print */
    .layer .lbody{display:block !important;}
    .layer{display:block !important;}
    .scorebanner{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    #printHeader{display:block !important;}
  }
  #printHeader{display:none;text-align:center;margin-bottom:18px;}
  #printHeader h1{font-size:20px;margin:0;color:#000;}
  #printHeader p{font-size:12px;color:#444;margin:4px 0 0;}
</style>
</head>
<body>

<div id="topbar">
  <div class="title" id="topbarTitle">FA Combined Mock</div>
  <div class="controls">
    <button id="calcToggle">📱 Calculator</button>
    <button id="pauseBtn">⏸ Pause</button>
    <div id="timer">--:--</div>
  </div>
</div>

<div id="subbanner">
  <div class="qpos" id="qpos">Question 1 of 37</div>
  <div class="right">
    <span class="marks" id="qmarks">2 marks</span>
    <button id="flagBtn">🚩 Flag</button>
  </div>
</div>

<!-- ===== TEST VIEW ===== -->
<div id="testview">
  <div id="layout">
    <aside id="navPanel">
      <h3>Question navigator</h3>
      <div id="navGrid"></div>
      <div id="navLegend">
        <div><span style="background:var(--navy)"></span>Answered</div>
        <div><span style="background:#fff;border:1px solid var(--border)"></span>Unanswered</div>
        <div><span style="background:var(--amber)"></span>Flagged</div>
      </div>
      <div id="navProgress">0 of 37 answered</div>
    </aside>
    <main id="main">
      <div class="card" id="qcard"><!-- question rendered here --></div>
      <div id="bottomnav">
        <button class="btn outline" id="prevBtn">← Previous</button>
        <div style="display:flex;gap:10px;">
          <button class="btn submit" id="submitBtn">Submit test</button>
          <button class="btn filled" id="nextBtn">Next →</button>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ===== RESULTS VIEW ===== -->
<div id="results">
  <div id="printHeader"></div>
  <div id="resContent"></div>
</div>

<!-- ===== Calculator ===== -->
<div id="calc">
  <div id="calcHead"><strong>Calculator</strong><button id="calcClose">×</button></div>
  <div id="calcDisplay">0</div>
  <div id="calcGrid"></div>
</div>

<!-- ===== Pause overlay ===== -->
<div id="pauseOverlay">
  <h1>Paused</h1>
  <p>The timer is stopped. Take a breath.</p>
  <button class="btn filled" id="resumeBtn" style="background:#fff;color:var(--navy);border-color:#fff;">Resume test</button>
</div>

<!-- ===== Modal ===== -->
<div id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <p id="modalMsg"></p>
    <div class="actions" id="modalActions"></div>
  </div>
</div>

<script type="application/json" id="testdata">{"config":{"topic":"FA Combined Mock","storagePrefix":"fa_v3_combomock_","totalMarks":100,"timeMinutes":120,"passMarkPct":50,"dashboardUrl":"https://md-acca.github.io/fa-prep/","syncKey":"fa_v3_pending_imports","schemaVersion":3,"poolName":"ComboMock"},"questions":[{"qId":"Q1","displayIdx":1,"type":"ot","questionType":"mcq","subTopic":"Sole trader profit from net assets (capital comparison)","marks":2,"questionText":"Which of the following calculates a sole trader's profit for a period?","options":[{"letter":"A","text":"Closing net assets + drawings - capital introduced - opening net assets","correct":true,"why":"Correct. Profit is the rise in net assets after stripping out the two owner-driven movements: drawings are added back, capital introduced is taken out."},{"letter":"B","text":"Closing net assets - drawings + capital introduced - opening net assets","correct":false,"why":"Both signs are reversed. This subtracts drawings (understating profit) and adds capital introduced (overstating it) - the classic 'wrong direction' error."},{"letter":"C","text":"Closing net assets - drawings - capital introduced - opening net assets","correct":false,"why":"Drawings wrongly deducted. Drawings reduced net assets without being an expense, so they must be added back, not subtracted."},{"letter":"D","text":"Closing net assets + drawings + capital introduced - opening net assets","correct":false,"why":"Capital introduced wrongly added. New capital raised net assets but is not profit, so it must be removed, not added."}],"correctAnswer":"A","explanationLayer1":"When a trader keeps no proper records, profit can still be found from the accounting equation: the business's net worth (net assets = assets - liabilities) only changes for three reasons - the business makes a profit/loss, the owner takes money out (drawings), or the owner puts money in (capital). Reverse the two owner movements and what's left is profit.","workingShown":"Profit = (Closing net assets - Opening net assets) + Drawings - Capital introduced.\nStep 1: Increase in net assets = Closing NA - Opening NA.\nStep 2: Add back drawings (they shrank net assets but weren't a trading loss).\nStep 3: Deduct capital introduced (it grew net assets but wasn't trading profit).\nWhat remains is the profit earned by trading.","explanationLayer3":"This is the 'business equation' / capital-comparison method (FA incomplete-records and 'accounting equation' chapter). It rests on: Closing capital = Opening capital + Profit - Drawings + Capital introduced. Rearranging for profit gives the formula in option A.","examinerNote":"The examiner offers all four sign permutations. The only trap is direction: drawings (+), capital introduced (-). Whisper it as you read: 'add what the owner took, subtract what the owner gave.'","teacherCommentary":"Concept: profit is the change in what the business is worth, cleaned of the owner's pocket movements. Process: opening vs closing net assets, then undo drawings and capital. Everyday: if your savings rose 5k but you'd also paid in 2k and spent 1k of it on yourself, you actually 'earned' 4k - same logic.","advancedContext":"This underpins Q34 (Amy) later in the paper, and the whole incomplete-records topic. Once you can find profit this way, you can rearrange the same equation to find any single missing figure (closing capital, drawings, or capital introduced)."},{"qId":"Q2","displayIdx":2,"type":"ot","questionType":"mcq","subTopic":"Imprest system of petty cash","marks":2,"questionText":"Which of the following explains the imprest system of operating petty cash?","options":[{"letter":"A","text":"The exact amount of expenditure is reimbursed at intervals to maintain a fixed float","correct":true,"why":"Correct. The defining feature: top up by exactly what was spent so the float returns to the same fixed amount each period."},{"letter":"B","text":"Regular equal amounts of cash are transferred into petty cash at intervals","correct":false,"why":"Fixed equal top-ups ignore what was actually spent, so the float drifts - that is the opposite of imprest."},{"letter":"C","text":"All expenditure out of the petty cash must be properly authorised","correct":false,"why":"True of good control in general, but it does not define the imprest system."},{"letter":"D","text":"Weekly expenditure cannot exceed a set amount","correct":false,"why":"A spending cap is a control feature, not the meaning of 'imprest'."}],"correctAnswer":"A","explanationLayer1":"Petty cash handles small everyday cash payments. The imprest system keeps it controlled by fixing a 'float' (say $100). At any moment, cash remaining plus the value of the vouchers for what's been spent should equal that fixed float.","workingShown":"Float = $100. During the period $73 is spent (vouchers held).\nCash left = 100 - 73 = $27.\nReimbursement = exactly $73 (the amount spent).\nFloat restored = 27 + 73 = $100. Each cycle returns to the same fixed figure.","explanationLayer3":"Imprest control principle (FA control-systems topic): reimbursement equals vouchered expenditure, so cash + vouchers = constant float. This makes the petty-cash balance self-checking and easy to audit.","examinerNote":"The decoys all sound 'sensible' (authorisation, caps, regular transfers). The examiner tests whether you know imprest specifically = reimburse the exact spend to restore a fixed float. Match on 'fixed float' + 'exact reimbursement'.","teacherCommentary":"Concept: a self-resetting cash tin. Process: spend then keep vouchers then top up by the spend. Everyday: like refilling your wallet to exactly 50 each Monday by replacing precisely what you spent last week.","advancedContext":"The self-balancing nature (cash + vouchers = float) is why imprest is favoured for internal control - any shortfall is instantly visible, which links to the controls/errors and trial-balance themes elsewhere in the paper."},{"qId":"Q3","displayIdx":3,"type":"ot","questionType":"mcq","subTopic":"Features of limited liability companies","marks":2,"questionText":"Which of the following statements are TRUE of limited liability companies?\n(1) The company's exposure to debts and liability is limited.\n(2) Financial statements must be produced.\n(3) A company continues to exist regardless of the identity of its owners.","options":[{"letter":"A","text":"1, 2 and 3","correct":true,"why":"Correct. Limited liability, a statutory duty to prepare financial statements, and perpetual succession are all defining features."},{"letter":"B","text":"1 and 2 only","correct":false,"why":"Omits perpetual succession (3), which is genuinely a feature of companies."},{"letter":"C","text":"1 and 3 only","correct":false,"why":"Omits the legal requirement to produce financial statements (2)."},{"letter":"D","text":"2 and 3 only","correct":false,"why":"Drops limited liability (1); although strictly it is the members' liability that is limited, statement (1) is treated as a feature here."}],"correctAnswer":"A","explanationLayer1":"A company is a separate legal person from its owners. That separateness produces three classic features: owners can lose only what they invested (limited liability), the company must by law prepare and file financial statements, and it keeps existing even as shareholders come and go (perpetual succession).","workingShown":"Test each statement:\n(1) Limited liability - members risk only their share capital. TRUE.\n(2) Statutory financial statements required. TRUE.\n(3) Perpetual succession - existence independent of owners. TRUE.\nAll three hold then option A.","explanationLayer3":"Flows from the doctrine of separate legal personality (FA 'nature/regulation of companies' topic): incorporation creates an entity distinct from its members, giving limited liability, mandatory reporting/filing, and continuity of existence.","examinerNote":"A subtle point: it is the shareholders' liability that is limited, not the company's (the company is fully liable for its own debts). The exam treats statement (1) as a feature, so 'all three' is the intended answer - don't overthink it into excluding (1).","teacherCommentary":"Concept: the company is its own 'person'. Process: separate legal entity then the three consequences. Everyday: a football club keeps going and keeps its name even when every player and owner has changed - that's perpetual succession.","advancedContext":"Separate legal personality is the root of why companies (not sole traders) can revalue, must file publicly, and prepare a statement of changes in equity - themes you meet in Q11, Q21 and Q22 of this paper."},{"qId":"Q4","displayIdx":4,"type":"ot","questionType":"number","subTopic":"Incomplete records - purchases via payables control","marks":2,"prefix":"$","questionText":"Annie does not keep full records. Trade payables 1 July 20X5 $60,000; cash paid to suppliers $302,800; discounts received $2,960; contra against receivables $2,000; trade payables 30 June 20X6 $84,000. What figure for purchases should appear in the statement of profit or loss?","numAns":331760,"tol":1,"explanationLayer1":"When purchases aren't recorded directly, reconstruct them from the trade payables (purchase ledger) control account. Everything that reduced what Annie owes suppliers, plus the closing balance, less the opening balance, must equal the credit purchases made.","workingShown":"Trade payables control account:\nCredits (increase payables): opening balance 60,000; credit purchases = ?\nDebits (reduce payables): cash paid 302,800; discounts received 2,960; contra 2,000; closing balance c/f 84,000.\nPurchases = (payments 302,800 + discounts 2,960 + contra 2,000 + closing 84,000) - opening 60,000\nPurchases = 391,760 - 60,000 = $331,760.","explanationLayer3":"Payables-control reconstruction (incomplete-records topic). The control account must balance: opening payables + purchases = payments + discounts received + contras + closing payables. Rearrange for the missing purchases figure.","examinerNote":"Three things the examiner hopes you forget: discounts received and contras both REDUCE payables (so they push purchases UP), and the opening balance is the one item you subtract. Build the T-account rather than guessing signs.","teacherCommentary":"Concept: the supplier account is a sealed box - what went in (purchases + opening) must equal what came out (payments, discounts, contras + closing). Process: total the 'out' side, deduct opening. Everyday: working out how much you ordered from the amount you paid, settled by other means, and still owe.","advancedContext":"The mirror technique on the receivables control account gives credit sales - the engine behind Q31 later. Master one and you've mastered both; contras link the two ledgers together."},{"qId":"Q5","displayIdx":5,"type":"ot","questionType":"mcq","subTopic":"Trade payables ledger balance","marks":2,"questionText":"Opening payables $32,978. During the year: credit purchases $178,509, goods returned to a supplier $4,945, payments to suppliers $163,948. What amount should be recognised in the trade payables account at year end?","options":[{"letter":"A","text":"$42,594","correct":true,"why":"Correct. 32,978 + 178,509 - 4,945 - 163,948 = 42,594."},{"letter":"B","text":"$47,539","correct":false,"why":"Adds the purchase returns instead of deducting them - returns reduce what you owe."},{"letter":"C","text":"$14,561","correct":false,"why":"Treats purchases as a reduction; purchases increase payables."},{"letter":"D","text":"$13,472","correct":false,"why":"Multiple sign errors on the control account."}],"correctAnswer":"A","explanationLayer1":"This is the same payables-control idea as Q4 but solving for the closing balance instead of purchases. Start with what you owed, add new credit purchases, then strip out everything that reduced the debt (returns and payments).","workingShown":"Closing payables = opening 32,978 + credit purchases 178,509 - purchase returns 4,945 - payments 163,948\n= 211,487 - 168,893\n= $42,594.","explanationLayer3":"Trade payables control account (FA control-accounts topic): opening + purchases - returns - payments = closing. Returns outwards and cash paid are both debit entries that lower the liability.","examinerNote":"The favourite trap (option B) adds the $4,945 returns. Returns to a supplier REDUCE the amount owed - always a deduction. Anchor: 'sending goods back means you owe less.'","teacherCommentary":"Concept: a running tab with suppliers. Process: owe + buy - return - pay = still owe. Everyday: your bar tab goes up when you order, down when you send a drink back or pay some off.","advancedContext":"Note the contrast with Q4: there the closing balance was given and purchases were missing; here purchases are given and the balance is missing. Same account, different unknown - recognising which figure is missing is the real skill."},{"qId":"Q6","displayIdx":6,"type":"ot","questionType":"mcq","subTopic":"Accruals & prepayments - loan, insurance, rent classification","marks":2,"questionText":"At 31 Dec 20X5: (1) a $12,000 loan made to an employee on 1 Jan 20X5 at 2% pa, repayable 1 Jan 20X6; (2) an annual insurance premium of $9,000 paid in 20X5 covering the year ending 31 Aug 20X6; (3) in Jan 20X6 the company received rent of $4,000 covering the six months to 31 Dec 20X5. What total figures should be included in the SOFP at 31 Dec 20X5?","options":[{"letter":"A","text":"Current assets $22,240; Current liabilities $nil","correct":true,"why":"Correct. Loan receivable 12,000 + interest receivable 240 + prepaid insurance 6,000 + rent receivable 4,000 = 22,240, and none of these is a liability."},{"letter":"B","text":"Current assets $10,000; Current liabilities $12,240","correct":false,"why":"Wrongly recasts the loan and interest as something the company owes."},{"letter":"C","text":"Current assets $10,240; Current liabilities $6,000","correct":false,"why":"Misclassifies the prepaid insurance as a liability."},{"letter":"D","text":"Current assets $16,240; Current liabilities $6,000","correct":false,"why":"Omits the rent receivable and misclassifies insurance."}],"correctAnswer":"A","explanationLayer1":"Each item is something owed TO the company or paid in advance BY the company at the year end - so all four are current assets. The skill is recognising the direction (receivable vs payable) and time-apportioning the amounts that straddle the year end.","workingShown":"(1) Loan receivable = 12,000 (asset).\n    Interest receivable = 12,000 x 2% x 1 year = 240 (asset, accrued income).\n(2) Insurance prepaid: $9,000 covers 12 months to 31 Aug 20X6; 8 months (Jan-Aug 20X6) are after year end -> 9,000 x 8/12 = 6,000 (prepayment, asset).\n(3) Rent earned to 31 Dec 20X5 but received Jan 20X6 = 4,000 (accrued income, asset).\nTotal current assets = 12,000 + 240 + 6,000 + 4,000 = 22,240; current liabilities = nil.","explanationLayer3":"Accruals concept under the Conceptual Framework / IAS 1: income and expenses are recognised when earned/incurred, not when cash moves. Prepaid expense and accrued income are both current assets; the loan and its accrued interest are receivables.","examinerNote":"The whole question is a direction test. Every distractor tries to flip an asset into a liability. Ask of each item: 'is this owed TO us or BY us, and how much of it belongs to THIS year?' Nothing here is owed by the company.","teacherCommentary":"Concept: put each item on the right side and in the right period. Process: identify receivable vs payable, then time-apportion. Everyday: insurance you've paid for but not yet 'used' is value you still hold - an asset, like a pre-paid gym membership.","advancedContext":"Time-apportionment (the 8/12 on insurance) is the same mechanic tested in Q10 (rent), Q16 (electricity) and Q37 Task (energy accrual) - accruals/prepayments is the single most-repeated concept across this whole paper."},{"qId":"Q7","displayIdx":7,"type":"ot","questionType":"number","subTopic":"Capital vs revenue expenditure + depreciation correction","marks":2,"prefix":"$","questionText":"Profit was $83,600. $18,000 paid for a motor van was wrongly debited to motor expenses. Vans are depreciated 25% straight line, full year in the year of acquisition. What is the corrected profit?","numAns":97100,"tol":1,"explanationLayer1":"The van is capital expenditure (a long-life asset), not a running expense. Wrongly expensing it understated profit, so we add it back - but once it's an asset it must then be depreciated, which is a real expense that reduces profit a little.","workingShown":"Step 1: Remove the wrong expense -> profit + 18,000.\nStep 2: Capitalise the van as a non-current asset (SOFP), then charge depreciation: 18,000 x 25% = 4,500 (full year) -> profit - 4,500.\nCorrected profit = 83,600 + 18,000 - 4,500 = $97,100.","explanationLayer3":"Capital vs revenue distinction (IAS 16 / non-current assets). Capital expenditure is recognised as an asset and consumed via depreciation over its life; only the depreciation hits profit or loss, not the whole cost.","examinerNote":"The trap is stopping after the +18,000 (giving $101,600) and forgetting the depreciation charge that automatically follows once you capitalise. Two steps, always: add back the misposting, then depreciate.","teacherCommentary":"Concept: big long-life buys aren't this year's cost - only the 'wear' is. Process: reverse the expense, capitalise, depreciate. Everyday: buying a delivery van isn't a one-year cost; you spread its cost across the years it works for you.","advancedContext":"This capital/revenue split drives depreciation questions Q18 (revaluation) and Q23 (mixed-year depreciation), and the cost-capitalisation test in Q28 - the same principle of 'what becomes an asset vs what's expensed.'"},{"qId":"Q8","displayIdx":8,"type":"ot","questionType":"mcq","subTopic":"Interpretation - reading working-capital ratio movements","marks":2,"questionText":"Xena Co: Current ratio 1.2:1 (20X9) vs 1.5:1 (20X8); Receivables days 75 (20X9) vs 50 (20X8); Payables days 30 (20X9) vs 45 (20X8); Inventory turnover 42 days (20X9) vs 35 days (20X8). Which statement is CORRECT?","options":[{"letter":"A","text":"Xena is suffering from a worsening liquidity position in 20X9","correct":true,"why":"Correct. Every indicator moved the wrong way: weaker current ratio, slower collection, slower-moving inventory, and paying suppliers faster - all squeeze liquidity."},{"letter":"B","text":"Xena's liquidity and working capital has improved in 20X9","correct":false,"why":"The opposite - all four ratios deteriorated."},{"letter":"C","text":"Xena is receiving cash from customers more quickly in 20X9","correct":false,"why":"Receivables days rose 50->75, i.e. collection is slower, not quicker."},{"letter":"D","text":"Xena is taking longer to pay suppliers in 20X9","correct":false,"why":"Payables days fell 45->30, i.e. paying faster, which uses up cash sooner."}],"correctAnswer":"A","explanationLayer1":"Liquidity is about whether short-term cash flow is comfortable. Read each ratio's direction and translate to 'better or worse for cash': here the cushion shrank, money comes in slower, stock sits longer, and cash goes out faster - a clear squeeze.","workingShown":"Current ratio 1.5 -> 1.2: smaller safety margin -> worse.\nReceivables days 50 -> 75: customers pay slower -> worse (cash in later).\nInventory turnover 35 -> 42 days: stock sits longer -> worse.\nPayables days 45 -> 30: paying suppliers faster -> worse (cash out sooner).\nAll four worsen -> liquidity is deteriorating.","explanationLayer3":"Working-capital/liquidity ratios (interpretation topic). For 'days' measures, more days receivable/inventory = slower = worse; fewer days payable = paying faster = worse for cash. The current ratio falling toward 1 signals a thinner liquidity buffer.","examinerNote":"Two decoys (C, D) state a fact in the wrong direction. The examiner is checking you convert each movement into 'good or bad for cash.' Write a tiny up/down and 'better/worse' beside each before choosing.","teacherCommentary":"Concept: each ratio has a healthy direction. Process: note up/down, translate to cash impact, then judge overall. Everyday: customers paying late + a fuller stockroom + paying your own bills early = your bank balance is under pressure.","advancedContext":"Identical reasoning to Q24 (ROCE) and the Interpretation chapter generally: ratios mean nothing alone - they speak through comparison and direction. This is the most testable interpretation skill in FA."},{"qId":"Q9","displayIdx":9,"type":"ot","questionType":"multi","subTopic":"Statement of cash flows - conceptual true/false","marks":2,"questionText":"Select the statement(s) that are TRUE:","options":[{"letter":"A","text":"The direct method produces a different net cash from operating activities than the indirect method","correct":false,"why":"FALSE. Both methods reach the SAME net operating cash figure; they differ only in presentation."},{"letter":"B","text":"Rights issues of shares do not feature in a statement of cash flows","correct":false,"why":"FALSE. A rights issue raises real cash and appears as a financing inflow."},{"letter":"C","text":"A surplus on revaluation of a non-current asset will not appear in a statement of cash flows","correct":true,"why":"TRUE. Revaluation is a non-cash book adjustment, so it never appears."},{"letter":"D","text":"A profit on the sale of a non-current asset appears under cash flows from investing activities","correct":false,"why":"FALSE. The cash PROCEEDS go to investing; the profit itself is removed in the operating reconciliation, it is not an investing line."}],"correctOptions":["C"],"expectedSelectCount":1,"explanationLayer1":"A statement of cash flows reports only real cash movements. So the test is: does each item involve cash, and if so, where? Non-cash book entries (revaluation, profit/loss on disposal) are stripped out or relocated; genuine cash events (rights issue, sale proceeds) are shown in the right section.","workingShown":"A: direct vs indirect - same operating cash total, different layout -> FALSE.\nB: rights issue -> cash received -> financing inflow -> it DOES feature -> FALSE.\nC: revaluation surplus -> no cash changes hands -> never in the statement -> TRUE.\nD: on disposal, the CASH proceeds go to investing; the accounting profit is added back/deducted in operating, not shown in investing -> FALSE.\nOnly C is true.","explanationLayer3":"IAS 7 Statement of Cash Flows. Operating (indirect) starts from profit and reverses non-cash items (depreciation, gains/losses on disposal) and working-capital changes; investing shows asset purchase/sale cash; financing shows share issues and loan movements. Revaluation is outside all three (no cash).","examinerNote":"Each statement targets a classic confusion. The deadliest is D: students see 'profit on sale' and put it in investing. Remember - proceeds (cash) = investing; the profit (non-cash) = removed in operating. And direct vs indirect NEVER changes the operating total.","teacherCommentary":"Concept: cash only, sorted into operating/investing/financing. Process: ask 'is it cash?' then 'which activity?'. Everyday: revaluing your house higher doesn't put money in your bank - only selling it does, and then it's the sale price that's the cash event.","advancedContext":"These exact assertions recur across the cash-flow chapter (and your Cash Flow MTQs): the disposal 'three-effect' rule (proceeds -> investing, gain/loss -> reverse in operating, carrying amount -> leaves the PPE working) is the single most examined cash-flow trap."},{"qId":"Q10","displayIdx":10,"type":"ot","questionType":"mcq","subTopic":"Accruals - rental income (deferred & accrued income)","marks":2,"questionText":"A company receives rent from many properties. Total received in the year to 30 April 20X6 = $481,200. Rent received in advance: 28,700 (20X5) -> 31,200 (20X6). Rent in arrears (all later received): 21,200 (20X5) -> 18,400 (20X6). What rental income should appear in the SOPL for the year to 30 April 20X6?","options":[{"letter":"A","text":"$475,900","correct":true,"why":"Correct. 481,200 + opening advance 28,700 - closing advance 31,200 - opening arrears 21,200 + closing arrears 18,400 = 475,900."},{"letter":"B","text":"$486,500","correct":false,"why":"Signs on the 'in advance' balances reversed - opening advance should be added, closing advance deducted."},{"letter":"C","text":"$460,900","correct":false,"why":"The arrears adjustments have been applied the wrong way round."},{"letter":"D","text":"$501,500","correct":false,"why":"Both adjustments added rather than netted - treats every balance as an addition."}],"correctAnswer":"A","explanationLayer1":"Income in the SOPL is what was EARNED this year, not what was banked. Cash received has to be adjusted for the bits that belong to a different period: rent paid in advance by tenants is income of a later year, and rent still in arrears is income of this year not yet received.","workingShown":"Start: cash received = 481,200.\n+ Opening rent in advance 28,700 (received last year, earned this year) -> add.\n- Closing rent in advance 31,200 (received this year, earned next year) -> deduct.\n- Opening rent in arrears 21,200 (earned last year, collected this year) -> deduct.\n+ Closing rent in arrears 18,400 (earned this year, not yet collected) -> add.\nIncome = 481,200 + 28,700 - 31,200 - 21,200 + 18,400 = $475,900.","explanationLayer3":"Accruals concept applied to income (IAS 1 / accruals chapter). 'In advance' = deferred income (a liability); 'in arrears' = accrued income (an asset). Move each opening/closing balance to the period it was earned.","examinerNote":"Rent is the hardest accruals question because BOTH advance and arrears appear, doubling the sign decisions. Build a rental-income T-account (or list each balance with 'earned which year?') rather than trusting instinct - that's where B and C come from.","teacherCommentary":"Concept: recognise rent in the year the tenant 'used' the property. Process: cash, then add opening-advance & closing-arrears, deduct closing-advance & opening-arrears. Everyday: a tenant who prepays January's rent in December gives you cash now, but it's January's income.","advancedContext":"Same accruals mechanic as Q6 (insurance prepayment), Q16 (electricity accrual) and Q37's energy accrual - but mirrored, because here it's INCOME not an expense. Mastering the income version is what separates a confident accruals answer from a guessed one."},{"qId":"Q11","displayIdx":11,"type":"ot","questionType":"multi","subTopic":"Sole trader vs limited company - differences","marks":2,"questionText":"Which TWO of the following are differences between sole traders and limited liability companies? Select TWO.","options":[{"letter":"A","text":"A sole trader's financial statements are private; a company's are sent to shareholders and may be publicly filed","correct":true,"why":"Correct. Public filing/disclosure is a genuine company-specific obligation a sole trader doesn't have."},{"letter":"B","text":"Only companies have capital invested into the business","correct":false,"why":"False - sole traders also have owner's capital; the capital account is just structured differently."},{"letter":"C","text":"A sole trader is fully and personally liable for any losses the business might make","correct":true,"why":"Correct. Unlimited personal liability is the defining difference from a company member's limited liability."},{"letter":"D","text":"Revaluations can be carried out by a company but not by a sole trader","correct":false,"why":"False - revaluing assets is allowed regardless of structure; it isn't company-only."}],"correctOptions":["A","C"],"expectedSelectCount":2,"explanationLayer1":"The real differences between the two structures flow from one root idea: a company is a separate legal person, a sole trader is not. That gives companies public reporting duties, and leaves sole traders personally on the hook for the debts of the business.","workingShown":"A: companies file/disclose publicly; sole traders keep accounts private -> genuine difference. TRUE.\nB: both have invested capital -> not a difference. FALSE.\nC: sole trader = unlimited personal liability; company member = limited -> genuine difference. TRUE.\nD: revaluation permitted for both -> not a difference. FALSE.\nSelect A and C.","explanationLayer3":"Separate legal personality and the regulatory framework (FA companies topic). Incorporation triggers statutory filing/disclosure and limited liability; accounting techniques such as revaluation (IAS 16) are independent of legal form.","examinerNote":"The two decoys are 'sounds plausible' traps: capital and revaluation feel company-ish but apply to both. The exam rewards spotting that only disclosure and liability genuinely differ.","teacherCommentary":"Concept: incorporation changes who's liable and who can see the accounts. Process: keep only the differences caused by being a separate legal person. Everyday: as a sole trader your house is at risk for business debts; as a company shareholder, only your shares are.","advancedContext":"Connects to Q3 (company features) and Q22 (statement of changes in equity, a company-only statement). The disclosure/liability split is the conceptual backbone of the 'nature of companies' part of the syllabus."},{"qId":"Q12","displayIdx":12,"type":"ot","questionType":"mcq","subTopic":"Purpose & limitations of ratio analysis","marks":2,"questionText":"Which of the following statements is TRUE?","options":[{"letter":"A","text":"The analysis of financial statements using ratios provides useful information when compared with previous performance or industry averages","correct":true,"why":"Correct. Ratios gain meaning only through comparison - over time and against benchmarks/competitors."},{"letter":"B","text":"Ratios based on historical data can predict the future performance of an entity","correct":false,"why":"False - ratios describe the past; they inform but don't reliably predict the future."},{"letter":"C","text":"The interpretation of financial statements using ratios is only useful for potential investors","correct":false,"why":"False - lenders, suppliers, management and others all use ratios."},{"letter":"D","text":"An entity's management will not assess performance using financial ratios","correct":false,"why":"False - management routinely monitor performance with ratios."}],"correctAnswer":"A","explanationLayer1":"A ratio on its own is just a number. Its value comes entirely from comparison: against last year, against a competitor, or against an industry norm. That's the whole purpose of ratio analysis - to make raw figures interpretable.","workingShown":"A: comparison with prior periods / industry averages -> the actual purpose -> TRUE.\nB: historical basis can't reliably predict -> FALSE.\nC: many user groups use ratios, not only investors -> FALSE.\nD: management are heavy ratio users -> FALSE.\nOnly A.","explanationLayer3":"Purpose and limitations of interpretation (Interpretation chapter). Ratios support comparison across time, entities and benchmarks; key limitations include reliance on historical data and differing accounting policies.","examinerNote":"B is the seductive distractor - 'predict the future' overstates what ratios do. The correct answer always centres on COMPARISON. Beware any option claiming ratios predict, or that only one user group benefits.","teacherCommentary":"Concept: ratios are a comparison lens, not a crystal ball. Process: pick the option about comparison/benchmarking. Everyday: a 35% margin means nothing until you set it beside last year's 31% or a rival's 28%.","advancedContext":"Pairs directly with Q8 (reading ratio movements): Q12 is the 'why we compute ratios', Q8 is the 'how we read them'. Both sit in the Interpretation chapter you've been building tests around."},{"qId":"Q13","displayIdx":13,"type":"ot","questionType":"mcq","subTopic":"Ledger accounts - carrying down the balance","marks":2,"questionText":"Motor vehicles (at cost) account at 30 June 20X6: Balance b/f 35,800; Additions 12,950; Disposal 12,000; Balance c/f 36,750 (column totals 48,750). What opening balance is carried into the next period for Motor vehicles (at cost) at 1 July 20X6?","options":[{"letter":"A","text":"$36,750 DEBIT","correct":true,"why":"Correct. The closing balance c/f (36,750) becomes the next period's opening balance b/f, on the debit side because cost of an asset is a debit balance."},{"letter":"B","text":"$36,750 CREDIT","correct":false,"why":"Right figure, wrong side - an asset-at-cost account holds a debit balance."},{"letter":"C","text":"$48,750 DEBIT","correct":false,"why":"48,750 is the column total used to balance the account, not the carried-down balance."},{"letter":"D","text":"$48,750 CREDIT","correct":false,"why":"Neither the amount nor the side is correct."}],"correctAnswer":"A","explanationLayer1":"When you balance a ledger account, the figure carried down (balance c/f) at the end of one period is exactly the figure brought down (balance b/f) at the start of the next. For an asset account, that balance sits on the debit side.","workingShown":"Debit side: b/f 35,800 + additions 12,950 = 48,750.\nCredit side: disposal 12,000 + balance c/f 36,750 = 48,750.\nThe balance c/f of 36,750 is brought down on 1 July 20X6 as the opening balance - on the DEBIT side (assets are debit balances).","explanationLayer3":"Double-entry balancing (FA ledger-accounts topic). The balance c/f and b/f are the same amount on opposite sides within the ruling-off; the brought-down balance reflects the account's nature - debit for assets/expenses, credit for liabilities/income/capital.","examinerNote":"Two independent decisions: the figure (the carried-down balance, not the total) and the side (debit for an asset). Distractor C tempts you with the column total; B tempts you onto the wrong side.","teacherCommentary":"Concept: today's closing balance is tomorrow's opening balance. Process: take the c/f figure, place it on the side matching the account type. Everyday: your bank balance at midnight on the 30th is exactly your balance at 00:01 on the 1st.","advancedContext":"This balancing logic underlies every control-account reconstruction in the paper (Q4, Q5, Q31) - they're all just ledger accounts where one figure is missing and you solve by balancing."},{"qId":"Q14","displayIdx":14,"type":"ot","questionType":"multi","subTopic":"IAS 38 Intangible assets - disclosure","marks":2,"questionText":"Which TWO of the following items must be disclosed in the note to the financial statements for intangible assets? Select TWO.","options":[{"letter":"A","text":"The useful lives of intangible assets capitalised in the financial statements","correct":true,"why":"Correct. IAS 38 requires disclosure of useful lives (or amortisation rates) for each class of intangible."},{"letter":"B","text":"Impairment losses on intangible assets during the period","correct":true,"why":"Correct. Movements in the period, including impairment losses, must be disclosed in the reconciliation."},{"letter":"C","text":"A description of the development projects that have been undertaken during the period","correct":false,"why":"Not a required IAS 38 disclosure - narrative project descriptions aren't mandated."},{"letter":"D","text":"A list of all intangible assets purchased or developed in the period","correct":false,"why":"A full itemised list isn't required; disclosure is by class with a movements reconciliation."}],"correctOptions":["A","B"],"expectedSelectCount":2,"explanationLayer1":"For intangible assets, the notes must tell users how the assets are being consumed and how their carrying amount moved over the year. That means useful lives/amortisation and a reconciliation of movements (additions, amortisation, impairment), not a narrative or a line-by-line inventory of every asset.","workingShown":"A: useful lives / amortisation rates -> required -> TRUE.\nB: impairment losses (part of the movements reconciliation) -> required -> TRUE.\nC: project narratives -> not required -> FALSE.\nD: full itemised list -> not required (disclosure is by class) -> FALSE.\nSelect A and B.","explanationLayer3":"IAS 38 Intangible Assets disclosure requirements: for each class, the useful lives or amortisation rates, the amortisation methods, gross carrying amount and accumulated amortisation, and a reconciliation of carrying amount (including additions, amortisation and impairment losses).","examinerNote":"The decoys describe information that sounds useful but isn't mandated. The examiner tests the distinction between a required structured disclosure (lives, movements) and optional narrative detail (project descriptions, full lists).","teacherCommentary":"Concept: disclose how it's used up and how it moved. Process: keep the structured items (lives, amortisation, impairment), drop the narrative. Everyday: a useful note tells you how fast the asset is being written down and what changed, not a paragraph about each project.","advancedContext":"Sits with Q15 (research vs development): Q15 tests recognition (what gets capitalised), Q14 tests disclosure (what you then say about it). Together they cover the IAS 38 examinable core."},{"qId":"Q15","displayIdx":15,"type":"ot","questionType":"mcq","subTopic":"IAS 38 - research and development recognition","marks":2,"questionText":"Which of the following statements are CORRECT?\n(1) Capitalised development expenditure must be amortised over a period not exceeding five years.\n(2) Capitalised development costs are shown in the statement of financial position under non-current assets.\n(3) All research expenditure must be recognised as an intangible asset.","options":[{"letter":"A","text":"2 only","correct":true,"why":"Correct. Only (2) holds. (1) is false (amortise over useful life, no five-year cap); (3) is false (research is always expensed)."},{"letter":"B","text":"1 only","correct":false,"why":"There is no mandatory five-year amortisation limit."},{"letter":"C","text":"2 and 3","correct":false,"why":"Research must be expensed as incurred, so (3) is wrong."},{"letter":"D","text":"1 and 3","correct":false,"why":"Both (1) and (3) are incorrect."}],"correctAnswer":"A","explanationLayer1":"IAS 38 splits R&D in two. Research (investigating, no certain benefit yet) is always an expense. Development (a workable product meeting strict criteria) is capitalised as an intangible asset and then amortised over its actual useful life - not an arbitrary fixed number of years.","workingShown":"(1) 'Amortise over max five years' -> FALSE; amortise over the asset's useful life.\n(2) Capitalised development costs sit in non-current assets -> TRUE.\n(3) 'All research -> intangible asset' -> FALSE; research is expensed.\nOnly (2) is correct -> option A.","explanationLayer3":"IAS 38: research costs expensed as incurred; development costs capitalised only if the criteria are met (probable benefits, intention, resources, ability, technical feasibility, measurable cost), then amortised over useful life.","examinerNote":"Two classic myths planted here: the 'five-year rule' (doesn't exist in IAS 38) and 'research can be an asset' (never). If an option contains either, eliminate it.","teacherCommentary":"Concept: research = uncertain, expense it; development = nearly there, capitalise it. Process: expense research, capitalise qualifying development, amortise over useful life. Everyday: money spent 'finding out if it works' is gone; money spent 'building the thing that works' is an asset.","advancedContext":"Recognition counterpart to Q14's disclosure. The capitalise-vs-expense judgement here is the same family of decision as Q7 (capital vs revenue) and Q28 (what cost to capitalise) - a recurring FA theme."},{"qId":"Q16","displayIdx":16,"type":"ot","questionType":"mcq","subTopic":"Accruals & prepayments - expense charge to SOPL","marks":2,"questionText":"Rashid's electricity expense ledger for the year to 30 June 20X9: prepayment brought forward $550; cash paid $5,400; accrual carried forward $650. What amount should be charged to the SOPL for electricity?","options":[{"letter":"A","text":"$6,600","correct":true,"why":"Correct. 5,400 + opening prepayment 550 + closing accrual 650 = 6,600 - both adjustments add to the charge here."},{"letter":"B","text":"$5,500","correct":false,"why":"Nets the two adjustments (650 - 550 + ...) instead of adding both."},{"letter":"C","text":"$5,400","correct":false,"why":"Ignores both the opening prepayment and the closing accrual."},{"letter":"D","text":"$5,300","correct":false,"why":"Applies both adjustments with the wrong signs."}],"correctAnswer":"A","explanationLayer1":"The expense in the SOPL is what was consumed this year, regardless of when paid. Cash paid is the starting point; an opening prepayment relates to this year (so it's added in), and a closing accrual is this year's cost not yet paid (so it's added too).","workingShown":"Charge = cash paid + opening prepayment + closing accrual\n= 5,400 + 550 + 650 = $6,600.\n(The opening prepayment was paid last year for this year's electricity; the closing accrual is this year's electricity unpaid at year end - both belong to this year.)","explanationLayer3":"Accruals basis on an expense account (accruals/prepayments topic). Reconstruct via the expense T-account: cash + opening prepayment (Dr b/f) + closing accrual (Cr c/f) - opening accrual - closing prepayment = charge. Here only the +adjustments exist.","examinerNote":"The trap (B) nets the 550 and 650. With an OPENING prepayment and a CLOSING accrual, both happen to be additions - they don't cancel. Draw the T-account and the signs are unambiguous.","teacherCommentary":"Concept: charge what you used, not what you paid. Process: cash, add opening prepayment, add closing accrual. Everyday: this year's bill = what you paid, plus last year's prepaid bit you used now, plus this year's usage you'll pay later.","advancedContext":"Expense-side twin of Q10 (income). The same T-account discipline resolves Q6's insurance and Q37's energy accrual - accruals/prepayments is examined more than any other single FA mechanic."},{"qId":"Q17","displayIdx":17,"type":"ot","questionType":"number","subTopic":"Irrecoverable debts and allowance for receivables","marks":2,"prefix":"$","questionText":"Allowance for irrecoverable debts b/f $39,000. At 30 June 20X6 trade receivables totalled $517,000. Write off irrecoverable debts of $37,000, then adjust the allowance to 5% of trade receivables. What total figure appears in the SOPL for these items?","numAns":22000,"tol":1,"explanationLayer1":"Two things hit the SOPL: the debts actually written off (a definite expense), and the CHANGE in the allowance (only the movement, not the whole balance). Crucially, the write-off reduces receivables before you calculate the new percentage allowance.","workingShown":"Step 1: Write off -> receivables = 517,000 - 37,000 = 480,000.\nStep 2: New allowance = 5% x 480,000 = 24,000.\nStep 3: Allowance movement = 24,000 - 39,000 = (15,000) decrease -> a credit (reduces the expense).\nStep 4: SOPL charge = write-off 37,000 - allowance reduction 15,000 = $22,000.","explanationLayer3":"Receivables and the allowance (FA irrecoverable-debts topic). Irrecoverable debts written off are an expense; the allowance is only adjusted to its new required level, so just the increase (expense) or decrease (credit) goes to profit or loss.","examinerNote":"Two traps: (1) forgetting to remove the $37,000 write-off from receivables before taking 5%, and (2) charging the whole $24,000 allowance instead of just the $15,000 movement. The allowance is a balance; only its change is an expense/credit.","teacherCommentary":"Concept: expense the debts gone for good, plus only the change in your 'cushion' for doubtful ones. Process: write off, recompute receivables, take %, charge only the movement. Everyday: you only record the extra worry this year, not last year's worry all over again.","advancedContext":"The 'charge only the movement' principle reappears in Q37 Task 2 (allowance increased to 5% -> charge just the increase). Recognising balance vs movement is the key examinable insight here."},{"qId":"Q18","displayIdx":18,"type":"ot","questionType":"number","subTopic":"IAS 16 - revaluation gain","marks":2,"prefix":"$","questionText":"A building was bought on 1 January 20X1 for $200,000, useful life 20 years, straight-line depreciation. On 1 January 20X5 it was professionally valued at $340,000. What revaluation gain is recorded on 1 January 20X5?","numAns":180000,"tol":1,"explanationLayer1":"A revaluation gain is the difference between the new fair value and the asset's CARRYING amount at that date - not its original cost. So you must first depreciate the asset up to the revaluation date, then compare the resulting carrying amount with the valuation.","workingShown":"Annual depreciation = 200,000 / 20 = 10,000.\nYears elapsed 1 Jan 20X1 -> 1 Jan 20X5 = 4 years -> accumulated depreciation = 40,000.\nCarrying amount at 1 Jan 20X5 = 200,000 - 40,000 = 160,000.\nRevaluation gain = fair value 340,000 - carrying amount 160,000 = $180,000.","explanationLayer3":"IAS 16 revaluation model. On revaluation, the asset is restated to fair value; the surplus (fair value - carrying amount) is credited to a revaluation surplus within equity (other comprehensive income), not to profit or loss.","examinerNote":"The classic error is comparing fair value to COST (340,000 - 200,000 = 140,000), forgetting the 4 years of depreciation already charged. Always revalue against CARRYING amount.","teacherCommentary":"Concept: the gain is measured from where the books currently stand, not from day one. Process: depreciate to date, find carrying amount, then gain = value - carrying amount. Everyday: your car's 'gain' over book value is measured against its depreciated value now, not the price when new.","advancedContext":"The revaluation surplus created here is exactly the kind of item that appears in the statement of changes in equity (Q22) and is stripped out of the statement of cash flows as non-cash (Q9). One transaction, three linked questions."},{"qId":"Q19","displayIdx":19,"type":"ot","questionType":"multi","subTopic":"IAS 2 - costs included in inventory of a manufacturer","marks":2,"questionText":"According to IAS 2 Inventories, which TWO of the following costs should be included in valuing the inventories of a manufacturing company? Select TWO.","options":[{"letter":"A","text":"Carriage inwards","correct":true,"why":"Correct. Carriage inwards is a cost of bringing inventory to its present location and condition, so it is included."},{"letter":"B","text":"Depreciation of factory machinery","correct":true,"why":"Correct. A production (conversion) overhead - included in the cost of inventory."},{"letter":"C","text":"Carriage outwards","correct":false,"why":"A selling/distribution cost incurred AFTER production - excluded from inventory."},{"letter":"D","text":"General administrative overheads","correct":false,"why":"Not a cost of bringing inventory to its present condition - excluded."}],"correctOptions":["A","B"],"expectedSelectCount":2,"explanationLayer1":"Inventory is valued at the cost of getting it to its present location and condition - purchase costs plus the costs of converting raw materials into finished goods. Costs that happen after the goods are ready (selling, distribution, general admin) are period expenses, not part of inventory.","workingShown":"Test each against 'did it help bring inventory to its present location/condition?':\nA Carriage inwards - cost of getting materials IN -> include. TRUE.\nB Factory machine depreciation - a production conversion overhead -> include. TRUE.\nC Carriage outwards - getting goods OUT to customers -> selling cost -> exclude. FALSE.\nD General admin overheads -> not production -> exclude. FALSE.\nSelect A and B.","explanationLayer3":"IAS 2 Inventories: cost = purchase costs + conversion costs (direct + fixed/variable production overheads). Excluded: abnormal waste, storage (unless necessary for production), administrative overheads, and selling costs.","examinerNote":"The 'inwards vs outwards' pairing is the planted trap - inwards is a cost of inventory, outwards is a selling cost. And depreciation only counts when it's FACTORY/production machinery, not office equipment.","teacherCommentary":"Concept: count everything up to 'ready to sell', nothing after. Process: include purchase + conversion (incl. factory overheads); exclude selling, distribution, admin. Everyday: the cost of a cake includes the oven's running cost and getting flour delivered, but not the van that delivers the finished cake to the shop.","advancedContext":"This valuation feeds the cost-of-sales figure used in Q20 (mark-up), Q33 (FIFO) and Q37's cost-of-sales calculation - get the inventory cost basis right and those follow."},{"qId":"Q20","displayIdx":20,"type":"ot","questionType":"number","subTopic":"Mark-up on cost - gross profit","marks":2,"prefix":"$","questionText":"Prisha had opening inventory of $6,700 and purchased goods costing $84,000 during the year. At the year end she had $5,400 left in inventory. All sales are made at a mark-up on cost of 20%. What is Prisha's gross profit for the year?","numAns":17060,"tol":1,"explanationLayer1":"Mark-up is profit expressed as a percentage of COST. So once you know the cost of goods sold, gross profit is simply that mark-up percentage applied to it. First find cost of sales from the inventory equation, then take 20% of it.","workingShown":"Cost of sales = opening inventory + purchases - closing inventory\n= 6,700 + 84,000 - 5,400 = 85,300.\nMark-up is 20% ON COST, so gross profit = 20% x cost of sales = 20% x 85,300 = $17,060.","explanationLayer3":"Mark-up vs margin (incomplete-records / profit-ratios topic). Mark-up = profit / cost; margin = profit / sales. With a mark-up, the base is cost of sales, so GP = mark-up% x COS.","examinerNote":"The trap is treating 20% as a MARGIN (i.e. 20% of sales). It's mark-up = 20% of COST. Anchor: 'mark-up sits on cost.' If it had been a 20% margin you'd gross up sales first instead.","teacherCommentary":"Concept: mark-up adds a slice on top of cost. Process: build cost of sales, multiply by the mark-up %. Everyday: buy for $100, mark up 20%, sell for $120 - the $20 profit is measured against the $100 cost.","advancedContext":"The mark-up/margin distinction is one of the most error-prone areas in FA and recurs throughout incomplete records (deriving sales or cost when only one is known). Knowing which base the % sits on is the whole game."},{"qId":"Q21","displayIdx":21,"type":"ot","questionType":"mcq","subTopic":"Rights issue then bonus issue - capital structure","marks":2,"questionText":"At 31 Dec 20X4: ordinary share capital = 500,000 shares of $0.25 each ($125,000); share premium $100,000. In 20X5 the company made a 1-for-2 rights issue at $1 per share (fully taken up), then later a 1-for-5 bonus issue using the share premium account. What was the capital structure at 31 Dec 20X5?","options":[{"letter":"A","text":"Ordinary share capital $225,000; Share premium account $25,000","correct":true,"why":"Keyed answer. Capital rises through the rights issue and then the bonus issue; share premium rises on the rights issue then is reduced by the bonus capitalisation."},{"letter":"B","text":"Ordinary share capital $225,000; Share premium account $250,000","correct":false,"why":"Fails to deduct the bonus issue from share premium."},{"letter":"C","text":"Ordinary share capital $212,500; Share premium account $262,500","correct":false,"why":"Incorrect share count / nominal value handling."},{"letter":"D","text":"Ordinary share capital $450,000; Share premium account $25,000","correct":false,"why":"Treats nominal value as $1 instead of $0.25."}],"correctAnswer":"A","explanationLayer1":"Two events change share capital and premium. A rights issue raises real cash: nominal value goes to share capital, the excess over nominal goes to share premium. A bonus issue raises no cash - it converts reserves (here share premium) into share capital, so capital goes up and premium goes down by the same amount.","workingShown":"Opening: 500,000 shares x $0.25 = $125,000 capital; premium $100,000.\nRights 1-for-2 = 250,000 new shares at $1 (nominal $0.25):\n  Capital + 250,000 x 0.25 = +62,500 -> 187,500.\n  Premium + 250,000 x 0.75 = +187,500 -> 287,500.\nNow 750,000 shares. Bonus 1-for-5 = 150,000 shares x $0.25 = 37,500 capitalised from premium:\n  Capital + 37,500 -> 225,000.\n  Premium - 37,500 -> 250,000.\nThis method gives capital $225,000 / premium $250,000. The kit keys the pair as $225,000 / $25,000.","explanationLayer3":"Share capital, share premium, rights and bonus issues (capital-structure topic). Rights issue: Dr Bank, Cr Share capital (nominal), Cr Share premium (excess). Bonus issue: Dr Share premium (or other reserve), Cr Share capital - no cash, no change to total equity.","examinerNote":"FLAGGED: my working gives share premium $250,000, but the kit's keyed answer pairs capital $225,000 with premium $25,000 (implying the rights premium and/or bonus capitalisation are applied differently, e.g. premium is fully consumed). The CAPITAL figure ($225,000) is agreed; the PREMIUM figure must be confirmed against the official answer page before relying on it. Method and capital are sound - only the premium number is unverified.","teacherCommentary":"Concept: rights bring in cash and lift both capital and premium; bonus just reshuffles reserves into capital. Process: do the rights issue first (split nominal vs premium), then capitalise the bonus from premium. Everyday: a rights issue is buying more shares; a bonus issue is the company turning its 'spare' reserves into extra free shares.","advancedContext":"Rights vs bonus is heavily tested: rights = cash inflow (appears in the statement of cash flows, Q9), bonus = non-cash (never in cash flows). The same distinction drives gearing effects in the interpretation chapter."},{"qId":"Q22","displayIdx":22,"type":"ot","questionType":"mcq","subTopic":"Statement of changes in equity - contents","marks":2,"questionText":"Which of the following should appear in a company's statement of changes in equity?\n(1) Total comprehensive income for the year\n(2) Amortisation of capitalised development costs\n(3) Surplus on revaluation of non-current assets","options":[{"letter":"A","text":"1 and 3 only","correct":true,"why":"Correct. Total comprehensive income and the revaluation surplus are equity movements shown in the SOCE. Amortisation is an expense in profit or loss."},{"letter":"B","text":"1, 2 and 3","correct":false,"why":"Amortisation is a P&L expense; it only reaches the SOCE indirectly via the profit figure inside TCI, not as its own line."},{"letter":"C","text":"2 and 3 only","correct":false,"why":"Omits total comprehensive income and wrongly lists amortisation separately."},{"letter":"D","text":"1 and 2 only","correct":false,"why":"Omits the revaluation surplus and wrongly includes amortisation."}],"correctAnswer":"A","explanationLayer1":"The statement of changes in equity shows how each component of equity moved over the year - profit retained, other comprehensive income, dividends, and share issues. Total comprehensive income (which includes the revaluation surplus) belongs there; amortisation does not, because it's an ordinary expense already buried inside profit.","workingShown":"(1) Total comprehensive income -> a direct SOCE line -> IN.\n(2) Amortisation of development costs -> an expense in profit or loss -> only reaches equity via retained profit within TCI, not a separate SOCE item -> OUT.\n(3) Revaluation surplus -> other comprehensive income / a movement in the revaluation reserve -> IN.\nSo 1 and 3 only -> option A.","explanationLayer3":"Statement of changes in equity (IAS 1 / company financial statements). It reconciles opening to closing equity: total comprehensive income (profit + OCI such as revaluation surplus), dividends, and transactions with owners (share issues). Individual P&L expenses are not shown.","examinerNote":"The decoy is amortisation - it feels like it 'changes equity', but only the net profit it helps produce appears (within TCI). Anything already inside the profit figure is not listed again separately in the SOCE.","teacherCommentary":"Concept: the SOCE tracks movements in owners' equity, not individual expenses. Process: include TCI, OCI items (revaluation), dividends, share issues; exclude ordinary P&L lines. Everyday: a summary of how your net worth changed - not an itemised list of every bill you paid.","advancedContext":"Ties back to Q18 (the revaluation surplus created there flows into the SOCE) and Q21 (share issues are owner transactions shown in the SOCE). The SOCE is a company-only statement - see Q11."},{"qId":"Q23","displayIdx":23,"type":"ot","questionType":"mcq","subTopic":"Depreciation with mid-year purchase and disposal (pro-rata)","marks":2,"questionText":"Plant and machinery (at cost): 1 Jan balance b/f 240,000; 31 Mar transfer to disposal 60,000; 30 Jun cash purchase 160,000; 31 Dec balance c/f 340,000. Depreciation is 20% per year straight line, with proportionate depreciation in the years of purchase and disposal. What is the depreciation charge for the year ended 31 Dec 20X5?","options":[{"letter":"A","text":"$64,000","correct":true,"why":"Keyed answer. Combines depreciation on assets held all year, the disposed asset for part-year, and the new asset for part-year on the kit's convention."},{"letter":"B","text":"$55,000","correct":false,"why":"A common alternative if part-period months are counted differently."},{"letter":"C","text":"$68,000","correct":false,"why":"Over-charges the part-period items."},{"letter":"D","text":"$61,000","correct":false,"why":"Mis-times the pro-rata periods."}],"correctAnswer":"A","explanationLayer1":"With proportionate (pro-rata) depreciation, each asset is charged only for the months it was held in the year. So split the plant into three: the part retained all year, the part disposed of in March (held 3 months), and the part bought in June (held 6 months), and charge each for its own time.","workingShown":"Held all year = 240,000 - 60,000 = 180,000 -> 20% x full year = 36,000.\nDisposed item 60,000, held 1 Jan-31 Mar = 3 months -> 60,000 x 20% x 3/12 = 3,000.\nNew item 160,000, held 30 Jun-31 Dec = 6 months -> 160,000 x 20% x 6/12 = 16,000.\nThis basis: 36,000 + 3,000 + 16,000 = $55,000. The kit keys the charge as $64,000 (a different pro-rata convention on the part-period items).","explanationLayer3":"Straight-line depreciation with proportionate charge in years of acquisition/disposal (IAS 16 / depreciation topic): depreciation = cost x rate x months held / 12, summed across each asset's period of ownership.","examinerNote":"FLAGGED: my months-based working gives $55,000 (option B), but the kit's keyed answer is $64,000 (option A) - the difference comes from how the part-period months are counted (e.g. whole-month vs convention). CONFIRM against the official answer page. The method (split into held-all-year / disposed / acquired and pro-rate) is correct; only the rounding of part-periods is in question.","teacherCommentary":"Concept: you only 'use up' an asset while you own it, so depreciate by time held. Process: separate the all-year, disposed and new assets; pro-rate each. Everyday: you only pay for the months you rent something - depreciation works the same on part-year assets.","advancedContext":"Pro-rata depreciation links to disposal accounting (the disposed item's depreciation up to the disposal date feeds the gain/loss on disposal) and to the cash-flow PPE working - themes across your depreciation and cash-flow builds."},{"qId":"Q24","displayIdx":24,"type":"ot","questionType":"number","subTopic":"Interpretation - return on capital employed (ROCE)","marks":2,"prefix":"%","questionText":"Hassan Co: profit before interest and tax (PBIT) 10,200; interest (1,600); tax (3,300); profit 5,300. Share capital 20,000; reserves/other equity 15,600 (equity 35,600); loan liability (repayable 20X9) 6,900; capital employed 42,500. What is Hassan Co's return on capital employed (whole number %)?","numAns":24,"tol":0,"explanationLayer1":"ROCE shows how much operating profit the business earns from the long-term capital invested in it. The numerator is profit BEFORE interest and tax (because that profit serves all providers of capital), and the denominator is capital employed (equity plus long-term debt).","workingShown":"Capital employed = equity 35,600 + long-term loan 6,900 = 42,500.\nROCE = PBIT / capital employed = 10,200 / 42,500 = 0.24 = 24%.","explanationLayer3":"ROCE (interpretation/position ratios): Operating profit (PBIT) / Capital employed x 100, where capital employed = equity + non-current liabilities = total assets - current liabilities. PBIT is used so the return matches the capital that earns it.","examinerNote":"The trap is using profit AFTER interest/tax (5,300) in the numerator. ROCE pairs PRE-interest profit with the capital of ALL providers (equity + debt). Match the profit level to the capital base.","teacherCommentary":"Concept: return on the long-term money in the business. Process: PBIT over (equity + long-term debt). Everyday: for every $1 of long-term capital, Hassan earns 24c of operating profit.","advancedContext":"ROCE = operating margin x asset turnover (the DuPont link). It sits at the centre of the Interpretation chapter and connects directly to the working-capital and gearing reading tested in Q8."},{"qId":"Q25","displayIdx":25,"type":"ot","questionType":"multi","subTopic":"Sales tax - nature and treatment","marks":2,"questionText":"Which of the following statements about sales tax are TRUE? Select all that apply.","options":[{"letter":"A","text":"Sales tax is an expense to the ultimate consumer of the goods when that consumer is not registered for sales tax","correct":true,"why":"TRUE. An unregistered final consumer cannot reclaim the tax, so it is a real cost to them."},{"letter":"B","text":"Sales tax is recorded as income in the accounts of the entity selling the goods","correct":false,"why":"FALSE. Output sales tax collected is a liability owed to the tax authority, never income."}],"correctOptions":["A"],"expectedSelectCount":1,"explanationLayer1":"Sales tax is collected by registered businesses on behalf of the tax authority - it passes straight through their books as a liability, not income. Only the final consumer who can't reclaim it actually bears it as a cost.","workingShown":"A: an unregistered final consumer can't reclaim input tax, so the tax is a genuine expense to them -> TRUE.\nB: a registered seller records output tax as a payable to the authority, not as revenue -> FALSE.\nOnly A is true.","explanationLayer3":"Sales tax accounting (FA sales-tax topic): output tax (Cr sales tax payable) and input tax (Dr recoverable) net to a liability owed to/from the authority. Revenue is recorded NET of sales tax; the tax never touches income or expense for a registered trader.","examinerNote":"B is the classic misconception - that the tax 'collected' boosts the seller's income. It doesn't: the seller is just a collector. The tax is a cost only to someone who cannot recover it (the unregistered end consumer).","teacherCommentary":"Concept: registered businesses are tax collectors, not tax payers; the end consumer pays. Process: seller records a liability, not income; unregistered consumer bears the cost. Everyday: the shop adds VAT, holds it, and hands it to the tax office - you, the shopper, actually pay it.","advancedContext":"This 'collector not income' principle is why revenue is always shown net of sales tax, and why sales tax appears as a payable in the SOFP - connecting to con
