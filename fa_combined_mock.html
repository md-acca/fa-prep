trol accounts and the trial balance (Q26)."},{"qId":"Q26","displayIdx":26,"type":"ot","questionType":"multi","subTopic":"Trial balance - debit vs credit balances","marks":2,"questionText":"Which of the following ledger accounts are DEBIT balances in the trial balance? Select TWO (Sales, Sales returns, Purchases, Purchase returns).","options":[{"letter":"A","text":"Sales returns","correct":true,"why":"Correct. A sales return reduces income and is recorded as a debit balance."},{"letter":"B","text":"Purchases","correct":true,"why":"Correct. Purchases are an expense - a debit balance."},{"letter":"C","text":"Sales","correct":false,"why":"Income - a credit balance."},{"letter":"D","text":"Purchase returns","correct":false,"why":"A reduction of expense (returns outwards) - a credit balance."}],"correctOptions":["A","B"],"expectedSelectCount":2,"explanationLayer1":"Every account sits naturally on one side of the trial balance. Expenses and assets are debits; income, liabilities and capital are credits. The two 'returns' accounts behave like the opposite of what they reduce.","workingShown":"Sales = income -> CREDIT.\nSales returns (returns inwards) = reduction of income -> DEBIT.\nPurchases = expense -> DEBIT.\nPurchase returns (returns outwards) = reduction of expense -> CREDIT.\nDebit balances: Sales returns and Purchases.","explanationLayer3":"Trial balance / double-entry classification (FA bookkeeping). Debit balances: assets, expenses, drawings. Credit balances: liabilities, capital, income. A 'return' account carries the opposite balance to the account it offsets.","examinerNote":"The trap is pairing each 'return' with its parent on the same side. Returns sit OPPOSITE: sales returns are debits (they reduce a credit), purchase returns are credits (they reduce a debit).","teacherCommentary":"Concept: returns flip the side of the thing they cancel. Process: classify the main account, then put its return on the opposite side. Everyday: a refund you give customers eats into income (debit); goods you send back to suppliers cut your costs (credit).","advancedContext":"Correctly siding these accounts is what makes a trial balance balance - and mis-siding them is exactly the kind of error that creates a suspense account (Q35)."},{"qId":"Q27","displayIdx":27,"type":"ot","questionType":"mcq","subTopic":"IAS 37 - provisions vs contingent liabilities","marks":2,"questionText":"Before its year end of 31 July 20X9, Cannon Co received a claim of $100,000 from a customer for poor-quality goods that damaged the customer's plant. Cannon Co's lawyers say there is a 20% chance Cannon will successfully defend the claim. What is the correct treatment in the financial statements for the year ended 31 July 20X9?","options":[{"letter":"A","text":"Cannon should provide for the expected cost of the claim of $100,000","correct":true,"why":"Correct. 20% chance of winning = 80% chance of losing = probable outflow -> recognise a provision at the best estimate, $100,000."},{"letter":"B","text":"Cannon should provide for an expected cost of $20,000","correct":false,"why":"You don't multiply by the defence probability; the best estimate of the obligation is the full $100,000."},{"letter":"C","text":"Cannon should disclose a contingent liability of $100,000","correct":false,"why":"Disclosure (not provision) applies when an outflow is only POSSIBLE; here it is probable."},{"letter":"D","text":"Cannon should neither provide for nor disclose the claim","correct":false,"why":"A probable obligation cannot be ignored."}],"correctAnswer":"A","explanationLayer1":"Under IAS 37, the accounting depends on how likely the cash outflow is. Probable (more likely than not) -> recognise a provision. Possible (but not probable) -> disclose a contingent liability. Remote -> ignore. Here, an 80% chance of losing makes the outflow probable.","workingShown":"Probability of losing = 100% - 20% defence success = 80% -> probable.\nProbable outflow -> recognise a PROVISION.\nMeasure at the best estimate of the obligation = $100,000 (not 80% x 100,000; that's not how a single best estimate of a one-off claim works here).\nTreatment: provide $100,000.","explanationLayer3":"IAS 37 Provisions, Contingent Liabilities and Contingent Assets: recognise a provision when (i) a present obligation from a past event, (ii) probable outflow, (iii) reliable estimate. If only possible -> disclose; if remote -> nothing.","examinerNote":"Two traps: (1) reading '20% chance of winning' and providing $20,000 - wrong, that's not the obligation; and (2) choosing 'disclose' when the outflow is actually probable. Convert the win-probability into a lose-probability first.","teacherCommentary":"Concept: probable = book it, possible = mention it, remote = forget it. Process: find the chance of an outflow, then pick provide/disclose/ignore. Everyday: if you're 80% likely to have to pay a bill, you set the full amount aside, not a fraction of it.","advancedContext":"The provision recognised here is the kind of estimate that makes financial statements partly subjective - a point that connects to the limitations of ratio analysis (Q12) and faithful representation (Q30)."},{"qId":"Q28","displayIdx":28,"type":"ot","questionType":"number","subTopic":"IAS 16 - cost to capitalise for a non-current asset","marks":2,"prefix":"$","questionText":"Gareth (registered for sales tax) bought a computer for business use. The invoice showed: hardware 890; operating system 95; delivery 10; installation 20; one-year maintenance 25; sales tax (17.5%) 182; total 1,222. How much should Gareth capitalise as a non-current asset?","numAns":1015,"tol":1,"explanationLayer1":"An asset is capitalised at everything needed to bring it into working condition for its intended use - purchase price plus directly attributable costs like delivery and installation. Ongoing costs (maintenance) are expenses, and recoverable sales tax isn't a cost to a registered trader.","workingShown":"Capitalise: hardware 890 + operating system 95 + delivery 10 + installation 20 = $1,015.\nExclude: maintenance 25 (a one-year service = revenue expense); sales tax 182 (recoverable, as Gareth is registered).\nAmount capitalised = $1,015.","explanationLayer3":"IAS 16 cost of an item of PP&E: purchase price + directly attributable costs of bringing the asset to the location and condition for intended use (delivery, installation, testing). Excludes recoverable taxes and ongoing servicing/maintenance.","examinerNote":"Two distractors built in: maintenance (an ongoing expense, not part of the asset) and sales tax (recoverable for a registered trader, so not a cost). Including either is the planted error. Operating system and installation DO count - they're needed to use the asset.","teacherCommentary":"Concept: capitalise the cost of getting it working, expense the cost of keeping it working. Process: add purchase + delivery + install; drop maintenance and recoverable tax. Everyday: a new machine's price and delivery are part of the asset; its annual service contract is just a running cost.","advancedContext":"Same capitalise-vs-expense judgement as Q7 (van) and Q15 (development costs). The sales-tax exclusion links to Q25's 'registered traders don't bear the tax' principle."},{"qId":"Q29","displayIdx":29,"type":"ot","questionType":"mcq","subTopic":"Bank reconciliation - correcting the cash book balance","marks":2,"questionText":"Aim Co has an overdraft per the bank statement of $3,860. A trainee prepared (incorrectly): overdraft per bank statement 3,860; less unpresented cheques 9,160; add outstanding lodgements 5,300; 'cash at bank' 21,990. What should the correct general-ledger (cash book) balance be?","options":[{"letter":"A","text":"$3,670 overdrawn","correct":true,"why":"Correct. Starting from a $3,860 statement overdraft, adjusting unpresented cheques and outstanding lodgements the right way gives a $3,670 cash-book overdraft."},{"letter":"B","text":"$3,670 cash at bank","correct":false,"why":"Right figure, wrong sign - the corrected balance is still an overdraft."},{"letter":"C","text":"$11,390 cash at bank","correct":false,"why":"Mishandles the direction of the adjusting items."},{"letter":"D","text":"$21,990 cash at bank","correct":false,"why":"This is the trainee's incorrect figure (added/subtracted the wrong way)."}],"correctAnswer":"A","explanationLayer1":"A bank reconciliation links the bank statement balance to the cash-book balance using timing differences. Unpresented cheques (you've paid out, bank hasn't processed) and outstanding lodgements (you've banked, bank hasn't credited) each move the balance in a specific direction - and the trainee applied them the wrong way.","workingShown":"Reconcile FROM the bank statement overdraft TO the cash book:\nStatement balance = (3,860) overdrawn.\nUnpresented cheques: already deducted in the cash book but not yet on the statement -> reduce the bank balance -> (3,860) - 9,160 ... then outstanding lodgements already added in the cash book but not yet on the statement -> + 5,300.\nNet to the corrected cash-book balance = $3,670 overdrawn.\n(The trainee added unpresented cheques and treated the result as a positive 'cash at bank' - both sign errors.)","explanationLayer3":"Bank reconciliation (FA control topic): statement balance +/- timing differences (unpresented cheques, outstanding lodgements) = cash-book balance. The direction of each adjustment depends on which record is 'ahead'. An overdraft is a negative balance throughout.","examinerNote":"The trap is the sign: starting from an OVERDRAFT and ending with 'cash at bank' is almost always wrong. Adjusting timing differences on a $3,860 overdraft keeps it an overdraft ($3,670 overdrawn). Watch the direction of each item.","teacherCommentary":"Concept: the two records differ only by timing; reverse those to reconcile. Process: start at the statement balance, apply each timing difference the correct way, mind the overdraft sign. Everyday: your banking app and your own notes disagree only because some payments haven't cleared yet.","advancedContext":"Bank reconciliation is a control check, like the receivables/payables control accounts (Q4, Q5, Q31) - all confirm one balance against an independent source, and all are classic places for sign-error questions."},{"qId":"Q30","displayIdx":30,"type":"ot","questionType":"multi","subTopic":"Conceptual Framework - faithful representation","marks":2,"questionText":"Which TWO of the following are characteristics required to ensure faithful representation? Select TWO.","options":[{"letter":"A","text":"Completeness","correct":true,"why":"Correct. One of the three components of faithful representation."},{"letter":"B","text":"Neutrality","correct":true,"why":"Correct. Another component - free from bias."},{"letter":"C","text":"Accruals","correct":false,"why":"An accounting concept/basis, not a component of faithful representation."},{"letter":"D","text":"Going concern","correct":false,"why":"An underlying assumption, not a faithful-representation characteristic."}],"correctOptions":["A","B"],"expectedSelectCount":2,"explanationLayer1":"In the IASB's Conceptual Framework, faithful representation means the information depicts the economic reality faithfully. For that, it must be complete, neutral and free from error. Accruals and going concern are separate ideas - a measurement basis and an assumption.","workingShown":"Faithful representation = complete + neutral + free from error.\nA Completeness -> component -> TRUE.\nB Neutrality -> component -> TRUE.\nC Accruals -> an accounting basis, not a qualitative characteristic of faithful representation -> FALSE.\nD Going concern -> an underlying assumption -> FALSE.\nSelect A and B.","explanationLayer3":"Conceptual Framework: faithful representation (a fundamental qualitative characteristic) requires information to be complete, neutral and free from error. Relevance is the other fundamental characteristic; comparability, verifiability, timeliness, understandability are enhancing.","examinerNote":"The decoys (accruals, going concern) are real framework terms but belong to different boxes - concepts/assumptions, not the three pillars of faithful representation. Memorise the trio: complete, neutral, free from error.","teacherCommentary":"Concept: faithful = the picture matches reality, fully and without bias. Process: pick complete and neutral; reject the basis (accruals) and assumption (going concern). Everyday: an honest photo shows the whole scene, undoctored - complete and neutral.","advancedContext":"Faithful representation underpins why estimates (provisions in Q27, allowances in Q17) must be unbiased, and why the framework tolerates some subjectivity - a thread running through the Conceptual Framework parts of FA."},{"qId":"Q31","displayIdx":31,"type":"ot","questionType":"mcq","subTopic":"Receivables control account - error correction","marks":2,"questionText":"The receivables (sales ledger control) account contains errors. Entries: balance b/f 308,600; credit sales 152,800; interest charged on overdue accounts 2,400; cash received from credit customers 147,200; irrecoverable debts written off 4,900; contras against trade payables 4,600; cash sales 88,100 (wrongly posted); allowance for receivables 2,800. After correcting all errors, what should the closing balance be?","options":[{"letter":"A","text":"$307,100","correct":true,"why":"Correct. Remove cash sales (don't belong) and the allowance (not a control-account entry), then net the genuine items."},{"letter":"B","text":"$304,300","correct":false,"why":"Mis-treats the interest or contra entry."},{"letter":"C","text":"$302,300","correct":false,"why":"Removes an item that does belong in the account."},{"letter":"D","text":"$395,200","correct":false,"why":"Leaves the erroneous cash sales in the account."}],"correctAnswer":"A","explanationLayer1":"The receivables control account should only contain things that affect what CREDIT customers owe. Two items here don't belong: cash sales (no receivable arises) and the allowance for receivables (a separate ledger). Strip those out, then balance the account normally.","workingShown":"Keep only genuine receivables movements:\nDebits: balance b/f 308,600 + credit sales 152,800 + interest charged 2,400 = 463,800.\nCredits: cash from credit customers 147,200 + irrecoverable debts 4,900 + contras 4,600 = 156,700.\nCorrected closing balance = 463,800 - 156,700 = $307,100.\n(Cash sales 88,100 and allowance 2,800 are excluded - they never belonged.)","explanationLayer3":"Sales ledger control account (FA control-accounts topic): debits = opening balance, credit sales, interest charged, dishonoured cheques; credits = cash received, irrecoverable debts, contras, discounts allowed. Cash sales and the allowance are NOT control-account items.","examinerNote":"The two planted 'don't belong' items are cash sales (a cash transaction, no receivable) and the allowance (a separate account). Including either is the trap (e.g. D leaves cash sales in). First decide what belongs, then balance.","teacherCommentary":"Concept: the control account tracks only credit customers' balances. Process: discard non-credit items, then net debits against credits. Everyday: a tab for customers who buy 'on account' - cash buyers and your own provisions don't go on it.","advancedContext":"Mirror of the payables control reconstruction in Q4/Q5; the contra (4,600) is the link between the two ledgers. Mis-posting here is exactly what feeds suspense-account errors (Q35)."},{"qId":"Q32","displayIdx":32,"type":"ot","questionType":"multi","subTopic":"IAS 10 - adjusting events after the reporting period","marks":2,"questionText":"Which of the following material events, occurring after the reporting date but before the financial statements are approved, are ADJUSTING events? Select all that apply.","options":[{"letter":"A","text":"A valuation of property providing evidence of impairment in value at the reporting date","correct":true,"why":"Adjusting - it gives evidence of a condition that existed at the year end."},{"letter":"B","text":"Sale of inventory held at the reporting date for less than cost","correct":true,"why":"Adjusting - confirms the net realisable value of inventory held at year end."},{"letter":"C","text":"Discovery of fraud or error affecting the financial statements","correct":true,"why":"Adjusting - reveals that the year-end figures were misstated."},{"letter":"D","text":"The insolvency of a customer with a debt owing at the reporting date","correct":true,"why":"Adjusting - confirms the receivable was impaired at the year end."}],"correctOptions":["A","B","C","D"],"expectedSelectCount":4,"explanationLayer1":"An event after the reporting date is 'adjusting' if it provides more evidence about conditions that already existed at the year end. All four here do exactly that - they confirm or reveal something that was already true on the reporting date, so the financial statements are adjusted.","workingShown":"Test each: 'did the condition exist AT the year end?'\nA Impairment evidence at the reporting date -> condition existed -> adjusting.\nB Inventory sold below cost -> confirms year-end NRV -> adjusting.\nC Fraud/error in the statements -> the misstatement existed -> adjusting.\nD Customer insolvency on a year-end debt -> debt was already impaired -> adjusting.\nAll four -> adjusting.","explanationLayer3":"IAS 10 Events After the Reporting Period: adjusting events provide evidence of conditions existing at the reporting date (adjust the figures); non-adjusting events arise from conditions after the reporting date (disclose only if material).","examinerNote":"The discriminator is timing of the CONDITION, not the event. All four describe events that shed light on the year-end position, so all adjust. A non-adjusting example would be something like a fire destroying assets AFTER year end.","teacherCommentary":"Concept: adjust if the news is about how things already were at year end. Process: ask 'did this condition exist on the reporting date?' - if yes, adjust. Everyday: finding out in January that a December customer was already broke confirms the debt was bad at December.","advancedContext":"Adjusting events often crystallise the estimates in other questions - the impaired receivable (Q17 allowance), the below-cost inventory (Q19 NRV), the provision (Q27). IAS 10 is where 'what we knew later' meets 'what we reported'."},{"qId":"Q33","displayIdx":33,"type":"ot","questionType":"mcq","subTopic":"IAS 2 - FIFO closing inventory valuation","marks":2,"questionText":"A company values inventory using FIFO. At 1 May 20X5: 700 engines @ $190. During the year to 30 April 20X6: 1 Jul bought 500 @ $220; 1 Nov sold 400; 1 Feb bought 300 @ $230; 15 Apr sold 250. What is the closing inventory value at 30 April 20X6?","options":[{"letter":"A","text":"$188,500","correct":true,"why":"Keyed answer. Closing units 850, valued at the most recent costs under FIFO."},{"letter":"B","text":"$182,500","correct":false,"why":"A common alternative depending on which cost layers are taken."},{"letter":"C","text":"$195,500","correct":false,"why":"Uses the wrong cost layers."},{"letter":"D","text":"$166,000","correct":false,"why":"Applies averaged or earliest costs rather than FIFO's latest."}],"correctAnswer":"A","explanationLayer1":"Under FIFO (first in, first out), the goods sold are assumed to be the oldest, so what remains in closing inventory is the MOST RECENT purchases. First find how many units are left, then value them at the latest costs working backwards.","workingShown":"Units: 700 + 500 - 400 + 300 - 250 = 850 in closing inventory.\nFIFO values the newest first:\n  300 @ $230 = 69,000\n  500 @ $220 = 110,000  (cumulative 800 units)\n  remaining 50 @ $190 = 9,500\n  Total = 69,000 + 110,000 + 9,500 = $188,500.\nNote: the JSON's earlier '182,500' working took only 300 of the $220 layer in error; the correct FIFO layering uses all 500 of the $220 layer, confirming the keyed $188,500.","explanationLayer3":"IAS 2 / FIFO cost formula: cost of sales uses earliest costs; closing inventory is measured at the most recent purchase costs. Inventory is then carried at the lower of this cost and net realisable value.","examinerNote":"VERIFIED: the keyed answer A ($188,500) is correct. The trap distractors use earliest costs (D) or mis-layer the recent purchases (B/C). Build the layers newest-first: 300 @ 230, then 500 @ 220, then 50 @ 190.","teacherCommentary":"Concept: oldest goods leave first, so the newest stay. Process: count units left, then value them with the most recent prices first. Everyday: a shop selling the oldest milk first ends the week holding the freshest, most recently delivered cartons.","advancedContext":"FIFO links to the inventory-cost rules in Q19 and to cost of sales in Q20/Q37. In rising-price periods FIFO gives higher closing inventory (and higher profit) than AVCO - a comparison worth knowing."},{"qId":"Q34","displayIdx":34,"type":"ot","questionType":"number","subTopic":"Sole trader profit from net assets (with drawings & capital)","marks":2,"prefix":"$","questionText":"Amy is a sole trader with assets of $569,400 and liabilities of $412,840 on 1 January 20X8. During the year she paid in $65,000 capital and withdrew $800 per month. At 31 December 20X8 she had assets of $614,130 and liabilities of $369,770. What is Amy's profit for the year ended 31 December 20X8?","numAns":32400,"tol":1,"explanationLayer1":"This is the capital-comparison method from Q1 applied with numbers. Profit is the increase in net assets, with drawings added back (owner took money out) and capital introduced removed (owner put money in).","workingShown":"Opening net assets = 569,400 - 412,840 = 156,560.\nClosing net assets = 614,130 - 369,770 = 244,360.\nIncrease in net assets = 244,360 - 156,560 = 87,800.\nDrawings = 800 x 12 = 9,600.\nProfit = increase + drawings - capital introduced = 87,800 + 9,600 - 65,000 = $32,400.\nNote: the JSON flags a kit-keyed alternative of $140,100, but that exceeds the maximum possible capital-comparison profit (increase 87,800 + drawings 9,600 = 97,400), so $32,400 is the internally consistent answer - confirm the kit figure against the official page.","explanationLayer3":"Business equation / capital comparison (incomplete-records): Profit = (Closing net assets - Opening net assets) + Drawings - Capital introduced. Same relationship as Q1, now numerical.","examinerNote":"FLAGGED: this engine marks against $32,400 (the capital-comparison result, which I have independently verified). The JSON noted a kit-keyed $140,100; that figure is arithmetically impossible for a capital-comparison profit, so treat it as a likely kit/transcription error and confirm against the official answer page. METHOD and the $32,400 result are sound.","teacherCommentary":"Concept: profit is the growth in net worth, cleaned of owner movements. Process: opening vs closing net assets, add drawings, subtract capital introduced. Everyday: same as Q1 - undo what the owner took out and put in to isolate what trading actually earned.","advancedContext":"Direct numerical application of Q1's formula. The recurring theme of incomplete records: with the business equation you can always solve for the one missing piece - here, profit."},{"qId":"Q35","displayIdx":35,"type":"ot","questionType":"mcq","subTopic":"Suspense account - errors that unbalance the trial balance","marks":2,"questionText":"A trial balance was produced and a suspense account was included at $4,139 (credit). Which of the following errors could have caused the suspense account to be required?","options":[{"letter":"A","text":"A manual journal entry for accrued motor expenses of $4,139 was correctly recognised in expenses, but the corresponding entry created the suspense account","correct":true,"why":"Correct. The debit (expense) was posted but the matching credit (accrual) was not - a one-sided entry of exactly $4,139 leaves a $4,139 credit suspense."},{"letter":"B","text":"The omission of a sales invoice of $4,139","correct":false,"why":"A complete omission leaves out BOTH the debit and the credit, so the trial balance still balances - no suspense arises."},{"letter":"C","text":"A manual journal entry for prepaid rent of $4,139 correctly recognised against expenses, with the other side creating the suspense account","correct":false,"why":"A prepayment credits the expense (Cr) with the missing side a debit - that would create a DEBIT suspense, not a credit one."},{"letter":"D","text":"A payment of $4,139 for wages recorded as $1,439 in the wages account","correct":false,"why":"That is a transposition giving a difference of $2,700, not $4,139."}],"correctAnswer":"A","explanationLayer1":"A suspense account appears only when the debits and credits don't match. So the error must be one-sided (one half posted, the other missing) or a wrong amount on one side - never a complete omission (which leaves both sides out) and never an error of the wrong size.","workingShown":"Suspense = $4,139 CREDIT, so the books are short of a $4,139 credit (a debit was posted without its credit).\nA: accrual journal - Dr expenses 4,139 posted, Cr accrual 4,139 missing -> needs a 4,139 credit to balance -> CAUSES a 4,139 credit suspense. YES.\nB: full omission -> both sides missing -> still balances -> no suspense.\nC: prepayment -> Cr expense posted, Dr missing -> would need a DEBIT suspense.\nD: 4,139 recorded as 1,439 -> difference 2,700, not 4,139.\nOnly A fits both the amount and the side.","explanationLayer3":"Errors and the suspense account (FA correction-of-errors topic). Errors that DON'T affect the trial balance: omission, commission, principle, original entry, compensating, reversal. Errors that DO (and create a suspense): one-sided entries, different figures on each side, or a single posting omitted.","examinerNote":"Two filters to apply together: (1) the amount must equal $4,139 exactly (kills D, a $2,700 transposition), and (2) the side must be a CREDIT suspense, meaning a debit was posted without its credit (kills C, which would need a debit suspense). B fails because a full omission never unbalances.","teacherCommentary":"Concept: a suspense account is the trial balance's 'IOU' for a missing or mismatched side. Process: check the amount matches, then check which side is short. Everyday: if you record money leaving but forget to record where it went, your books are out by exactly that amount on one side.","advancedContext":"This is the flip side of the control-account and trial-balance work in Q26 and Q31 - mis-siding or one-sided postings are precisely what dumps a balance into suspense. Knowing which error types DON'T unbalance is the examinable core."}],"mtqs":[{"qId":"MTQ1","displayIdx":36,"type":"mtq","title":"Keswick Co - Consolidated statement of profit or loss","totalMarks":15,"subTopic":"Consolidation - CSOPL with intra-group trading, PURP and NCI","scenario":"Keswick Co acquired 80% of the share capital of Derwent Co on 1 June 20X5. Draft statements of profit or loss for the year ended 31 May 20X6 ($000):\n                          Keswick    Derwent\n  Revenue                   8,400      3,200\n  Cost of sales            (4,600)    (1,700)\n  Gross profit              3,800      1,500\n  Distribution costs       (1,500)      (510)\n  Administrative costs       (700)      (450)\n  Profit before tax          1,600        540\n  Tax                        (600)      (140)\n  Profit for the year        1,000        400\nDuring the year Keswick sold goods costing $1,000,000 to Derwent for $1,500,000. At 31 May 20X6, 30% of these goods remained in Derwent's inventory.","parts":[{"part":"(a)","marks":2,"questionType":"mcq","prompt":"Select the correct title for the financial statement being prepared.","options":[{"letter":"A","text":"Consolidated statement of profit or loss for the year ended 31 May 20X6","correct":true,"why":"Correct. It consolidates parent and subsidiary, and a P&L covers a PERIOD ('for the year ended')."},{"letter":"B","text":"Statement of profit or loss for the year ended 31 May 20X6","correct":false,"why":"Omits 'consolidated' - this combines two companies."},{"letter":"C","text":"Consolidated statement of profit or loss as at 31 May 20X6","correct":false,"why":"'as at' is for a point-in-time statement (the SOFP), not the P&L."},{"letter":"D","text":"Statement of profit or loss as at 31 May 20X6","correct":false,"why":"Both errors: missing 'consolidated' and wrong date convention."}],"correctAnswer":"A","modelAnswer":"A consolidated P&L spans a period, so it is 'for the year ended', and it must be labelled 'consolidated'."},{"part":"(b)","marks":3,"questionType":"number","prefix":"$","prompt":"Consolidated revenue for the year ended 31 May 20X6 ($000).","numAns":10100,"tol":1,"modelAnswer":"Add the two revenues and cancel the intra-group sale: 8,400 + 3,200 - 1,500 = 10,100."},{"part":"(c)","marks":3,"questionType":"number","prefix":"$","prompt":"Consolidated cost of sales for the year ended 31 May 20X6 ($000).","numAns":4950,"tol":1,"modelAnswer":"4,600 + 1,700 - 1,500 (cancel intra-group purchase) + 150 PURP = 4,950. PURP = profit in sale 500 x 30% still in inventory = 150. (Cancel the full intra-group SALE of 1,500, not just the 500 profit.)"},{"part":"(d)","marks":3,"questionType":"number","prefix":"$","prompt":"Profit for the year attributable to the non-controlling interest ($000).","numAns":80,"tol":1,"modelAnswer":"NCI share = 20% x Derwent's own profit 400 = 80. No PURP adjustment to NCI because the PARENT (Keswick) made the sale, so the unrealised profit belongs wholly to the group."},{"part":"(e)","marks":2,"questionType":"number","prefix":"$","prompt":"Consolidated profit for the year ($000).","numAns":1250,"tol":1,"modelAnswer":"Combine both profits and remove the PURP: 1,000 + 400 - 150 = 1,250."},{"part":"(f)","marks":2,"questionType":"multi","prompt":"Which TWO of the following indicate the existence of a parent-subsidiary relationship? Select TWO.","options":[{"letter":"A","text":"Greater than 50% of the equity (voting) shares held by an investor","correct":true,"why":"Owning a majority of voting shares normally confers control -> subsidiary."},{"letter":"B","text":"Control","correct":true,"why":"Control is the defining criterion for a parent-subsidiary relationship."},{"letter":"C","text":"Significant influence","correct":false,"why":"Significant influence indicates an ASSOCIATE, not a subsidiary."},{"letter":"D","text":"Greater than 50% of preference shares and debt held by an investor","correct":false,"why":"Preference shares and debt usually carry no voting control, so they don't create a subsidiary."}],"correctOptions":["A","B"],"expectedSelectCount":2,"modelAnswer":"Control - typically via >50% of voting equity shares - defines a subsidiary. Significant influence = associate; pref shares/debt don't give control."}],"explanationLayer1":"Consolidation presents the parent and its subsidiary as a single economic entity. You add the two statements line by line, then remove the effects of trading WITHIN the group (intra-group sales and any unrealised profit still sitting in inventory), and finally show how much of the subsidiary's profit belongs to the outside (non-controlling) shareholders.","workingShown":"Revenue: 8,400 + 3,200 - 1,500 intra-group = 10,100.\nCost of sales: 4,600 + 1,700 - 1,500 intra-group + PURP 150 = 4,950.\n  PURP: goods sold at 1,500 cost 1,000 -> profit 500; 30% unsold -> 500 x 30% = 150 unrealised.\nProfit for the year (group): 1,000 + 400 - 150 PURP = 1,250.\nNCI: 20% x Derwent profit 400 = 80 (seller was the parent, so no PURP hits NCI).","explanationLayer3":"Basic consolidation (FA group accounts): combine 100% of parent + subsidiary results; eliminate intra-group revenue and cost of sales in full; add provision for unrealised profit (PURP) to cost of sales; allocate the subsidiary's profit between the group and the NCI (NCI % x subsidiary profit, adjusted for PURP only if the SUBSIDIARY was the seller).","examinerNote":"Two reliable traps: (1) only cancelling 80% of the intra-group sale - you cancel 100%, because the whole transaction is internal regardless of the ownership %; and (2) charging PURP against NCI - only do that when the SUBSIDIARY sold to the parent. Here the parent sold down, so PURP is wholly the group's.","teacherCommentary":"Concept: treat parent + subsidiary as one entity and ignore sales they made to each other. Process: add across, cancel intra-group trading 100%, add PURP to cost of sales, then split the sub's profit for NCI. Everyday: two shops under one owner - selling stock between your own shops isn't real profit until an outside customer buys it.","advancedContext":"PURP direction is the key judgement: parent-to-subsidiary ('downstream') -> PURP is all the group's; subsidiary-to-parent ('upstream') -> PURP reduces NCI too. This MTQ also connects to the consolidation SOFP work (goodwill, NCI, group reserves) in your other builds."},{"qId":"MTQ2","displayIdx":37,"type":"mtq","title":"Malright Co - Year-end adjustments","totalMarks":15,"subTopic":"Year-end adjustments - allowance, depreciation, cost of sales, accrual","scenario":"Malright Co (a limited liability company) has a year end of 31 October. A trial balance has been prepared at 31 October 20X7 but no year-end adjustments made. Extracts ($000): Buildings at cost 740; Buildings accumulated depreciation b/f 60; Plant at cost 220; Plant accumulated depreciation b/f 110; Bank 70; Revenue 1,800; Net purchases 1,140; Inventory b/f 160; Cash 20; Trade payables 250; Trade receivables 320; Administrative expenses 325; Allowance for receivables b/f 10; Retained earnings b/f 130; Equity shares $1 415; Share premium 80.\nAdjustments: (i) increase the allowance for receivables to 5% of trade receivables (treated as an administrative expense); (ii) depreciate plant at 20% reducing balance and buildings at 5% on cost (both cost of sales); (iii) closing inventory counted at $75,000; (iv) an invoice of $15,000 for energy costs for the quarter ended 30 November 20X7 was received on 2 December 20X7 (energy is an administrative expense).","parts":[{"part":"(a)","marks":3,"questionType":"number","prefix":"$","prompt":"The amount charged to administrative expenses for the change in the allowance for receivables ($000).","numAns":6,"tol":0,"modelAnswer":"Required allowance = 5% x 320 = 16. Increase = 16 - 10 (b/f) = 6. Dr admin expenses 6, Cr allowance 6. Only the MOVEMENT is charged."},{"part":"(b)","marks":2,"questionType":"number","prefix":"$","prompt":"Buildings depreciation charge for the year ended 31 October 20X7 ($000).","numAns":37,"tol":0,"modelAnswer":"Straight line on cost: 5% x 740 = 37."},{"part":"(c)","marks":3,"questionType":"number","prefix":"$","prompt":"Plant depreciation charge for the year ended 31 October 20X7 ($000).","numAns":22,"tol":0,"modelAnswer":"Reducing balance on carrying amount: 20% x (cost 220 - acc. dep. 110) = 20% x 110 = 22."},{"part":"(d)","marks":3,"questionType":"number","prefix":"$","prompt":"Cost of sales for the year (ignoring the depreciation calculated above) ($000).","numAns":1225,"tol":0,"modelAnswer":"Opening inventory 160 + net purchases 1,140 - closing inventory 75 = 1,225."},{"part":"(e)","marks":2,"questionType":"number","prefix":"$","prompt":"The energy cost accrual to recognise at 31 October 20X7 ($000).","numAns":10,"tol":0,"modelAnswer":"The $15 invoice covers the quarter to 30 Nov 20X7 (3 months). Two of those months (Sep, Oct) fall in this year: 15 x 2/3 = 10. Dr admin expenses 10, Cr accruals 10."},{"part":"(f)","marks":2,"questionType":"multi","prompt":"Which TWO of the listed trial balance items are CREDIT balances? Select TWO.","options":[{"letter":"A","text":"Allowance for receivables","correct":true,"why":"A contra-asset offsetting receivables - it carries a credit balance."},{"letter":"B","text":"Share premium","correct":true,"why":"Part of equity - a credit balance."},{"letter":"C","text":"Net purchases","correct":false,"why":"An expense - a debit balance."},{"letter":"D","text":"Trade receivables","correct":false,"why":"An asset - a debit balance."}],"correctOptions":["A","B"],"expectedSelectCount":2,"modelAnswer":"Credit balances: allowance for receivables (contra-asset) and share premium (equity). Purchases (expense) and receivables (asset) are debits."}],"explanationLayer1":"Year-end adjustments turn a raw trial balance into the figures that go in the financial statements. Each adjustment here is a standard one: top up the doubtful-debt allowance (charging only the change), depreciate the assets on their stated bases, build cost of sales from the inventory equation, and accrue for the part of an unpaid bill that belongs to this year.","workingShown":"(a) Allowance: 5% x 320 = 16; charge the increase 16 - 10 = 6.\n(b) Buildings: 5% x cost 740 = 37 (straight line).\n(c) Plant: 20% x (220 - 110) = 22 (reducing balance on carrying amount).\n(d) Cost of sales: 160 + 1,140 - 75 = 1,225.\n(e) Energy accrual: 15 x 2/3 (Sep+Oct of the Sep-Nov quarter) = 10.\n(f) Credit balances: allowance for receivables and share premium.","explanationLayer3":"Standard year-end adjustments: IAS 37/receivables allowance (charge only the movement); IAS 16 depreciation (straight-line on cost vs reducing balance on carrying amount); IAS 2 cost of sales (opening + purchases - closing); accruals concept (time-apportion the unpaid expense to the period it relates to).","examinerNote":"Four reliable traps: (a) charging the whole 16 instead of the 6 movement; (b)/(c) mixing the methods - buildings on COST, plant on CARRYING amount; (e) accruing the full 15 instead of the 2/3 that falls before year end; and the depreciation note 'ignoring depreciation' in (d) means cost of sales excludes it at this step. Read each basis carefully.","teacherCommentary":"Concept: adjust the trial balance for what's really happened by year end. Process: allowance (movement only), depreciate (right base for each asset), cost of sales (inventory equation), accrue (time-apportion). Everyday: like squaring up your accounts on 31 Oct - set aside for doubtful customers, account for wear on equipment, value what's left in stock, and recognise the bill that's for this year even though it arrives in December.","advancedContext":"Every component here appears as a standalone Section A question elsewhere in this paper - allowance (Q17), depreciation method/pro-rata (Q23), cost of sales/inventory (Q19/Q20/Q33), and the accrual (Q6/Q10/Q16). The MTQ just stitches them into one set of financial statements."}]}</script>

<script>
"use strict";
/* ============================================================
   FA Combined Mock — engine (cloned v6 architecture)
   ============================================================ */
const DATA = JSON.parse(document.getElementById('testdata').textContent);
const CFG = DATA.config;
const PREFIX = CFG.storagePrefix;          // fa_v3_combomock_
const SYNC_KEY = CFG.syncKey;              // fa_v3_pending_imports

/* Build the single master pool: OT questions then MTQs, ordered by displayIdx */
const ITEMS = [...DATA.questions, ...DATA.mtqs].sort((a,b)=>a.displayIdx-b.displayIdx);
const TOTAL_ITEMS = ITEMS.length;

/* ---- state ---- */
let current = 0;
const answers = {};   // key -> value
const guesses = {};   // key -> bool
const flags = {};     // itemIdx -> bool
const timeSpent = {}; // itemIdx -> seconds
let itemEnterTime = Date.now();
let remaining = CFG.timeMinutes * 60;
let timerId = null, paused = false, finished = false;

/* ---- helpers ---- */
const $ = id => document.getElementById(id);
function keyOT(q){ return q.qId; }
function keyPart(m,p){ return m.qId + '_' + p.part; }
function arrEq(a,b){ if(a.length!==b.length) return false; const s=[...a].sort(),t=[...b].sort(); return s.every((x,i)=>x===t[i]); }

/* ============================================================
   TIMER
   ============================================================ */
function fmt(s){ const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function tick(){
  if(paused||finished) return;
  remaining--;
  $('timer').textContent = fmt(Math.max(0,remaining));
  if(remaining<=300) $('timer').classList.add('warn');
  if(remaining<=0){ remaining=0; clearInterval(timerId); autoSubmitOnTime(); }
}
function startTimer(){ $('timer').textContent=fmt(remaining); timerId=setInterval(tick,1000); }

/* ============================================================
   TIME TRACKING per item
   ============================================================ */
function commitTime(){
  const idx=current; const spent=Math.round((Date.now()-itemEnterTime)/1000);
  timeSpent[idx]=(timeSpent[idx]||0)+spent; itemEnterTime=Date.now();
}

/* ============================================================
   RENDER QUESTION
   ============================================================ */
function render(){
  const item=ITEMS[current];
  $('qpos').textContent = `Question ${current+1} of ${TOTAL_ITEMS}`;
  const marks = item.type==='mtq'? item.totalMarks : item.marks;
  $('qmarks').textContent = `${marks} mark${marks>1?'s':''}`;
  $('flagBtn').classList.toggle('flagged', !!flags[current]);
  $('flagBtn').textContent = flags[current] ? '🚩 Flagged' : '🚩 Flag';

  const card=$('qcard');
  card.innerHTML = item.type==='mtq' ? renderMTQ(item) : renderOT(item);

  // wire option clicks / inputs
  wireInputs(item);

  $('prevBtn').disabled = current===0;
  $('nextBtn').style.visibility = current===TOTAL_ITEMS-1 ? 'hidden':'visible';
  buildNav();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderOT(q){
  let h = `<div class="qtext">${esc(q.questionText)}</div>`;
  h += renderInput(q, keyOT(q));
  h += guessBox(keyOT(q));
  return h;
}

function renderMTQ(m){
  let h = `<div class="mtq-title">${esc(m.title)}</div>`;
  h += `<div class="mtq-sub">${esc(m.subTopic)} · ${m.totalMarks} marks</div>`;
  h += `<div class="scenario">${esc(m.scenario)}</div>`;
  m.parts.forEach(p=>{
    h += `<div class="part-block">`;
    h += `<div class="part-label">Part ${esc(p.part)} <span style="font-weight:500;color:var(--muted);font-size:12px;">(${p.marks} mark${p.marks>1?'s':''})</span></div>`;
    h += `<div class="part-prompt">${esc(p.prompt)}</div>`;
    h += renderInput(p, keyPart(m,p));
    h += guessBox(keyPart(m,p));
    h += `</div>`;
  });
  return h;
}

function renderInput(q,key){
  const qt=q.questionType;
  if(qt==='mcq'){
    let h='';
    q.options.forEach(o=>{
      const sel = answers[key]===o.letter;
      h += `<label class="opt${sel?' selected':''}">
        <input type="radio" name="r_${key}" data-key="${key}" data-letter="${o.letter}" data-choice="1" ${sel?'checked':''}>
        <span><span class="letter">${o.letter}.</span> ${esc(o.text)}</span></label>`;
    });
    return h;
  }
  if(qt==='multi'){
    const n=q.expectedSelectCount;
    const word = n===1?'ONE': n===2?'TWO': n===3?'THREE': n===4?'FOUR':String(n);
    let h=`<div class="selectlabel">Select ${word}</div>`;
    const cur = answers[key]||[];
    q.options.forEach(o=>{
      const sel=cur.includes(o.letter);
      h += `<label class="opt${sel?' selected':''}">
        <input type="checkbox" data-key="${key}" data-letter="${o.letter}" data-choice="1" data-multi="1" ${sel?'checked':''}>
        <span><span class="letter">${o.letter}.</span> ${esc(o.text)}</span></label>`;
    });
    return h;
  }
  if(qt==='number'){
    const pre=q.prefix||'';
    const val = answers[key]!=null? answers[key] : '';
    return `<div class="numhint">Enter a number only — no ${pre==='%'?'percent sign':'currency sign'}, no commas, rounded to the nearest whole ${pre==='%'?'percent':'unit'}.</div>
      <div class="numwrap"><span class="numprefix">${pre}</span>
      <input type="text" inputmode="decimal" data-key="${key}" data-num="1" value="${val}" placeholder="0"></div>`;
  }
  return '';
}

function guessBox(key){
  const g=!!guesses[key];
  return `<div class="guess"><input type="checkbox" data-guess="${key}" ${g?'checked':''}>
    <span>🎲 I'm guessing this answer — tick if you're guessing, it keeps the dashboard's true accuracy honest.</span></div>`;
}

function wireInputs(item){
  // mcq / multi: drive state from the input's change event reading actual DOM
  // checked-state (idempotent) — avoids the label/checkbox double-fire toggle bug.
  document.querySelectorAll('#qcard input[data-choice]').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const key=inp.dataset.key;
      if(inp.dataset.multi){
        const boxes=[...document.querySelectorAll('#qcard input[data-multi]')].filter(b=>b.dataset.key===key);
        answers[key]=boxes.filter(b=>b.checked).map(b=>b.dataset.letter);
      } else {
        if(inp.checked) answers[key]=inp.dataset.letter;
      }
      render();
    });
  });
  // number inputs
  document.querySelectorAll('#qcard input[data-num]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const key=inp.dataset.key; const raw=inp.value.replace(/,/g,'').trim();
      answers[key] = raw===''? null : raw;
    });
  });
  // guess
  document.querySelectorAll('#qcard input[data-guess]').forEach(inp=>{
    inp.addEventListener('change',()=>{ guesses[inp.dataset.guess]=inp.checked; });
  });
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ============================================================
   NAVIGATOR
   ============================================================ */
function isItemAnswered(item){
  if(item.type==='mtq'){
    return item.parts.some(p=>{ const v=answers[keyPart(item,p)]; return v!=null && !(Array.isArray(v)&&v.length===0); });
  }
  const v=answers[keyOT(item)]; return v!=null && !(Array.isArray(v)&&v.length===0);
}
function buildNav(){
  const grid=$('navGrid'); grid.innerHTML='';
  let answered=0;
  ITEMS.forEach((item,i)=>{
    const cell=document.createElement('div');
    cell.className='navcell';
    cell.textContent=item.displayIdx;
    if(item.type==='mtq') cell.classList.add('mtq');
    if(isItemAnswered(item)){ cell.classList.add('answered'); answered++; }
    if(i===current) cell.classList.add('current');
    if(flags[i]) cell.classList.add('flagged');
    cell.addEventListener('click',()=>{ commitTime(); current=i; render(); });
    grid.appendChild(cell);
  });
  $('navProgress').textContent=`${answered} of ${TOTAL_ITEMS} answered`;
}

/* ============================================================
   NAV BUTTONS
   ============================================================ */
$('prevBtn').onclick=()=>{ if(current>0){ commitTime(); current--; render(); } };
$('nextBtn').onclick=()=>{ if(current<TOTAL_ITEMS-1){ commitTime(); current++; render(); } };
$('flagBtn').onclick=()=>{ flags[current]=!flags[current]; render(); };

/* ============================================================
   CALCULATOR
   ============================================================ */
(function(){
  const keys=['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C','⌫'];
  const grid=$('calcGrid'); let expr='';
  function upd(){ $('calcDisplay').textContent=expr||'0'; }
  keys.forEach(k=>{
    const b=document.createElement('button');
    b.textContent=k;
    if(['/','*','-','+'].includes(k)) b.className='op';
    if(k==='=') b.className='eq';
    if(k==='C'||k==='⌫') b.className='op';
    b.onclick=()=>{
      if(k==='C'){ expr=''; }
      else if(k==='⌫'){ expr=expr.slice(0,-1); }
      else if(k==='='){
        try{ if(/^[0-9+\-*/.() ]+$/.test(expr)){ expr=String(Function('return ('+expr+')')()); } }
        catch(e){ expr='Error'; }
      } else { if(expr==='Error') expr=''; expr+=k; }
      upd();
    };
    grid.appendChild(b);
  });
  $('calcToggle').onclick=()=>$('calc').classList.toggle('show');
  $('calcClose').onclick=()=>$('calc').classList.remove('show');
})();

/* ============================================================
   PAUSE
   ============================================================ */
$('pauseBtn').onclick=()=>{ paused=true; $('pauseOverlay').classList.add('show'); };
$('resumeBtn').onclick=()=>{ paused=false; $('pauseOverlay').classList.remove('show'); itemEnterTime=Date.now(); };

/* ============================================================
   MODAL (no native confirm)
   ============================================================ */
function modal(title,msg,actions){
  $('modalTitle').textContent=title;
  $('modalMsg').textContent=msg;
  const wrap=$('modalActions'); wrap.innerHTML='';
  actions.forEach(a=>{
    const b=document.createElement('button');
    b.className='btn '+(a.style||'outline'); b.textContent=a.label;
    b.onclick=()=>{ $('modalOverlay').classList.remove('show'); if(a.onClick) a.onClick(); };
    wrap.appendChild(b);
  });
  $('modalOverlay').classList.add('show');
}

/* ============================================================
   SUBMIT
   ============================================================ */
$('submitBtn').onclick=()=>{
  const answered=ITEMS.filter(isItemAnswered).length;
  const blank=TOTAL_ITEMS-answered;
  const msg = blank>0
    ? `You've answered ${answered} of ${TOTAL_ITEMS}. ${blank} still blank — these score zero. Submit anyway?`
    : `All ${TOTAL_ITEMS} answered. Submit and mark the paper?`;
  modal('Submit test', msg, [
    {label:'Keep working', style:'outline'},
    {label:'Submit & mark', style:'submit', onClick:doSubmit}
  ]);
};
function autoSubmitOnTime(){
  modal("Time's up", 'The 120 minutes are up. The paper will now be marked.', [
    {label:'See results', style:'submit', onClick:doSubmit}
  ]);
}

/* ---- MARKING ---- */
function markNumber(q,key){
  const raw=answers[key]; if(raw==null||raw==='') return {earned:0,ua:null};
  const ua=parseFloat(String(raw).replace(/,/g,''));
  if(isNaN(ua)) return {earned:0,ua:raw};
  const ok=Math.abs(ua-q.numAns)<=(q.tol||0);
  return {earned: ok?q.marks:0, ua, ok};
}
function markMCQ(q,key){
  const ua=answers[key]??null;
  const ok=ua===q.correctAnswer;
  return {earned: ok?q.marks:0, ua, ok};
}
function markMulti(q,key){
  const ua=answers[key]||[];
  const ok = ua.length>0 && arrEq(ua,q.correctOptions);
  return {earned: ok?q.marks:0, ua, ok};
}
function markAny(q,key){
  if(q.questionType==='number') return markNumber(q,key);
  if(q.questionType==='multi') return markMulti(q,key);
  return markMCQ(q,key);
}

function doSubmit(){
  if(finished) return;
  finished=true; commitTime(); clearInterval(timerId);
  $('calc').classList.remove('show');

  let earnedTotal=0;
  const exportQs=[];

  ITEMS.forEach((item,idx)=>{
    if(item.type==='ot'){
      const key=keyOT(item);
      const res=markAny(item,key);
      earnedTotal+=res.earned;
      exportQs.push(buildExport(item,key,res,idx,null));
    } else {
      item.parts.forEach(p=>{
        const key=keyPart(item,p);
        const res=markAny(p,key);
        earnedTotal+=res.earned;
        exportQs.push(buildExport(p,key,res,idx,item));
      });
    }
  });

  const pct=Math.round(earnedTotal/CFG.totalMarks*100);
  const attempt=buildAttempt(earnedTotal,pct,exportQs);
  autoSyncToPendingQueue(attempt);
  renderResults(earnedTotal,pct,attempt);
}

/* ---- EXPORT SCHEMA (V3.1) ---- */
function buildExport(q,key,res,idx,parentMtq){
  const obj={
    qId: parentMtq? key : q.qId,
    displayIdx: parentMtq? parentMtq.displayIdx : q.displayIdx,
    type: parentMtq? 'mtq-part':'ot',
    questionType: q.questionType,
    subTopic: parentMtq? parentMtq.subTopic : q.subTopic,
    marks: q.marks,
    questionText: parentMtq? (parentMtq.title+' '+q.part+': '+q.prompt) : q.questionText,
    userAnswer: res.ua===undefined?null:res.ua,
    correct: res.earned===q.marks && res.earned>0,
    earned: res.earned,
    timeSpent: timeSpent[idx]||0,
    guessed: !!guesses[key],
    explanation: parentMtq? (parentMtq.explanationLayer1||'') : (q.explanationLayer1||''),
    examinerNote: parentMtq? (parentMtq.examinerNote||'') : (q.examinerNote||''),
    ifrsRef: parentMtq? (parentMtq.explanationLayer3||'') : (q.explanationLayer3||''),
    teacherCommentary: parentMtq? (parentMtq.teacherCommentary||'') : (q.teacherCommentary||'')
  };
  if(q.questionType==='mcq'){
    obj.correctAnswer=q.correctAnswer;
    obj.options=q.options.map(o=>({letter:o.letter,text:o.text,correct:!!o.correct,why:o.why||''}));
  } else if(q.questionType==='multi'){
    obj.expectedSelectCount=q.expectedSelectCount;
    obj.correctOptions=q.correctOptions;
    obj.options=q.options.map(o=>({letter:o.letter,text:o.text,correct:!!o.correct,why:o.why||''}));
  } else if(q.questionType==='number'){
    obj.numAns=q.numAns; obj.tol=q.tol||0; obj.prefix=q.prefix||'';
    obj.correctAnswer=q.numAns;
  }
  return obj;
}

function buildAttempt(earned,pct,exportQs){
  const now=new Date();
  return {
    schemaVersion: CFG.schemaVersion,
    topic: CFG.topic,
    poolName: CFG.poolName,
    storagePrefix: PREFIX,
    dateISO: now.toISOString(),
    dateDisplay: now.toLocaleString(),
    timeTakenSeconds: CFG.timeMinutes*60 - remaining,
    totalMarks: CFG.totalMarks,
    earnedMarks: earned,
    percentage: pct,
    passMarkPct: CFG.passMarkPct,
    passed: pct>=CFG.passMarkPct,
    questions: exportQs
  };
}

function autoSyncToPendingQueue(attemptJson){
  try{
    const k=SYNC_KEY;
    const e=JSON.parse(localStorage.getItem(k)||'[]');
    e.push(attemptJson);
    localStorage.setItem(k,JSON.stringify(e));
  }catch(err){ console.error('Auto-sync failed (JSON download still backup):',err); }
}

/* ============================================================
   RESULTS
   ============================================================ */
function renderResults(earned,pct,attempt){
  $('testview').style.display='none';
  $('subbanner').style.display='none';
  $('results').classList.add('show');
  $('topbarTitle').textContent='FA Combined Mock — Results';
  $('pauseBtn').style.display='none'; $('calcToggle').style.display='none';
  $('timer').textContent=fmt(Math.max(0,remaining));

  const passed=pct>=CFG.passMarkPct;
  $('printHeader').innerHTML=`<h1>FA Combined Mock — Mistakes Review</h1><p>${attempt.dateDisplay} · Score ${earned}/${CFG.totalMarks} (${pct}%)</p>`;

  let h='';
  h+=`<div class="scorebanner ${passed?'pass':'fail'}">
        <div class="big">${earned} / ${CFG.totalMarks}</div>
        <div class="pct">${pct}%</div>
        <div class="verdict">${passed?'PASS':'BELOW PASS MARK'} · pass = ${CFG.passMarkPct}%</div>
      </div>`;
  h+=`<div class="meta">
        <div><strong>Pool:</strong> ${esc(CFG.poolName)}</div>
        <div><strong>Date:</strong> ${esc(attempt.dateDisplay)}</div>
        <div><strong>Time used:</strong> ${fmt(attempt.timeTakenSeconds)}</div>
        <div><strong>Items:</strong> ${TOTAL_ITEMS} (${DATA.questions.length} OT + ${DATA.mtqs.length} MTQ)</div>
      </div>`;
  h+=`<div class="resbtns">
        <button class="btn filled" onclick="window.print()">🖨 Print mistakes PDF</button>
        <button class="btn outline" id="downloadJsonBtn">⬇ Download JSON attempt</button>
        <button class="btn outline" onclick="location.reload()">↻ Retake</button>
        <a class="btn outline" style="text-decoration:none;display:inline-block;" href="${CFG.dashboardUrl}" target="_blank">📊 Open dashboard</a>
      </div>`;

  // sub-topic table
  h+=buildSubtopicTable(attempt);

  // per-question cards
  h+=`<h2 style="color:var(--navy);font-size:18px;margin:8px 0 14px;">Question-by-question review</h2>`;
  ITEMS.forEach((item,idx)=>{
    if(item.type==='ot'){
      h+=resultCardOT(item,idx);
    } else {
      h+=resultCardMTQ(item,idx);
    }
  });

  $('resContent').innerHTML=h;

  // wire layer toggles + reveal all + download
  document.querySelectorAll('.layer .ltitle').forEach(t=>{
    t.addEventListener('click',()=>t.parentElement.classList.toggle('open'));
  });
  document.querySelectorAll('.revealAllBtn').forEach(b=>{
    b.addEventListener('click',()=>{
      b.closest('.rescard').querySelectorAll('.layer').forEach(l=>l.classList.add('open'));
    });
  });
  $('downloadJsonBtn').onclick=()=>downloadJSON(attempt);

  window.scrollTo({top:0,behavior:'smooth'});
}

function buildSubtopicTable(attempt){
  const map={};
  attempt.questions.forEach(q=>{
    const st=q.subTopic||'(uncategorised)';
    if(!map[st]) map[st]={earned:0,possible:0};
    map[st].earned+=q.earned; map[st].possible+=q.marks;
  });
  let rows='';
  Object.keys(map).sort().forEach(st=>{
    const m=map[st]; const p=Math.round(m.earned/m.possible*100);
    const col = p>=75?'var(--green)': p>=50?'var(--amber)':'var(--red)';
    rows+=`<tr><td>${esc(st)}</td><td>${m.earned}/${m.possible}</td>
      <td class="pctcell" style="color:${col}">${p}%</td></tr>`;
  });
  return `<table class="subtopic"><thead><tr><th>Sub-topic</th><th>Marks</th><th>%</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function verdictPill(earned,marks){
  if(earned===marks && marks>0) return `<span class="verdict-pill right">✓ ${earned}/${marks}</span>`;
  if(earned===0) return `<span class="verdict-pill wrong">✗ ${earned}/${marks}</span>`;
  return `<span class="verdict-pill partial">~ ${earned}/${marks}</span>`;
}

function optionResultHTML(q,res){
  let h='';
  if(q.questionType==='mcq'){
    q.options.forEach(o=>{
      const isCorrect=o.letter===q.correctAnswer;
      const isUserWrong = res.ua===o.letter && !isCorrect;
      let cls='resopt'; if(isCorrect) cls+=' correct'; else if(isUserWrong) cls+=' userwrong';
      const tag = isCorrect?'<span class="tick"> ✓ correct</span>' : (isUserWrong?'<span class="cross"> ✗ your pick</span>':'');
      h+=`<div class="${cls}"><strong>${o.letter}.</strong> ${esc(o.text)}${tag}<div class="why">${esc(o.why||'')}</div></div>`;
    });
  } else if(q.questionType==='multi'){
    const ua=res.ua||[];
    q.options.forEach(o=>{
      const isCorrect=q.correctOptions.includes(o.letter);
      const userPicked=ua.includes(o.letter);
      const isUserWrong = userPicked && !isCorrect;
      let cls='resopt'; if(isCorrect) cls+=' correct'; else if(isUserWrong) cls+=' userwrong';
      let tag='';
      if(isCorrect) tag = userPicked?'<span class="tick"> ✓ correct (you picked)</span>':'<span class="tick"> ✓ correct (missed)</span>';
      else if(isUserWrong) tag='<span class="cross"> ✗ you picked</span>';
      h+=`<div class="${cls}"><strong>${o.letter}.</strong> ${esc(o.text)}${tag}<div class="why">${esc(o.why||'')}</div></div>`;
    });
  } else if(q.questionType==='number'){
    const uaTxt = res.ua==null||res.ua===''? '(blank)' : res.ua;
    const tol=q.tol||0;
    h+=`<div class="numresult">
      <div class="ua ${res.ok?'ok':''}">${q.prefix||''} Your answer: ${esc(String(uaTxt))}</div>
      <div class="ca">${q.prefix||''} Correct: ${q.numAns}${tol>0?` (±${tol})`:''}</div></div>`;
  }
  return h;
}

function layersHTML(src){
  // src has explanationLayer1, workingShown, explanationLayer3, examinerNote, advancedContext, teacherCommentary
  let h='<div class="layers">';
  h+=`<button class="revealAllBtn">Reveal all layers</button>`;
  if(src.explanationLayer1) h+=layer('L1 · Concept', `<div>${esc(src.explanationLayer1)}</div>`);
  if(src.workingShown) h+=layer('L2 · Working', `<div class="working">${esc(src.workingShown)}</div>`);
  if(src.explanationLayer3) h+=layer('L3 · Standard / IFRS', `<div class="ifrs">${esc(src.explanationLayer3)}</div>`);
  // L4 (per-option WHY) is rendered inline on each option above; note it here
  h+=layer('L4 · Why each option', `<div style="font-size:12.5px;color:var(--muted)">Per-option reasoning is shown on each answer choice above (green = correct, red = your wrong pick).</div>`);
  if(src.examinerNote) h+=layer('L5 · Examiner note', `<div class="examiner">${esc(src.examinerNote)}</div>`);
  if(src.advancedContext) h+=layer('L6 · Advanced context', `<div class="advanced">${esc(src.advancedContext)}</div>`);
  h+='</div>';
  if(src.teacherCommentary){
    h+=`<div class="teacher"><div class="tt">Teacher commentary</div>${esc(src.teacherCommentary)}</div>`;
  }
  return h;
}
function layer(title,body){
  return `<div class="layer"><div class="ltitle"><span class="chev">▶</span>${title}</div><div class="lbody">${body}</div></div>`;
}

function resultCardOT(q,idx){
  const key=keyOT(q); const res=markAny(q,key);
  const isCorrect = res.earned===q.marks && res.earned>0;
  let h=`<div class="rescard ${isCorrect?'is-correct':''}">`;
  h+=`<div class="rhead"><div><span class="qnum">Q${q.displayIdx}</span> <span class="qsub">${esc(q.subTopic)}</span></div>${verdictPill(res.earned,q.marks)}</div>`;
  h+=`<div class="qbody">${esc(q.questionText)}</div>`;
  h+=optionResultHTML(q,res);
  h+=layersHTML(q);
  h+=`</div>`;
  return h;
}

function resultCardMTQ(m,idx){
  // an MTQ is wholly correct only if all parts are full
  let allFull=true, anyEarned=0, totMarks=0;
  m.parts.forEach(p=>{ const r=markAny(p,keyPart(m,p)); anyEarned+=r.earned; totMarks+=p.marks; if(!(r.earned===p.marks&&r.earned>0)) allFull=false; });
  let h=`<div class="rescard ${allFull?'is-correct':''}">`;
  h+=`<div class="rhead"><div><span class="qnum">Q${m.displayIdx} · ${esc(m.title)}</span> <span class="qsub">${esc(m.subTopic)}</span></div>${verdictPill(anyEarned,totMarks)}</div>`;
  h+=`<div class="scenario">${esc(m.scenario)}</div>`;
  m.parts.forEach(p=>{
    const key=keyPart(m,p); const res=markAny(p,key);
    h+=`<div class="mtq-part-result">`;
    h+=`<div class="rhead"><div class="part-label">Part ${esc(p.part)} <span class="qsub">${esc(p.prompt)}</span></div>${verdictPill(res.earned,p.marks)}</div>`;
    h+=optionResultHTML(p,res);
    if(p.modelAnswer) h+=`<div class="teacher" style="margin-top:8px;"><div class="tt">Model answer</div>${esc(p.modelAnswer)}</div>`;
    h+=`</div>`;
  });
  h+=layersHTML(m);
  h+=`</div>`;
  return h;
}

function downloadJSON(attempt){
  const blob=new Blob([JSON.stringify(attempt,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href=url; a.download=`fa_combined_mock_attempt_${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

/* ============================================================
   BOOT
   ============================================================ */
render();
startTimer();
</script>
