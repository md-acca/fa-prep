<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FA Cash Flow (IAS 7) · Master Test</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #003d6b; --primary-light: #0066b3; --primary-dark: #00264a;
  --accent: #d4a017; --accent-light: #f4d57b;
  --success: #2e7d32; --success-light: #c8e6c9;
  --warning: #ed6c02; --warning-light: #ffe0b2;
  --danger: #c62828; --danger-light: #ffcdd2;
  --neutral: #546e7a;
  --bg: #f6f8fb; --bg-card: #ffffff; --bg-elevated: #fafbfc;
  --border: #e1e7ee; --border-strong: #c5cdd6;
  --text-primary: #1a2332; --text-secondary: #5a6573; --text-muted: #8b95a3;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
  --radius: 10px; --radius-sm: 6px;
  --transition: all 0.18s ease;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
  background: var(--bg); color: var(--text-primary);
  font-size: 14px; line-height: 1.5; min-height: 100vh;
}

/* === Header === */
.app-header {
  background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
  color: white; padding: 14px 24px; box-shadow: var(--shadow);
  position: sticky; top: 0; z-index: 50;
}
.app-header-inner {
  max-width: 1280px; margin: 0 auto;
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
}
.app-title { display: flex; align-items: center; gap: 12px; }
.app-title-icon {
  width: 36px; height: 36px; background: var(--accent); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--primary-dark); font-weight: 700;
}
.app-title h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
.app-title .subtitle { font-size: 11px; opacity: 0.85; margin-top: 1px; }
.header-actions { display: flex; align-items: center; gap: 10px; }

/* === Timer in header === */
.timer-pill {
  background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22);
  padding: 8px 14px; border-radius: 8px;
  font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px;
  display: flex; align-items: center; gap: 8px;
}
.timer-pill.warn { background: rgba(237,108,2,0.85); border-color: rgba(255,255,255,0.4); }
.timer-pill.crit { background: rgba(198,40,40,0.95); border-color: rgba(255,255,255,0.5); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
.timer-pill .label { font-size: 10px; opacity: 0.85; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

/* === Container === */
.container { max-width: 1280px; margin: 0 auto; padding: 24px; }

/* === Buttons === */
.btn {
  background: var(--primary); color: white; border: none;
  padding: 10px 18px; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 500; transition: var(--transition);
  display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { background: var(--primary-dark); }
.btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-success { background: var(--success); }
.btn-success:hover { background: #1b5e20; }
.btn-danger { background: var(--danger); }
.btn-danger:hover { background: #8e0000; }
.btn-warning { background: var(--warning); color: white; }
.btn-lg { padding: 14px 24px; font-size: 16px; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* === Cards === */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow-sm); margin-bottom: 16px;
}
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
.card-subtitle { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }

/* === Home screen === */
.home-hero {
  text-align: center; padding: 32px 24px; margin-bottom: 24px;
}
.home-hero h1 {
  font-size: 28px; font-weight: 700; color: var(--primary-dark); margin-bottom: 8px;
  letter-spacing: -0.5px;
}
.home-hero p { font-size: 14px; color: var(--text-muted); }

.pool-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;
}
@media (max-width: 720px) { .pool-grid { grid-template-columns: 1fr; } }
.pool-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px;
  box-shadow: var(--shadow-sm); transition: var(--transition);
  cursor: pointer; position: relative; overflow: hidden;
}
.pool-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--primary-light); }
.pool-card.in-progress { border-color: var(--accent); }
.pool-card.in-progress::before {
  content: 'IN PROGRESS'; position: absolute; top: 12px; right: 12px;
  background: var(--accent); color: var(--primary-dark);
  padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
}
.pool-card-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
.pool-card-title { font-size: 24px; font-weight: 700; color: var(--primary-dark); margin-bottom: 8px; letter-spacing: -0.3px; }
.pool-card-meta { font-size: 12px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px; }
.pool-card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.home-utility {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px; margin-top: 16px;
}
.utility-btn {
  padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); cursor: pointer;
  font-size: 13px; color: var(--text-secondary);
  display: flex; align-items: center; gap: 10px; transition: var(--transition);
}
.utility-btn:hover { background: var(--bg-elevated); border-color: var(--border-strong); }
.utility-btn .icon { font-size: 16px; }

/* === Test view === */
.test-layout {
  display: grid; grid-template-columns: 260px 1fr; gap: 20px;
  align-items: start;
}
@media (max-width: 900px) { .test-layout { grid-template-columns: 1fr; } }

.q-nav-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto;
}
.q-nav-section { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin: 12px 0 8px; }
.q-nav-section:first-child { margin-top: 0; }
.q-nav-grid {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
}
.q-nav-btn {
  aspect-ratio: 1; border: 1px solid var(--border); background: var(--bg-card);
  border-radius: 5px; font-size: 11px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: var(--text-secondary);
  transition: var(--transition); position: relative;
}
.q-nav-btn:hover { border-color: var(--primary-light); }
.q-nav-btn.answered { background: var(--success-light); border-color: var(--success); color: var(--success); }
.q-nav-btn.current { background: var(--primary); color: white; border-color: var(--primary); }
.q-nav-btn.flagged::after {
  content: ''; position: absolute; top: 2px; right: 2px;
  width: 6px; height: 6px; background: var(--warning); border-radius: 50%;
}
.q-nav-mtq {
  grid-column: span 6; padding: 8px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-elevated); font-size: 12px; cursor: pointer;
  text-align: left; transition: var(--transition);
}
.q-nav-mtq:hover { border-color: var(--primary-light); }
.q-nav-mtq.current { background: var(--primary); color: white; border-color: var(--primary); }
.q-nav-mtq.answered { background: var(--success-light); border-color: var(--success); color: var(--success); }
.q-nav-mtq-parts { font-size: 10px; opacity: 0.8; margin-top: 2px; }

.q-nav-legend {
  margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-muted); line-height: 1.7;
}
.q-nav-legend .dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 3px;
  margin-right: 5px; vertical-align: middle;
}

.q-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px; min-height: 400px;
}
.q-meta-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
}
.q-num { font-size: 18px; font-weight: 700; color: var(--primary-dark); }
.q-meta-right { display: flex; gap: 8px; align-items: center; }
.q-marks-badge {
  background: var(--bg-elevated); border: 1px solid var(--border);
  padding: 4px 10px; border-radius: 5px; font-size: 12px; font-weight: 600; color: var(--text-secondary);
}
.q-flag-btn, .q-guess-btn {
  background: transparent; border: 1px solid var(--border); border-radius: 5px;
  padding: 5px 10px; cursor: pointer; font-size: 12px; color: var(--text-secondary);
  transition: var(--transition); display: inline-flex; align-items: center; gap: 5px;
}
.q-flag-btn.active { background: var(--warning); color: white; border-color: var(--warning); }
.q-guess-btn.active { background: var(--neutral); color: white; border-color: var(--neutral); }
.q-flag-btn:hover, .q-guess-btn:hover { border-color: var(--border-strong); }

.q-scenario {
  background: var(--bg-elevated); border-left: 3px solid var(--primary-light);
  padding: 14px 18px; border-radius: 0 6px 6px 0; margin-bottom: 18px;
  font-size: 14px; line-height: 1.6; color: var(--text-primary); white-space: pre-wrap;
}
.q-scenario-rich { white-space: normal; }
.fin-table {
  width: 100%; border-collapse: collapse; margin: 10px 0 4px;
  font-size: 13px; line-height: 1.5;
}
.fin-table th {
  text-align: right; padding: 5px 12px; font-weight: 600; font-size: 12px;
  color: var(--text-muted); border-bottom: 2px solid var(--border-strong);
  white-space: nowrap;
}
.fin-table th.lbl { text-align: left; }
.fin-table th.unit { border-bottom: 1px solid var(--border); padding-top: 0; font-weight: 500; }
.fin-table td {
  padding: 4px 12px; border-bottom: 1px solid var(--border);
  color: var(--text-primary);
}
.fin-table td.lbl { text-align: left; }
.fin-table td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fin-table tr.subtotal td { font-weight: 700; border-top: 1px solid var(--border-strong); }
.fin-table tr.gap td { border-bottom: none; height: 8px; padding: 0; }
body.printing-mistakes .fin-table th { color:#333 !important; border-bottom-color:#666 !important; }
body.printing-mistakes .fin-table td { color:#000 !important; border-bottom-color:#ccc !important; }
.q-text {
  font-size: 15px; font-weight: 500; margin-bottom: 18px; line-height: 1.6;
}

.opt-list { display: flex; flex-direction: column; gap: 10px; }
.opt-row {
  display: flex; gap: 12px; padding: 12px 14px; border: 1px solid var(--border);
  border-radius: 7px; cursor: pointer; transition: var(--transition);
  background: var(--bg-card);
}
.opt-row:hover { border-color: var(--primary-light); background: var(--bg-elevated); }
.opt-row.selected { border-color: var(--primary); background: rgba(0,61,107,0.04); }
.opt-row input { margin-top: 3px; cursor: pointer; }
.opt-row .letter { font-weight: 700; color: var(--primary); margin-right: 4px; }
.opt-row .text { flex: 1; line-height: 1.55; }

.num-input-wrap {
  display: flex; align-items: center; gap: 10px;
  max-width: 360px;
}
.num-input-wrap .prefix {
  font-size: 18px; font-weight: 700; color: var(--text-secondary);
}
.num-input {
  flex: 1; padding: 12px 14px; border: 2px solid var(--border); border-radius: 7px;
  font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums;
  text-align: right; font-family: inherit;
}
.num-input:focus { outline: none; border-color: var(--primary); }

/* MTQ */
.mtq-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
.mtq-title { font-size: 16px; font-weight: 700; color: var(--primary-dark); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.mtq-working {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 7px;
  padding: 12px; margin-bottom: 18px;
}
.mtq-working-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.mtq-working textarea {
  width: 100%; min-height: 100px; border: 1px solid var(--border); border-radius: 5px;
  padding: 10px; font-family: 'SF Mono', Consolas, monospace; font-size: 12px;
  resize: vertical; background: white;
}
.mtq-part {
  border: 1px solid var(--border); border-radius: 7px; padding: 14px;
  margin-bottom: 12px; background: var(--bg-card);
}
.mtq-part-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.mtq-part-label { font-weight: 700; color: var(--primary-dark); font-size: 14px; }
.mtq-part-marks { font-size: 11px; color: var(--text-muted); }
.mtq-part-prompt { font-size: 14px; margin-bottom: 12px; line-height: 1.55; }

/* === Nav buttons bottom === */
.nav-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 20px; gap: 12px;
}

/* === Pre-submit & overlay === */
.review-summary {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px; margin-bottom: 20px;
}
.review-stat {
  background: var(--bg-elevated); padding: 14px; border-radius: 7px;
  border: 1px solid var(--border); text-align: center;
}
.review-stat-num { font-size: 24px; font-weight: 700; color: var(--primary-dark); }
.review-stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(26,35,50,0.6);
  display: none; align-items: center; justify-content: center; z-index: 200;
  padding: 24px;
}
.modal-backdrop.show { display: flex; }
.modal {
  background: var(--bg-card); border-radius: var(--radius);
  max-width: 480px; width: 100%; padding: 24px;
  box-shadow: var(--shadow-lg);
}
.modal h2 { font-size: 18px; margin-bottom: 8px; color: var(--primary-dark); }
.modal p { color: var(--text-secondary); margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

.timeup-overlay {
  position: fixed; inset: 0; background: rgba(198,40,40,0.92);
  display: none; align-items: center; justify-content: center; z-index: 300;
  color: white;
}
.timeup-overlay.show { display: flex; }
.timeup-content { text-align: center; padding: 32px; }
.timeup-content h2 { font-size: 32px; margin-bottom: 12px; }

/* === Results === */
.grade-pill {
  display: inline-flex; padding: 10px 24px; border-radius: 999px;
  font-size: 16px; font-weight: 700; letter-spacing: 0.3px;
  margin-bottom: 8px;
}
.grade-pill.pass { background: var(--success-light); color: var(--success); border: 2px solid var(--success); }
.grade-pill.fail { background: var(--danger-light); color: var(--danger); border: 2px solid var(--danger); }

.score-display { font-size: 48px; font-weight: 700; color: var(--primary-dark); letter-spacing: -1px; line-height: 1; margin: 12px 0 4px; }
.score-display small { font-size: 24px; color: var(--text-muted); font-weight: 500; }
.score-pct { font-size: 18px; color: var(--text-secondary); }

.metric-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px; margin-top: 20px;
}
.metric-card {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 7px;
  padding: 14px; text-align: center;
}
.metric-num { font-size: 22px; font-weight: 700; color: var(--primary-dark); }
.metric-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-top: 3px; }

.subtopic-bar {
  display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
  margin-bottom: 8px; padding: 10px 12px;
  background: var(--bg-elevated); border-radius: 6px; border: 1px solid var(--border);
}
.subtopic-bar .label { font-size: 13px; font-weight: 500; }
.subtopic-bar .meter { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.subtopic-bar .fill { height: 100%; background: var(--success); transition: width 0.4s ease; }
.subtopic-bar.weak .fill { background: var(--danger); }
.subtopic-bar.medium .fill { background: var(--warning); }
.subtopic-bar .pct { font-size: 13px; font-weight: 700; color: var(--text-secondary); white-space: nowrap; }

.result-q {
  border: 1px solid var(--border); border-radius: 7px;
  margin-bottom: 10px; overflow: hidden;
}
.result-q-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; cursor: pointer; background: var(--bg-card);
  transition: var(--transition);
}
.result-q-header:hover { background: var(--bg-elevated); }
.result-q.correct .result-q-header { border-left: 3px solid var(--success); }
.result-q.wrong .result-q-header { border-left: 3px solid var(--danger); }
.result-q.skip .result-q-header { border-left: 3px solid var(--text-muted); }
.result-q-left { display: flex; gap: 12px; align-items: center; flex: 1; min-width: 0; }
.result-q-num { font-weight: 700; color: var(--primary-dark); min-width: 38px; }
.result-q-summary { flex: 1; font-size: 13px; color: var(--text-secondary); }
.result-q-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.result-q-tag { font-size: 10px; padding: 3px 7px; border-radius: 4px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-muted); white-space: nowrap; }
.result-q-tag.diff-easy { color: var(--success); border-color: var(--success-light); }
.result-q-tag.diff-medium { color: var(--warning); border-color: var(--warning-light); }
.result-q-tag.diff-hard { color: var(--danger); border-color: var(--danger-light); }
.result-q-marks { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 50px; text-align: right; }
.result-q-marks.correct { color: var(--success); }
.result-q-marks.wrong { color: var(--danger); }

.result-q-body { display: none; padding: 18px 20px; border-top: 1px solid var(--border); background: var(--bg-elevated); }
.result-q.expanded .result-q-body { display: block; }

.expl-section { margin-bottom: 18px; }
.expl-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
.expl-content { font-size: 13.5px; line-height: 1.6; color: var(--text-primary); }
.expl-content.working { font-family: 'SF Mono', Consolas, monospace; font-size: 12.5px; background: var(--bg-card); padding: 12px; border-radius: 5px; border: 1px solid var(--border); white-space: pre-wrap; }
.opt-result {
  padding: 10px 12px; border: 1px solid var(--border); border-radius: 5px;
  margin-bottom: 6px; background: var(--bg-card); font-size: 13px;
}
.opt-result.correct { background: var(--success-light); border-color: var(--success); }
.opt-result.user-selected { box-shadow: inset 3px 0 0 var(--primary); }
.opt-result.user-selected.wrong { background: var(--danger-light); border-color: var(--danger); }
.opt-result .letter { font-weight: 700; }
.opt-result .why { font-size: 12px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--primary-dark); color: white;
  padding: 12px 24px; border-radius: 8px;
  font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease; z-index: 400;
  max-width: 80%; box-shadow: var(--shadow-lg);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.warn { background: var(--warning); }

/* Misc */
.hidden { display: none !important; }
.spacer { flex: 1; }
hr.div { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
/* === Print-only utilities (hidden on screen) === */
.print-only { display: none; }

/* === Print Mistakes mode === */
@media print {
  body.printing-mistakes { background: white !important; color: black !important; font-size: 10.5pt; }
  body.printing-mistakes .app-header,
  body.printing-mistakes .timer-pill,
  body.printing-mistakes .toast,
  body.printing-mistakes .modal-backdrop,
  body.printing-mistakes .timeup-overlay,
  body.printing-mistakes button,
  body.printing-mistakes .header-actions,
  body.printing-mistakes .home-utility,
  body.printing-mistakes .review-summary,
  body.printing-mistakes .test-layout > aside,
  body.printing-mistakes .nav-bar,
  body.printing-mistakes .q-flag-btn,
  body.printing-mistakes .q-guess-btn,
  body.printing-mistakes .result-q.correct {
    display: none !important;
  }

<script type="application/json" id="master-data">{"poolName": "Master", "chapterName": "Cash Flow", "topicName": "Cash Flow", "totalMarks": 125, "timeMinutes": 150, "difficultyMix": "25% medium / 75% hard · Stress standard", "questions": [{"qId": "CF_Q1", "displayIdx": 1, "type": "ot", "questionType": "mcq", "subTopic": "Classification", "difficulty": "medium", "marks": 2, "timeIdeal": 90, "scenario": "Halloway Manufacturing Co is preparing its statement of cash flows for the year ended 31 March 20X7 in accordance with IAS 7 Statement of Cash Flows.", "questionText": "Which ONE of the following would be classified within investing activities?", "options": [{"letter": "A", "text": "Proceeds from the issue of ordinary shares", "correct": false, "why": "Misclassifies a financing inflow as investing. Share issue proceeds are financing activities (IAS 7 para 17) — they change the entity's capital structure, they do not acquire/dispose of long-term assets."}, {"letter": "B", "text": "Cash purchase of a new packaging machine", "correct": true, "why": "CORRECT. Purchase of property, plant and equipment is the classic investing outflow (IAS 7 para 16) — cash used to acquire a long-term asset."}, {"letter": "C", "text": "Repayment of a debenture", "correct": false, "why": "Misclassifies a financing outflow as investing. Repaying borrowings is financing (IAS 7 para 17)."}, {"letter": "D", "text": "Dividends paid to ordinary shareholders", "correct": false, "why": "Dividends paid are usually financing (IAS 7 permits operating or financing) — never investing. Investing is about long-term assets and investments, not returns to owners."}], "correctAnswer": "B", "explanationLayer1": "IAS 7 splits all cash flows into three buckets: operating (the trading engine), investing (buying/selling long-term assets and investments), and financing (raising/repaying capital from owners and lenders). The skill is sorting each item into the right bucket.", "workingShown": "Purchase of a packaging machine = acquisition of PPE = INVESTING outflow.\nShare issue proceeds = FINANCING inflow.\nDebenture repayment = FINANCING outflow.\nDividends paid = FINANCING (or operating) outflow.\nOnly the machine purchase sits in investing.", "explanationLayer3": "IAS 7 para 16 defines investing activities as the acquisition and disposal of long-term assets and other investments not included in cash equivalents. Para 17 defines financing activities as those that change the size/composition of contributed equity and borrowings.", "examinerNote": "The examiner loves mixing one investing item among three financing items (or vice versa) because candidates memorise headings but don't test each item against the para-16/17 definitions. Read every option, don't stop at the first plausible one.", "teacherCommentary": "Concept: three buckets — trade, long-term assets, capital. Process: ask 'is this a long-term asset moving, or capital moving?' Machine = asset = investing. Everyday: investing is money you spend to build the business's capacity; financing is money you raise or return to fund it.", "advancedContext": "In FR (and your hotel work), the investing/financing split feeds free-cash-flow analysis: investors strip out financing to see whether operations self-fund capex. Misclassifying capex as financing would flatter operating cash flow — a real audit red flag."}, {"qId": "CF_Q2", "displayIdx": 2, "type": "ot", "questionType": "mcq", "subTopic": "Cash & cash equivalents", "difficulty": "hard", "marks": 2, "timeIdeal": 150, "scenario": "Tarnbrook Co had the following balances in its statements of financial position:\n\n                                          31 Dec 20X4   31 Dec 20X3\n                                              $             $\nShort-term liquid investments              30,000        25,000\nBank                                        16,000         9,000\nCash in hand                                   200           120\nBank loan repayable within 3 months         28,000        32,000\nBank loan repayable within 5 years         240,000       190,000", "questionText": "What is the net increase or decrease in cash and cash equivalents to be shown in the statement of cash flows for the year ended 31 December 20X4?", "options": [{"letter": "A", "text": "$12,080 increase", "correct": true, "why": "CORRECT. Cash & cash equivalents = short-term liquid investments + bank + cash only. 46,200 - 34,120 = 12,080 increase. Bank loans are financing, never cash equivalents."}, {"letter": "B", "text": "$16,080 increase", "correct": false, "why": "'Short-term bank loan treated as a cash equivalent' error — deducted the 3-month loan from cash equivalents. A loan repayable in 3 months is still borrowing (financing), not a cash equivalent. Cash equivalents are short-term liquid INVESTMENTS held, not liabilities owed."}, {"letter": "C", "text": "$7,080 increase", "correct": false, "why": "'Excluded short-term liquid investments' error. Short-term highly liquid investments (e.g. a 30-day bond) ARE cash equivalents per IAS 7 para 6 and must be included."}, {"letter": "D", "text": "$33,920 decrease", "correct": false, "why": "'Both bank loans included as negative cash equivalents' error. Neither loan is a cash equivalent; both belong in financing. Including them swamps the real movement and flips the sign."}], "correctAnswer": "A", "explanationLayer1": "Cash and cash equivalents = cash in hand + bank balances + short-term highly liquid investments, less bank overdrafts. The net movement reported in the SCF is simply closing CCE minus opening CCE. Bank LOANS (any maturity) are borrowings = financing, not part of CCE.", "workingShown": "Cash & cash equivalents:\n  31 Dec 20X4: 30,000 + 16,000 + 200            = 46,200\n  31 Dec 20X3: 25,000 +  9,000 + 120            = 34,120\nNet increase: 46,200 - 34,120                   = 12,080 increase\n\nThe two bank loans (28,000/32,000 and 240,000/190,000) are EXCLUDED — they are financing items, not cash equivalents.", "explanationLayer3": "IAS 7 para 6 defines cash equivalents as short-term, highly liquid investments readily convertible to known amounts of cash and subject to insignificant risk of value change. Para 8 notes bank borrowings are generally financing; only repayable-on-demand overdrafts that form an integral part of cash management are netted within cash equivalents.", "examinerNote": "A 'repayable within 3 months' bank loan is a deliberate trap. Short maturity does NOT convert a borrowing into a cash equivalent. The examiner tests whether you know cash equivalents are liquid INVESTMENTS held, not short-dated liabilities owed.", "teacherCommentary": "Concept: CCE is what you OWN that is cash-like, not what you OWE. Process: list only cash, bank, and liquid investments; ignore every loan. Everyday: a 90-day loan you must repay is not 'spare cash' — it is a debt with a short fuse.", "advancedContext": "This links to bank reconciliation and the overdraft nuance: an overdraft that swings in and out as part of day-to-day cash management is netted in CCE, but a term loan never is. In FR, the same para-6/8 logic governs what goes into the cash line of a consolidated SCF.", "scenarioHtml": "<div style=\"white-space:pre-wrap\">Tarnbrook Co had the following balances in its statements of financial position:</div><table class=\"fin-table\"><thead><tr><th class=\"lbl\"></th><th>31 Dec 20X4</th><th>31 Dec 20X3</th></tr><tr><th class=\"lbl unit\"></th><th class=\"unit\">$</th><th class=\"unit\">$</th></tr></thead><tbody><tr><td class=\"lbl\">Short-term liquid investments</td><td class=\"num\">30,000</td><td class=\"num\">25,000</td></tr><tr><td class=\"lbl\">Bank</td><td class=\"num\">16,000</td><td class=\"num\">9,000</td></tr><tr><td class=\"lbl\">Cash in hand</td><td class=\"num\">200</td><td class=\"num\">120</td></tr><tr><td class=\"lbl\">Bank loan repayable within 3 months</td><td class=\"num\">28,000</td><td class=\"num\">32,000</td></tr><tr><td class=\"lbl\">Bank loan repayable within 5 years</td><td class=\"num\">240,000</td><td class=\"num\">190,000</td></tr></tbody></table>"}, {"qId": "CF_Q3", "displayIdx": 3, "type": "ot", "questionType": "multi", "subTopic": "Indirect method reconciliation", "difficulty": "hard", "marks": 2, "timeIdeal": 150, "scenario": "The following extract is taken from a draft statement of cash flows prepared by a trainee accountant at Welbeck Co (year ended 30 June 20X6):\n\nCash flows from operating activities                 $'000\nOperating profit                                       484\nAdjustments for:\n  Depreciation charges                                  35\n  Profit on sale of property, plant and equipment       16\n  Increase in inventories                              (74)\n  Decrease in trade receivables                        (41)\n  Increase in trade payables                            29", "questionText": "Which TWO of the following corrections must be made to the trainee's draft? Select TWO.", "options": [{"letter": "A", "text": "The profit on sale of PPE should be subtracted, not added", "correct": true, "why": "CORRECT. A gain on disposal is a non-cash credit inflating profit; it must be DEDUCTED in the reconciliation (the real cash — the proceeds — sits in investing). The trainee added it."}, {"letter": "B", "text": "The increase in inventories should be added, not subtracted", "correct": false, "why": "'Reversed the inventory rule' misconception. An increase in inventory ties up cash, so it is correctly SUBTRACTED. The trainee had this right."}, {"letter": "C", "text": "The decrease in trade receivables should be added, not subtracted", "correct": true, "why": "CORRECT. A decrease in receivables means more cash collected — a cash INFLOW, so it is added. The trainee wrongly subtracted it."}, {"letter": "D", "text": "The increase in trade payables should be subtracted, not added", "correct": false, "why": "'Reversed the payables rule' misconception. An increase in payables conserves cash (you owe more, paid less), so it is correctly ADDED. The trainee had this right."}], "correctOptions": ["A", "C"], "expectedSelectCount": 2, "explanationLayer1": "The indirect method starts from profit and strips out (a) non-cash items and (b) working-capital timing differences. Gains are deducted/losses added back; for working capital the rule is 'asset up = cash down, liability up = cash up'.", "workingShown": "Check each line:\n  Depreciation +35      ✓ non-cash expense added back\n  Profit on sale +16    ✗ gain must be DEDUCTED (-16)  -> CORRECTION\n  Increase inventory -74 ✓ asset up = cash down\n  Decrease receivables -41 ✗ asset DOWN = cash UP, should be +41 -> CORRECTION\n  Increase payables +29 ✓ liability up = cash up\nTwo corrections: profit on sale (A) and decrease in receivables (C).", "explanationLayer3": "IAS 7 para 20 sets out the indirect method: profit is adjusted for non-cash items (depreciation, gains/losses) and for changes in operating working capital. Gains on disposal are excluded here because the related cash is an investing flow (para 16).", "examinerNote": "This 'spot the trainee's errors' format is one of the examiner's favourite cash-flow questions. The reliable method: re-derive each sign from first principles rather than eyeballing — the trap options deliberately flip the two lines the trainee got RIGHT.", "teacherCommentary": "Concept: profit is not cash; you reverse the accruals distortions. Process: tattoo the rule 'asset up = subtract, liability up = add; gain = subtract, loss = add'. Everyday: receivables falling means customers finally paid you — money in the door, so add it.", "advancedContext": "This is your #1 timing-pressure trap from the diagnostic (working-capital direction errors). Under exam pressure, do NOT free-style the signs — write the four-word rule in the margin before touching the numbers. Same logic recurs in FR consolidated cash flows."}, {"qId": "CF_Q4", "displayIdx": 4, "type": "ot", "questionType": "multi", "subTopic": "Working capital movements", "difficulty": "hard", "marks": 2, "timeIdeal": 150, "scenario": "Pendrey Co has the following opening and closing working-capital balances:\n\n                       31 Dec 20X7   31 Dec 20X6\n                            $             $\nInventory                 24,000        18,000\nTrade receivables         12,000        14,000\nTrade payables             8,000         9,000", "questionText": "Using the indirect method, which TWO of the following correctly describe the effect of these movements within cash flows from operating activities? Select TWO.", "options": [{"letter": "A", "text": "The inventory movement is a $6,000 cash outflow (deducted from profit)", "correct": true, "why": "CORRECT. Inventory rose 24,000-18,000 = 6,000. An increase in inventory ties up cash, so it is deducted — a cash outflow effect."}, {"letter": "B", "text": "The inventory movement is a $6,000 cash inflow (added to profit)", "correct": false, "why": "'Wrong-direction inventory' error. An INCREASE in an asset is a use of cash (outflow), not an inflow."}, {"letter": "C", "text": "The trade receivables movement is a $2,000 cash inflow (added to profit)", "correct": true, "why": "CORRECT. Receivables fell 14,000-12,000 = 2,000. A decrease in receivables means more cash collected — added to profit, an inflow effect."}, {"letter": "D", "text": "The trade payables movement is a $1,000 cash inflow (added to profit)", "correct": false, "why": "'Wrong-direction payables' error. Payables FELL by 1,000 (you paid suppliers down) = cash outflow, deducted from profit — not an inflow."}], "correctOptions": ["A", "C"], "expectedSelectCount": 2, "explanationLayer1": "Each working-capital line's cash effect follows one rule: asset increase = cash out; asset decrease = cash in; liability increase = cash in; liability decrease = cash out.", "workingShown": "Inventory:   24,000 - 18,000 = +6,000 increase  -> asset up = cash OUT (deduct)  [A correct]\nReceivables: 12,000 - 14,000 = -2,000 decrease  -> asset down = cash IN (add)      [C correct]\nPayables:     8,000 -  9,000 = -1,000 decrease  -> liability down = cash OUT (deduct) [D is wrong: it's an outflow]", "explanationLayer3": "IAS 7 para 20(a) requires profit to be adjusted for changes in inventories, operating receivables and operating payables when using the indirect method.", "examinerNote": "The examiner pairs a correctly-signed statement with its mirror-image wrong-direction twin (A vs B, and a payables flip in D). If you know the one-line rule cold you bank both marks in seconds; if you guess directions you will pick exactly one right and one wrong.", "teacherCommentary": "Concept: cash tied up vs cash released. Process: label each line asset/liability, then up/down, then apply the rule. Everyday: more stock on the shelf = cash sitting still; customers paying down = cash coming in.", "advancedContext": "Direction errors here were a named weakness in your diagnostic. Build the reflex now: in the margin write A↑=−, A↓=+, L↑=+, L↓=−. It eliminates the single most common 2-mark cash-flow loss.", "scenarioHtml": "<div style=\"white-space:pre-wrap\">Pendrey Co has the following opening and closing working-capital balances:</div><table class=\"fin-table\"><thead><tr><th class=\"lbl\"></th><th>31 Dec 20X7</th><th>31 Dec 20X6</th></tr><tr><th class=\"lbl unit\"></th><th class=\"unit\">$</th><th class=\"unit\">$</th></tr></thead><tbody><tr><td class=\"lbl\">Inventory</td><td class=\"num\">24,000</td><td class=\"num\">18,000</td></tr><tr><td class=\"lbl\">Trade receivables</td><td class=\"num\">12,000</td><td class=\"num\">14,000</td></tr><tr><td class=\"lbl\">Trade payables</td><td class=\"num\">8,000</td><td class=\"num\">9,000</td></tr></tbody></table>"}, {"qId": "CF_Q5", "displayIdx": 5, "type": "ot", "questionType": "multi", "subTopic": "Non-cash adjustments", "difficulty": "medium", "marks": 2, "timeIdeal": 110, "scenario": "Calderwood Co is preparing the operating activities section of its statement of cash flows using the indirect method for the year ended 31 December 20X6.", "questionText": "Which TWO of the following are non-cash adjustments added back to profit in arriving at cash generated from operations? Select TWO.", "options": [{"letter": "A", "text": "Amortisation of intangible assets", "correct": true, "why": "CORRECT. Amortisation, like depreciation, is a non-cash expense charged in profit; it is added back."}, {"letter": "B", "text": "Depreciation of plant and machinery", "correct": true, "why": "CORRECT. Depreciation is the textbook non-cash add-back."}, {"letter": "C", "text": "Income taxes paid", "correct": false, "why": "'Non-cash confusion' error. Tax PAID is a real cash outflow shown on its own line within operating activities — it is not a non-cash add-back."}, {"letter": "D", "text": "Interest paid", "correct": false, "why": "'Non-cash confusion' error. The interest EXPENSE is added back, but interest PAID is a real cash outflow on its own line. As written ('interest paid') this is a cash flow, not a non-cash add-back."}], "correctOptions": ["A", "B"], "expectedSelectCount": 2, "explanationLayer1": "Non-cash add-backs are expenses that reduced profit but involved no cash movement — depreciation and amortisation are the headline examples. Items that involve actual cash (tax paid, interest paid) are shown as their own cash lines, not as add-backs.", "workingShown": "Amortisation  -> non-cash expense -> ADD BACK  ✓\nDepreciation  -> non-cash expense -> ADD BACK  ✓\nIncome taxes PAID -> real cash outflow line -> not an add-back\nInterest PAID -> real cash outflow line -> not an add-back", "explanationLayer3": "IAS 7 para 20(b) requires adjustment for non-cash items such as depreciation, provisions and unrealised gains/losses. Interest and tax cash flows are disclosed separately under paras 31-35.", "examinerNote": "Watch the exact wording: 'interest expense' is a non-cash-style add-back, but 'interest PAID' is the actual cash line. The examiner exploits the difference between the P&L charge and the cash paid.", "teacherCommentary": "Concept: add back things that never moved cash. Process: ask 'did cash actually leave for this?' Depreciation — no. Tax paid — yes. Everyday: depreciation is wear-and-tear on paper; the tax cheque genuinely clears the bank.", "advancedContext": "The charge-vs-paid distinction is exactly how interest and tax T-accounts work (next questions). The add-back removes the P&L charge; a separate line then shows the cash actually paid, reconciled via the accrual account."}, {"qId": "CF_Q6", "displayIdx": 6, "type": "ot", "questionType": "number", "subTopic": "Cash generated from operations", "difficulty": "hard", "marks": 2, "timeIdeal": 150, "prefix": "$", "numAns": 186151, "tol": 5, "scenario": "Hartwell Co is preparing its statement of cash flows for the year ended 31 December 20X5. Its operating profit for the year was $157,321. This figure includes a profit of $5,400 on the sale of some machinery. Depreciation charged for the year was $32,300. Over the year, inventories increased by $2,100, trade receivables increased by $950 and trade payables increased by $4,980.", "questionText": "What is the cash generated from operations? Give your answer in $ as a whole number.", "explanationLayer1": "Start from operating profit, reverse non-cash items (deduct the disposal gain, add back depreciation), then adjust for working-capital movements using the asset/liability rule.", "workingShown": "Operating profit                       157,321\nLess profit on sale of machinery        (5,400)   gain is non-cash, deduct\nAdd depreciation                        32,300    non-cash, add back\nLess increase in inventories            (2,100)   asset up = cash down\nLess increase in receivables              (950)   asset up = cash down\nAdd increase in payables                 4,980    liability up = cash up\n                                       --------\nCash generated from operations         186,151", "explanationLayer3": "IAS 7 para 18(b) and para 20 — the indirect method derives operating cash by adjusting profit for non-cash items and working-capital changes. Note 'cash generated from operations' is BEFORE interest and tax paid (paras 31-35).", "examinerNote": "Two traps in one: (1) the disposal gain is buried inside operating profit and must be removed (deducted, not added); (2) all three working-capital lines move in the cash-reducing/increasing direction the rule predicts. Candidates who add the gain get 191,551 — a classic wrong answer.", "teacherCommentary": "Concept: convert accruals-profit into operating cash. Process: gain out, depreciation in, then working capital by rule. Everyday: the machinery profit was an accounting win, not cash in this section — the cash showed up when you sold the asset, over in investing.", "advancedContext": "Note what is NOT here: interest and tax. 'Cash generated from operations' stops before them. The next subtotal, 'net cash from operating activities', deducts interest paid and tax paid — a structure the examiner tests by asking for one subtotal but giving data for both."}, {"qId": "CF_Q7", "displayIdx": 7, "type": "ot", "questionType": "mcq", "subTopic": "Interest paid (T-account)", "difficulty": "hard", "marks": 2, "timeIdeal": 150, "scenario": "Quennell Co had a credit balance for interest payable of $72 at 1 January 20X6 and a credit balance of $56 at 31 December 20X6. The interest expense charged to the statement of profit or loss for the year ended 31 December 20X6 was $375.", "questionText": "How much should Quennell Co show in its statement of cash flows for interest paid for the year ended 31 December 20X6?", "options": [{"letter": "A", "text": "$391", "correct": true, "why": "CORRECT. Opening accrual 72 + P&L charge 375 - closing accrual 56 = 391 cash paid."}, {"letter": "B", "text": "$359", "correct": false, "why": "'Reversed b/f and c/f' error. Computed 56 + 375 - 72 = 359 — opening and closing accruals swapped. Opening is added, closing is deducted."}, {"letter": "C", "text": "$375", "correct": false, "why": "'Ignored the accrual movement' error. Took the P&L charge as the cash paid. Because the accrual fell by 16, cash paid exceeds the charge."}, {"letter": "D", "text": "$503", "correct": false, "why": "'Added both accruals' error. 72 + 375 + 56 = 503 — the closing accrual must be deducted, not added."}], "correctAnswer": "A", "explanationLayer1": "When the P&L charge differs from cash paid, reconstruct the payable T-account. Cash paid is the balancing figure: opening liability + expense charged - closing liability.", "workingShown": "Interest payable account:\n          $                              $\nCash (B) 391        Balance b/f          72\nBal c/f   56        P&L interest charge 375\n         ----                           ----\n         447                            447\n\nCash paid = 72 + 375 - 56 = 391", "explanationLayer3": "IAS 7 para 31 requires interest paid to be disclosed separately and classified consistently (operating or financing). The cash figure — not the accruals-based P&L charge — is what appears in the statement.", "examinerNote": "The reliable approach is to draw the T-account every time, even for 2 marks. Guessing the direction (add or subtract the accrual) is exactly the 50/50 the examiner is testing — and the reversed-direction distractor (B) is always present.", "teacherCommentary": "Concept: the SCF shows cash, the P&L shows the charge; the accrual bridges them. Process: open the payable T-account, slot in b/f, charge, c/f, balance for cash. Everyday: you were charged 375 of interest and also cleared 16 of last year's arrears, so 391 actually left the bank.", "advancedContext": "Identical mechanics drive tax paid, dividends received and any 'charge vs cash' reconciliation. Master one T-account and you have mastered them all — this is the highest-leverage 2-mark technique in the chapter."}, {"qId": "CF_Q8", "displayIdx": 8, "type": "ot", "questionType": "number", "subTopic": "Tax paid (T-account)", "difficulty": "hard", "marks": 2, "timeIdeal": 150, "prefix": "$", "numAns": 56000, "tol": 5, "scenario": "Ashworth Co had an income tax payable balance of $76,000 at 1 January 20X6 and $91,000 at 31 December 20X6. The income tax charge in the statement of profit or loss for the year ended 31 December 20X6 was $71,000. There was no under- or over-provision adjustment in the year.", "questionText": "What amount should be shown for income taxes paid in the statement of cash flows for the year ended 31 December 20X6? Give your answer in $ as a whole number.", "explanationLayer1": "Tax paid is the balancing figure on the tax payable account: opening liability + charge for the year - closing liability = cash paid.", "workingShown": "Income tax payable account:\n          $                          $\nCash (B) 56,000     Balance b/f      76,000\nBal c/f  91,000     P&L tax charge   71,000\n        -------                     -------\n        147,000                     147,000\n\nCash tax paid = 76,000 + 71,000 - 91,000 = 56,000", "explanationLayer3": "IAS 7 para 35 requires taxes paid to be disclosed separately and classified as operating cash flows unless specifically identified with financing or investing activities.", "examinerNote": "Because the liability ROSE (76k -> 91k), less cash was paid than the charge. Candidates who assume 'tax paid = tax charge' (71,000) walk into the trap. The rising accrual means 15k of this year's charge is still unpaid at year end.", "teacherCommentary": "Concept: charge accrues, cash settles later; the payable account bridges them. Process: b/f + charge - c/f. Everyday: you were billed 71k of tax but your tax-owed balance grew by 15k, so you only actually paid 56k.", "advancedContext": "Same engine as interest paid (Q7). When an under/over-provision exists, it slots into the same T-account as an extra entry — a step-up the FR exam builds on with deferred tax movements."}, {"qId": "CF_Q9", "displayIdx": 9, "type": "ot", "questionType": "number", "subTopic": "Dividends paid (RE reconciliation)", "difficulty": "hard", "marks": 2, "timeIdeal": 150, "prefix": "$", "numAns": 80000, "tol": 5, "scenario": "Bardwell Co reported retained earnings of $283,000 at 1 January 20X6 and $295,000 at 31 December 20X6. The profit for the year (after tax) was $92,000. The only other movement on retained earnings during the year was the payment of an equity dividend.", "questionText": "What amount of dividends paid should be shown in the statement of cash flows for the year ended 31 December 20X6? Give your answer in $ as a whole number.", "explanationLayer1": "When a dividend figure is not given directly, derive it as the balancing item on retained earnings: opening RE + profit for the year - closing RE = dividends paid.", "workingShown": "Retained earnings account:\n          $                          $\nDiv (B)  80,000     Balance b/f     283,000\nBal c/f 295,000     Profit for year  92,000\n        -------                     -------\n        375,000                     375,000\n\nDividends paid = 283,000 + 92,000 - 295,000 = 80,000", "explanationLayer3": "IAS 7 para 31 permits dividends paid to be shown as either operating or financing cash flows; it is more usual to classify them as financing. Only dividends actually PAID (not proposed) appear in the SCF.", "examinerNote": "Only dividends PAID hit the cash flow statement; a proposed dividend is a non-adjusting disclosure, not a cash flow. The examiner often adds a proposed dividend to tempt you into the wrong number — ignore it here.", "teacherCommentary": "Concept: retained earnings rises by profit and falls by dividends; the gap reveals the dividend. Process: b/f + profit - c/f. Everyday: you earned 92k, your reserves only grew 12k, so 80k must have left as dividends.", "advancedContext": "If there were a transfer to/from another reserve or a prior-year adjustment, those entries also pass through this account. In FR, the same reconciliation appears within the statement of changes in equity working."}, {"qId": "CF_Q10", "displayIdx": 10, "type": "ot", "questionType": "mcq", "subTopic": "Disposal proceeds", "difficulty": "medium", "marks": 2, "timeIdeal": 110, "scenario": "During the year ended 31 December 20X6, Foxley Co sold an item of equipment. The equipment had originally cost $23,000 and accumulated depreciation of $8,500 had been charged on it. The disposal gave rise to a profit on disposal of $1,750.", "questionText": "What amount, and under which heading, should be shown in the statement of cash flows for this disposal?", "options": [{"letter": "A", "text": "Investing activities: $16,250 proceeds", "correct": true, "why": "CORRECT. Carrying amount 23,000 - 8,500 = 14,500; proceeds = CA + profit = 14,500 + 1,750 = 16,250, shown as an investing inflow."}, {"letter": "B", "text": "Operating activities: $16,250 proceeds", "correct": false, "why": "'Wrong section' error. The cash proceeds of selling a non-current asset are an investing inflow; only the profit/loss adjustment touches operating activities."}, {"letter": "C", "text": "Investing activities: $14,500 proceeds", "correct": false, "why": "'Used carrying amount as proceeds' error. Forgot to add the profit. Proceeds = CA + profit on disposal."}, {"letter": "D", "text": "Investing activities: $1,750 proceeds", "correct": false, "why": "'Used the profit as the proceeds' error. The profit is just the gain over carrying amount, not the cash received."}], "correctAnswer": "A", "explanationLayer1": "The cash that appears in the SCF for a disposal is the PROCEEDS, shown in investing. Proceeds = carrying amount +/- profit/loss on disposal. The profit itself is removed from operating as a non-cash adjustment.", "workingShown": "Carrying amount = cost - accumulated depreciation = 23,000 - 8,500 = 14,500\nProfit on disposal = proceeds - carrying amount\n  => proceeds = carrying amount + profit = 14,500 + 1,750 = 16,250\nShown as investing inflow of 16,250.", "explanationLayer3": "IAS 7 para 16 classifies proceeds from sale of PPE as investing inflows. The disposal gain is excluded from operating activities under para 20 because the cash effect is captured (in full) within investing.", "examinerNote": "The examiner tests whether you separate the CASH (proceeds, investing) from the ACCOUNTING gain (non-cash, removed from operating). Distractor C — carrying amount as proceeds — is the most seductive.", "teacherCommentary": "Concept: cash received vs accounting gain are different numbers. Process: CA = cost - acc dep, then proceeds = CA +/- profit/loss. Everyday: the asset was 'worth' 14,500 on the books; you sold it for 16,250, so the 1,750 extra is your profit.", "advancedContext": "A loss flips the arithmetic: proceeds = CA - loss, and the loss is ADDED back in operating. This proceeds-vs-profit split is the bridge between the disposals working and both the investing and operating sections."}, {"qId": "CF_Q11", "displayIdx": 11, "type": "ot", "questionType": "number", "subTopic": "PPE additions (with revaluation)", "difficulty": "hard", "marks": 2, "timeIdeal": 165, "prefix": "$", "numAns": 1395000, "tol": 5, "scenario": "Carrow Co had non-current assets with a carrying amount of $2,500,000 at 1 December 20X7. During the year ended 30 November 20X8:\n  - Depreciation of $75,000 was charged.\n  - Land and buildings were revalued upwards by $500,000.\n  - An asset with a carrying amount of $120,000 was disposed of.\nThe carrying amount of non-current assets at 30 November 20X8 was $4,200,000.", "questionText": "What amount should be shown for the purchase of non-current assets in the statement of cash flows for the year ended 30 November 20X8? Give your answer in $ as a whole number.", "explanationLayer1": "Use the carrying-amount T-account. Additions (the cash purchase) is the balancing figure once you account for the opening balance, the upward revaluation (adds to CA, non-cash), depreciation (reduces CA) and the disposal at carrying amount (reduces CA).", "workingShown": "NCA carrying-amount account:\n  Carrying amount b/f      2,500,000\n  Revaluation (non-cash)    +500,000\n  Additions (cash) (B)            ?\n  Depreciation              -75,000\n  Disposal at CA           -120,000\n  Carrying amount c/f    = 4,200,000\n\nAdditions = 4,200,000 - 2,500,000 - 500,000 + 75,000 + 120,000 = 1,395,000", "explanationLayer3": "IAS 7 para 16(a): cash payments to acquire PPE are investing outflows. The revaluation is a non-cash event (IAS 16) and must be removed from the working so it does not overstate cash purchases.", "examinerNote": "The revaluation is the killer. It pushes CA up by 500,000 with NO cash, so it must be stripped out of the additions figure. Forget it and you overstate purchases by exactly 500,000 (you'd get 1,895,000).", "teacherCommentary": "Concept: only CASH movements are purchases; revaluation and depreciation are non-cash noise. Process: build the CA account, put revaluation on the debit (increase) side, solve for additions. Everyday: the buildings went up in value on paper — you didn't buy them again, so that uplift isn't cash spent.", "advancedContext": "This is your named 'revaluation-trap on PPE additions' weakness. Always ask: did any non-cash item inflate CA? Revaluation and depreciation both do. The same working scales directly into FR's PPE note and consolidated SCF."}, {"qId": "CF_Q12", "displayIdx": 12, "type": "ot", "questionType": "mcq", "subTopic": "PPE additions (with revaluation)", "difficulty": "hard", "marks": 2, "timeIdeal": 165, "scenario": "The following information relates to the property, plant and equipment of Lockton Co for the year to 31 December 20X3:\n\n                                                       $\nCarrying amount at beginning of the year          462,000\nCarrying amount at end of the year                 633,000\nIncrease in revaluation surplus during the year     50,000\nDisposals during the year, at cost                 110,000\nAccumulated depreciation on the assets disposed of  65,000\nDepreciation charge for the year                    38,000", "questionText": "What amount will be included for purchases of property, plant and equipment in the statement of cash flows for the year ended 31 December 20X3?", "options": [{"letter": "A", "text": "$204,000", "correct": true, "why": "CORRECT. Disposal CA = 110,000 - 65,000 = 45,000. Additions = 633,000 - 462,000 - 50,000 + 45,000 + 38,000 = 204,000."}, {"letter": "B", "text": "$254,000", "correct": false, "why": "'Omitted the revaluation' error. Leaving out the 50,000 non-cash uplift overstates additions by 50,000."}, {"letter": "C", "text": "$159,000", "correct": false, "why": "'Omitted the disposal' error. Failing to remove the disposed asset's carrying amount understates additions by 45,000."}, {"letter": "D", "text": "$269,000", "correct": false, "why": "'Disposal at cost not carrying amount' error. Used 110,000 (cost) instead of 45,000 (carrying amount) for the disposal in the CA working."}], "correctAnswer": "A", "explanationLayer1": "Build the carrying-amount account. Two traps: the revaluation increases CA with no cash (remove it), and the disposal must enter at CARRYING AMOUNT (45,000), not cost (110,000).", "workingShown": "Disposal carrying amount = 110,000 - 65,000 = 45,000\n\nNCA carrying amount account:\n  CA b/f                462,000\n  Revaluation           +50,000\n  Additions (B)               ?\n  Depreciation          -38,000\n  Disposal at CA        -45,000\n  CA c/f              = 633,000\n\nAdditions = 633,000 - 462,000 - 50,000 + 45,000 + 38,000 = 204,000", "explanationLayer3": "IAS 7 para 16(a) (cash to acquire PPE = investing). The disposal enters the CA working at carrying amount because the account is maintained on a carrying-amount (net) basis, consistent with IAS 16 derecognition.", "examinerNote": "Two independent traps in one question — revaluation (distractor B) and disposal-at-cost (distractor D). The examiner rewards candidates who keep the CA account strictly on a net basis and strip every non-cash item.", "teacherCommentary": "Concept: a net (carrying-amount) account only takes net figures. Process: convert disposal to CA first, remove revaluation, then balance. Everyday: you can't 'buy back' a revaluation, and you only remove the leftover book value of what you sold.", "advancedContext": "Contrast with Q11 which gave disposal already at CA. Here you must DERIVE it (cost - acc dep). The examiner alternates between giving CA directly and forcing the conversion — always check which form the data is in before plugging."}, {"qId": "CF_Q13", "displayIdx": 13, "type": "ot", "questionType": "mcq", "subTopic": "Net investing activities", "difficulty": "hard", "marks": 2, "timeIdeal": 150, "scenario": "At 1 November 20X5 the non-current assets of Fenwick Co had a carrying amount of $2,758,940. During the year to 31 October 20X6, assets with a carrying amount of $273,790 were sold at a loss of $15,850, and new assets costing $568,900 were purchased for cash.", "questionText": "What figure should appear for net cash used in investing activities in the statement of cash flows for the year to 31 October 20X6?", "options": [{"letter": "A", "text": "$310,960 net outflow", "correct": true, "why": "CORRECT. Proceeds = CA - loss = 273,790 - 15,850 = 257,940 inflow. Net = 568,900 purchase - 257,940 proceeds = 310,960 outflow."}, {"letter": "B", "text": "$295,110 net outflow", "correct": false, "why": "'Carrying amount used as proceeds' error. Used 273,790 as the cash received, ignoring the loss. Proceeds = CA - loss."}, {"letter": "C", "text": "$279,260 net outflow", "correct": false, "why": "'Loss added instead of subtracted' error. Added the loss to CA (289,640) to get proceeds. A loss means you received LESS than CA, so subtract it."}, {"letter": "D", "text": "$568,900 net outflow", "correct": false, "why": "'Disposal proceeds omitted' error. Counted only the purchase and forgot the 257,940 disposal inflow."}], "correctAnswer": "A", "explanationLayer1": "Net investing = disposal proceeds (inflow) - purchases (outflow). The opening carrying amount of 2,758,940 is a distractor — it is not needed because purchases are given directly.", "workingShown": "Proceeds on disposal = carrying amount - loss = 273,790 - 15,850 = 257,940 (inflow)\nPurchase of NCA = 568,900 (outflow)\nNet cash used in investing = 568,900 - 257,940 = 310,960 outflow", "explanationLayer3": "IAS 7 para 16: purchases of PPE are investing outflows; proceeds of sale are investing inflows. The loss on disposal does NOT appear in investing — it is an operating add-back.", "examinerNote": "Two traps: the redundant opening CA (2,758,940) baits you into a needless working, and the loss sign (proceeds = CA - loss). The examiner rewards candidates who isolate only the cash items and get the loss direction right.", "teacherCommentary": "Concept: investing nets the cash in and cash out on long-term assets. Process: proceeds = CA - loss (or CA + profit), then purchase - proceeds. Everyday: you sold for 15,850 LESS than book value, so cash in was 257,940, not 273,790.", "advancedContext": "Notice the unused opening CA — the examiner plants surplus data to test whether you compute only what's needed under time pressure. Recognising redundant data fast is part of beating your Section A timing weakness."}, {"qId": "CF_Q14", "displayIdx": 14, "type": "ot", "questionType": "number", "subTopic": "Share issue (financing)", "difficulty": "hard", "marks": 2, "timeIdeal": 140, "prefix": "$", "numAns": 60000, "tol": 5, "scenario": "Garnett Co reported the following balances:\n\n                          31 Dec 20X7   31 Dec 20X6\n                              $             $\nOrdinary share capital      120,000        80,000\nShare premium                60,000        40,000\n\nThere was no bonus issue during the year. All shares issued were for cash.", "questionText": "What amount should be shown as proceeds from the issue of shares in the statement of cash flows for the year ended 31 December 20X7? Give your answer in $ as a whole number.", "explanationLayer1": "Cash from a share issue is the increase in share capital PLUS the increase in share premium. Both reserves capture cash received from shareholders when there is no bonus issue.", "workingShown": "Increase in share capital = 120,000 - 80,000 = 40,000\nIncrease in share premium =  60,000 - 40,000 = 20,000\nCash proceeds from share issue = 40,000 + 20,000 = 60,000", "explanationLayer3": "IAS 7 para 17(a): cash proceeds from issuing shares are financing inflows. Share premium represents the excess of issue price over nominal value and is part of the cash raised.", "examinerNote": "Candidates who take only the share-capital movement (40,000) and forget the premium lose the mark. With no bonus issue, BOTH movements are cash. The examiner adds a premium column precisely to catch the omission.", "teacherCommentary": "Concept: cash raised = nominal value + premium. Process: add both increases. Everyday: if you sell a $1 share for $1.50, the $1 goes to share capital and the 50c to premium — but $1.50 cash hit the bank.", "advancedContext": "If there were a BONUS issue, part of the share-capital rise would be non-cash (funded from premium/reserves) and must be stripped out — exactly the trap in the next question.", "scenarioHtml": "<div style=\"white-space:pre-wrap\">Garnett Co reported the following balances:</div><table class=\"fin-table\"><thead><tr><th class=\"lbl\"></th><th>31 Dec 20X7</th><th>31 Dec 20X6</th></tr><tr><th class=\"lbl unit\"></th><th class=\"unit\">$</th><th class=\"unit\">$</th></tr></thead><tbody><tr><td class=\"lbl\">Ordinary share capital</td><td class=\"num\">120,000</td><td class=\"num\">80,000</td></tr><tr><td class=\"lbl\">Share premium</td><td class=\"num\">60,000</td><td class=\"num\">40,000</td></tr></tbody></table><div style=\"white-space:pre-wrap;margin-top:8px\">There was no bonus issue during the year. All shares issued were for cash.</div>"}, {"qId": "CF_Q15", "displayIdx": 15, "type": "ot", "questionType": "mcq", "subTopic": "Bonus issue / financing", "difficulty": "hard", "marks": 2, "timeIdeal": 165, "scenario": "Marsden Co reported the following:\n\n                          31 Dec 20X7   31 Dec 20X6\n                              $             $\nOrdinary share capital      200,000       120,000\nShare premium                90,000        50,000\n\nDuring the year a bonus issue of 1 share for every 6 shares held at 1 January 20X7 was made, funded out of retained earnings. All other shares issued were for cash.", "questionText": "What amount should be shown as proceeds from the issue of shares (a cash inflow) in the statement of cash flows for the year ended 31 December 20X7?", "options": [{"letter": "A", "text": "$100,000", "correct": true, "why": "CORRECT. Bonus = 120,000/6 = 20,000 (non-cash, from retained earnings). Cash nominal = 80,000 - 20,000 = 60,000; cash premium = 40,000; total cash = 100,000."}, {"letter": "B", "text": "$120,000", "correct": false, "why": "'Ignored the bonus issue' error. Treated the whole 80,000 capital rise as cash. The 20,000 bonus was funded from retained earnings — no cash — so it must be removed."}, {"letter": "C", "text": "$60,000", "correct": false, "why": "'Omitted the share premium' error. Counted only the cash nominal (60,000) and forgot the 40,000 premium received on the cash issue."}, {"letter": "D", "text": "$80,000", "correct": false, "why": "'Share capital movement only' error. Took the full capital increase, ignoring both the premium and the non-cash bonus."}], "correctAnswer": "A", "explanationLayer1": "A bonus issue is non-cash. When funded from retained earnings it inflates share capital with no cash, so it must be stripped from the financing inflow. Cash raised = (capital increase - bonus nominal) + premium increase.", "workingShown": "Bonus shares = 120,000 / 6 = 20,000 (funded from retained earnings, non-cash)\nTotal share-capital increase = 200,000 - 120,000 = 80,000\nCash element of capital = 80,000 - 20,000 = 60,000\nShare premium increase (all from cash issue) = 90,000 - 50,000 = 40,000\nCash proceeds from share issue = 60,000 + 40,000 = 100,000", "explanationLayer3": "IAS 7 para 17(a): only CASH proceeds from issuing shares are financing inflows. A bonus issue is a non-cash transaction (disclosed separately, not in the SCF body) per IAS 7 para 43.", "examinerNote": "The funding source matters. Bonus from retained earnings affects only share capital (so you subtract it). Bonus from share premium would be internally offsetting (DR premium/CR capital) and wouldn't change the cash answer. Read which reserve funds it.", "teacherCommentary": "Concept: bonus shares are 'free' — no cash. Process: remove the bonus nominal from the capital movement, then add the genuine premium. Everyday: handing existing owners extra shares for nothing raises no money — only the shares you SOLD did.", "advancedContext": "Rights issues, by contrast, ARE cash (shares sold to existing holders at a set price) and stay in financing. The bonus/rights distinction is a perennial 2-mark concept question — bonus = non-cash, rights = cash.", "scenarioHtml": "<div style=\"white-space:pre-wrap\">Marsden Co reported the following:</div><table class=\"fin-table\"><thead><tr><th class=\"lbl\"></th><th>31 Dec 20X7</th><th>31 Dec 20X6</th></tr><tr><th class=\"lbl unit\"></th><th class=\"unit\">$</th><th class=\"unit\">$</th></tr></thead><tbody><tr><td class=\"lbl\">Ordinary share capital</td><td class=\"num\">200,000</td><td class=\"num\">120,000</td></tr><tr><td class=\"lbl\">Share premium</td><td class=\"num\">90,000</td><td class=\"num\">50,000</td></tr></tbody></table><div style=\"white-space:pre-wrap;margin-top:8px\">During the year a bonus issue of 1 share for every 6 shares held at 1 January 20X7 was made, funded out of retained earnings. All other shares issued were for cash.</div>"}, {"qId": "CF_Q16", "displayIdx": 16, "type": "ot", "questionType": "mcq", "subTopic": "Loans (financing)", "difficulty": "medium", "marks": 2, "timeIdeal": 120, "scenario": "Ravenscar Co had a bank loan outstanding of $3,400,000 at 31 December 20X4. During 20X5, Ravenscar Co was charged and paid interest of $170,000, was advanced an additional loan of $200,000, and at 31 December 20X5 the balance outstanding on the loan was $3,100,000.", "questionText": "How much should be included within cash flows from financing activities for the repayment of the bank loan during 20X5?", "options": [{"letter": "A", "text": "$500,000", "correct": true, "why": "CORRECT. Loan account: 3,400,000 b/f + 200,000 new - repayment = 3,100,000 c/f, so repayment = 500,000. Interest is a separate cash flow."}, {"letter": "B", "text": "$670,000", "correct": false, "why": "'Interest folded into repayment' error. Added the 170,000 interest to the 500,000 principal repayment. Interest paid is disclosed separately, not as loan repayment."}, {"letter": "C", "text": "$300,000", "correct": false, "why": "'New loan ignored' error. Used only the fall in the balance (3,400,000 - 3,100,000). The 200,000 advance must be added back to find the true repayment."}, {"letter": "D", "text": "$700,000", "correct": false, "why": "'New loan double-counted' error. Added the 200,000 advance to the repayment instead of recognising it raised the balance."}], "correctAnswer": "A", "explanationLayer1": "Reconstruct the loan account. Repayment is the balancing figure: opening balance + new loans advanced - closing balance. Interest is a separate cash flow and never forms part of the principal movement.", "workingShown": "Bank loan account:\n           $                          $\nRepay (B) 500,000   Balance b/f    3,400,000\nBal c/f 3,100,000   New loan         200,000\n        ---------                   ---------\n        3,600,000                   3,600,000\n\nRepayment = 3,400,000 + 200,000 - 3,100,000 = 500,000\n(Interest 170,000 = separate operating/financing cash line.)", "explanationLayer3": "IAS 7 para 17(c)/(d): cash proceeds from borrowings and cash repayments of borrowings are financing flows, shown GROSS (not netted). Para 31 covers interest paid as a separate disclosure.", "examinerNote": "Two classic traps live here: folding interest into the repayment (B), and forgetting the new advance so you only see the net balance change (C). IAS 7 requires the new loan and the repayment to be shown gross — separately.", "teacherCommentary": "Concept: separate principal from interest, and show new borrowing and repayment gross. Process: build the loan account; repayment balances it. Everyday: the balance only fell 300k, but you also borrowed 200k more — so you actually repaid 500k.", "advancedContext": "IAS 7 para 21 requires gross presentation of financing flows: a 200,000 inflow AND a 500,000 outflow, not a single 300,000 net line. Netting is an examiner-flagged error."}, {"qId": "CF_Q17", "displayIdx": 17, "type": "ot", "questionType": "number", "subTopic": "Net financing activities", "difficulty": "hard", "marks": 2, "timeIdeal": 160, "prefix": "$", "numAns": 200000, "tol": 5, "scenario": "Saxby Co reported the following at 31 December (no bonus issue in the year; all shares issued for cash):\n\n                          20X7          20X6\n                            $             $\nOrdinary share capital    350,000       250,000\nShare premium             130,000        90,000\nBank loan (non-current)   320,000       200,000\n\nA dividend of $60,000 was paid during the year.", "questionText": "What is the net cash flow from financing activities for the year ended 31 December 20X7? Give your answer in $ as a whole number (a net inflow).", "explanationLayer1": "Net financing = share issue proceeds + new borrowings - loan repayments - dividends paid. Here the loan balance ROSE, so it is a new-borrowing inflow, not a repayment.", "workingShown": "Share issue: (350,000-250,000) + (130,000-90,000) = 100,000 + 40,000 = 140,000 inflow\nBank loan:    320,000 - 200,000 = 120,000 new loan (inflow)\nDividends paid:                                  (60,000) outflow\nNet cash from financing = 140,000 + 120,000 - 60,000 = 200,000 inflow", "explanationLayer3": "IAS 7 para 17: financing flows comprise share issues (a), borrowings raised (c) and repaid (d), and (per para 31) dividends paid may be classified here. Shown gross.", "examinerNote": "The loan balance INCREASED — students primed to expect a repayment may wrongly deduct 120,000, swinging the answer by 240,000. Always check the direction of the loan movement: up = inflow, down = outflow.", "teacherCommentary": "Concept: net the three financing streams — owners' capital, lenders' capital, returns to owners. Process: identify each as inflow or outflow by direction, then net. Everyday: you raised 140k from shares and 120k more debt, then handed 60k back as dividends — 200k net came in.", "advancedContext": "Combine this with Q14/Q15 (share issue mechanics) and Q16 (loan direction) and you can build the entire financing section of an MTQ — which is exactly what Part 3 will require.", "scenarioHtml": "<div style=\"white-space:pre-wrap\">Saxby Co reported the following at 31 December (no bonus issue in the year; all shares issued for cash):</div><table class=\"fin-table\"><thead><tr><th class=\"lbl\"></th><th>20X7</th><th>20X6</th></tr><tr><th class=\"lbl unit\"></th><th class=\"unit\">$</th><th class=\"unit\">$</th></tr></thead><tbody><tr><td class=\"lbl\">Ordinary share capital</td><td class=\"num\">350,000</td><td class=\"num\">250,000</td></tr><tr><td class=\"lbl\">Share premium</td><td class=\"num\">130,000</td><td class=\"num\">90,000</td></tr><tr><td class=\"lbl\">Bank loan (non-current)</td><td class=\"num\">320,000</td><td class=\"num\">200,000</td></tr></tbody></table><div style=\"white-space:pre-wrap;margin-top:8px\">A dividend of $60,000 was paid during the year.</div>"}, {"qId": "CF_Q18", "displayIdx": 18, "type": "ot", "questionType": "mcq", "subTopic": "Direct method (customers)", "difficulty": "hard", "marks": 2, "timeIdeal": 150, "scenario": "Tilbrook Co prepares its statement of cash flows using the direct method. The following relates to the year ended 31 March 20X7:\n\n                                    $\nSales                            750,000\nTrade receivables 1 April 20X6   163,000\nTrade receivables 31 March 20X7  184,000", "questionText": "What will be disclosed as cash receipts from customers in the statement of cash flows for the year ended 31 March 20X7?", "options": [{"letter": "A", "text": "$729,000", "correct": true, "why": "CORRECT. Receivables rose 21,000, so cash collected is less than sales: 750,000 - 21,000 = 729,000."}, {"letter": "B", "text": "$771,000", "correct": false, "why": "'Wrong-direction receivables' error. Added the 21,000 increase. A rise in receivables means cash collected is LOWER than sales, so it is deducted."}, {"letter": "C", "text": "$750,000", "correct": false, "why": "'Ignored receivables movement' error. Took sales as cash. The direct method needs the receivables T-account adjustment."}, {"letter": "D", "text": "$566,000", "correct": false, "why": "'Deducted the closing balance' error. Subtracted the whole 184,000 closing receivables instead of the 21,000 MOVEMENT."}], "correctAnswer": "A", "explanationLayer1": "Direct-method cash from customers = sales adjusted for the movement in receivables. Use the receivables T-account: opening + sales - cash received = closing, so cash = sales - increase (or + decrease) in receivables.", "workingShown": "Receivables account:\n           $                       $\nBal b/f  163,000   Cash rec'd (B)  729,000\nSales    750,000   Bal c/f         184,000\n         -------                   -------\n         913,000                   913,000\n\nCash from customers = 750,000 - (184,000 - 163,000) = 729,000", "explanationLayer3": "IAS 7 para 18(a) and para 19: under the direct method, major classes of gross cash receipts (e.g. from customers) are disclosed, derived from accounting records or by adjusting sales for receivables movements.", "examinerNote": "The reliable route is the receivables T-account; the direction trap (add vs subtract the movement) is the whole point. Distractor D — deducting the full closing balance — catches candidates who confuse the balance with the movement.", "teacherCommentary": "Concept: sales is accruals; cash from customers is what actually arrived. Process: open the receivables account, balance for cash. Everyday: you billed 750k but customers owe you 21k more than last year, so only 729k cash came in.", "advancedContext": "Direct vs indirect produce the SAME net operating cash (IAS 7) — only the presentation of the operating section differs. The receivables T-account here is the same one used in the indirect method's working-capital adjustment."}, {"qId": "CF_Q19", "displayIdx": 19, "type": "ot", "questionType": "number", "subTopic": "Direct method (suppliers)", "difficulty": "hard", "marks": 2, "timeIdeal": 160, "prefix": "$", "numAns": 409000, "tol": 5, "scenario": "Continuing with Tilbrook Co (direct method, year ended 31 March 20X7):\n\n                                  $\nPurchases                       400,000\nTrade payables 1 April 20X6     111,000\nTrade payables 31 March 20X7    102,000", "questionText": "What will be disclosed as cash payments to suppliers in the statement of cash flows for the year ended 31 March 20X7? Give your answer in $ as a whole number.", "explanationLayer1": "Cash paid to suppliers = purchases adjusted for the movement in payables. Payables fell, so you paid down old debt as well as the year's purchases — cash paid exceeds purchases.", "workingShown": "Payables account:\n            $                        $\nCash (B) 409,000    Bal b/f       111,000\nBal c/f  102,000    Purchases     400,000\n         -------                  -------\n         511,000                  511,000\n\nCash to suppliers = 400,000 + (111,000 - 102,000) = 409,000", "explanationLayer3": "IAS 7 para 18(a)/19: gross cash payments to suppliers are disclosed under the direct method, derived from the payables account.", "examinerNote": "Payables FALLING means you settled more than you bought — cash paid is higher than purchases. Candidates who reflexively 'add an increase' get the direction wrong when the balance decreases. Draw the T-account.", "teacherCommentary": "Concept: purchases is accruals; cash to suppliers is what actually left. Process: open payables account, balance for cash. Everyday: you bought 400k of goods and also paid off 9k of last year's bills, so 409k left the bank.", "advancedContext": "Pair this with Q18 (customers): customers + suppliers + employees together build the entire direct-method operating section. The contra-and-irrecoverable-debt twist in Part 2 stretches this further."}, {"qId": "CF_Q20", "displayIdx": 20, "type": "ot", "questionType": "mcq", "subTopic": "Direct method (employees)", "difficulty": "medium", "marks": 2, "timeIdeal": 120, "scenario": "Wexford Co prepares its statement of cash flows using the direct method. For the year ended 31 December 20X6, wages and salaries expense was $9,500. The accrual for wages and salaries was $1,500 at the start of the year and $750 at the end of the year.", "questionText": "What is the cash paid to and on behalf of employees for the year ended 31 December 20X6?", "options": [{"letter": "A", "text": "$10,250", "correct": true, "why": "CORRECT. The accrual fell by 750, so cash paid exceeds the expense: 9,500 + (1,500 - 750) = 10,250."}, {"letter": "B", "text": "$9,500", "correct": false, "why": "'Ignored the accrual movement' error. Took the P&L expense as cash. Because the accrual fell, more cash was paid than the expense."}, {"letter": "C", "text": "$8,75
