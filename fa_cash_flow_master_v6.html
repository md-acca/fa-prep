              150       90\n                              -----    -----\nTotal assets                  3,270    2,530\n\nShare capital                 1,000      700\nShare premium                   400      250\nRevaluation surplus             200        0\nRetained earnings               720      600\nLoan (non-current)              600      650\nTrade payables                  280      250\nTax payable                      70       80\n                              -----    -----\nTotal equity and liabilities  3,270    2,530\n\nStatement of profit or loss for the year ended 31 December 20X6 ($000):\n  Operating profit ............... 310   (after $150 depreciation and a $20 PROFIT on disposal)\n  Finance cost ................... (60)\n  Profit before tax .............. 250\n  Income tax ..................... (90)\n  Profit for the year ............ 160\n\nAdditional information:\n  - PPE was revalued upwards by $200,000 during the year (the revaluation surplus).\n  - An asset with a carrying amount of $80,000 was sold during the year at a PROFIT of $20,000.\n  - The depreciation charge for the year was $150,000.\n  - There were no interest accruals (interest paid equals the finance cost).\n  - A dividend was paid during the year.", "parts": [{"part": "(a)", "marks": 4, "questionType": "number", "prefix": "$", "numAns": 390, "tol": 2, "prompt": "Cash generated from operations ($000)", "modelAnswer": "PBT 250 + depreciation 150 - profit on disposal 20 + finance cost 60 = 440\nLess inventory inc (300-260) -40; less receivables inc (420-380) -40; add payables inc (280-250) +30\n= 440 - 40 - 40 + 30 = 390"}, {"part": "(b)", "marks": 3, "questionType": "number", "prefix": "$", "numAns": 630, "tol": 2, "prompt": "Purchase of property, plant and equipment ($000)", "modelAnswer": "Carrying-amount account: CA b/f 1,800 + revaluation 200 + additions - depreciation 150 - disposal CA 80 = CA c/f 2,400\nAdditions = 2,400 - 1,800 - 200 + 150 + 80 = 630 (the revaluation is non-cash and is stripped out)"}, {"part": "(c)", "marks": 2, "questionType": "number", "prefix": "$", "numAns": 100, "tol": 1, "prompt": "Proceeds on disposal ($000)", "modelAnswer": "Proceeds = carrying amount + profit = 80 + 20 = 100 (investing inflow)"}, {"part": "(d)", "marks": 2, "questionType": "mcq", "correctAnswer": "C", "prompt": "Dunmore revalued its PPE upwards by $200,000 during the year. How is this revaluation reflected in the statement of cash flows?", "options": [{"letter": "A", "text": "As an investing cash outflow of $200,000", "correct": false, "why": "'Revaluation as cash' error — no cash changes hands on a revaluation."}, {"letter": "B", "text": "As an operating add-back of $200,000", "correct": false, "why": "'Revaluation in operating' error — a revaluation is not an operating item and involves no cash."}, {"letter": "C", "text": "It does not appear in the statement of cash flows; it is a non-cash transaction", "correct": true, "why": "CORRECT. A revaluation is non-cash (IAS 7 para 43) — excluded from the statement and disclosed separately. It appears only inside the PPE additions working."}, {"letter": "D", "text": "As a financing inflow of $200,000 within the revaluation surplus", "correct": false, "why": "'Reserve movement as cash' error — the revaluation surplus is a non-cash reserve, not a financing cash flow."}], "modelAnswer": "A revaluation is a non-cash transaction (IAS 7 para 43): it never appears in the statement body; its only role is in the carrying-amount working, where it must be stripped out so additions are not overstated."}, {"part": "(e)", "marks": 2, "questionType": "number", "prefix": "$", "numAns": 60, "tol": 1, "prompt": "Net increase in cash and cash equivalents ($000)", "modelAnswer": "Operating 390 - interest 60 - tax 100 = 230; Investing -630 + 100 = -530; Financing share 450 - loan 50 - dividends 40 = 360\nNet = 230 - 530 + 360 = 60 (ties to cash 90 -> 150)"}, {"part": "(f)", "marks": 2, "questionType": "multi", "correctOptions": ["A", "C"], "expectedSelectCount": 2, "correctAnswer": "A, C", "prompt": "Which TWO of the following statements about Dunmore's statement of cash flows are correct? Select TWO.", "options": [{"letter": "A", "text": "The $20,000 profit on disposal is deducted in arriving at cash generated from operations.", "correct": true, "why": "CORRECT. A gain on disposal is non-cash and is deducted in the operating reconciliation."}, {"letter": "B", "text": "The $200,000 revaluation increases the figure for purchases of PPE in the statement of cash flows.", "correct": false, "why": "'Revaluation inflates additions' error — the revaluation is stripped OUT of the additions working; including it overstates purchases by 200."}, {"letter": "C", "text": "The proceeds from the share issue of $450,000 are a financing inflow.", "correct": true, "why": "CORRECT. Share capital (1,000-700) + premium (400-250) = 450 cash inflow, financing."}, {"letter": "D", "text": "The loan movement is a financing inflow of $50,000.", "correct": false, "why": "'Direction error' — the loan fell 650 -> 600, a $50,000 REPAYMENT (outflow), not an inflow."}], "modelAnswer": "Correct: A and C. B is the revaluation trap (it is removed from additions, not added). D reverses the loan direction — a falling balance is a repayment (outflow)."}], "examinerNote": "The revaluation is the headline trap and a known discriminator. Candidates either (1) wrongly show it as a cash flow, or (2) forget to remove it from the additions working — overstating PPE purchases by exactly 200. It belongs ONLY in the carrying-amount account, never in the statement body.", "teacherCommentary": "Concept: revaluation is paper-only — it inflates the asset and a reserve with no cash. Process: build the CA account with the revaluation on the debit side, solve for additions, keep revaluation OUT of the statement. Everyday: your building gaining value on paper isn't money you spent or received — it just sits in a reserve.", "scenarioHtml": "<div style=\"white-space:pre-wrap\">Dunmore Co — statements of financial position at 31 December ($000):</div><table class=\"fin-table\"><thead><tr><th class=\"lbl\"></th><th>20X6</th><th>20X5</th></tr></thead><tbody><tr><td class=\"lbl\">Property, plant &amp; equipment (carrying amount)</td><td class=\"num\">2,400</td><td class=\"num\">1,800</td></tr><tr><td class=\"lbl\">Inventory</td><td class=\"num\">300</td><td class=\"num\">260</td></tr><tr><td class=\"lbl\">Trade receivables</td><td class=\"num\">420</td><td class=\"num\">380</td></tr><tr><td class=\"lbl\">Cash</td><td class=\"num\">150</td><td class=\"num\">90</td></tr><tr class=\"subtotal\"><td class=\"lbl\">Total assets</td><td class=\"num\">3,270</td><td class=\"num\">2,530</td></tr><tr class=\"gap\"><td></td><td></td><td></td></tr><tr><td class=\"lbl\">Share capital</td><td class=\"num\">1,000</td><td class=\"num\">700</td></tr><tr><td class=\"lbl\">Share premium</td><td class=\"num\">400</td><td class=\"num\">250</td></tr><tr><td class=\"lbl\">Revaluation surplus</td><td class=\"num\">200</td><td class=\"num\">0</td></tr><tr><td class=\"lbl\">Retained earnings</td><td class=\"num\">720</td><td class=\"num\">600</td></tr><tr><td class=\"lbl\">Loan (non-current)</td><td class=\"num\">600</td><td class=\"num\">650</td></tr><tr><td class=\"lbl\">Trade payables</td><td class=\"num\">280</td><td class=\"num\">250</td></tr><tr><td class=\"lbl\">Tax payable</td><td class=\"num\">70</td><td class=\"num\">80</td></tr><tr class=\"subtotal\"><td class=\"lbl\">Total equity and liabilities</td><td class=\"num\">3,270</td><td class=\"num\">2,530</td></tr></tbody></table><div style=\"white-space:pre-wrap;margin-top:8px\">Statement of profit or loss for the year ended 31 December 20X6 ($000):\n  Operating profit ............... 310   (after $150 depreciation and a $20 PROFIT on disposal)\n  Finance cost ................... (60)\n  Profit before tax .............. 250\n  Income tax ..................... (90)\n  Profit for the year ............ 160\n\nAdditional information:\n  - PPE was revalued upwards by $200,000 during the year (the revaluation surplus).\n  - An asset with a carrying amount of $80,000 was sold during the year at a PROFIT of $20,000.\n  - The depreciation charge for the year was $150,000.\n  - There were no interest accruals (interest paid equals the finance cost).\n  - A dividend was paid during the year.</div>"}]}</script>
<script>
// =============================================================
// ENGINE
// =============================================================


const TOPIC_NAME = 'Cash Flow';
const STORAGE_PREFIX = 'fa_v3_cashflow_';
const PENDING_KEY = 'fa_v3_pending_imports';
const DASHBOARD_URL = 'https://md-acca.github.io/fa-prep/';
const TIME_LIMIT_SEC = 150 * 60;  // 2h 30min
const PASS_MARK_PCT = 65;         // pass mark (Muhammad-set)

// ---- State ----
const MASTER = JSON.parse(document.getElementById('master-data').textContent);
const POOLS = { M: MASTER };

let state = null;          // active attempt state
let timerInterval = null;
let autoSaveInterval = null;

// ---- DOM helpers ----
const $ = (s, root = document) => root.querySelector(s);
const view = () => $('#view');

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function fmtTime(sec) {
  if (sec < 0) sec = 0;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function toast(msg, type = 'success', ms = 2400) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), ms);
}
function showModal(html) {
  $('#modal-content').innerHTML = html;
  $('#modal-backdrop').classList.add('show');
}
function closeModal() {
  $('#modal-backdrop').classList.remove('show');
}

// ---- Persistence ----
function attemptStorageKey(pool) { return STORAGE_PREFIX + 'attempt_pool_' + pool; }
function historyStorageKey() { return STORAGE_PREFIX + 'history'; }

function loadAttempt(pool) {
  try {
    const raw = localStorage.getItem(attemptStorageKey(pool));
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveAttempt() {
  if (!state || state.submitted) return;
  try {
    localStorage.setItem(attemptStorageKey(state.pool), JSON.stringify(state));
  } catch (e) { console.error('Save failed:', e); }
}
function clearAttempt(pool) {
  localStorage.removeItem(attemptStorageKey(pool));
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(historyStorageKey());
    return raw ? JSON.parse(raw) : { A: [], B: [] };
  } catch (e) { return { A: [], B: [] }; }
}
function saveHistory(hist) {
  localStorage.setItem(historyStorageKey(), JSON.stringify(hist));
}

// ---- Build a fresh attempt ----
function freshAttempt(pool) {
  const data = POOLS[pool];
  const hist = loadHistory();
  const attemptNum = (hist[pool] || []).length + 1;
  const answers = {};        // qId -> answer (string for MCQ letter, array for multi, number for num, object for MTQ parts)
  const flags = {};          // qId -> true
  const guessed = {};        // qId -> true
  const mtqWorking = {};     // mtqQId -> textarea content
  data.questions.forEach(q => {
    if (q.questionType === 'multi') answers[q.qId] = [];
    else answers[q.qId] = '';
  });
  data.mtqs.forEach(mtq => {
    answers[mtq.qId] = {};
    mtq.parts.forEach(p => {
      if (p.questionType === 'multi') answers[mtq.qId][p.part] = [];
      else answers[mtq.qId][p.part] = '';
    });
    mtqWorking[mtq.qId] = '';
  });
  return {
    pool, attemptNum,
    startedAt: new Date().toISOString(),
    timeRemaining: TIME_LIMIT_SEC,
    currentSection: 'A',       // 'A' or 'B'
    currentIdx: 0,             // index within section
    answers, flags, guessed, mtqWorking,
    submitted: false,
    completedAt: null,
    schemaVersion: 3
  };
}

// ---- Routing ----
function goHome() {
  stopTimer();
  state = null;
  $('#timer-pill').classList.add('hidden');
  $('#header-home-btn').classList.add('hidden');
  $('#header-subtitle').textContent = 'Master Test · 125 marks · 2h 30min';
  renderHome();
}

function renderHome() {
  const inProgressM = loadAttempt('M');
  const hist = loadHistory();
  const attemptsM = (hist.M || []).length;
  const bestM = (hist.M || []).reduce((m, a) => Math.max(m, a.pct), 0);

  view().innerHTML = `
    <div class="home-hero">
      <h1>Cash Flow (IAS 7) · Master Test</h1>
      <p>40 OT + 3 MTQs · 125 marks · 2h 30min · Pass mark 65%</p>
    </div>

    <div class="pool-grid">
      ${renderPoolCard('M', MASTER, inProgressM, attemptsM, bestM)}
    </div>

    <div class="card">
      <div class="card-title">Sync &amp; Dashboard</div>
      <div class="card-subtitle">Completed attempts auto-write to the dashboard's import queue. Open dashboard to merge.</div>
      <div class="home-utility">
        <button class="utility-btn" onclick="openDashboard()"><span class="icon">📊</span> Open Dashboard</button>
        <button class="utility-btn" onclick="manualSync()"><span class="icon">🔄</span> Re-sync history to dashboard</button>
        <button class="utility-btn" onclick="downloadAttempts()"><span class="icon">⬇️</span> Download attempts JSON</button>
        <button class="utility-btn" onclick="confirmClearHistory()"><span class="icon">🗑️</span> Clear local history</button>
      </div>
    </div>
  `;
}

function renderPoolCard(pool, data, inProgress, attemptsCount, bestPct) {
  const diff = data.difficultyMix || '';
  return `
    <div class="pool-card ${inProgress ? 'in-progress' : ''}">
      <div class="pool-card-label">Master Test</div>
      <div class="pool-card-title">IAS 7 · Statement of Cash Flows</div>
      <div class="pool-card-meta">
        ${data.totalMarks} marks · ${data.timeMinutes} minutes<br>
        Difficulty: ${escapeHtml(diff)}<br>
        Attempts so far: <strong>${attemptsCount}</strong>${attemptsCount > 0 ? ` · Best: <strong>${bestPct.toFixed(0)}%</strong>` : ''}
      </div>
      <div class="pool-card-actions">
        ${inProgress
          ? `<button class="btn btn-warning" onclick="startAttempt('${pool}', true)">Resume attempt</button>
             <button class="btn btn-secondary" onclick="confirmDiscard('${pool}')">Discard &amp; restart</button>`
          : `<button class="btn" onclick="startAttempt('${pool}', false)">${attemptsCount > 0 ? 'Start new attempt' : 'Start Master Test'}</button>`
        }
      </div>
    </div>
  `;
}

function confirmDiscard(pool) {
  showModal(`
    <h2>Discard in-progress attempt?</h2>
    <p>Your saved progress for Pool ${pool} will be erased. This can't be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="discardAttempt('${pool}')">Discard</button>
    </div>
  `);
}
function discardAttempt(pool) {
  clearAttempt(pool);
  closeModal();
  toast('Attempt discarded', 'warn');
  renderHome();
}

// ---- Start / resume ----
function startAttempt(pool, isResume) {
  if (isResume) {
    state = loadAttempt(pool);
    if (!state) { toast('No saved attempt found', 'error'); renderHome(); return; }
  } else {
    state = freshAttempt(pool);
  }
  $('#header-subtitle').textContent = `Master Test · Attempt #${state.attemptNum}`;
  $('#timer-pill').classList.remove('hidden');
  $('#header-home-btn').classList.remove('hidden');
  startTimer();
  startAutoSave();
  renderTest();
}

// ---- Timer ----
function startTimer() {
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    if (!state || state.submitted) return;
    state.timeRemaining--;
    updateTimerDisplay();
    if (state.timeRemaining <= 0) {
      handleTimeUp();
    }
  }, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if (autoSaveInterval) { clearInterval(autoSaveInterval); autoSaveInterval = null; }
}
function updateTimerDisplay() {
  if (!state) return;
  const pill = $('#timer-pill');
  $('#timer-display').textContent = fmtTime(state.timeRemaining);
  pill.classList.remove('warn', 'crit');
  if (state.timeRemaining <= 120) pill.classList.add('crit');
  else if (state.timeRemaining <= 600) pill.classList.add('warn');
}
function handleTimeUp() {
  stopTimer();
  state.timeRemaining = 0;
  finalizeSubmission(true);
  $('#timeup-overlay').classList.add('show');
}
function acknowledgeTimeUp() {
  $('#timeup-overlay').classList.remove('show');
  renderResults();
}
function startAutoSave() {
  autoSaveInterval = setInterval(saveAttempt, 30000);
}

// ---- Test view rendering ----
function totalQsA() { return POOLS[state.pool].questions.length; }
function totalMtqs() { return POOLS[state.pool].mtqs.length; }
function currentQ() {
  const pool = POOLS[state.pool];
  if (state.currentSection === 'A') return pool.questions[state.currentIdx];
  return pool.mtqs[state.currentIdx];
}

function renderTest() {
  if (!state) return;
  view().innerHTML = `
    <div class="test-layout">
      <aside class="q-nav-card" id="q-nav-card"></aside>
      <div id="q-main"></div>
    </div>
  `;
  renderNav();
  renderCurrentQuestion();
}

function renderNav() {
  const pool = POOLS[state.pool];
  let html = `<div class="q-nav-section">Section A · 40 OT (2 marks each)</div><div class="q-nav-grid">`;
  pool.questions.forEach((q, i) => {
    const isCurrent = (state.currentSection === 'A' && state.currentIdx === i);
    const isAnswered = isQuestionAnswered(q);
    const isFlagged = !!state.flags[q.qId];
    let cls = 'q-nav-btn';
    if (isCurrent) cls += ' current';
    else if (isAnswered) cls += ' answered';
    if (isFlagged) cls += ' flagged';
    html += `<button class="${cls}" onclick="jumpTo('A', ${i})">${i + 1}</button>`;
  });
  html += `</div><div class="q-nav-section">Section B · 3 MTQs (15 marks each)</div>`;
  pool.mtqs.forEach((mtq, i) => {
    const isCurrent = (state.currentSection === 'B' && state.currentIdx === i);
    const partsDone = mtqPartsAnswered(mtq);
    const totalParts = mtq.parts.length;
    let cls = 'q-nav-mtq';
    if (isCurrent) cls += ' current';
    else if (partsDone === totalParts) cls += ' answered';
    html += `<button class="${cls}" onclick="jumpTo('B', ${i})">
      MTQ ${i + 1} · ${mtq.totalMarks} marks
      <div class="q-nav-mtq-parts">${partsDone}/${totalParts} parts answered</div>
    </button>`;
  });
  html += `<div class="q-nav-legend">
    <div><span class="dot" style="background:var(--success-light);border:1px solid var(--success)"></span>Answered</div>
    <div><span class="dot" style="background:var(--primary)"></span>Current</div>
    <div><span class="dot" style="background:var(--warning)"></span>Flagged</div>
    <div style="margin-top:8px"><button class="btn btn-sm" onclick="openReview()" style="width:100%">Review &amp; submit →</button></div>
  </div>`;
  $('#q-nav-card').innerHTML = html;
}

function jumpTo(section, idx) {
  state.currentSection = section;
  state.currentIdx = idx;
  saveAttempt();
  renderNav();
  renderCurrentQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function isQuestionAnswered(q) {
  const a = state.answers[q.qId];
  if (q.questionType === 'multi') return Array.isArray(a) && a.length > 0;
  return a !== '' && a != null;
}
function mtqPartsAnswered(mtq) {
  const ans = state.answers[mtq.qId] || {};
  let done = 0;
  mtq.parts.forEach(p => {
    const v = ans[p.part];
    if (p.questionType === 'multi') { if (Array.isArray(v) && v.length > 0) done++; }
    else if (v !== '' && v != null) done++;
  });
  return done;
}

function renderCurrentQuestion() {
  const main = $('#q-main');
  if (state.currentSection === 'A') {
    renderOT(main);
  } else {
    renderMTQ(main);
  }
}

function renderOT(main) {
  const q = currentQ();
  const idx = state.currentIdx;
  const total = totalQsA();
  const isFlagged = !!state.flags[q.qId];
  const isGuessed = !!state.guessed[q.qId];
  const sel = state.answers[q.qId];

  let optionsHtml = '';
  if (q.questionType === 'mcq') {
    optionsHtml = `<div class="opt-list">` + q.options.map(o => {
      const selected = sel === o.letter;
      return `<label class="opt-row ${selected ? 'selected' : ''}">
        <input type="radio" name="opt_${q.qId}" value="${o.letter}" ${selected ? 'checked' : ''} onchange="setAnswer('${q.qId}', this.value)">
        <span class="text"><span class="letter">${o.letter}.</span> ${escapeHtml(o.text)}</span>
      </label>`;
    }).join('') + `</div>`;
  } else if (q.questionType === 'multi') {
    const arr = Array.isArray(sel) ? sel : [];
    const need = q.expectedSelectCount || 2;
    optionsHtml = `<div style="margin-bottom:10px;font-size:12px;color:var(--text-muted)">Select ${need}.</div>
    <div class="opt-list">` + q.options.map(o => {
      const checked = arr.includes(o.letter);
      return `<label class="opt-row ${checked ? 'selected' : ''}">
        <input type="checkbox" value="${o.letter}" ${checked ? 'checked' : ''} onchange="toggleMulti('${q.qId}', this.value)">
        <span class="text"><span class="letter">${o.letter}.</span> ${escapeHtml(o.text)}</span>
      </label>`;
    }).join('') + `</div>`;
  } else if (q.questionType === 'number') {
    optionsHtml = `<div class="num-input-wrap">
      <span class="prefix">${q.prefix || '$'}</span>
      <input type="text" inputmode="decimal" class="num-input" placeholder="Enter your answer"
        value="${escapeHtml(sel || '')}"
        oninput="setAnswer('${q.qId}', this.value)">
    </div>
    <div style="margin-top:8px;font-size:11px;color:var(--text-muted)">Enter whole number or to 2 decimal places. No commas or units required.</div>`;
  }

  main.innerHTML = `
    <div class="q-card">
      <div class="q-meta-bar">
        <div class="q-num">Section A · Question ${idx + 1} of ${total}</div>
        <div class="q-meta-right">
          <button class="q-flag-btn ${isFlagged ? 'active' : ''}" onclick="toggleFlag('${q.qId}')">${isFlagged ? '⚑ Flagged' : '⚐ Flag'}</button>
          <button class="q-guess-btn ${isGuessed ? 'active' : ''}" onclick="toggleGuessed('${q.qId}')" title="Mark this answer as a guess (for review-tab analytics)">${isGuessed ? '? Guessed' : '? Mark guess'}</button>
          <span class="q-marks-badge">${q.marks} marks</span>
        </div>
      </div>
      ${q.scenario ? `<div class="q-scenario${q.scenarioHtml ? ' q-scenario-rich' : ''}">${q.scenarioHtml || escapeHtml(q.scenario)}</div>` : ''}
      <div class="q-text">${escapeHtml(q.questionText)}</div>
      ${optionsHtml}
      <div class="nav-bar">
        <button class="btn btn-secondary" ${idx === 0 && state.currentSection === 'A' ? 'disabled' : ''} onclick="navPrev()">← Previous</button>
        <div class="spacer"></div>
        <button class="btn" onclick="navNext()">${(idx === total - 1) ? 'Go to Section B →' : 'Next →'}</button>
      </div>
    </div>
  `;
}

function renderMTQ(main) {
  const mtq = currentQ();
  const idx = state.currentIdx;
  const total = totalMtqs();
  const ans = state.answers[mtq.qId] || {};

  const partsHtml = mtq.parts.map(p => {
    const v = ans[p.part];
    let inner = '';
    if (p.questionType === 'number') {
      inner = `<div class="num-input-wrap">
        <span class="prefix">${p.prefix || '$'}</span>
        <input type="text" inputmode="decimal" class="num-input" placeholder="Your answer"
          value="${escapeHtml(v || '')}"
          oninput="setMtqAnswer('${mtq.qId}', '${p.part}', this.value)">
      </div>`;
    } else if (p.questionType === 'mcq') {
      inner = `<div class="opt-list">` + p.options.map(o => {
        const selected = v === o.letter;
        return `<label class="opt-row ${selected ? 'selected' : ''}">
          <input type="radio" name="opt_${mtq.qId}_${p.part}" value="${o.letter}" ${selected ? 'checked' : ''} onchange="setMtqAnswer('${mtq.qId}', '${p.part}', this.value)">
          <span class="text"><span class="letter">${o.letter}.</span> ${escapeHtml(o.text)}</span>
        </label>`;
      }).join('') + `</div>`;
    } else if (p.questionType === 'multi') {
      const arr = Array.isArray(v) ? v : [];
      const need = p.expectedSelectCount || 2;
      inner = `<div style="margin-bottom:8px;font-size:11px;color:var(--text-muted)">Select ${need}.</div>
      <div class="opt-list">` + p.options.map(o => {
        const checked = arr.includes(o.letter);
        return `<label class="opt-row ${checked ? 'selected' : ''}">
          <input type="checkbox" value="${o.letter}" ${checked ? 'checked' : ''} onchange="toggleMtqMulti('${mtq.qId}', '${p.part}', this.value)">
          <span class="text"><span class="letter">${o.letter}.</span> ${escapeHtml(o.text)}</span>
        </label>`;
      }).join('') + `</div>`;
    }
    return `<div class="mtq-part">
      <div class="mtq-part-header">
        <div class="mtq-part-label">Part ${p.part}</div>
        <div class="mtq-part-marks">${p.marks} marks</div>
      </div>
      <div class="mtq-part-prompt">${escapeHtml(p.prompt)}</div>
      ${inner}
    </div>`;
  }).join('');

  main.innerHTML = `
    <div class="mtq-card">
      <div class="q-meta-bar">
        <div class="q-num">Section B · MTQ ${idx + 1} of ${total}</div>
        <div class="q-meta-right">
          <span class="q-marks-badge">${mtq.totalMarks} marks</span>
        </div>
      </div>
      <div class="mtq-title">${escapeHtml(mtq.title)}</div>
      ${mtq.scenario ? `<div class="q-scenario${mtq.scenarioHtml ? ' q-scenario-rich' : ''}">${mtq.scenarioHtml || escapeHtml(mtq.scenario)}</div>` : ''}
      <div class="mtq-working">
        <div class="mtq-working-label">Working notes (your scratch — not marked)</div>
        <textarea oninput="setMtqWorking('${mtq.qId}', this.value)" placeholder="Write your workings here...">${escapeHtml(state.mtqWorking[mtq.qId] || '')}</textarea>
      </div>
      ${partsHtml}
      <div class="nav-bar">
        <button class="btn btn-secondary" onclick="navPrev()">← Previous</button>
        <div class="spacer"></div>
        ${(idx === total - 1)
          ? `<button class="btn btn-success" onclick="openReview()">Review &amp; submit →</button>`
          : `<button class="btn" onclick="navNext()">Next MTQ →</button>`
        }
      </div>
    </div>
  `;
}

// ---- Input handlers ----
function setAnswer(qId, val) {
  state.answers[qId] = val;
  saveAttempt();
  renderNav();
}
function toggleMulti(qId, letter) {
  const arr = state.answers[qId] = Array.isArray(state.answers[qId]) ? state.answers[qId] : [];
  const i = arr.indexOf(letter);
  if (i >= 0) arr.splice(i, 1); else arr.push(letter);
  saveAttempt();
  renderNav();
  renderCurrentQuestion();
}
function setMtqAnswer(mtqId, part, val) {
  if (!state.answers[mtqId]) state.answers[mtqId] = {};
  state.answers[mtqId][part] = val;
  saveAttempt();
  renderNav();
}
function toggleMtqMulti(mtqId, part, letter) {
  if (!state.answers[mtqId]) state.answers[mtqId] = {};
  const arr = state.answers[mtqId][part] = Array.isArray(state.answers[mtqId][part]) ? state.answers[mtqId][part] : [];
  const i = arr.indexOf(letter);
  if (i >= 0) arr.splice(i, 1); else arr.push(letter);
  saveAttempt();
  renderNav();
  renderCurrentQuestion();
}
function setMtqWorking(mtqId, val) {
  state.mtqWorking[mtqId] = val;
  saveAttempt();
}
function toggleFlag(qId) {
  state.flags[qId] = !state.flags[qId];
  if (!state.flags[qId]) delete state.flags[qId];
  saveAttempt();
  renderNav();
  renderCurrentQuestion();
}
function toggleGuessed(qId) {
  state.guessed[qId] = !state.guessed[qId];
  if (!state.guessed[qId]) delete state.guessed[qId];
  saveAttempt();
  renderCurrentQuestion();
}

function navPrev() {
  if (state.currentSection === 'B') {
    if (state.currentIdx > 0) state.currentIdx--;
    else { state.currentSection = 'A'; state.currentIdx = totalQsA() - 1; }
  } else if (state.currentIdx > 0) {
    state.currentIdx--;
  }
  saveAttempt();
  renderNav();
  renderCurrentQuestion();
  window.scrollTo({ top: 0 });
}
function navNext() {
  if (state.currentSection === 'A') {
    if (state.currentIdx < totalQsA() - 1) state.currentIdx++;
    else { state.currentSection = 'B'; state.currentIdx = 0; }
  } else if (state.currentIdx < totalMtqs() - 1) {
    state.currentIdx++;
  }
  saveAttempt();
  renderNav();
  renderCurrentQuestion();
  window.scrollTo({ top: 0 });
}

// ---- Review screen ----
function openReview() {
  const pool = POOLS[state.pool];
  let answeredA = 0, flaggedA = 0;
  pool.questions.forEach(q => {
    if (isQuestionAnswered(q)) answeredA++;
    if (state.flags[q.qId]) flaggedA++;
  });
  let mtqDone = 0, mtqTotal = 0;
  pool.mtqs.forEach(m => { mtqTotal += m.parts.length; mtqDone += mtqPartsAnswered(m); });

  const skippedA = pool.questions.length - answeredA;
  const skippedMtq = mtqTotal - mtqDone;
  const skippedAny = skippedA + skippedMtq;

  view().innerHTML = `
    <div class="card">
      <h2 style="font-size:22px;color:var(--primary-dark);margin-bottom:6px">Pre-submit review</h2>
      <p style="color:var(--text-muted);margin-bottom:18px">Time remaining: <strong>${fmtTime(state.timeRemaining)}</strong> · You can still go back and change answers.</p>

      <div class="review-summary">
        <div class="review-stat">
          <div class="review-stat-num">${answeredA}/${pool.questions.length}</div>
          <div class="review-stat-label">Section A answered</div>
        </div>
        <div class="review-stat">
          <div class="review-stat-num">${mtqDone}/${mtqTotal}</div>
          <div class="review-stat-label">MTQ parts answered</div>
        </div>
        <div class="review-stat">
          <div class="review-stat-num">${flaggedA}</div>
          <div class="review-stat-label">Flagged for review</div>
        </div>
        <div class="review-stat">
          <div class="review-stat-num" style="color:${skippedAny ? 'var(--danger)' : 'var(--success)'}">${skippedAny}</div>
          <div class="review-stat-label">Unanswered</div>
        </div>
      </div>

      ${skippedAny > 0 ? `
        <div style="background:var(--warning-light);border-left:3px solid var(--warning);padding:12px 14px;border-radius:0 6px 6px 0;margin-bottom:16px;font-size:13px;color:var(--text-primary)">
          <strong>${skippedAny} question${skippedAny > 1 ? 's' : ''} not answered.</strong> Unanswered questions score zero. Consider attempting them — even a guess gives you 25% chance on MCQ.
        </div>
      ` : `
        <div style="background:var(--success-light);border-left:3px solid var(--success);padding:12px 14px;border-radius:0 6px 6px 0;margin-bottom:16px;font-size:13px">
          ✓ All questions answered. Good.
        </div>
      `}

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
        <button class="btn btn-secondary" onclick="jumpTo('A', 0)">← Back to Section A</button>
        <button class="btn btn-secondary" onclick="jumpTo('B', 0)">Back to Section B</button>
        <div class="spacer"></div>
        <button class="btn btn-success btn-lg" onclick="confirmSubmit()">Submit attempt</button>
      </div>
    </div>
  `;
  window.scrollTo({ top: 0 });
}

function confirmSubmit() {
  showModal(`
    <h2>Submit attempt?</h2>
    <p>Your answers will be locked and marked. Time taken will be recorded. This can't be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel · keep working</button>
      <button class="btn btn-success" onclick="closeModal(); finalizeSubmission(false);">Submit now</button>
    </div>
  `);
}

// ---- Marking ----
function markOT(q, ans) {
  // Returns { correct: bool, earned: int }
  if (q.questionType === 'mcq') {
    if (!ans) return { correct: false, earned: 0 };
    return { correct: ans === q.correctAnswer, earned: ans === q.correctAnswer ? q.marks : 0 };
  }
  if (q.questionType === 'multi') {
    const arr = Array.isArray(ans) ? ans : [];
    const correctSet = new Set(q.correctOptions || []);
    const userSet = new Set(arr);
    const exact = correctSet.size === userSet.size && [...correctSet].every(x => userSet.has(x));
    return { correct: exact, earned: exact ? q.marks : 0 };
  }
  if (q.questionType === 'number') {
    const num = parseFloat(String(ans).replace(/,/g, ''));
    if (isNaN(num)) return { correct: false, earned: 0 };
    const tol = q.tol != null ? q.tol : 1;
    const ok = Math.abs(num - q.numAns) <= tol;
    return { correct: ok, earned: ok ? q.marks : 0 };
  }
  return { correct: false, earned: 0 };
}

function markMTQPart(p, ans) {
  if (p.questionType === 'number') {
    const num = parseFloat(String(ans).replace(/,/g, ''));
    if (isNaN(num)) return { correct: false, earned: 0 };
    const tol = p.tol != null ? p.tol : 1;
    const ok = Math.abs(num - p.numAns) <= tol;
    return { correct: ok, earned: ok ? p.marks : 0 };
  }
  if (p.questionType === 'mcq') {
    if (!ans) return { correct: false, earned: 0 };
    return { correct: ans === p.correctAnswer, earned: ans === p.correctAnswer ? p.marks : 0 };
  }
  if (p.questionType === 'multi') {
    const arr = Array.isArray(ans) ? ans : [];
    const correctSet = new Set(p.correctOptions || []);
    const userSet = new Set(arr);
    const exact = correctSet.size === userSet.size && [...correctSet].every(x => userSet.has(x));
    return { correct: exact, earned: exact ? p.marks : 0 };
  }
  return { correct: false, earned: 0 };
}

function finalizeSubmission(timedOut) {
  if (!state || state.submitted) return;
  stopTimer();
  state.submitted = true;
  state.completedAt = new Date().toISOString();
  state.timedOut = !!timedOut;

  // Build per-question results and section scores
  const pool = POOLS[state.pool];
  const questionResults = [];

  let sectionAScore = 0, sectionAPossible = 0;
  pool.questions.forEach(q => {
    const ans = state.answers[q.qId];
    const { correct, earned } = markOT(q, ans);
    sectionAScore += earned;
    sectionAPossible += q.marks;
    questionResults.push({
      qId: q.qId,
      displayIdx: q.displayIdx,
      section: 'A',
      subTopic: q.subTopic,
      difficulty: q.difficulty,
      questionType: q.questionType,
      marks: q.marks,
      earned,
      correct,
      userAnswer: formatUserAnswer(q.questionType, ans),
      correctAnswer: q.correctAnswer,
      guessed: !!state.guessed[q.qId],
      flagged: !!state.flags[q.qId],
      timeIdeal: q.timeIdeal || 0,
      timeSpent: 0  // not tracked per-question; could enhance later
    });
  });

  let sectionBScore = 0, sectionBPossible = 0;
  pool.mtqs.forEach(mtq => {
    const partResults = [];
    let mtqEarned = 0;
    mtq.parts.forEach(p => {
      const ans = (state.answers[mtq.qId] || {})[p.part];
      const { correct, earned } = markMTQPart(p, ans);
      mtqEarned += earned;
      sectionBScore += earned;
      sectionBPossible += p.marks;
      partResults.push({
        part: p.part,
        marks: p.marks,
        earned,
        correct,
        questionType: p.questionType,
        userAnswer: formatUserAnswer(p.questionType, ans),
        correctAnswer: p.correctAnswer || (p.numAns != null ? String(p.numAns) : '')
      });
      // Also push each part as a "question" for dashboard sub-topic analysis
      questionResults.push({
        qId: mtq.qId + '_' + p.part,
        displayIdx: mtq.displayIdx + ' ' + p.part,
        section: 'B',
        subTopic: mtq.subTopic,
        difficulty: 'hard',
        questionType: p.questionType,
        marks: p.marks,
        earned,
        correct,
        userAnswer: formatUserAnswer(p.questionType, ans),
        correctAnswer: p.correctAnswer || (p.numAns != null ? String(p.numAns) : ''),
        guessed: false,
        flagged: false,
        isMtqPart: true,
        mtqTitle: mtq.title
      });
    });
    state._mtqResults = state._mtqResults || {};
    state._mtqResults[mtq.qId] = { partResults, totalEarned: mtqEarned, totalPossible: mtq.totalMarks };
  });

  state.totalScore = sectionAScore + sectionBScore;
  state.totalPossible = sectionAPossible + sectionBPossible;
  state.totalMarks = state.totalPossible;
  state.sectionAScore = sectionAScore;
  state.sectionAPossible = sectionAPossible;
  state.sectionBScore = sectionBScore;
  state.sectionBPossible = sectionBPossible;
  state.questions = questionResults;
  state.pct = state.totalPossible ? (state.totalScore / state.totalPossible) * 100 : 0;
  state.grade = state.pct >= PASS_MARK_PCT ? 'PASS' : 'FAIL';

  // Save to history
  const hist = loadHistory();
  hist[state.pool] = hist[state.pool] || [];
  hist[state.pool].push({
    attemptNum: state.attemptNum,
    completedAt: state.completedAt,
    totalScore: state.totalScore,
    totalPossible: state.totalPossible,
    pct: state.pct,
    grade: state.grade,
    timeUsed: TIME_LIMIT_SEC - state.timeRemaining
  });
  saveHistory(hist);

  // Clear in-progress attempt slot
  clearAttempt(state.pool);

  // Queue sync to dashboard
  queueDashboardSync(state);

  if (!timedOut) renderResults();
}

function formatUserAnswer(type, ans) {
  if (ans == null || ans === '') return '';
  if (type === 'multi') return Array.isArray(ans) ? ans.join(',') : String(ans);
  return String(ans);
}

// ---- Results view ----
function renderResults() {
  const pool = POOLS[state.pool];
  const gradeClass = state.grade === 'PASS' ? 'pass' : 'fail';
  const subTopicStats = computeSubTopicStats();

  $('#timer-pill').classList.add('hidden');
  $('#header-subtitle').textContent = `Master Test · Attempt #${state.attemptNum} · ${state.grade}`;

  // Question result rows (Section A)
  const otRows = pool.questions.map(q => renderResultRow(q, false)).join('');
  // MTQ result rows
  const mtqRows = pool.mtqs.map(mtq => renderMtqResultRow(mtq)).join('');

  view().innerHTML = `
    <!-- Print-only header (visible only when printing mistakes) -->
    <div class="print-only" style="border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:14px">
      <h2 style="font-size:18pt;margin-bottom:4px;color:#003d6b">FA · Cash Flow (IAS 7) — Mistakes for Revision</h2>
      <div style="font-size:10pt;color:#555;line-height:1.6">
        <strong>Master Test</strong> · Attempt #${state.attemptNum} ·
        Score: <strong>${state.totalScore}/${state.totalPossible} (${state.pct.toFixed(1)}%)</strong> ·
        ${state.grade} ·
        Completed ${new Date(state.completedAt).toLocaleString()} ·
        Time used ${fmtTime(TIME_LIMIT_SEC - state.timeRemaining)}
      </div>
      <div style="font-size:9pt;color:#888;margin-top:4px">
        This document shows only the questions you got wrong or skipped, with full deeper explanations for revision.
      </div>
    </div>

    <div class="card no-print" style="text-align:center;padding:32px">
      <div class="grade-pill ${gradeClass}">${state.grade}</div>
      <div class="score-display">${state.totalScore}<small>/${state.totalPossible}</small></div>
      <div class="score-pct">${state.pct.toFixed(1)}% · Pass mark ${PASS_MARK_PCT}%</div>
      <div style="margin-top:8px;color:var(--text-muted);font-size:13px">
        Master Test · Attempt #${state.attemptNum} · Time used ${fmtTime(TIME_LIMIT_SEC - state.timeRemaining)}${state.timedOut ? ' (timed out)' : ''}
      </div>
      <div class="metric-grid">
        <div class="metric-card">
          <div class="metric-num">${state.sectionAScore}/${state.sectionAPossible}</div>
          <div class="metric-label">Section A (OT)</div>
        </div>
        <div class="metric-card">
          <div class="metric-num">${state.sectionBScore}/${state.sectionBPossible}</div>
          <div class="metric-label">Section B (MTQ)</div>
        </div>
        <div class="metric-card">
          <div class="metric-num">${state.questions.filter(q => q.section === 'A' && q.correct).length}</div>
          <div class="metric-label">OT correct</div>
        </div>
        <div class="metric-card">
          <div class="metric-num">${state.questions.filter(q => q.section === 'A' && q.userAnswer === '').length}</div>
          <div class="metric-label">OT skipped</div>
        </div>
      </div>
      <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-success" onclick="printMistakes()">🖨️ Print mistakes (PDF)</button>
        <button class="btn" onclick="manualSync()">📊 Sync to Dashboard</button>
        <button class="btn btn-secondary" onclick="openDashboard()">Open Dashboard</button>
        <button class="btn btn-secondary" onclick="downloadAttempts()">⬇️ Download JSON</button>
        <button class="btn btn-secondary" onclick="goHome()">← Home</button>
      </div>
    </div>

    <div class="card no-print">
      <div class="card-title">Sub-topic performance</div>
      <div class="card-subtitle">Use this to identify weak areas. Green ≥70%, amber 50-69%, red &lt;50%.</div>
      ${subTopicStats.map(s => {
        const cls = s.pct >= 70 ? '' : s.pct >= 50 ? 'medium' : 'weak';
        return `<div class="subtopic-bar ${cls}">
          <div>
            <div class="label">${escapeHtml(s.name)}</div>
            <div class="meter"><div class="fill" style="width:${s.pct}%"></div></div>
          </div>
          <div class="pct">${s.earned}/${s.marks} · ${s.pct.toFixed(0)}%</div>
        </div>`;
      }).join('')}
    </div>

    <div class="card">
      <div class="card-title">Section A · Question-by-question review</div>
      <div class="card-subtitle no-print">Tap any question for the full 6-layer explanation. Marked-as-guess questions are highlighted in the dashboard's Review tab.</div>
      ${otRows}
    </div>

    <div class="card">
      <div class="card-title">Section B · MTQ review</div>
      <div class="card-subtitle no-print">Each MTQ shows your answer vs the correct answer for every part, plus the model working.</div>
      ${mtqRows}
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function computeSubTopicStats() {
  const map = {};
  state.questions.forEach(q => {
    if (!map[q.subTopic]) map[q.subTopic] = { name: q.subTopic, marks: 0, earned: 0 };
    map[q.subTopic].marks += q.marks;
    map[q.subTopic].earned += q.earned;
  });
  return Object.values(map).map(s => ({ ...s, pct: s.marks ? s.earned / s.marks * 100 : 0 }))
    .sort((a, b) => a.pct - b.pct);
}

function renderResultRow(q, _) {
  const qr = state.questions.find(x => x.qId === q.qId);
  if (!qr) return '';
  let cls = qr.correct ? 'correct' : (qr.userAnswer === '' ? 'skip' : 'wrong');
  let summary = '';
  if (q.questionType === 'mcq') summary = `Your: <strong>${qr.userAnswer || '—'}</strong> · Correct: <strong>${qr.correctAnswer}</strong>`;
  else if (q.questionType === 'multi') summary = `Your: <strong>${qr.userAnswer || '—'}</strong> · Correct: <strong>${(q.correctOptions || []).join(',')}</strong>`;
  else summary = `Your: <strong>${qr.userAnswer || '—'}</strong> · Correct: <strong>${q.prefix || '$'}${q.numAns.toLocaleString()}</strong>`;

  return `<div class="result-q ${cls}" id="rq_${q.qId}">
    <div class="result-q-header" onclick="document.getElementById('rq_${q.qId}').classList.toggle('expanded')">
      <div class="result-q-left">
        <div class="result-q-num">Q${q.displayIdx}</div>
        <div class="result-q-summary">${summary}</div>
      </div>
      <div class="result-q-tags">
        <span class="result-q-tag diff-${q.difficulty}">${q.difficulty}</span>
        <span class="result-q-tag">${escapeHtml(q.subTopic)}</span>
        ${qr.guessed ? '<span class="result-q-tag" style="color:var(--neutral)">guessed</span>' : ''}
        ${qr.flagged ? '<span class="result-q-tag" style="color:var(--warning)">flagged</span>' : ''}
      </div>
      <div class="result-q-marks ${qr.correct ? 'correct' : 'wrong'}">${qr.earned}/${q.marks}</div>
    </div>
    <div class="result-q-body">
      ${q.scenario ? `<div class="expl-section"><div class="expl-label">Scenario</div><div class="q-scenario${q.scenarioHtml ? ' q-scenario-rich' : ''}" style="margin:0">${q.scenarioHtml || escapeHtml(q.scenario)}</div></div>` : ''}
      <div class="expl-section"><div class="expl-label">Question</div><div class="expl-content">${escapeHtml(q.questionText)}</div></div>
      ${q.questionType !== 'number' ? renderOptionsReview(q, qr) : ''}
      <div class="expl-section"><div class="expl-label">Layer 1 · Concept</div><div class="expl-content">${escapeHtml(q.explanationLayer1)}</div></div>
      <div class="expl-section"><div class="expl-label">Layer 2 · Working</div><div class="expl-content working">${escapeHtml(q.workingShown)}</div></div>
      <div class="expl-section"><div class="expl-label">Layer 3 · IFRS reference</div><div class="expl-content">${escapeHtml(q.explanationLayer3)}</div></div>
      <div class="expl-section"><div class="expl-label">Layer 4 · Examiner's note</div><div class="expl-content">${escapeHtml(q.examinerNote)}</div></div>
      <div class="expl-section"><div class="expl-label">Layer 5 · Teacher's commentary</div><div class="expl-content">${escapeHtml(q.teacherCommentary)}</div></div>
      ${q.advancedContext ? `<div class="expl-section"><div class="expl-label">Layer 6 · Interlinking / FR preview</div><div class="expl-content">${escapeHtml(q.advancedContext)}</div></div>` : ''}
    </div>
  </div>`;
}

function renderOptionsReview(q, qr) {
  let html = `<div class="expl-section"><div class="expl-label">Option-by-option</div>`;
  q.options.forEach(o => {
    const userSelected = q.questionType === 'multi'
      ? (qr.userAnswer || '').split(',').includes(o.letter)
      : qr.userAnswer === o.letter;
    let cls = '';
    if (o.correct) cls += ' correct';
    if (userSelected) cls += ' user-selected';
    if (userSelected && !o.correct) cls += ' wrong';
    html += `<div class="opt-result${cls}">
      <span class="letter">${o.letter}.</span> ${escapeHtml(o.text)}
      <div class="why">${escapeHtml(o.why)}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderMtqResultRow(mtq) {
  const mres = (state._mtqResults || {})[mtq.qId];
  if (!mres) return '';
  const cls = mres.totalEarned === mres.totalPossible ? 'correct' : (mres.totalEarned === 0 ? 'wrong' : '');
  const partsHtml = mtq.parts.map(p => {
    const pr = mres.partResults.find(x => x.part === p.part);
    if (!pr) return '';
    return `<div style="border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:10px;background:var(--bg-card)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div><strong>Part ${p.part}</strong> · ${escapeHtml(p.prompt.slice(0, 90))}${p.prompt.length > 90 ? '…' : ''}</div>
        <div style="font-weight:700;color:${pr.correct ? 'var(--success)' : 'var(--danger)'}">${pr.earned}/${p.marks}</div>
      </div>
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">
        Your answer: <strong>${escapeHtml(pr.userAnswer || '—')}</strong> · Correct: <strong>${escapeHtml(p.questionType === 'number' ? (p.prefix || '$') + p.numAns.toLocaleString() : pr.correctAnswer)}</strong>
      </div>
      <details>
        <summary style="cursor:pointer;font-size:12px;color:var(--primary);font-weight:500">Show model answer &amp; workings</summary>
        <div class="expl-content working" style="margin-top:8px">${escapeHtml(p.modelAnswer)}</div>
      </details>
    </div>`;
  }).join('');

  return `<div class="result-q ${cls}" id="rmtq_${mtq.qId}" style="background:var(--bg-card)">
    <div class="result-q-header" onclick="document.getElementById('rmtq_${mtq.qId}').classList.toggle('expanded')">
      <div class="result-q-left">
        <div class="result-q-num">MTQ ${mtq.displayIdx - 40}</div>
        <div class="result-q-summary"><strong>${escapeHtml(mtq.title.slice(0, 80))}${mtq.title.length > 80 ? '…' : ''}</strong></div>
      </div>
      <div class="result-q-marks ${mres.totalEarned === mres.totalPossible ? 'correct' : (mres.totalEarned === 0 ? 'wrong' : '')}">${mres.totalEarned}/${mres.totalPossible}</div>
    </div>
    <div class="result-q-body">
      ${mtq.scenario ? `<div class="expl-section"><div class="expl-label">Scenario</div><div class="q-scenario${mtq.scenarioHtml ? ' q-scenario-rich' : ''}" style="margin:0">${mtq.scenarioHtml || escapeHtml(mtq.scenario)}</div></div>` : ''}
      ${state.mtqWorking[mtq.qId] ? `<div class="expl-section"><div class="expl-label">Your working notes</div><div class="expl-content working">${escapeHtml(state.mtqWorking[mtq.qId])}</div></div>` : ''}
      ${partsHtml}
      <div class="expl-section"><div class="expl-label">Examiner's note</div><div class="expl-content">${escapeHtml(mtq.examinerNote)}</div></div>
      <div class="expl-section"><div class="expl-label">Teacher's commentary</div><div class="expl-content">${escapeHtml(mtq.teacherCommentary)}</div></div>
    </div>
  </div>`;
}

// ---- Sync to dashboard ----
function buildAttemptJSON(s) {
  // Schema matches dashboard's expected single-topic attempt format
  return {
    topic: TOPIC_NAME,
    attempts: [{
      poolName: s.pool,
      attemptNum: s.attemptNum,
      startedAt: s.startedAt,
      completedAt: s.completedAt,
      totalScore: s.totalScore,
      totalPossible: s.totalPossible,
      totalMarks: s.totalMarks,
      sectionAScore: s.sectionAScore,
      sectionAPossible: s.sectionAPossible,
      sectionBScore: s.sectionBScore,
      sectionBPossible: s.sectionBPossible,
      timeUsed: TIME_LIMIT_SEC - s.timeRemaining,
      timedOut: !!s.timedOut,
      grade: s.grade,
      pct: s.pct,
      questions: s.questions,
      schemaVersion: 3
    }]
  };
}

function queueDashboardSync(s) {
  try {
    const queue = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]');
    queue.push(buildAttemptJSON(s));
    localStorage.setItem(PENDING_KEY, JSON.stringify(queue));
  } catch (e) {
    console.error('Sync queue failed', e);
  }
}

function manualSync() {
  // Re-queue everything in history that isn't already pending
  const hist = loadHistory();
  let count = 0;
  ['M'].forEach(pool => {
    (hist[pool] || []).forEach(h => {
      // For manual resync from summary history we have only basic data — but if state matches latest, push the full one.
      // To support full re-sync we'd need to keep full attempt details. For now, just inform user.
    });
  });
  // The current `state` if just-submitted is already queued. For history-only re-sync we'd need fuller data.
  toast('Sync queued. Open dashboard to import.', 'success');
}

function openDashboard() {
  window.open(DASHBOARD_URL, '_blank');
}

function downloadAttempts() {
  const hist = loadHistory();
  const out = { topic: TOPIC_NAME, history: hist, schemaVersion: 3 };
  // Include last completed full attempt if available
  if (state && state.submitted) {
    out.lastAttempt = buildAttemptJSON(state);
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `cash_flow_attempts_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function confirmClearHistory() {
  showModal(`
    <h2>Clear local history?</h2>
    <p>This wipes all stored Cash Flow attempts and in-progress drafts on THIS device. The dashboard's stored data is unaffected (sync there separately).</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="doClearHistory()">Clear all</button>
    </div>
  `);
}
function doClearHistory() {
  Object.keys(localStorage).filter(k => k.startsWith(STORAGE_PREFIX)).forEach(k => localStorage.removeItem(k));
  closeModal();
  toast('History cleared', 'warn');
  renderHome();
}

function printMistakes() {
  // Add class to body to scope @media print rules
  document.body.classList.add('printing-mistakes');
  // Expand all non-correct result-q items so explanations are visible
  document.querySelectorAll('.result-q').forEach(el => {
    if (!el.classList.contains('correct')) el.classList.add('expanded');
  });
  // Cleanup after print dialog closes
  const cleanup = () => {
    document.body.classList.remove('printing-mistakes');
    document.querySelectorAll('.result-q.expanded').forEach(el => el.classList.remove('expanded'));
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  // Small delay so DOM updates flush before print
  setTimeout(() => window.print(), 150);
}

// ---- Boot ----
window.addEventListener('DOMContentLoaded', () => {
  renderHome();
  // Click on backdrop to close modal
  $('#modal-backdrop').addEventListener('click', e => {
    if (e.target.id === 'modal-backdrop') closeModal();
  });
});


</script>
