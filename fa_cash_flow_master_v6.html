0", "correct": false, "why": "'Wrong-direction accrual' error. Deducted the 750 fall. A FALLING accrual means you cleared old liabilities, so cash paid is higher, not lower."}, {"letter": "D", "text": "$11,000", "correct": false, "why": "'Added the opening accrual instead of the movement' error. 9,500 + 1,500 = 11,000 ignores the closing accrual entirely."}], "correctAnswer": "A", "explanationLayer1": "Cash to employees = wages expense adjusted for the movement in the wages accrual. Falling accrual = cash paid exceeds the expense (you paid this year's wages plus part of last year's owing).", "workingShown": "Wages accrual account:\n          $                        $\nCash (B) 10,250    Bal b/f        1,500\nBal c/f     750    Wages expense  9,500\n         ------                  ------\n         11,000                  11,000\n\nCash to employees = 9,500 + (1,500 - 750) = 10,250", "explanationLayer3": "IAS 7 para 18(a)/19: cash paid to and on behalf of employees is a gross operating cash payment disclosed under the direct method.", "examinerNote": "Same accrual mechanic as interest and tax paid — the wages accrual T-account. A falling accrual adds to cash paid. The examiner reuses one technique (the accrual account) across wages, interest and tax.", "teacherCommentary": "Concept: the expense and the cash differ by the accrual movement. Process: open the accrual account, balance for cash. Everyday: you ran up 9,500 of wages and also cleared 750 of last year's unpaid wages, so 10,250 actually left.", "advancedContext": "Wages, interest and tax all share the identical b/f + charge - c/f engine. Recognising that one pattern covers three different line items is the efficiency the examiner rewards under time pressure."}, {"qId": "CF_Q21", "displayIdx": 21, "type": "ot", "questionType": "number", "subTopic": "Direct method (net operating cash)", "difficulty": "hard", "marks": 2, "timeIdeal": 160, "prefix": "$", "numAns": 85000, "tol": 5, "scenario": "Aldermoor Co had the following information for the year ended 30 June 20X8:\n\n                                       $\nOperating profit                    375,000\nCash receipts from customers        410,000\nCash paid to suppliers              180,000\nCash paid to employees              120,000\nInterest paid                        12,000\nIncome taxes paid                    13,000\nIncrease in trade receivables        15,000\nIncrease in inventories               4,000\nDecrease in trade payables            5,000", "questionText": "What amount should be shown for net cash from operating activities using the direct method? Give your answer in $ as a whole number.", "explanationLayer1": "The direct method sums the actual operating cash flows: receipts from customers, less payments to suppliers, employees, interest and tax. The profit figure and the working-capital movements are NOT used — those cash effects are already captured inside the cash figures given.", "workingShown": "Cash receipts from customers       410,000\nCash paid to suppliers            (180,000)\nCash paid to employees            (120,000)\nInterest paid                      (12,000)\nIncome taxes paid                  (13,000)\n                                  --------\nNet cash from operating activities  85,000", "explanationLayer3": "IAS 7 para 18(a): the direct method discloses major classes of gross cash receipts and payments. Both methods (direct/indirect) give the SAME net operating cash (para 19).", "examinerNote": "The operating profit (375,000) and the three working-capital movements are deliberate distractors. Under the direct method you use the actual cash lines only — mixing in indirect-method adjustments double-counts. Ignore the noise.", "teacherCommentary": "Concept: direct method = add up the real cash in and out. Process: receipts minus all the cash payments; stop. Everyday: it's your bank statement — money in from customers, money out to suppliers, staff, lender and HMRC.", "advancedContext": "The receivables/inventory/payables movements would matter if you were RECONSTRUCTING the cash figures (as in Q18-Q20), but here they're already done. Spotting that the cash figures supersede the accruals data saves time — directly addressing your Section A timing weakness."}, {"qId": "CF_Q22", "displayIdx": 22, "type": "ot", "questionType": "mcq", "subTopic": "Operating profit (reverse calc)", "difficulty": "hard", "marks": 2, "timeIdeal": 165, "scenario": "Calverton Co provided the following extracts from its statement of financial position ($000):\n\n                          20X7        20X6\nAccumulated profits      82,000      72,000\n10% Loan notes           40,000      30,000\nTax payable              15,000      12,000\nDividends payable         1,600       1,200\n\nAll dividends were declared and proposed before the year end. There was no under/over-provision for tax in the year. No interim dividends were paid. The additional 10% loan notes were issued on 1 January 20X7.", "questionText": "What is Calverton Co's operating profit (profit before interest and tax) for the year ended 31 December 20X7?", "options": [{"letter": "A", "text": "$30,600", "correct": true, "why": "CORRECT. Work back: RE movement 10,000 + dividend 1,600 + tax 15,000 + interest (10% x 40,000 = 4,000) = 30,600."}, {"letter": "B", "text": "$29,600", "correct": false, "why": "'Interest on opening loan notes' error. Used 10% x 30,000 = 3,000. The loan notes were issued on 1 January (the first day), so a full year's interest accrues on 40,000 = 4,000."}, {"letter": "C", "text": "$26,600", "correct": false, "why": "'Finance cost omitted' error. Stopped at PBT and never added back the 4,000 interest to reach operating profit (PBIT)."}, {"letter": "D", "text": "$29,400", "correct": false, "why": "'Dividend movement instead of full dividend' error. Used the 400 change in dividends payable rather than the 1,600 dividend charged to retained earnings."}], "correctAnswer": "A", "explanationLayer1": "Reverse-engineer operating profit by climbing back up the income statement: start from the RE movement, add back the dividend charged, then the tax charge, then the interest charge.", "workingShown": "RE movement = 82,000 - 72,000        = 10,000  (= PAT - dividend)\nAdd dividend charged to RE            =  1,600  -> PAT = 11,600\nAdd tax charge                        = 15,000  -> PBT = 26,600\nAdd interest (10% x 40,000)           =  4,000  -> PBIT = 30,600", "explanationLayer3": "Built on the retained-earnings reconciliation (dividends, IAS 7 para 31) plus finance-cost and tax add-backs to rebuild PBIT — the starting point IAS 7 para 20 uses for the indirect method.", "examinerNote": "Two precision traps: (1) interest is on the FULL-YEAR balance because the notes were issued on day one (1 Jan); (2) the dividend charged to RE is the full declared amount (1,600), not the 400 balance movement. The examiner tests whether you read the timing and the source of each figure.", "teacherCommentary": "Concept: each layer of the income statement leaves a footprint in the SOFP. Process: RE move, add dividend, add tax, add interest. Everyday: profit that didn't stay in reserves went out as dividend; profit consumed by tax and interest must be added back to find the trading result.", "advancedContext": "This reverse build is the hardest cash-flow sub-skill and a frequent Section A discriminator. The same climb (PAT -> PBT -> PBIT) underpins ratio analysis in the Interpretation chapter and FR.", "scenarioHtml": "<div style=\"white-space:pre-wrap\">Calverton Co provided the following extracts from its statement of financial position ($000):</div><table class=\"fin-table\"><thead><tr><th class=\"lbl\"></th><th>20X7</th><th>20X6</th></tr></thead><tbody><tr><td class=\"lbl\">Accumulated profits</td><td class=\"num\">82,000</td><td class=\"num\">72,000</td></tr><tr><td class=\"lbl\">10% Loan notes</td><td class=\"num\">40,000</td><td class=\"num\">30,000</td></tr><tr><td class=\"lbl\">Tax payable</td><td class=\"num\">15,000</td><td class=\"num\">12,000</td></tr><tr><td class=\"lbl\">Dividends payable</td><td class=\"num\">1,600</td><td class=\"num\">1,200</td></tr></tbody></table><div style=\"white-space:pre-wrap;margin-top:8px\">All dividends were declared and proposed before the year end. There was no under/over-provision for tax in the year. No interim dividends were paid. The additional 10% loan notes were issued on 1 January 20X7.</div>"}, {"qId": "CF_Q23", "displayIdx": 23, "type": "ot", "questionType": "mcq", "subTopic": "PBT (reverse calc)", "difficulty": "hard", "marks": 2, "timeIdeal": 165, "scenario": "During its last financial year, Denholm Co's bank balance increased by $750,000. In the same period it issued shares raising $1,000,000 and repaid a loan of $750,000. It purchased property, plant and equipment for $200,000 and charged depreciation of $100,000. Receivables and inventory together increased by $575,000.", "questionText": "What was the profit before tax for the year?", "options": [{"letter": "A", "text": "$1,175,000", "correct": true, "why": "CORRECT. Operating cash = 750,000 - financing 250,000 - investing (-200,000) = 700,000. PBT = 700,000 - dep 100,000 + WC increase 575,000 = 1,175,000."}, {"letter": "B", "text": "$1,275,000", "correct": false, "why": "'Depreciation omitted' error. Failed to remove the 100,000 depreciation when working back from operating cash to PBT."}, {"letter": "C", "text": "$1,375,000", "correct": false, "why": "'Depreciation added not removed' error. Added 100,000 instead of subtracting it on the way back to PBT (depreciation was an add-back going forward, so reverse it going back)."}, {"letter": "D", "text": "$775,000", "correct": false, "why": "'Investing sign error' error. Treated the PPE purchase as reducing operating cash twice, giving operating cash of 300,000 instead of 700,000."}], "correctAnswer": "A", "explanationLayer1": "Work backwards through the SCF: isolate operating cash (total movement minus financing minus investing), then reverse the operating adjustments to recover PBT.", "workingShown": "Net cash increase                       750,000\nLess financing (1,000,000 - 750,000) = (250,000)\nLess investing (-200,000)            = +200,000\nOperating cash flow                  =  700,000\n\nPBT = operating cash - depreciation + increase in working capital\n    = 700,000 - 100,000 + 575,000 = 1,175,000", "explanationLayer3": "Applies IAS 7's three-section structure in reverse and the para-20 indirect adjustments (depreciation add-back, working-capital changes) read backwards from cash to profit.", "examinerNote": "The hardest reverse question type. Build the SCF skeleton (operating ? + financing 250,000 + investing -200,000 = 750,000) to solve for operating, THEN unwind the operating adjustments. Doing it in one leap invites the depreciation-sign error (B/C).", "teacherCommentary": "Concept: if you know cash and two sections, the third is forced; then reverse the operating bridge. Process: skeleton first, operating cash second, PBT last. Everyday: you know the bank rose 750k and where the financing/investing cash went, so what's left came from trading.", "advancedContext": "This 'given cash, find profit' format is the mirror of normal SCF prep. Mastering both directions is what separates a 70% candidate from a 90% one. The skeleton technique also speeds up MTQ checking."}, {"qId": "CF_Q24", "displayIdx": 24, "type": "ot", "questionType": "mcq", "subTopic": "Cash invested in NCA (reverse calc)", "difficulty": "hard", "marks": 2, "timeIdeal": 150, "scenario": "Eastgate Co had non-current assets with a carrying amount of $50,000 at the start of the financial year. During the year the business sold assets that had cost $4,000 and had been depreciated by $1,500. Depreciation for the year was $9,000. The carrying amount of assets at the end of the financial year was $46,000.", "questionText": "How much cash has been invested in non-current assets during the year?", "options": [{"letter": "A", "text": "$7,500", "correct": true, "why": "CORRECT. Disposal CA = 4,000 - 1,500 = 2,500. Additions = 46,000 - 50,000 + 2,500 + 9,000 = 7,500."}, {"letter": "B", "text": "$5,000", "correct": false, "why": "'Disposal omitted' error. Left the disposed asset's 2,500 carrying amount out of the working, understating additions."}, {"letter": "C", "text": "$9,000", "correct": false, "why": "'Disposal at cost' error. Used the 4,000 cost instead of the 2,500 carrying amount in the net carrying-amount account."}, {"letter": "D", "text": "$4,000", "correct": false, "why": "'Disposal cost taken as cash invested' error. Confused the cost of the disposed asset with the cash spent on new assets."}], "correctAnswer": "A", "explanationLayer1": "Cash invested (additions) is the balancing figure in the net carrying-amount account: CA c/f - CA b/f + disposal CA + depreciation.", "workingShown": "Disposal carrying amount = 4,000 - 1,500 = 2,500\n\nNCA carrying amount account:\n  CA b/f          50,000\n  Additions (B)        ?\n  Depreciation    (9,000)\n  Disposal at CA  (2,500)\n  CA c/f        = 46,000\n\nAdditions = 46,000 - 50,000 + 2,500 + 9,000 = 7,500", "explanationLayer3": "IAS 7 para 16(a): cash paid to acquire PPE = investing outflow. The disposal must enter at carrying amount, consistent with the net basis of the account.", "examinerNote": "The disposal must go in at CARRYING AMOUNT (2,500), not cost (4,000). Distractor C is the trap for candidates who grab the cost figure. Build the net account and the balancing figure is unambiguous.", "teacherCommentary": "Concept: a net account takes net figures only. Process: convert disposal to CA, then balance for additions. Everyday: you only remove the leftover book value of what you sold, then see how much new stuff you must have bought to land at 46,000.", "advancedContext": "Same engine as Q11/Q12/Q30 but run in reverse to find additions rather than verify them. The cost-vs-carrying-amount trap recurs across every PPE cash-flow question."}, {"qId": "CF_Q25", "displayIdx": 25, "type": "ot", "questionType": "mcq", "subTopic": "Profit vs cash", "difficulty": "medium", "marks": 2, "timeIdeal": 120, "scenario": "Foxton Co made a profit of $8,000 during the year, but its bank balance reduced by $5,000 over the same period.", "questionText": "Which of the following could be a possible explanation for this situation?", "options": [{"letter": "A", "text": "Depreciation charge of $3,000 and an increase in inventories of $10,000", "correct": false, "why": "'Net positive cash' error. 8,000 + 3,000 - 10,000 = +1,000 — cash would RISE, not fall by 5,000."}, {"letter": "B", "text": "Depreciation charge of $6,000 and the repayment of a loan of $7,000", "correct": false, "why": "'Net positive cash' error. 8,000 + 6,000 - 7,000 = +7,000 — cash would rise."}, {"letter": "C", "text": "Depreciation charge of $12,000 and the purchase of new non-current assets for $25,000", "correct": true, "why": "CORRECT. 8,000 + 12,000 (add back depreciation) - 25,000 (capex) = -5,000, exactly matching the fall in the bank balance."}, {"letter": "D", "text": "The disposal of a non-current asset for $13,000 less than its carrying amount", "correct": false, "why": "'Loss raises cash' error. A loss on disposal is non-cash and is added back, which would push cash ABOVE profit, not below it."}], "correctAnswer": "C", "explanationLayer1": "A profit can sit alongside falling cash when large cash outflows (capex, loan repayment) or working-capital absorption exceed the non-cash add-backs. Test each option by reconstructing the cash effect.", "workingShown": "Target: profit 8,000 but cash -5,000 (a 13,000 gap).\nA: 8,000 + 3,000 - 10,000 = +1,000      (cash up)\nB: 8,000 + 6,000 - 7,000  = +7,000      (cash up)\nC: 8,000 + 12,000 - 25,000 = -5,000     (matches)  <-- correct\nD: loss added back => cash above profit (cash up)", "explanationLayer3": "Illustrates the core IAS 7 rationale (chapter intro): profit (accruals basis) differs from cash because of non-cash items and capital/working-capital movements.", "examinerNote": "Test each option by quick mental SCF, not by intuition. Capex is the usual culprit for 'profitable but cash-poor'. Depreciation always pushes cash above profit, so an option relying on depreciation alone can never explain a cash FALL.", "teacherCommentary": "Concept: profit and cash diverge mainly through capex and working capital. Process: add back depreciation, subtract capex/repayments, see if it lands on -5,000. Everyday: a profitable hotel that just bought a new lift can still see its bank balance drop.", "advancedContext": "This is the conceptual heart of the whole chapter and ties to interpretation: a company can be profitable yet illiquid (the classic 'overtrading' risk you'll meet in the Interpretation chapter and FR)."}, {"qId": "CF_Q26", "displayIdx": 26, "type": "ot", "questionType": "number", "subTopic": "Net increase in cash (reverse calc)", "difficulty": "hard", "marks": 2, "timeIdeal": 155, "prefix": "$", "numAns": 13150, "tol": 5, "scenario": "Glanton Co made a profit for the year of $18,750, after charging depreciation of $1,250. During the year, non-current assets were purchased for $8,000, trade receivables increased by $1,000, inventories decreased by $1,800 and trade payables increased by $350.", "questionText": "What was Glanton Co's increase in cash and bank balances during the year? Give your answer in $ as a whole number.", "explanationLayer1": "Build a mini-SCF: profit + depreciation +/- working capital - capex = movement in cash. Apply the working-capital rule to each line.", "workingShown": "Profit for the year             18,750\nAdd depreciation                 1,250\nLess increase in receivables    (1,000)\nAdd decrease in inventories      1,800\nAdd increase in payables           350\nLess purchase of NCA            (8,000)\n                                ------\nIncrease in cash and bank       13,150", "explanationLayer3": "IAS 7 paras 16 and 20: capex is an investing outflow; the operating section adjusts profit for depreciation and working-capital changes. The sum reconciles to the cash movement.", "examinerNote": "Four sign decisions in a row (receivables up = subtract, inventory down = add, payables up = add) plus the capex outflow. Any single direction slip loses the mark. Write the four-word rule before you start.", "teacherCommentary": "Concept: assemble the whole cash bridge from profit. Process: depreciation in, working capital by rule, capex out. Everyday: you earned 18,750 on paper; after stock, customer and supplier timing and buying 8,000 of kit, only 13,150 extra cash landed.", "advancedContext": "This compact full-SCF-in-miniature is exactly the structure of MTQ1. Getting fluent here de-risks the 15-mark task in Part 3."}, {"qId": "CF_Q27", "displayIdx": 27, "type": "ot", "questionType": "number", "subTopic": "Net investing (loan-financed capex trap)", "difficulty": "hard", "marks": 2, "timeIdeal": 160, "prefix": "$", "numAns": 75000, "tol": 5, "scenario": "In the year ended 31 May 20X7, Hartside Co purchased non-current assets at a cost of $140,000, financing them partly with a new loan of $120,000. Hartside Co also disposed of non-current assets with a carrying amount of $50,000, making a loss of $3,000. Cash of $18,000 was received from the disposal of investments during the year.", "questionText": "What is Hartside Co's net cash OUTFLOW from investing activities? Give your answer in $ as a whole number (ignore the minus sign).", "explanationLayer1": "Investing includes the FULL cash cost of the PPE purchase, the proceeds on PPE disposal (CA - loss), and proceeds from disposing of investments. The new loan is a FINANCING inflow and is NOT netted against the purchase.", "workingShown": "Purchase of PPE (full cost)        (140,000)\nProceeds on PPE disposal (50,000-3,000) 47,000\nProceeds from sale of investments     18,000\n                                   --------\nNet cash used in investing          (75,000)\n\n(The $120,000 new loan is a financing inflow, shown separately.)", "explanationLayer3": "IAS 7 para 16: purchases/disposals of long-term assets and investments are investing flows, shown GROSS (para 21). The related borrowing is a financing flow (para 17) and must not be offset.", "examinerNote": "The trap is netting the 120,000 loan against the 140,000 purchase to show only 20,000. IAS 7 forbids that — the full 140,000 is investing, the 120,000 is financing. Also: proceeds = CA - loss (47,000), not 50,000.", "teacherCommentary": "Concept: gross presentation — don't net financing against investing. Process: full capex out, disposal proceeds in (CA minus loss), investment proceeds in. Everyday: borrowing to buy a machine is two events — you raised a loan AND you bought a machine — shown separately.", "advancedContext": "Gross vs net presentation (para 21) is an examiner favourite. Offsetting a loan against capex hides the entity's true investing intensity — a transparency point that carries into FR."}, {"qId": "CF_Q28", "displayIdx": 28, "type": "ot", "questionType": "mcq", "subTopic": "Plant T-account (investing figures)", "difficulty": "hard", "marks": 2, "timeIdeal": 160, "scenario": "The movement on the plant and machinery account of Ingleby Co is shown below:\n\n                              $\nCost b/f                   10,000\nAdditions                   2,000\nDisposals                  (3,000)\nCost c/f                    9,000\nDepreciation b/f            2,000\nCharge for the year         1,000\nDepreciation on disposals  (1,500)\nDepreciation c/f            1,500\n\nThe profit on the sale of the machine was $500.", "questionText": "What figures would appear in the statement of cash flows under 'Investing activities'?", "options": [{"letter": "A", "text": "Movement on plant account $500 and profit on disposal of $500", "correct": false, "why": "'Movement-as-cash' error. The 'movement on the plant account' is not a cash flow, and profit on disposal is a non-cash operating add-back, not an investing item."}, {"letter": "B", "text": "Movement on plant account $500 and proceeds on sale of plant $2,000", "correct": false, "why": "'Net movement instead of gross purchase' error. Investing shows the GROSS purchase (2,000), not a net 'movement' figure."}, {"letter": "C", "text": "Purchase of plant $2,000 and profit on disposal of $500", "correct": false, "why": "'Profit as investing item' error. Purchase is right, but profit on disposal belongs in operating (added back); the investing inflow is the PROCEEDS, not the profit."}, {"letter": "D", "text": "Purchase of plant $2,000 and proceeds on sale of plant $2,000", "correct": true, "why": "CORRECT. Purchase = additions 2,000 (outflow). Disposal CA = 3,000 - 1,500 = 1,500; proceeds = CA + profit = 1,500 + 500 = 2,000 (inflow)."}], "correctAnswer": "D", "explanationLayer1": "Investing shows two GROSS cash figures: the purchase (additions) and the disposal proceeds. Proceeds are derived from the disposed asset's carrying amount plus the profit (or minus the loss).", "workingShown": "Purchase (additions) = 2,000 (outflow)\nDisposal carrying amount = cost 3,000 - dep 1,500 = 1,500\nProceeds = carrying amount + profit = 1,500 + 500 = 2,000 (inflow)\nInvesting: purchase 2,000 and proceeds 2,000.", "explanationLayer3": "IAS 7 para 16 and para 21: purchases and disposal proceeds are shown separately (gross), not netted into a single movement; the disposal gain is excluded from investing (para 20 removes it from operating as non-cash).", "examinerNote": "Distractors A-C mix the accounting profit (non-cash) into investing or net the gross figures. Only cash purchase and cash proceeds belong in investing — and proceeds means CA +/- profit/loss, never the profit itself.", "teacherCommentary": "Concept: investing = cash spent + cash received, both gross. Process: additions for the outflow, CA + profit for the proceeds. Everyday: you spent 2,000 on new plant and got 2,000 selling the old — two separate cash facts.", "advancedContext": "This question fuses the disposals working (Q10), the proceeds rule, and gross presentation (Q27). It is the kind of integrated 2-marker that signals MTQ-readiness."}, {"qId": "CF_Q29", "displayIdx": 29, "type": "ot", "questionType": "mcq", "subTopic": "Indirect method (add-back identification)", "difficulty": "medium", "marks": 2, "timeIdeal": 120, "scenario": "Jedburgh Co prepares its statement of cash flows using the indirect method, reconciling profit before tax to cash generated from operations.", "questionText": "Which of the following lists consists ONLY of items that would be ADDED to profit before tax in that reconciliation?", "options": [{"letter": "A", "text": "Decrease in inventory, depreciation charge, profit on sale of non-current assets", "correct": false, "why": "'Gain treated as add-back' error. A profit on sale is DEDUCTED (it is a non-cash gain), so this list is not all-additions."}, {"letter": "B", "text": "Increase in payables, decrease in receivables, profit on sale of non-current assets", "correct": false, "why": "'Gain treated as add-back' error. Increase in payables and decrease in receivables are added, but the profit on sale is deducted."}, {"letter": "C", "text": "Loss on sale of non-current assets, depreciation charge, increase in receivables", "correct": false, "why": "'Asset increase treated as add-back' error. Loss and depreciation are added, but an INCREASE in receivables is deducted."}, {"letter": "D", "text": "Decrease in receivables, increase in payables, loss on sale of non-current assets", "correct": true, "why": "CORRECT. All three are additions: decrease in receivables (cash in), increase in payables (cash conserved), loss on disposal (non-cash, added back)."}], "correctAnswer": "D", "explanationLayer1": "Items ADDED to profit: non-cash expenses (depreciation, amortisation, losses on disposal), decreases in operating assets (receivables, inventory) and increases in operating liabilities (payables). Items DEDUCTED: gains, increases in assets, decreases in liabilities.", "workingShown": "Test each list for a non-addition:\n  A: profit on sale -> DEDUCTED  (fail)\n  B: profit on sale -> DEDUCTED  (fail)\n  C: increase in receivables -> DEDUCTED (fail)\n  D: decrease receivables (+), increase payables (+), loss on sale (+) -> all added (pass)", "explanationLayer3": "IAS 7 para 20: adjust profit for non-cash items and working-capital movements. Gains are removed (deducted), losses added back.", "examinerNote": "Scan each list for the one item that breaks the 'all additions' rule — usually a gain or an asset increase. The examiner builds three lists that are 'almost all additions' with a single planted deduction.", "teacherCommentary": "Concept: additions = non-cash expenses + cash-releasing working-capital moves. Process: hunt the odd one out in each list. Everyday: losses and depreciation cost no cash, and collecting receivables/stretching payables brings cash in.", "advancedContext": "Fast pattern-recognition like this is a timing weapon: spotting the disqualifying item in each list takes seconds and frees time for the calculation-heavy questions."}, {"qId": "CF_Q30", "displayIdx": 30, "type": "ot", "questionType": "number", "subTopic": "Net investing (PPE additions)", "difficulty": "hard", "marks": 2, "timeIdeal": 155, "prefix": "$", "numAns": 435000, "tol": 5, "scenario": "At 31 May Kirkby Co had the following balances:\n\n                              20X7        20X6\n                             $000        $000\nProperty, plant & equipment  2,110       1,945\nEquity shares, $1            1,200         800\nShare premium                  760         500\nNon-current loans              550         174\n\nThe depreciation charge for the year to 31 May 20X7 was $270,000. There were no disposals of non-current assets during the year.", "questionText": "What figure should appear as net cash used in investing activities for the year to 31 May 20X7? Give your answer in $ as a whole number.", "explanationLayer1": "With no disposals, the only investing item is the purchase of PPE. Find additions from the carrying-amount account: CA c/f - CA b/f + depreciation. The shares, premium and loan movements are FINANCING distractors.", "workingShown": "PPE additions = 2,110,000 - 1,945,000 + 270,000 = 435,000 (outflow)\nNo disposals => net cash used in investing = 435,000\n\n(Equity shares, share premium and loan movements are FINANCING, not investing.)", "explanationLayer3": "IAS 7 para 16(a): purchase of PPE is the investing outflow. Para 17 confirms share and loan movements are financing — they must not stray into investing.", "examinerNote": "Three financing lines (shares, premium, loan) are planted to tempt you into the wrong section. Investing here is ONLY the PPE purchase. The depreciation add-back is needed because PPE rose by less than the cash spent.", "teacherCommentary": "Concept: sort by section first, then compute. Process: PPE only for investing; additions = rise in PPE + depreciation. Everyday: the assets grew 165k on the books but 270k of value wore off, so you must have bought 435k of new assets.", "advancedContext": "Section-discipline (ignoring financing data when asked for investing) is a recurring discriminator. The same balances would feed the financing section if the question flipped — recognising which data belongs where is the skill.", "scenarioHtml": "<div style=\"white-space:pre-wrap\">At 31 May Kirkby Co had the following balances:</div><table class=\"fin-table\"><thead><tr><th class=\"lbl\"></th><th>20X7</th><th>20X6</th></tr><tr><th class=\"lbl unit\"></th><th class=\"unit\">$000</th><th class=\"unit\">$000</th></tr></thead><tbody><tr><td class=\"lbl\">Property, plant &amp; equipment</td><td class=\"num\">2,110</td><td class=\"num\">1,945</td></tr><tr><td class=\"lbl\">Equity shares, $1</td><td class=\"num\">1,200</td><td class=\"num\">800</td></tr><tr><td class=\"lbl\">Share premium</td><td class=\"num\">760</td><td class=\"num\">500</td></tr><tr><td class=\"lbl\">Non-current loans</td><td class=\"num\">550</td><td class=\"num\">174</td></tr></tbody></table><div style=\"white-space:pre-wrap;margin-top:8px\">The depreciation charge for the year to 31 May 20X7 was $270,000. There were no disposals of non-current assets during the year.</div>"}, {"qId": "CF_Q31", "displayIdx": 31, "type": "ot", "questionType": "multi", "subTopic": "Indirect method (mixed directions)", "difficulty": "hard", "marks": 2, "timeIdeal": 150, "scenario": "An extract from the draft statement of cash flows of Langton Co shows the following items being used to reconcile profit before tax to cash generated from operations ($000):\n\nProfit before tax            1,255\nLoss on disposal               455\nIncrease in receivables        198\nIncrease in payables           340", "questionText": "Which TWO of the following statements about the correct treatment of these items are correct? Select TWO.", "options": [{"letter": "A", "text": "The loss on disposal of $455 should be added to profit before tax", "correct": true, "why": "CORRECT. A loss on disposal is a non-cash debit reducing profit; it is added back in the reconciliation."}, {"letter": "B", "text": "The increase in receivables of $198 should be added to profit before tax", "correct": false, "why": "'Wrong-direction receivables' error. An INCREASE in receivables ties up cash and is DEDUCTED, not added."}, {"letter": "C", "text": "The increase in payables of $340 should be added to profit before tax", "correct": true, "why": "CORRECT. An increase in payables conserves cash (liability up = cash up) and is added."}, {"letter": "D", "text": "The loss on disposal of $455 should be deducted from profit before tax", "correct": false, "why": "'Loss deducted' error. A loss is added back; only a GAIN is deducted."}], "correctOptions": ["A", "C"], "expectedSelectCount": 2, "explanationLayer1": "Apply the two rules together: non-cash losses are added (gains deducted); for working capital, asset increase = deduct, liability increase = add.", "workingShown": "Loss on disposal +455   -> non-cash, ADD  [A correct, D wrong]\nIncrease receivables    -> asset up = DEDUCT (not add) [B wrong]\nIncrease payables +340  -> liability up = ADD [C correct]", "explanationLayer3": "IAS 7 para 20: profit is adjusted for non-cash items (losses added, gains deducted) and for working-capital changes (asset up = deduct, liability up = add).", "examinerNote": "The question mixes a non-cash item (loss) with two working-capital items. Each correct statement is paired with a wrong-direction twin (A vs D for the loss; B is the receivables flip). Apply the rules mechanically.", "teacherCommentary": "Concept: two separate rules running at once. Process: classify each line (non-cash vs working capital) then apply its rule. Everyday: a loss didn't cost cash so add it back; customers owing more means cash is stuck out there, so subtract it.", "advancedContext": "This combines the loss-direction trap with the receivables/payables-direction trap — two of your named diagnostic weaknesses in a single 2-marker. The fix is the same margin note used throughout."}, {"qId": "CF_Q32", "displayIdx": 32, "type": "ot", "questionType": "mcq", "subTopic": "Interest received (investing, T-account)", "difficulty": "hard", "marks": 2, "timeIdeal": 150, "scenario": "Moorside Co had an interest receivable balance of $4,900 at the start of the year and $1,200 at the end of the year. Interest income of $20,000 was recognised in the statement of profit or loss for the year.", "questionText": "How much should be shown for interest received within investing activities in the statement of cash flows?", "options": [{"letter": "A", "text": "$23,700", "correct": true, "why": "CORRECT. Interest receivable account: 4,900 b/f + 20,000 income - 1,200 c/f = 23,700 cash received."}, {"letter": "B", "text": "$16,300", "correct": false, "why": "'Reversed b/f and c/f' error. Computed 1,200 + 20,000 - 4,900. For a receivable (asset), the OPENING balance is added and the CLOSING balance deducted."}, {"letter": "C", "text": "$20,000", "correct": false, "why": "'Ignored the accrual movement' error. Took the P&L income as the cash received; the falling receivable means more cash was collected."}, {"letter": "D", "text": "$26,100", "correct": false, "why": "'Added both balances' error. 4,900 + 20,000 + 1,200; the closing receivable must be deducted, not added."}], "correctAnswer": "A", "explanationLayer1": "Interest received is the balancing figure on the interest RECEIVABLE (asset) account: opening receivable + income earned - closing receivable = cash received.", "workingShown": "Interest receivable account:\n          $                            $\nBal b/f  4,900     Cash received (B) 23,700\nP&L inc 20,000     Bal c/f            1,200\n        ------                       ------\n        24,900                       24,900\n\nCash received = 4,900 + 20,000 - 1,200 = 23,700", "explanationLayer3": "IAS 7 para 16: interest received is normally an investing inflow (though para 31 permits operating). The cash figure — not the P&L income — appears in the statement.", "examinerNote": "Mind the account direction: for a RECEIVABLE (asset), opening adds and closing subtracts — the mirror image of the payable accounts in Q7/Q8. The reversed-direction distractor (B) catches candidates who use the payable rule by habit.", "teacherCommentary": "Concept: asset account, so cash is what came IN to clear it. Process: b/f + income - c/f. Everyday: you were owed 4,900, earned 20,000 more, and end owed only 1,200 — so 23,700 actually arrived.", "advancedContext": "Receivable accounts (interest received, dividends received) run opposite to payable accounts (interest/tax paid). Knowing which direction to apply is the single most error-prone choice in the chapter."}, {"qId": "CF_Q33", "displayIdx": 33, "type": "ot", "questionType": "number", "subTopic": "Dividends received (investing, T-account)", "difficulty": "hard", "marks": 2, "timeIdeal": 150, "prefix": "$", "numAns": 50000, "tol": 5, "scenario": "Newsham Co had a dividend receivable balance of $50,000 at the start of the year and $57,000 at the end of the year. Dividend income of $57,000 was recognised in the statement of profit or loss for the year.", "questionText": "How much should be shown for dividends received within investing activities in the statement of cash flows? Give your answer in $ as a whole number.", "explanationLayer1": "Dividends received is the balancing figure on the dividend RECEIVABLE account: opening + income recognised - closing = cash received.", "workingShown": "Dividend receivable account:\n          $                            $\nBal b/f  50,000     Cash received (B) 50,000\nP&L inc  57,000     Bal c/f           57,000\n        -------                       -------\n       107,000                       107,000\n\nCash received = 50,000 + 57,000 - 57,000 = 50,000", "explanationLayer3": "IAS 7 para 16: dividends received are normally an investing inflow (para 31 permits operating). Consistent classification is required year to year.", "examinerNote": "The income and the closing receivable being equal (both 57,000) is the trap: it makes cash received equal the OPENING balance (50,000), which feels wrong but is correct. Trust the T-account.", "teacherCommentary": "Concept: an asset account again — cash is what cleared it. Process: b/f + income - c/f. Everyday: you were owed 50k of dividends, declared 57k more, and are still owed 57k — so exactly 50k cash came in.", "advancedContext": "This mirrors the Geronimo dividend-receivable working in the Study Text. Interest received and dividends received share one engine; only the labels change."}, {"qId": "CF_Q34", "displayIdx": 34, "type": "ot", "questionType": "mcq", "subTopic": "Non-cash transactions", "difficulty": "medium", "marks": 2, "timeIdeal": 110, "scenario": "During the year, Oakworth Co issued shares with a value of $150,000 in exchange for shares in a new subsidiary. No cash changed hands in the transaction.", "questionText": "How should the issue of shares be treated in Oakworth Co's statement of cash flows?", "options": [{"letter": "A", "text": "$150,000 cash inflow in investing activities", "correct": false, "why": "'Non-cash treated as cash' error. No cash moved; nothing enters the SCF body. (And a share issue would be financing, not investing, even if it were cash.)"}, {"letter": "B", "text": "$150,000 cash inflow in financing activities", "correct": false, "why": "'Non-cash treated as cash' error. The shares were issued for shares, not cash, so there is no financing cash inflow."}, {"letter": "C", "text": "$150,000 cash inflow in operating activities", "correct": false, "why": "'Non-cash treated as cash' error. A share-for-share exchange never touches operating cash."}, {"letter": "D", "text": "No entries should be made in the statement of cash flows", "correct": true, "why": "CORRECT. A share-for-share exchange is a non-cash transaction — excluded from the SCF body and disclosed separately."}], "correctAnswer": "D", "explanationLayer1": "The statement of cash flows reports only cash transactions. A share-for-share exchange involves no cash, so nothing enters the statement; it is disclosed separately as a significant non-cash transaction.", "workingShown": "Shares issued in exchange for shares = NON-CASH.\n=> No cash inflow or outflow.\n=> No entry in the SCF; disclose separately by note.", "explanationLayer3": "IAS 7 para 43: investing and financing transactions that do not require cash are excluded from the SCF and disclosed elsewhere in the financial statements.", "examinerNote": "Any 'in exchange for'/'bonus'/'revaluation' wording flags a non-cash transaction. The examiner offers three plausible cash classifications (A/B/C) to test whether you spot that there is no cash at all.", "teacherCommentary": "Concept: no cash, no SCF entry. Process: ask 'did cash move?' If no, disclose by note only. Everyday: swapping your shares for someone else's is a barter — no money crossed, so your cash statement stays silent.", "advancedContext": "Bonus issues (Q15), revaluations and share-for-share exchanges are the three headline non-cash transactions (para 43). All are disclosed by note, none hit the SCF body."}, {"qId": "CF_Q35", "displayIdx": 35, "type": "ot", "questionType": "mcq", "subTopic": "Cash generated from operations (prepayments trap)", "difficulty": "hard", "marks": 2, "timeIdeal": 165, "scenario": "Pennington Co had a profit before tax of $434,850 for the year ended 31 December 20X6.\n  - Depreciation of $37,400 was charged (this figure includes a $7,600 loss on disposal of a non-current asset).\n  - Finance costs of $35,000 were charged to profit or loss.\n  - Statement of financial position extracts:\n                          20X6        20X5\n                          $000        $000\n    Inventory              145         167\n    Trade receivables      202         203\n    Prepayments             27          16\n    Trade payables         196         212\n    Interest payable          6          28", "questionText": "What was the cash generated from operations?", "options": [{"letter": "A", "text": "$503,250", "correct": true, "why": "CORRECT. PBT 434,850 + finance costs 35,000 + depreciation/loss 37,400 + inventory dec 22,000 + receivables dec 1,000 - prepayments inc 11,000 - payables dec 16,000 = 503,250. (Interest payable movement is used for interest PAID, after this subtotal.)"}, {"letter": "B", "text": "$468,250", "correct": false, "why": "'Finance cost not added back' error. Forgot to add the 35,000 finance cost to PBT before reaching cash generated from operations."}, {"letter": "C", "text": "$525,250", "correct": false, "why": "'Prepayment increase added' error. A rise in prepayments is an asset increase = cash OUT, so it is deducted (-11,000), not added."}, {"letter": "D", "text": "$535,250", "correct": false, "why": "'Payables decrease added' error. A fall in payables is a cash OUTFLOW, deducted (-16,000), not added."}], "correctAnswer": "A", "explanationLayer1": "Start from PBT, add back finance costs and the combined depreciation/loss, then adjust for ALL working-capital lines including prepayments. Note the depreciation figure already bundles the loss, so add it once. The interest payable movement is NOT used here — it belongs to the later 'interest paid' line.", "workingShown": "Profit before tax                    434,850\nAdd finance costs                     35,000\nAdd depreciation incl. loss           37,400\nAdd decrease in inventory (167-145)   22,000\nAdd decrease in receivables (203-202)  1,000\nLess increase in prepayments (27-16) (11,000)\nLess decrease in payables (212-196)  (16,000)\n                                     -------\nCash generated from operations       503,250", "explanationLayer3": "IAS 7 para 20: finance costs are added back (interest paid shown separately, para 31); working capital includes prepayments (an operating receivable-type asset). The interest payable accrual feeds the separate interest-paid line, not this subtotal.", "examinerNote": "Three traps stacked: (1) prepayments are an asset (increase = deduct); (2) the interest payable movement is a decoy here — it is used only for interest PAID, after cash generated from operations; (3) the depreciation figure already includes the loss, so don't add the 7,600 again.", "teacherCommentary": "Concept: cash generated from operations is BEFORE interest and tax. Process: add back finance cost + non-cash, then every working-capital line by rule, ignore the interest accrual. Everyday: prepaying expenses is cash gone early — it reduces operating cash just like buying stock does.", "advancedContext": "Prepayments are the most-missed working-capital line because students drill inventory/receivables/payables and forget prepayments behave like a receivable. This exact Caddyshack-style item is a known Section A discriminator.", "scenarioHtml": "<div style=\"white-space:pre-wrap\">Pennington Co had a profit before tax of $434,850 for the year ended 31 December 20X6.\n  - Depreciation of $37,400 was charged (this figure includes a $7,600 loss on disposal of a non-current asset).\n  - Finance costs of $35,000 were charged to profit or loss.\n  - Statement of financial position extracts:</div><table class=\"fin-table\"><thead><tr><th class=\"lbl\"></th><th>20X6</th><th>20X5</th></tr><tr><th class=\"lbl unit\"></th><th class=\"unit\">$000</th><th class=\"unit\">$000</th></tr></thead><tbody><tr><td class=\"lbl\">Inventory</td><td class=\"num\">145</td><td class=\"num\">167</td></tr><tr><td class=\"lbl\">Trade receivables</td><td class=\"num\">202</td><td class=\"num\">203</td></tr><tr><td class=\"lbl\">Prepayments</td><td class=\"num\">27</td><td class=\"num\">16</td></tr><tr><td class=\"lbl\">Trade payables</td><td class=\"num\">196</td><td class=\"num\">212</td></tr><tr><td class=\"lbl\">Interest payable</td><td class=\"num\">6</td><td class=\"num\">28</td></tr></tbody></table>"}, {"qId": "CF_Q36", "displayIdx": 36, "type": "ot", "questionType": "number", "subTopic": "Reconciliation to closing cash", "difficulty": "hard", "marks": 2, "timeIdeal": 145, "prefix": "$", "numAns": 95000, "tol": 5, "scenario": "Quarrington Co's statement of cash flows for the year ended 31 December 20X6 showed:\n\n                                          $\nNet cash from operating activities    142,000\nNet cash used in investing activities  (95,000)\nNet cash from financing activities      30,000\nCash and cash equivalents at 1 Jan 20X6 18,000", "questionText": "What is the cash and cash equivalents balance to be reported at 31 December 20X6? Give your answer in $ as a whole number.", "explanationLayer1": "Sum the three section subtotals to get the net movement, then add the opening cash and cash equivalents to get the closing balance.", "workingShown": "Net movement = 142,000 - 95,000 + 30,000 = 77,000 increase\nCCE at 1 Jan                          18,000\nNet increase                          77,000\nCCE at 31 Dec                       = 95,000", "explanationLayer3": "IAS 7 para 45: the SCF reconciles the net movement to the opening and closing cash and cash equivalents reported in the statement of financial position.", "examinerNote": "Watch the sign on the investing subtotal — it is an OUTFLOW (negative). Adding it as a positive overstates the closing balance by 190,000. The opening balance is then simply added to the net movement.", "teacherCommentary": "Concept: the three sections net to the change in cash; opening plus change = closing. Process: add the three subtotals (mind signs), then add opening. Everyday: like adding up the month's deposits and withdrawals, then adding your starting balance.", "advancedContext": "This bottom-of-the-statement reconciliation is the final line of every MTQ. A correct closing CCE that ties to the SOFP cash figure is the examiner's quickest check that the whole statement balances."}, {"qId": "CF_Q37", "displayIdx": 37, "type": "ot", "questionType": "number", "subTopic": "Direct method (customers, non-cash reductions)", "difficulty": "hard", "marks": 2, "timeIdeal": 165, "prefix": "$", "numAns": 577000, "tol": 5, "scenario": "Riverton Co prepares its statement of cash flows using the direct method. For the year ended 31 December 20X6:\n  - Sales were $600,000.\n  - Trade receivables were $80,000 at the start and $95,000 at the end of the year.\n  - An irrecoverable debt of $5,000 was written off during the year.\n  - A contra of $3,000 was agreed against the trade payables ledger.", "questionText": "What is the cash received from customers for the year ended 31 December 20X6? Give your answer in $ as a whole number.", "explanationLayer1": "Reconstruct the receivables account, remembering that the irrecoverable-debt write-off and the contra reduce receivables WITHOUT cash. Cash received is the balancing figure.", "workingShown": "Receivables account:\n          $                              $\nBal b/f  80,000    Cash received (B)   577,000\nSales   600,000    Irrecoverable debt    5,000\n                   Contra                3,000\n                   Bal c/f              95,000\n        -------                        -------\n        680,000                        680,000\n\nCash = 80,000 + 600,000 - 5,000 - 3,000 - 95,000 = 577,000", "explanationLayer3": "IAS 7 para 18(a)/19 (direct method gross receipts). The receivables account also clears via non-cash credits — irrecoverable debts (IFRS 9) and contras — which must be removed before solving for cash.", "examinerNote": "The irrecoverable debt and contra are non-cash reductions in receivables. Omit them and you understate cash received by 8,000. The examiner plants both to test whether you account for every credit to the receivables account, not just cash and the balance.", "teacherCommentary": "Concept: receivables fall for several reasons, only one of which is cash. Process: open the account, credit cash, irrecoverable debt, contra and c/f; balance for cash. Everyday: a customer who never pays (write-off) and a customer you net off against (contra) reduce what's owed without any money arriving.", "advancedContext": "This stretches the basic customers working (Q18) by adding two non-cash credits — exactly the kind of layered direct-method twist that appears in the harder MTQs and in FR."}, {"qId": "CF_Q38", "displayIdx": 38, "type": "ot", "questionType": "mcq", "subTopic": "Interpretation / limitations", "difficulty": "medium", "marks": 2, "timeIdeal": 110, "scenario": "Thornaby Co's directors are reviewing the usefulness of the statement of cash flows to users of the financial statements.", "questionText": "Which one of the following correctly identifies a valid DISADVANTAGE to users of the statement of cash flows?", "options": [{"letter": "A", "text": "Under IAS 7, an entity may use any format it wishes for the statement", "correct": false, "why": "Factually wrong. IAS 7 prescribes standard headings (operating/investing/financing), so this is not a valid disadvantage."}, {"letter": "B", "text": "There is an opportunity to reclassify some cash outflows reported in the operating section as investing cash outflows", "correct": true, "why": "CORRECT. Classification choices (e.g. where interest sits) give limited scope to flatter operating cash flow — a genuine limitation for users."}, {"letter": "C", "text": "Under IAS 7, the statement of cash flows may cover a different period from the other financial statements", "correct": false, "why": "Factually wrong. The SCF covers the SAME reporting period as the other statements."}, {"letter": "D", "text": "Cash flow figures are more open to manipulation than the profit figure", "correct": false, "why": "Reversed. Cash flows are more OBJECTIVE than profit (which relies on estimates and policies); cash is harder, not easier, to manipulate."}], "correctAnswer": "B", "explanationLayer1": "The SCF's main strength is objectivity, but it has limitations: it is historic, offers no interpretation, and leaves some scope for classification choices (e.g. interest as operating vs financing) that can shift the operating subtotal.", "workingShown": "A: false - IAS 7 prescribes headings.\nB: true - classification latitude can flatter operating cash. (valid disadvantage)\nC: false - same period as other statements.\nD: false - cash is more objective than profit.", "explanationLayer3": "IAS 7 permits choices for interest and dividends (paras 31-34), which is the source of the limited classification latitude in option B. The standard's prescribed format (para 10 onwards) rebuts A and C.", "examinerNote": "Concept questions reward eliminating the factually false options first (A, C, D are simply untrue). The valid disadvantage is the subtle classification-latitude point, not a sweeping 'cash is easy to manipulate' claim.", "teacherCommentary": "Concept: the SCF is objective but not flawless. Process: discard the false statements; the survivor is the real limitation. Everyday: where a company chooses to file its interest payment can nudge how healthy its core operations look.", "advancedContext": "Classification latitude (interest/dividends operating vs financing) is a live issue in FR and SBR, where analysts adjust reported operating cash flow to compare entities on a like-for-like basis."}, {"qId": "CF_Q39", "displayIdx": 39, "type": "ot", "questionType": "multi", "subTopic": "Disposal at a loss (indirect method)", "difficulty": "hard", "marks": 2, "timeIdeal": 145, "scenario": "Selby Co sold its warehouse premises at a loss during the year ended 31 December 20X6. The company prepares its statement of cash flows using the indirect method.", "questionText": "Which TWO of the following statements correctly describe how this disposal is presented? Select TWO.", "options": [{"letter": "A", "text": "The loss on disposal is added back as an adjustment within cash flows from operating activities", "correct": true, "why": "CORRECT. The loss is a non-cash expense reducing profit; it is added back in the operating reconciliation."}, {"letter": "B", "text": "The loss on disposal is deducted as an adjustment within cash flows from operating activities", "correct": false, "why": "'Loss deducted' error. A loss is ADDED back; only a gain is deducted."}, {"letter": "C", "text": "The proceeds from the sale are included within cash flows from investing activities", "correct": true, "why": "CORRECT. The cash proceeds on disposal of a non-current asset are an investing inflow."}, {"letter": "D", "text": "The proceeds from the sale are included within cash flows from operating activities", "correct": false, "why": "'Proceeds in operating' error. Disposal proceeds are investing, never operating — only the non-cash profit/loss adjustment touches operating."}], "correctOptions": ["A", "C"], "expectedSelectCount": 2, "explanationLayer1": "A disposal splits two ways: the non-cash loss/gain is adjusted in OPERATING (loss added back, gain deducted), and the actual cash PROCEEDS go in INVESTING.", "workingShown": "Loss on disposal -> non-cash -> ADD BACK in operating  [A correct, B wrong]\nProceeds -> cash received on a long-term asset -> INVESTING inflow [C correct, D wrong]", "explanationLayer3": "IAS 7 para 20 (remove non-cash loss/gain from operating) and para 16 (proceeds of sale of PPE = investing inflow). One transaction, two sections.", "examinerNote": "Each correct statement is paired with its wrong twin (A vs B for the loss direction; C vs D for the proceeds location). Know that a disposal hits TWO sections in opposite ways and you bank both marks.", "teacherCommentary": "Concept: one sale, two presentation effects. Process: loss back in operating, proceeds into investing. Everyday: selling the warehouse cheaply created a paper loss (added back) and brought in some cash (shown in investing).", "advancedContext": "This is the conceptual version of the numeric disposal questions (Q10, Q13, Q28). Understanding the two-section split is what lets you place every disposal figure correctly in an MTQ."}, {"qId": "CF_Q40", "displayIdx": 40, "type": "ot", "questionType": "multi", "subTopic": "Classification (items appearing in the SCF)", "difficulty": "medium", "marks": 2, "timeIdeal": 120, "scenario": "A limited liability company is finalising its statement of cash flows for the year under IAS 7.", "questionText": "Which TWO of the following items would appear in the company's statement of cash flows? Select TWO.", "options": [{"letter": "A", "text": "Proposed dividends", "correct": false, "why": "'Proposed = cash' error. A proposed dividend has not been paid, so it is not a cash flow — only dividends PAID appear."}, {"letter": "B", "text": "Rights issue of shares", "correct": true, "why": "CORRECT. A rights issue raises cash from existing shareholders — a financing inflow."}, {"letter": "C", "text": "Issue of bonus shares", "correct": false, "why": "'Bonus = cash' error. A bonus issue is non-cash (capitalising reserves), so it does not appear in the SCF body."}, {"letter": "D", "text": "Repayment of a loan", "correct": true, "why": "CORRECT. Repaying borrowings is a financing cash outflow."}], "correctOptions": ["B", "D"], "expectedSelectCount": 2, "explanationLayer1": "Only items involving actual cash appear in the SCF. Rights issues and loan repayments are cash; proposed dividends (not yet paid) and bonus issues (non-cash) are not.", "workingShown": "Proposed dividends -> not yet paid -> NO\nRights issue -> cash raised -> YES (financing)\nBonus issue -> non-cash -> NO\nLoan repayment -> cash paid -> YES (financing)", "explanationLayer3": "IAS 7 para 17 (rights issue and loan repayment are financing cash flows). Para 43 (bonus issue is a non-cash transaction, excluded). Only dividends PAID, not proposed, are cash flows (para 31).", "examinerNote": "The pair of traps — proposed (not yet paid) and bonus (non-cash) — recurs constantly. Rights vs bonus is the key distinction: rights = cash in, bonus = no cash. The examiner relies on candidates blurring the two.", "teacherCommentary": "Concept: cash only. Process: ask 'has cash moved?' for each. Everyday: a rights issue sells new shares for money (cash in); a bonus issue just splits the existing pie (no money); a proposed dividend is a promise, not a payment.", "advancedContext": "Rights vs bonus and proposed vs paid are the two perennial classification traps. Together with the revaluation/share-for-share non-cash items (Q34), they cover every 'what appears in the SCF' question the examiner sets."}], "mtqs": [{"qId": "CF_MTQ1", "displayIdx": 41, "subTopic": "Full indirect-method SCF", "totalMarks": 15, "title": "Brampton Co — Full indirect-method statement of cash flows (year ended 31 December 20X6)", "scenario": "Brampton Co — statements of financial position at 31 December ($000):\n\n                              20X6     20X5\nNon-current assets (cost)     1,200      900\nAccumulated depreciation       (300)    (220)\nCarrying amount                 900      680\nInventory                       140      120\nTrade receivables               180      150\nCash at bank                     60       30\n                              -----    -----\nTotal assets                  1,280      980\n\nShare capital                   400      300\nShare premium                   150      100\nRetained earnings               330      250\nLoan (non-current)              200      150\nTrade payables                  110       90\nInterest accrual                  5        8\nTax payable                      85       82\n                              -----    -----\nTotal equity and liabilities  1,280      980\n\nStatement of profit or loss for the year ended 31 December 20X6 ($000):\n  Operating profit ............... 220   (after depreciation and loss on disposal)\n  Finance cost ................... (20)\n  Profit before tax .............. 200\n  Income tax ..................... (90)\n  Profit for the year ............ 110\n\nAdditional information:\n  - During the year an asset that originally cost $100,000 with accumulated depreciation of $40,000 was sold, giving rise to a LOSS on disposal of $10,000.\n  - The depreciation charge for the year was $120,000.\n  - A dividend was paid during the year (the only other movement on retained earnings).", "parts": [{"part": "(a)", "marks": 3, "questionType": "number", "prefix": "$", "numAns": 320, "tol": 2, "prompt": "Cash generated from operations ($000)", "modelAnswer": "PBT 200 + depreciation 120 + loss on disposal 10 + finance cost 20 = 350\nLess increase in inventory (140-120) -20; less increase in receivables (180-150) -30; add increase in payables (110-90) +20\nCash generated from operations = 350 - 20 - 30 + 20 = 320"}, {"part": "(b)", "marks": 2, "questionType": "number", "prefix": "$", "numAns": 23, "tol": 1, "prompt": "Interest paid ($000)", "modelAnswer": "Interest accrual: b/f 8 + finance cost 20 - c/f 5 = 23 paid"}, {"part": "(c)", "marks": 2, "questionType": "number", "prefix": "$", "numAns": 87, "tol": 1, "prompt": "Income tax paid ($000)", "modelAnswer": "Tax payable: b/f 82 + charge 90 - c/f 85 = 87 paid"}, {"part": "(d)", "marks": 2, "questionType": "number", "prefix": "$", "numAns": 400, "tol": 2, "prompt": "Purchase of property, plant and equipment ($000)", "modelAnswer": "Cost account: b/f 900 + additions - disposal cost 100 = c/f 1,200 -> additions = 400"}, {"part": "(e)", "marks": 2, "questionType": "mcq", "correctAnswer": "A", "prompt": "Brampton's asset disposal gave rise to a loss of $10,000. How is this LOSS reflected in the statement of cash flows?", "options": [{"letter": "A", "text": "Added back as an adjustment within operating activities", "correct": true, "why": "CORRECT. A loss on disposal is a non-cash expense; it is added back to profit in the operating reconciliation."}, {"letter": "B", "text": "Deducted as an adjustment within operating activities", "correct": false, "why": "'Loss deducted' error — only a GAIN is deducted; a loss is added back."}, {"letter": "C", "text": "Shown as a cash outflow within investing activities", "correct": false, "why": "'Loss as investing cash' error — only the disposal PROCEEDS hit investing; the loss is non-cash."}, {"letter": "D", "text": "Not reflected anywhere in the statement of cash flows", "correct": false, "why": "'Loss ignored' error — failing to add it back understates operating cash."}], "modelAnswer": "A loss on disposal is non-cash, so it is ADDED back in operating activities (the cash proceeds go in investing). A=correct; B is the gain rule; C confuses the proceeds with the loss; D would understate operating cash."}, {"part": "(f)", "marks": 2, "questionType": "number", "prefix": "$", "numAns": 30, "tol": 1, "prompt": "Net increase in cash and cash equivalents ($000)", "modelAnswer": "Operating 320 - 23 - 87 = 210; Investing -400 + 50 = -350; Financing share 150 + loan 50 - dividends 30 = 170\nNet = 210 - 350 + 170 = 30 (ties to cash 30 -> 60)"}, {"part": "(g)", "marks": 2, "questionType": "multi", "correctOptions": ["A", "B"], "expectedSelectCount": 2, "correctAnswer": "A, B", "prompt": "Which TWO of the following statements about Brampton's statement of cash flows are correct? Select TWO.", "options": [{"letter": "A", "text": "The depreciation charge of $120,000 is added back in arriving at cash generated from operations.", "correct": true, "why": "CORRECT. Depreciation is a non-cash expense added back."}, {"letter": "B", "text": "The interest paid of $23,000 differs from the finance cost of $20,000 because the interest accrual fell during the year.", "correct": true, "why": "CORRECT. Accrual fell 8 -> 5, so cash paid (23) exceeds the charge (20)."}, {"letter": "C", "text": "The proceeds from the share issue are shown as a financing OUTFLOW.", "correct": false, "why": "'Direction error' — a share issue raises cash, so it is a financing INFLOW."}, {"letter": "D", "text": "The dividend paid of $30,000 is added back within operating activities.", "correct": false, "why": "'Dividend as operating add-back' error — dividends paid are a financing OUTFLOW, not an operating adjustment."}, {"letter": "E", "text": "The proceeds on disposal of $50,000 are added back within operating activities.", "correct": false, "why": "'Proceeds in operating' error — disposal proceeds are an investing inflow; only the loss is adjusted in operating."}], "modelAnswer": "Correct: A and B. C reverses the share-issue direction (inflow). D wrongly treats dividends paid as operating. E puts proceeds in the wrong section (they are investing)."}], "examinerNote": "In a 15-mark MTQ, the line items are interdependent: the depreciation charge feeds both the operating add-back and the PPE working; the finance cost feeds both the add-back and the interest-paid line. A single error can cascade. Build each working separately, then prove the whole statement by checking it nets to the cash movement.", "teacherCommentary": "Concept: assemble the statement piece by piece, then verify it balances to the cash line. Process: operating reconciliation, then the four T-account lines (interest, tax, PPE, disposal), then financing, then tie to cash. Everyday: it's a full reconstruction of where every pound moved this year, proven correct when it lands exactly on the bank balance change.", "scenarioHtml": "<div style=\"white-space:pre-wrap\">Brampton Co — statements of financial position at 31 December ($000):</div><table class=\"fin-table\"><thead><tr><th class=\"lbl\"></th><th>20X6</th><th>20X5</th></tr></thead><tbody><tr><td class=\"lbl\">Non-current assets (cost)</td><td class=\"num\">1,200</td><td class=\"num\">900</td></tr><tr><td class=\"lbl\">Accumulated depreciation</td><td class=\"num\">(300)</td><td class=\"num\">(220)</td></tr><tr><td class=\"lbl\">Carrying amount</td><td class=\"num\">900</td><td class=\"num\">680</td></tr><tr><td class=\"lbl\">Inventory</td><td class=\"num\">140</td><td class=\"num\">120</td></tr><tr><td class=\"lbl\">Trade receivables</td><td class=\"num\">180</td><td class=\"num\">150</td></tr><tr><td class=\"lbl\">Cash at bank</td><td class=\"num\">60</td><td class=\"num\">30</td></tr><tr class=\"subtotal\"><td class=\"lbl\">Total assets</td><td class=\"num\">1,280</td><td class=\"num\">980</td></tr><tr class=\"gap\"><td></td><td></td><td></td></tr><tr><td class=\"lbl\">Share capital</td><td class=\"num\">400</td><td class=\"num\">300</td></tr><tr><td class=\"lbl\">Share premium</td><td class=\"num\">150</td><td class=\"num\">100</td></tr><tr><td class=\"lbl\">Retained earnings</td><td class=\"num\">330</td><td class=\"num\">250</td></tr><tr><td class=\"lbl\">Loan (non-current)</td><td class=\"num\">200</td><td class=\"num\">150</td></tr><tr><td class=\"lbl\">Trade payables</td><td class=\"num\">110</td><td class=\"num\">90</td></tr><tr><td class=\"lbl\">Interest accrual</td><td class=\"num\">5</td><td class=\"num\">8</td></tr><tr><td class=\"lbl\">Tax payable</td><td class=\"num\">85</td><td class=\"num\">82</td></tr><tr class=\"subtotal\"><td class=\"lbl\">Total equity and liabilities</td><td class=\"num\">1,280</td><td class=\"num\">980</td></tr></tbody></table><div style=\"white-space:pre-wrap;margin-top:8px\">Statement of profit or loss for the year ended 31 December 20X6 ($000):\n  Operating profit ............... 220   (after depreciation and loss on disposal)\n  Finance cost ................... (20)\n  Profit before tax .............. 200\n  Income tax ..................... (90)\n  Profit for the year ............ 110\n\nAdditional information:\n  - During the year an asset that originally cost $100,000 with accumulated depreciation of $40,000 was sold, giving rise to a LOSS on disposal of $10,000.\n  - The depreciation charge for the year was $120,000.\n  - A dividend was paid during the year (the only other movement on retained earnings).</div>"}, {"qId": "CF_MTQ2", "displayIdx": 42, "subTopic": "Direct-method operating section", "totalMarks": 15, "title": "Carlow Co — Direct-method operating cash flows (year ended 31 December 20X6)", "scenario": "Carlow Co prepares the operating section of its statement of cash flows using the DIRECT method.\n\nStatement of profit or loss extracts for the year ended 31 December 20X6:\n  Revenue ............ 900,000\n  Purchases .......... 500,000\n  Wages .............. 120,000\n  Interest expense ... 15,000\n  Income tax charge .. 40,000\n\nStatement of financial position extracts:\n                          20X6        20X5\n                            $           $\n  Trade receivables     110,000      95,000\n  Trade payables         70,000      82,000\n  Wages accrual           6,000       4,000\n  Interest accrual        3,000       5,000\n  Tax payable            38,000      35,000", "parts": [{"part": "(a)", "marks": 3, "questionType": "number", "prefix": "$", "numAns": 885000, "tol": 5, "prompt": "Cash received from customers ($)", "modelAnswer": "Receivables: b/f 95,000 + sales 900,000 - c/f 110,000 = cash 885,000 (= 900,000 - 15,000 increase)"}, {"part": "(b)", "marks": 3, "questionType": "number", "prefix": "$", "numAns": 512000, "tol": 5, "prompt": "Cash paid to suppliers ($)", "modelAnswer": "Payables: b/f 82,000 + purchases 500,000 - c/f 70,000 = cash 512,000 (= 500,000 + 12,000 fall in payables)"}, {"part": "(c)", "marks": 2, "questionType": "number", "prefix": "$", "numAns": 118000, "tol": 5, "prompt": "Cash paid to employees ($)", "modelAnswer": "Wages accrual: b/f 4,000 + wages 120,000 - c/f 6,000 = cash 118,000 (= 120,000 - 2,000 rise in accrual)"}, {"part": "(d)", "marks": 2, "questionType": "number", "prefix": "$", "numAns": 201000, "tol": 5, "prompt": "Net cash from operating activities ($)", "modelAnswer": "Customers 885,000 - suppliers 512,000 - employees 118,000 - interest 17,000 - tax 37,000 = 201,000\n(interest paid = 15,000 + 2,000 = 17,000; tax paid = 40,000 - 3,000 = 37,000)"}, {"part": "(e)", "marks": 2, "questionType": "mcq", "correctAnswer": "B", "prompt": "If Carlow had used the INDIRECT method instead of the direct method, which figure would be UNCHANGED?", "options": [{"letter": "A", "text": "Cash received from customers", "correct": false, "why": "'Gross line shown under both' error — gross receipts appear only under the direct method, not the indirect."}, {"letter": "B", "text": "Net cash from operating activities", "correct": true, "why": "CORRECT. Both methods give the SAME net operating cash; only the presentation of the operating section differs."}, {"letter": "C", "text": "Cash paid to suppliers", "correct": false, "why": "'Gross line shown under both' error — not separately presented under the indirect method."}, {"letter": "D", "text": "Cash paid to employees", "correct": false, "why": "'Gross line shown under both' error — replaced by working-capital adjustments under the indirect method."}], "modelAnswer": "Direct and indirect produce the SAME net cash from operating activities (IAS 7). The gross lines (A, C, D) are unique to the direct method; only the operating subtotal (B) is identical under both."}, {"part": "(f)", "marks": 3, "questionType": "multi", "correctOptions": ["A", "C"], "expectedSelectCount": 2, "correctAnswer": "A, C", "prompt": "Which TWO of the following statements about Carlow's direct-method figures are correct? Select TWO.", "options": [{"letter": "A", "text": "Net cash from operating activities equals the figure the indirect method would produce.", "correct": true, "why": "CORRECT. Both methods reconcile to the same net operating cash."}, {"letter": "B", "text": "The direct method shows depreciation as an adjustment within operating activities.", "correct": false, "why": "'Method confusion' error — depreciation add-backs belong to the INDIRECT method; the direct method shows gross cash flows only."}, {"letter": "C", "text": "Cash paid to suppliers exceeds purchases because trade payables decreased during the year.", "correct": true, "why": "CORRECT. Payables fell 82,000 -> 70,000, so cash paid (512,000) exceeds purchases (500,000)."}, {"letter": "D", "text": "Cash received from customers exceeds revenue because receivables increased.", "correct": false, "why": "'Direction error' — receivables ROSE (95,000 -> 110,000), so cash received (885,000) is LESS than revenue (900,000)."}], "modelAnswer": "Correct: A and C. B describes the indirect method (no depreciation line in the direct method). D reverses the receivables effect — a rise in receivables means cash received is below revenue."}], "examinerNote": "Every line is one T-account. The direction flips by account type: receivables (asset) up = LESS cash; payables/accruals (liabilities) up = LESS cash paid. Watching the increase/decrease direction on each account is
