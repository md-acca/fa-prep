<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FA Consolidation · Pool A &amp; Pool B</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #003d6b; --primary-light: #0066b3; --primary-dark: #00264a;
  --accent: #d4a017; --accent-light: #f4d57b;
  --success: #2e7d32; --success-light: #c8e6c9;
  --warning: #ed6c02; --warning-light: #ffe0b2;
  --danger: #c62828; --danger-light: #ffcdd2;
  --neutral: #546e7a;
  --bg: #f6f8fb; --bg-card: #ffffff; --bg-elevated: #fafbfc;
  --border: #e1e7ee; --border-strong: #c5cdd6;
  --text-primary: #1a2332; --text-secondary: #5a6573; --text-muted: #8b95a3;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
  --radius: 10px; --radius-sm: 6px;
  --transition: all 0.18s ease;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
  background: var(--bg); color: var(--text-primary);
  font-size: 14px; line-height: 1.5; min-height: 100vh;
}

/* === Header === */
.app-header {
  background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
  color: white; padding: 14px 24px; box-shadow: var(--shadow);
  position: sticky; top: 0; z-index: 50;
}
.app-header-inner {
  max-width: 1280px; margin: 0 auto;
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
}
.app-title { display: flex; align-items: center; gap: 12px; }
.app-title-icon {
  width: 36px; height: 36px; background: var(--accent); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--primary-dark); font-weight: 700;
}
.app-title h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
.app-title .subtitle { font-size: 11px; opacity: 0.85; margin-top: 1px; }
.header-actions { display: flex; align-items: center; gap: 10px; }

/* === Timer in header === */
.timer-pill {
  background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22);
  padding: 8px 14px; border-radius: 8px;
  font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px;
  display: flex; align-items: center; gap: 8px;
}
.timer-pill.warn { background: rgba(237,108,2,0.85); border-color: rgba(255,255,255,0.4); }
.timer-pill.crit { background: rgba(198,40,40,0.95); border-color: rgba(255,255,255,0.5); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
.timer-pill .label { font-size: 10px; opacity: 0.85; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

/* === Container === */
.container { max-width: 1280px; margin: 0 auto; padding: 24px; }

/* === Buttons === */
.btn {
  background: var(--primary); color: white; border: none;
  padding: 10px 18px; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 500; transition: var(--transition);
  display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { background: var(--primary-dark); }
.btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-success { background: var(--success); }
.btn-success:hover { background: #1b5e20; }
.btn-danger { background: var(--danger); }
.btn-danger:hover { background: #8e0000; }
.btn-warning { background: var(--warning); color: white; }
.btn-lg { padding: 14px 24px; font-size: 16px; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* === Cards === */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow-sm); margin-bottom: 16px;
}
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
.card-subtitle { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }

/* === Home screen === */
.home-hero {
  text-align: center; padding: 32px 24px; margin-bottom: 24px;
}
.home-hero h1 {
  font-size: 28px; font-weight: 700; color: var(--primary-dark); margin-bottom: 8px;
  letter-spacing: -0.5px;
}
.home-hero p { font-size: 14px; color: var(--text-muted); }

.pool-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;
}
@media (max-width: 720px) { .pool-grid { grid-template-columns: 1fr; } }
.pool-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px;
  box-shadow: var(--shadow-sm); transition: var(--transition);
  cursor: pointer; position: relative; overflow: hidden;
}
.pool-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--primary-light); }
.pool-card.in-progress { border-color: var(--accent); }
.pool-card.in-progress::before {
  content: 'IN PROGRESS'; position: absolute; top: 12px; right: 12px;
  background: var(--accent); color: var(--primary-dark);
  padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
}
.pool-card-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
.pool-card-title { font-size: 24px; font-weight: 700; color: var(--primary-dark); margin-bottom: 8px; letter-spacing: -0.3px; }
.pool-card-meta { font-size: 12px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px; }
.pool-card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.home-utility {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px; margin-top: 16px;
}
.utility-btn {
  padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); cursor: pointer;
  font-size: 13px; color: var(--text-secondary);
  display: flex; align-items: center; gap: 10px; transition: var(--transition);
}
.utility-btn:hover { background: var(--bg-elevated); border-color: var(--border-strong); }
.utility-btn .icon { font-size: 16px; }

/* === Test view === */
.test-layout {
  display: grid; grid-template-columns: 260px 1fr; gap: 20px;
  align-items: start;
}
@media (max-width: 900px) { .test-layout { grid-template-columns: 1fr; } }

.q-nav-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto;
}
.q-nav-section { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin: 12px 0 8px; }
.q-nav-section:first-child { margin-top: 0; }
.q-nav-grid {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
}
.q-nav-btn {
  aspect-ratio: 1; border: 1px solid var(--border); background: var(--bg-card);
  border-radius: 5px; font-size: 11px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: var(--text-secondary);
  transition: var(--transition); position: relative;
}
.q-nav-btn:hover { border-color: var(--primary-light); }
.q-nav-btn.answered { background: var(--success-light); border-color: var(--success); color: var(--success); }
.q-nav-btn.current { background: var(--primary); color: white; border-color: var(--primary); }
.q-nav-btn.flagged::after {
  content: ''; position: absolute; top: 2px; right: 2px;
  width: 6px; height: 6px; background: var(--warning); border-radius: 50%;
}
.q-nav-mtq {
  grid-column: span 6; padding: 8px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-elevated); font-size: 12px; cursor: pointer;
  text-align: left; transition: var(--transition);
}
.q-nav-mtq:hover { border-color: var(--primary-light); }
.q-nav-mtq.current { background: var(--primary); color: white; border-color: var(--primary); }
.q-nav-mtq.answered { background: var(--success-light); border-color: var(--success); color: var(--success); }
.q-nav-mtq-parts { font-size: 10px; opacity: 0.8; margin-top: 2px; }

.q-nav-legend {
  margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-muted); line-height: 1.7;
}
.q-nav-legend .dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 3px;
  margin-right: 5px; vertical-align: middle;
}

.q-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px; min-height: 400px;
}
.q-meta-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
}
.q-num { font-size: 18px; font-weight: 700; color: var(--primary-dark); }
.q-meta-right { display: flex; gap: 8px; align-items: center; }
.q-marks-badge {
  background: var(--bg-elevated); border: 1px solid var(--border);
  padding: 4px 10px; border-radius: 5px; font-size: 12px; font-weight: 600; color: var(--text-secondary);
}
.q-flag-btn, .q-guess-btn {
  background: transparent; border: 1px solid var(--border); border-radius: 5px;
  padding: 5px 10px; cursor: pointer; font-size: 12px; color: var(--text-secondary);
  transition: var(--transition); display: inline-flex; align-items: center; gap: 5px;
}
.q-flag-btn.active { background: var(--warning); color: white; border-color: var(--warning); }
.q-guess-btn.active { background: var(--neutral); color: white; border-color: var(--neutral); }
.q-flag-btn:hover, .q-guess-btn:hover { border-color: var(--border-strong); }

.q-scenario {
  background: var(--bg-elevated); border-left: 3px solid var(--primary-light);
  padding: 14px 18px; border-radius: 0 6px 6px 0; margin-bottom: 18px;
  font-size: 14px; line-height: 1.6; color: var(--text-primary); white-space: pre-wrap;
}
.q-text {
  font-size: 15px; font-weight: 500; margin-bottom: 18px; line-height: 1.6;
}

.opt-list { display: flex; flex-direction: column; gap: 10px; }
.opt-row {
  display: flex; gap: 12px; padding: 12px 14px; border: 1px solid var(--border);
  border-radius: 7px; cursor: pointer; transition: var(--transition);
  background: var(--bg-card);
}
.opt-row:hover { border-color: var(--primary-light); background: var(--bg-elevated); }
.opt-row.selected { border-color: var(--primary); background: rgba(0,61,107,0.04); }
.opt-row input { margin-top: 3px; cursor: pointer; }
.opt-row .letter { font-weight: 700; color: var(--primary); margin-right: 4px; }
.opt-row .text { flex: 1; line-height: 1.55; }

.num-input-wrap {
  display: flex; align-items: center; gap: 10px;
  max-width: 360px;
}
.num-input-wrap .prefix {
  font-size: 18px; font-weight: 700; color: var(--text-secondary);
}
.num-input {
  flex: 1; padding: 12px 14px; border: 2px solid var(--border); border-radius: 7px;
  font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums;
  text-align: right; font-family: inherit;
}
.num-input:focus { outline: none; border-color: var(--primary); }

/* MTQ */
.mtq-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
.mtq-title { font-size: 16px; font-weight: 700; color: var(--primary-dark); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.mtq-working {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 7px;
  padding: 12px; margin-bottom: 18px;
}
.mtq-working-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.mtq-working textarea {
  width: 100%; min-height: 100px; border: 1px solid var(--border); border-radius: 5px;
  padding: 10px; font-family: 'SF Mono', Consolas, monospace; font-size: 12px;
  resize: vertical; background: white;
}
.mtq-part {
  border: 1px solid var(--border); border-radius: 7px; padding: 14px;
  margin-bottom: 12px; background: var(--bg-card);
}
.mtq-part-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.mtq-part-label { font-weight: 700; color: var(--primary-dark); font-size: 14px; }
.mtq-part-marks { font-size: 11px; color: var(--text-muted); }
.mtq-part-prompt { font-size: 14px; margin-bottom: 12px; line-height: 1.55; }

/* === Nav buttons bottom === */
.nav-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 20px; gap: 12px;
}

/* === Pre-submit & overlay === */
.review-summary {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px; margin-bottom: 20px;
}
.review-stat {
  background: var(--bg-elevated); padding: 14px; border-radius: 7px;
  border: 1px solid var(--border); text-align: center;
}
.review-stat-num { font-size: 24px; font-weight: 700; color: var(--primary-dark); }
.review-stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(26,35,50,0.6);
  display: none; align-items: center; justify-content: center; z-index: 200;
  padding: 24px;
}
.modal-backdrop.show { display: flex; }
.modal {
  background: var(--bg-card); border-radius: var(--radius);
  max-width: 480px; width: 100%; padding: 24px;
  box-shadow: var(--shadow-lg);
}
.modal h2 { font-size: 18px; margin-bottom: 8px; color: var(--primary-dark); }
.modal p { color: var(--text-secondary); margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

.timeup-overlay {
  position: fixed; inset: 0; background: rgba(198,40,40,0.92);
  display: none; align-items: center; justify-content: center; z-index: 300;
  color: white;
}
.timeup-overlay.show { display: flex; }
.timeup-content { text-align: center; padding: 32px; }
.timeup-content h2 { font-size: 32px; margin-bottom: 12px; }

/* === Results === */
.grade-pill {
  display: inline-flex; padding: 10px 24px; border-radius: 999px;
  font-size: 16px; font-weight: 700; letter-spacing: 0.3px;
  margin-bottom: 8px;
}
.grade-pill.pass { background: var(--success-light); color: var(--success); border: 2px solid var(--success); }
.grade-pill.fail { background: var(--danger-light); color: var(--danger); border: 2px solid var(--danger); }

.score-display { font-size: 48px; font-weight: 700; color: var(--primary-dark); letter-spacing: -1px; line-height: 1; margin: 12px 0 4px; }
.score-display small { font-size: 24px; color: var(--text-muted); font-weight: 500; }
.score-pct { font-size: 18px; color: var(--text-secondary); }

.metric-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px; margin-top: 20px;
}
.metric-card {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 7px;
  padding: 14px; text-align: center;
}
.metric-num { font-size: 22px; font-weight: 700; color: var(--primary-dark); }
.metric-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-top: 3px; }

.subtopic-bar {
  display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
  margin-bottom: 8px; padding: 10px 12px;
  background: var(--bg-elevated); border-radius: 6px; border: 1px solid var(--border);
}
.subtopic-bar .label { font-size: 13px; font-weight: 500; }
.subtopic-bar .meter { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.subtopic-bar .fill { height: 100%; background: var(--success); transition: width 0.4s ease; }
.subtopic-bar.weak .fill { background: var(--danger); }
.subtopic-bar.medium .fill { background: var(--warning); }
.subtopic-bar .pct { font-size: 13px; font-weight: 700; color: var(--text-secondary); white-space: nowrap; }

.result-q {
  border: 1px solid var(--border); border-radius: 7px;
  margin-bottom: 10px; overflow: hidden;
}
.result-q-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; cursor: pointer; background: var(--bg-card);
  transition: var(--transition);
}
.result-q-header:hover { background: var(--bg-elevated); }
.result-q.correct .result-q-header { border-left: 3px solid var(--success); }
.result-q.wrong .result-q-header { border-left: 3px solid var(--danger); }
.result-q.skip .result-q-header { border-left: 3px solid var(--text-muted); }
.result-q-left { display: flex; gap: 12px; align-items: center; flex: 1; min-width: 0; }
.result-q-num { font-weight: 700; color: var(--primary-dark); min-width: 38px; }
.result-q-summary { flex: 1; font-size: 13px; color: var(--text-secondary); }
.result-q-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.result-q-tag { font-size: 10px; padding: 3px 7px; border-radius: 4px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-muted); white-space: nowrap; }
.result-q-tag.diff-easy { color: var(--success); border-color: var(--success-light); }
.result-q-tag.diff-medium { color: var(--warning); border-color: var(--warning-light); }
.result-q-tag.diff-hard { color: var(--danger); border-color: var(--danger-light); }
.result-q-marks { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 50px; text-align: right; }
.result-q-marks.correct { color: var(--success); }
.result-q-marks.wrong { color: var(--danger); }

.result-q-body { display: none; padding: 18px 20px; border-top: 1px solid var(--border); background: var(--bg-elevated); }
.result-q.expanded .result-q-body { display: block; }

.expl-section { margin-bottom: 18px; }
.expl-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
.expl-content { font-size: 13.5px; line-height: 1.6; color: var(--text-primary); }
.expl-content.working { font-family: 'SF Mono', Consolas, monospace; font-size: 12.5px; background: var(--bg-card); padding: 12px; border-radius: 5px; border: 1px solid var(--border); white-space: pre-wrap; }
.opt-result {
  padding: 10px 12px; border: 1px solid var(--border); border-radius: 5px;
  margin-bottom: 6px; background: var(--bg-card); font-size: 13px;
}
.opt-result.correct { background: var(--success-light); border-color: var(--success); }
.opt-result.user-selected { box-shadow: inset 3px 0 0 var(--primary); }
.opt-result.user-selected.wrong { background: var(--danger-light); border-color: var(--danger); }
.opt-result .letter { font-weight: 700; }
.opt-result .why { font-size: 12px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--primary-dark); color: white;
  padding: 12px 24px; border-radius: 8px;
  font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease; z-index: 400;
  max-width: 80%; box-shadow: var(--shadow-lg);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.warn { background: var(--warning); }

/* Misc */
.hidden { display: none !important; }
.spacer { flex: 1; }
hr.div { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
/* === Print-only utilities (hidden on screen) === */
.print-only { display: none; }

/* === Print Mistakes mode === */
@media print {
  body.printing-mistakes { background: white !important; color: black !important; font-size: 10.5pt; }
  body.printing-mistakes .app-header,
  body.printing-mistakes .timer-pill,
  body.printing-mistakes .toast,
  body.printing-mistakes .modal-backdrop,
  body.printing-mistakes .timeup-overlay,
  body.printing-mistakes button,
  body.printing-mistakes .header-actions,
  body.printing-mistakes .home-utility,
  body.printing-mistakes .review-summary,
  body.printing-mistakes .test-layout > aside,
  body.printing-mistakes .nav-bar,
  body.printing-mistakes .q-flag-btn,
  body.printing-mistakes .q-guess-btn,
  body.printing-mistakes .result-q.correct {
    display: none !important;
  }
  body.printing-mistakes .print-only { display: block !important; }
  body.printing-mistakes .container { padding: 0 !important; max-width: 100% !important; }
  body.printing-mistakes .card {
    box-shadow: none !important; border: none !important;
    padding: 4px 0 !important; margin: 0 0 8px !important; background: white !important;
  }
  /* Hide the score / sub-topic cards (1st and 2nd) — keep only Q-by-Q and MTQ */
  body.printing-mistakes .card.no-print { display: none !important; }
  body.printing-mistakes .card-title, body.printing-mistakes .card-subtitle { color: #333 !important; }
  /* Expanded bodies in print */
  body.printing-mistakes .result-q .result-q-body { display: block !important; }
  body.printing-mistakes .result-q-header { cursor: default !important; background: white !important; padding: 4px 0 8px !important; }
  body.printing-mistakes .result-q-body { background: white !important; border-top: 1px solid #ccc !important; padding: 10px 0 0 !important; }
  body.printing-mistakes .result-q {
    page-break-inside: avoid; break-inside: avoid;
    border: 1px solid #999 !important; border-left: 3px solid #c62828 !important;
    border-radius: 4px !important;
    margin-bottom: 14px !important; padding: 10px 14px !important;
    background: white !important;

<script>
// =============================================================
// ENGINE
// =============================================================


const TOPIC_NAME = 'Consolidation';
const STORAGE_PREFIX = 'fa_v3_consolidation_';
const PENDING_KEY = 'fa_v3_pending_imports';
const DASHBOARD_URL = 'https://md-acca.github.io/fa-prep/';
const TIME_LIMIT_SEC = 135 * 60;  // 2h 15min
const PASS_MARK_PCT = 50;         // ACCA pass mark

// ---- State ----
const POOL_A = JSON.parse(document.getElementById('pool-a-data').textContent);
const POOL_B = JSON.parse(document.getElementById('pool-b-data').textContent);
const POOLS = { A: POOL_A, B: POOL_B };

let state = null;          // active attempt state
let timerInterval = null;
let autoSaveInterval = null;

// ---- DOM helpers ----
const $ = (s, root = document) => root.querySelector(s);
const view = () => $('#view');

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function fmtTime(sec) {
  if (sec < 0) sec = 0;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function toast(msg, type = 'success', ms = 2400) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), ms);
}
function showModal(html) {
  $('#modal-content').innerHTML = html;
  $('#modal-backdrop').classList.add('show');
}
function closeModal() {
  $('#modal-backdrop').classList.remove('show');
}

// ---- Persistence ----
function attemptStorageKey(pool) { return STORAGE_PREFIX + 'attempt_pool_' + pool; }
function historyStorageKey() { return STORAGE_PREFIX + 'history'; }

function loadAttempt(pool) {
  try {
    const raw = localStorage.getItem(attemptStorageKey(pool));
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveAttempt() {
  if (!state || state.submitted) return;
  try {
    localStorage.setItem(attemptStorageKey(state.pool), JSON.stringify(state));
  } catch (e) { console.error('Save failed:', e); }
}
function clearAttempt(pool) {
  localStorage.removeItem(attemptStorageKey(pool));
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(historyStorageKey());
    return raw ? JSON.parse(raw) : { A: [], B: [] };
  } catch (e) { return { A: [], B: [] }; }
}
function saveHistory(hist) {
  localStorage.setItem(historyStorageKey(), JSON.stringify(hist));
}

// ---- Build a fresh attempt ----
function freshAttempt(pool) {
  const data = POOLS[pool];
  const hist = loadHistory();
  const attemptNum = (hist[pool] || []).length + 1;
  const answers = {};        // qId -> answer (string for MCQ letter, array for multi, number for num, object for MTQ parts)
  const flags = {};          // qId -> true
  const guessed = {};        // qId -> true
  const mtqWorking = {};     // mtqQId -> textarea content
  data.questions.forEach(q => {
    if (q.questionType === 'multi') answers[q.qId] = [];
    else answers[q.qId] = '';
  });
  data.mtqs.forEach(mtq => {
    answers[mtq.qId] = {};
    mtq.parts.forEach(p => {
      if (p.questionType === 'multi') answers[mtq.qId][p.part] = [];
      else answers[mtq.qId][p.part] = '';
    });
    mtqWorking[mtq.qId] = '';
  });
  return {
    pool, attemptNum,
    startedAt: new Date().toISOString(),
    timeRemaining: TIME_LIMIT_SEC,
    currentSection: 'A',       // 'A' or 'B'
    currentIdx: 0,             // index within section
    answers, flags, guessed, mtqWorking,
    submitted: false,
    completedAt: null,
    schemaVersion: 3
  };
}

// ---- Routing ----
function goHome() {
  stopTimer();
  state = null;
  $('#timer-pill').classList.add('hidden');
  $('#header-home-btn').classList.add('hidden');
  $('#header-subtitle').textContent = 'Pool A & Pool B · 90 marks · 2h 15min';
  renderHome();
}

function renderHome() {
  const inProgressA = loadAttempt('A');
  const inProgressB = loadAttempt('B');
  const hist = loadHistory();
  const attemptsA = (hist.A || []).length;
  const attemptsB = (hist.B || []).length;
  const bestA = (hist.A || []).reduce((m, a) => Math.max(m, a.pct), 0);
  const bestB = (hist.B || []).reduce((m, a) => Math.max(m, a.pct), 0);

  view().innerHTML = `
    <div class="home-hero">
      <h1>Consolidation · Pool Selector</h1>
      <p>30 OT + 2 MTQs · 90 marks · 2h 15min · Pass mark 50%</p>
    </div>

    <div class="pool-grid">
      ${renderPoolCard('A', POOL_A, inProgressA, attemptsA, bestA)}
      ${renderPoolCard('B', POOL_B, inProgressB, attemptsB, bestB)}
    </div>

    <div class="card">
      <div class="card-title">Sync &amp; Dashboard</div>
      <div class="card-subtitle">Completed attempts auto-write to the dashboard's import queue. Open dashboard to merge.</div>
      <div class="home-utility">
        <button class="utility-btn" onclick="openDashboard()"><span class="icon">📊</span> Open Dashboard</button>
        <button class="utility-btn" onclick="manualSync()"><span class="icon">🔄</span> Re-sync history to dashboard</button>
        <button class="utility-btn" onclick="downloadAttempts()"><span class="icon">⬇️</span> Download attempts JSON</button>
        <button class="utility-btn" onclick="confirmClearHistory()"><span class="icon">🗑️</span> Clear local history</button>
      </div>
    </div>
  `;
}

function renderPoolCard(pool, data, inProgress, attemptsCount, bestPct) {
  const diff = data.difficultyMix || '';
  return `
    <div class="pool-card ${inProgress ? 'in-progress' : ''}">
      <div class="pool-card-label">Pool ${pool}</div>
      <div class="pool-card-title">${pool === 'A' ? 'Foundation set' : 'Advanced set'}</div>
      <div class="pool-card-meta">
        ${data.totalMarks} marks · ${data.timeMinutes} minutes<br>
        Difficulty: ${escapeHtml(diff)}<br>
        Attempts so far: <strong>${attemptsCount}</strong>${attemptsCount > 0 ? ` · Best: <strong>${bestPct.toFixed(0)}%</strong>` : ''}
      </div>
      <div class="pool-card-actions">
        ${inProgress
          ? `<button class="btn btn-warning" onclick="startAttempt('${pool}', true)">Resume attempt</button>
             <button class="btn btn-secondary" onclick="confirmDiscard('${pool}')">Discard &amp; restart</button>`
          : `<button class="btn" onclick="startAttempt('${pool}', false)">${attemptsCount > 0 ? 'Start new attempt' : 'Start Pool ' + pool}</button>`
        }
      </div>
    </div>
  `;
}

function confirmDiscard(pool) {
  showModal(`
    <h2>Discard in-progress attempt?</h2>
    <p>Your saved progress for Pool ${pool} will be erased. This can't be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="discardAttempt('${pool}')">Discard</button>
    </div>
  `);
}
function discardAttempt(pool) {
  clearAttempt(pool);
  closeModal();
  toast('Attempt discarded', 'warn');
  renderHome();
}

// ---- Start / resume ----
function startAttempt(pool, isResume) {
  if (isResume) {
    state = loadAttempt(pool);
    if (!state) { toast('No saved attempt found', 'error'); renderHome(); return; }
  } else {
    state = freshAttempt(pool);
  }
  $('#header-subtitle').textContent = `Pool ${pool} · Attempt #${state.attemptNum}`;
  $('#timer-pill').classList.remove('hidden');
  $('#header-home-btn').classList.remove('hidden');
  startTimer();
  startAutoSave();
  renderTest();
}

// ---- Timer ----
function startTimer() {
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    if (!state || state.submitted) return;
    state.timeRemaining--;
    updateTimerDisplay();
    if (state.timeRemaining <= 0) {
      handleTimeUp();
    }
  }, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if (autoSaveInterval) { clearInterval(autoSaveInterval); autoSaveInterval = null; }
}
function updateTimerDisplay() {
  if (!state) return;
  const pill = $('#timer-pill');
  $('#timer-display').textContent = fmtTime(state.timeRemaining);
  pill.classList.remove('warn', 'crit');
  if (state.timeRemaining <= 120) pill.classList.add('crit');
  else if (state.timeRemaining <= 600) pill.classList.add('warn');
}
function handleTimeUp() {
  stopTimer();
  state.timeRemaining = 0;
  finalizeSubmission(true);
  $('#timeup-overlay').classList.add('show');
}
function acknowledgeTimeUp() {
  $('#timeup-overlay').classList.remove('show');
  renderResults();
}
function startAutoSave() {
  autoSaveInterval = setInterval(saveAttempt, 30000);
}

// ---- Test view rendering ----
function totalQsA() { return POOLS[state.pool].questions.length; }
function totalMtqs() { return POOLS[state.pool].mtqs.length; }
function currentQ() {
  const pool = POOLS[state.pool];
  if (state.currentSection === 'A') return pool.questions[state.currentIdx];
  return pool.mtqs[state.currentIdx];
}

function renderTest() {
  if (!state) return;
  view().innerHTML = `
    <div class="test-layout">
      <aside class="q-nav-card" id="q-nav-card"></aside>
      <div id="q-main"></div>
    </div>
  `;
  renderNav();
  renderCurrentQuestion();
}

function renderNav() {
  const pool = POOLS[state.pool];
  let html = `<div class="q-nav-section">Section A · 30 OT (2 marks each)</div><div class="q-nav-grid">`;
  pool.questions.forEach((q, i) => {
    const isCurrent = (state.currentSection === 'A' && state.currentIdx === i);
    const isAnswered = isQuestionAnswered(q);
    const isFlagged = !!state.flags[q.qId];
    let cls = 'q-nav-btn';
    if (isCurrent) cls += ' current';
    else if (isAnswered) cls += ' answered';
    if (isFlagged) cls += ' flagged';
    html += `<button class="${cls}" onclick="jumpTo('A', ${i})">${i + 1}</button>`;
  });
  html += `</div><div class="q-nav-section">Section B · 2 MTQs (15 marks each)</div>`;
  pool.mtqs.forEach((mtq, i) => {
    const isCurrent = (state.currentSection === 'B' && state.currentIdx === i);
    const partsDone = mtqPartsAnswered(mtq);
    const totalParts = mtq.parts.length;
    let cls = 'q-nav-mtq';
    if (isCurrent) cls += ' current';
    else if (partsDone === totalParts) cls += ' answered';
    html += `<button class="${cls}" onclick="jumpTo('B', ${i})">
      MTQ ${i + 1} · ${mtq.totalMarks} marks
      <div class="q-nav-mtq-parts">${partsDone}/${totalParts} parts answered</div>
    </button>`;
  });
  html += `<div class="q-nav-legend">
    <div><span class="dot" style="background:var(--success-light);border:1px solid var(--success)"></span>Answered</div>
    <div><span class="dot" style="background:var(--primary)"></span>Current</div>
    <div><span class="dot" style="background:var(--warning)"></span>Flagged</div>
    <div style="margin-top:8px"><button class="btn btn-sm" onclick="openReview()" style="width:100%">Review &amp; submit →</button></div>
  </div>`;
  $('#q-nav-card').innerHTML = html;
}

function jumpTo(section, idx) {
  state.currentSection = section;
  state.currentIdx = idx;
  saveAttempt();
  renderNav();
  renderCurrentQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function isQuestionAnswered(q) {
  const a = state.answers[q.qId];
  if (q.questionType === 'multi') return Array.isArray(a) && a.length > 0;
  return a !== '' && a != null;
}
function mtqPartsAnswered(mtq) {
  const ans = state.answers[mtq.qId] || {};
  let done = 0;
  mtq.parts.forEach(p => {
    const v = ans[p.part];
    if (p.questionType === 'multi') { if (Array.isArray(v) && v.length > 0) done++; }
    else if (v !== '' && v != null) done++;
  });
  return done;
}

function renderCurrentQuestion() {
  const main = $('#q-main');
  if (state.currentSection === 'A') {
    renderOT(main);
  } else {
    renderMTQ(main);
  }
}

// ---- Input handlers ----
function setAnswer(qId, val) {
  state.answers[qId] = val;
  saveAttempt();
  renderNav();
}
function toggleMulti(qId, letter) {
  const arr = state.answers[qId] = Array.isArray(state.answers[qId]) ? state.answers[qId] : [];
  const i = arr.indexOf(letter);
  if (i >= 0) arr.splice(i, 1); else arr.push(letter);
  saveAttempt();
  renderNav();
  renderCurrentQuestion();
}
function setMtqAnswer(mtqId, part, val) {
  if (!state.answers[mtqId]) state.answers[mtqId] = {};
  state.answers[mtqId][part] = val;
  saveAttempt();
  renderNav();
}
function toggleMtqMulti(mtqId, part, letter) {
  if (!state.answers[mtqId]) state.answers[mtqId] = {};
  const arr = state.answers[mtqId][part] = Array.isArray(state.answers[mtqId][part]) ? state.answers[mtqId][part] : [];
  const i = arr.indexOf(letter);
  if (i >= 0) arr.splice(i, 1); else arr.push(letter);
  saveAttempt();
  renderNav();
  renderCurrentQuestion();
}
function setMtqWorking(mtqId, val) {
  state.mtqWorking[mtqId] = val;
  saveAttempt();
}
function toggleFlag(qId) {
  state.flags[qId] = !state.flags[qId];
  if (!state.flags[qId]) delete state.flags[qId];
  saveAttempt();
  renderNav();
  renderCurrentQuestion();
}
function toggleGuessed(qId) {
  state.guessed[qId] = !state.guessed[qId];
  if (!state.guessed[qId]) delete state.guessed[qId];
  saveAttempt();
  renderCurrentQuestion();
}

function navPrev() {
  if (state.currentSection === 'B') {
    if (state.currentIdx > 0) state.currentIdx--;
    else { state.currentSection = 'A'; state.currentIdx = totalQsA() - 1; }
  } else if (state.currentIdx > 0) {
    state.currentIdx--;
  }
  saveAttempt();
  renderNav();
  renderCurrentQuestion();
  window.scrollTo({ top: 0 });
}
function navNext() {
  if (state.currentSection === 'A') {
    if (state.currentIdx < totalQsA() - 1) state.currentIdx++;
    else { state.currentSection = 'B'; state.currentIdx = 0; }
  } else if (state.currentIdx < totalMtqs() - 1) {
    state.currentIdx++;
  }
  saveAttempt();
  renderNav();
  renderCurrentQuestion();
  window.scrollTo({ top: 0 });
}

// ---- Review screen ----

function confirmSubmit() {
  showModal(`
    <h2>Submit attempt?</h2>
    <p>Your answers will be locked and marked. Time taken will be recorded. This can't be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel · keep working</button>
      <button class="btn btn-success" onclick="closeModal(); finalizeSubmission(false);">Submit now</button>
    </div>
  `);
}

// ---- Marking ----
function markOT(q, ans) {
  // Returns { correct: bool, earned: int }
  if (q.questionType === 'mcq') {
    if (!ans) return { correct: false, earned: 0 };
    return { correct: ans === q.correctAnswer, earned: ans === q.correctAnswer ? q.marks : 0 };
  }
  if (q.questionType === 'multi') {
    const arr = Array.isArray(ans) ? ans : [];
    const correctSet = new Set(q.correctOptions || []);
    const userSet = new Set(arr);
    const exact = correctSet.size === userSet.size && [...correctSet].every(x => userSet.has(x));
    return { correct: exact, earned: exact ? q.marks : 0 };
  }
  if (q.questionType === 'number') {
    const num = parseFloat(String(ans).replace(/,/g, ''));
    if (isNaN(num)) return { correct: false, earned: 0 };
    const tol = q.tol != null ? q.tol : 1;
    const ok = Math.abs(num - q.numAns) <= tol;
    return { correct: ok, earned: ok ? q.marks : 0 };
  }
  return { correct: false, earned: 0 };
}

function markMTQPart(p, ans) {
  if (p.questionType === 'number') {
    const num = parseFloat(String(ans).replace(/,/g, ''));
    if (isNaN(num)) return { correct: false, earned: 0 };
    const tol = p.tol != null ? p.tol : 1;
    const ok = Math.abs(num - p.numAns) <= tol;
    return { correct: ok, earned: ok ? p.marks : 0 };
  }
  if (p.questionType === 'mcq') {
    if (!ans) return { correct: false, earned: 0 };
    return { correct: ans === p.correctAnswer, earned: ans === p.correctAnswer ? p.marks : 0 };
  }
  if (p.questionType === 'multi') {
    const arr = Array.isArray(ans) ? ans : [];
    const correctSet = new Set(p.correctOptions || []);
    const userSet = new Set(arr);
    const exact = correctSet.size === userSet.size && [...correctSet].every(x => userSet.has(x));
    return { correct: exact, earned: exact ? p.marks : 0 };
  }
  return { correct: false, earned: 0 };
}

function finalizeSubmission(timedOut) {
  if (!state || state.submitted) return;
  stopTimer();
  state.submitted = true;
  state.completedAt = new Date().toISOString();
  state.timedOut = !!timedOut;

  // Build per-question results and section scores
  const pool = POOLS[state.pool];
  const questionResults = [];

  let sectionAScore = 0, sectionAPossible = 0;
  pool.questions.forEach(q => {
    const ans = state.answers[q.qId];
    const { correct, earned } = markOT(q, ans);
    sectionAScore += earned;
    sectionAPossible += q.marks;
    questionResults.push({
      qId: q.qId,
      displayIdx: q.displayIdx,
      section: 'A',
      subTopic: q.subTopic,
      difficulty: q.difficulty,
      questionType: q.questionType,
      marks: q.marks,
      earned,
      correct,
      userAnswer: formatUserAnswer(q.questionType, ans),
      correctAnswer: q.correctAnswer,
      guessed: !!state.guessed[q.qId],
      flagged: !!state.flags[q.qId],
      timeIdeal: q.timeIdeal || 0,
      timeSpent: 0  // not tracked per-question; could enhance later
    });
  });

  let sectionBScore = 0, sectionBPossible = 0;
  pool.mtqs.forEach(mtq => {
    const partResults = [];
    let mtqEarned = 0;
    mtq.parts.forEach(p => {
      const ans = (state.answers[mtq.qId] || {})[p.part];
      const { correct, earned } = markMTQPart(p, ans);
      mtqEarned += earned;
      sectionBScore += earned;
      sectionBPossible += p.marks;
      partResults.push({
        part: p.part,
        marks: p.marks,
        earned,
        correct,
        questionType: p.questionType,
        userAnswer: formatUserAnswer(p.questionType, ans),
        correctAnswer: p.correctAnswer || (p.numAns != null ? String(p.numAns) : '')
      });
      // Also push each part as a "question" for dashboard sub-topic analysis
      questionResults.push({
        qId: mtq.qId + '_' + p.part,
        displayIdx: mtq.displayIdx + ' ' + p.part,
        section: 'B',
        subTopic: mtq.subTopic,
        difficulty: 'hard',
        questionType: p.questionType,
        marks: p.marks,
        earned,
        correct,
        userAnswer: formatUserAnswer(p.questionType, ans),
        correctAnswer: p.correctAnswer || (p.numAns != null ? String(p.numAns) : ''),
        guessed: false,
        flagged: false,
        isMtqPart: true,
        mtqTitle: mtq.title
      });
    });
    state._mtqResults = state._mtqResults || {};
    state._mtqResults[mtq.qId] = { partResults, totalEarned: mtqEarned, totalPossible: mtq.totalMarks };
  });

  state.totalScore = sectionAScore + sectionBScore;
  state.totalPossible = sectionAPossible + sectionBPossible;
  state.totalMarks = state.totalPossible;
  state.sectionAScore = sectionAScore;
  state.sectionAPossible = sectionAPossible;
  state.sectionBScore = sectionBScore;
  state.sectionBPossible = sectionBPossible;
  state.questions = questionResults;
  state.pct = state.totalPossible ? (state.totalScore / state.totalPossible) * 100 : 0;
  state.grade = state.pct >= PASS_MARK_PCT ? 'PASS' : 'FAIL';

  // Save to history
  const hist = loadHistory();
  hist[state.pool] = hist[state.pool] || [];
  hist[state.pool].push({
    attemptNum: state.attemptNum,
    completedAt: state.completedAt,
    totalScore: state.totalScore,
    totalPossible: state.totalPossible,
    pct: state.pct,
    grade: state.grade,
    timeUsed: TIME_LIMIT_SEC - state.timeRemaining
  });
  saveHistory(hist);

  // Clear in-progress attempt slot
  clearAttempt(state.pool);

  // Queue sync to dashboard
  queueDashboardSync(state);

  if (!timedOut) renderResults();
}

function formatUserAnswer(type, ans) {
  if (ans == null || ans === '') return '';
  if (type === 'multi') return Array.isArray(ans) ? ans.join(',') : String(ans);
  return String(ans);
}

// ---- Results view ----
function renderResults() {

  // MTQ result rows

  view().innerHTML = `
    <!-- Print-only header (visible only when printing mistakes) -->
    <div class="print-only" style="border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:14px">
      <h2 style="font-size:18pt;margin-bottom:4px;color:#003d6b">FA · Consolidation — Mistakes for Revision</h2>
      <div style="font-size:10pt;color:#555;line-height:1.6">
        <strong>Pool ${state.pool}</strong> · Attempt #${state.attemptNum} ·
        Score: <strong>${state.totalScore}/${state.totalPossible} (${state.pct.toFixed(1)}%)</strong> ·
        ${state.grade} ·
        Completed ${new Date(state.completedAt).toLocaleString()} ·
        Time used ${fmtTime(TIME_LIMIT_SEC - state.timeRemaining)}
      </div>
      <div style="font-size:9pt;color:#888;margin-top:4px">
        This document shows only the questions you got wrong or skipped, with full deeper explanations for revision.
      </div>
    </div>

    <div class="card no-print" style="text-align:center;padding:32px">
      <div class="grade-pill ${gradeClass}">${state.grade}</div>
      <div class="score-display">${state.totalScore}<small>/${state.totalPossible}</small></div>
      <div class="score-pct">${state.pct.toFixed(1)}% · Pass mark ${PASS_MARK_PCT}%</div>
      <div style="margin-top:8px;color:var(--text-muted);font-size:13px">
        Pool ${state.pool} · Attempt #${state.attemptNum} · Time used ${fmtTime(TIME_LIMIT_SEC - state.timeRemaining)}${state.timedOut ? ' (timed out)' : ''}
      </div>
      <div class="metric-grid">
        <div class="metric-card">
          <div class="metric-num">${state.sectionAScore}/${state.sectionAPossible}</div>
          <div class="metric-label">Section A (OT)</div>
        </div>
        <div class="metric-card">
          <div class="metric-num">${state.sectionBScore}/${state.sectionBPossible}</div>
          <div class="metric-label">Section B (MTQ)</div>
        </div>
        <div class="metric-card">
          <div class="metric-num">${state.questions.filter(q => q.section === 'A' && q.correct).length}</div>
          <div class="metric-label">OT correct</div>
        </div>
        <div class="metric-card">
          <div class="metric-num">${state.questions.filter(q => q.section === 'A' && q.userAnswer === '').length}</div>
          <div class="metric-label">OT skipped</div>
        </div>
      </div>
      <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-success" onclick="printMistakes()">🖨️ Print mistakes (PDF)</button>
        <button class="btn" onclick="manualSync()">📊 Sync to Dashboard</button>
        <button class="btn btn-secondary" onclick="openDashboard()">Open Dashboard</button>
        <button class="btn btn-secondary" onclick="downloadAttempts()">⬇️ Download JSON</button>
        <button class="btn btn-secondary" onclick="goHome()">← Home</button>
      </div>
    </div>

    <div class="card no-print">
      <div class="card-title">Sub-topic performance</div>
      <div class="card-subtitle">Use this to identify weak areas. Green ≥70%, amber 50-69%, red &lt;50%.</div>
      ${subTopicStats.map(s => {
        const cls = s.pct >= 70 ? '' : s.pct >= 50 ? 'medium' : 'weak';
        return `<div class="subtopic-bar ${cls}">
          <div>
            <div class="label">${escapeHtml(s.name)}</div>
            <div class="meter"><div class="fill" style="width:${s.pct}%"></div></div>
          </div>
          <div class="pct">${s.earned}/${s.marks} · ${s.pct.toFixed(0)}%</div>
        </div>`;
      }).join('')}
    </div>

    <div class="card">
      <div class="card-title">Section A · Question-by-question review</div>
      <div class="card-subtitle no-print">Tap any question for the full 6-layer explanation. Marked-as-guess questions are highlighted in the dashboard's Review tab.</div>
      ${otRows}
    </div>

    <div class="card">
      <div class="card-title">Section B · MTQ review</div>
      <div class="card-subtitle no-print">Each MTQ shows your answer vs the correct answer for every part, plus the model working.</div>
      ${mtqRows}
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function computeSubTopicStats() {
  const map = {};
  state.questions.forEach(q => {
    if (!map[q.subTopic]) map[q.subTopic] = { name: q.subTopic, marks: 0, earned: 0 };
    map[q.subTopic].marks += q.marks;
    map[q.subTopic].earned += q.earned;
  });
  return Object.values(map).map(s => ({ ...s, pct: s.marks ? s.earned / s.marks * 100 : 0 }))
    .sort((a, b) => a.pct - b.pct);
}

function renderResultRow(q, _) {
  const qr = state.questions.find(x => x.qId === q.qId);
  if (!qr) return '';
  let cls = qr.correct ? 'correct' : (qr.userAnswer === '' ? 'skip' : 'wrong');
  let summary = '';
  if (q.questionType === 'mcq') summary = `Your: <strong>${qr.userAnswer || '—'}</strong> · Correct: <strong>${qr.correctAnswer}</strong>`;
  else if (q.questionType === 'multi') summary = `Your: <strong>${qr.userAnswer || '—'}</strong> · Correct: <strong>${(q.correctOptions || []).join(',')}</strong>`;
  else summary = `Your: <strong>${qr.userAnswer || '—'}</strong> · Correct: <strong>${q.prefix || '$'}${q.numAns.toLocaleString()}</strong>`;

  return `<div class="result-q ${cls}" id="rq_${q.qId}">
    <div class="result-q-header" onclick="document.getElementById('rq_${q.qId}').classList.toggle('expanded')">
      <div class="result-q-left">
        <div class="result-q-num">Q${q.displayIdx}</div>
        <div class="result-q-summary">${summary}</div>
      </div>
      <div class="result-q-tags">
        <span class="result-q-tag diff-${q.difficulty}">${q.difficulty}</span>
        <span class="result-q-tag">${escapeHtml(q.subTopic)}</span>
        ${qr.guessed ? '<span class="result-q-tag" style="color:var(--neutral)">guessed</span>' : ''}
        ${qr.flagged ? '<span class="result-q-tag" style="color:var(--warning)">flagged</span>' : ''}
      </div>
      <div class="result-q-marks ${qr.correct ? 'correct' : 'wrong'}">${qr.earned}/${q.marks}</div>
    </div>
    <div class="result-q-body">
      ${q.scenario ? `<div class="expl-section"><div class="expl-label">Scenario</div><div class="q-scenario" style="margin:0">${escapeHtml(q.scenario)}</div></div>` : ''}
      <div class="expl-section"><div class="expl-label">Question</div><div class="expl-content">${escapeHtml(q.questionText)}</div></div>
      ${q.questionType !== 'number' ? renderOptionsReview(q, qr) : ''}
      <div class="expl-section"><div class="expl-label">Layer 1 · Concept</div><div class="expl-content">${escapeHtml(q.explanationLayer1)}</div></div>
      <div class="expl-section"><div class="expl-label">Layer 2 · Working</div><div class="expl-content working">${escapeHtml(q.workingShown)}</div></div>
      <div class="expl-section"><div class="expl-label">Layer 3 · IFRS reference</div><div class="expl-content">${escapeHtml(q.explanationLayer3)}</div></div>
      <div class="expl-section"><div class="expl-label">Layer 4 · Examiner's note</div><div class="expl-content">${escapeHtml(q.examinerNote)}</div></div>
      <div class="expl-section"><div class="expl-label">Layer 5 · Teacher's commentary</div><div class="expl-content">${escapeHtml(q.teacherCommentary)}</div></div>
      ${q.advancedContext ? `<div class="expl-section"><div class="expl-label">Layer 6 · Interlinking / FR preview</div><div class="expl-content">${escapeHtml(q.advancedContext)}</div></div>` : ''}
    </div>
  </div>`;
}

function renderOptionsReview(q, qr) {
  let html = `<div class="expl-section"><div class="expl-label">Option-by-option</div>`;
  q.options.forEach(o => {
    const userSelected = q.questionType === 'multi'
      ? (qr.userAnswer || '').split(',').includes(o.letter)
      : qr.userAnswer === o.letter;
    let cls = '';
    if (o.correct) cls += ' correct';
    if (userSelected) cls += ' user-selected';
    if (userSelected && !o.correct) cls += ' wrong';
    html += `<div class="opt-result${cls}">
      <span class="letter">${o.letter}.</span> ${escapeHtml(o.text)}
      <div class="why">${escapeHtml(o.why)}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderMtqResultRow(mtq) {
  const mres = (state._mtqResults || {})[mtq.qId];
  if (!mres) return '';
  const cls = mres.totalEarned === mres.totalPossible ? 'correct' : (mres.totalEarned === 0 ? 'wrong' : '');
  const partsHtml = mtq.parts.map(p => {
    const pr = mres.partResults.find(x => x.part === p.part);
    if (!pr) return '';
    return `<div style="border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:10px;background:var(--bg-card)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div><strong>Part ${p.part}</strong> · ${escapeHtml(p.prompt.slice(0, 90))}${p.prompt.length > 90 ? '…' : ''}</div>
        <div style="font-weight:700;color:${pr.correct ? 'var(--success)' : 'var(--danger)'}">${pr.earned}/${p.marks}</div>
      </div>
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">
        Your answer: <strong>${escapeHtml(pr.userAnswer || '—')}</strong> · Correct: <strong>${escapeHtml(p.questionType === 'number' ? (p.prefix || '$') + p.numAns.toLocaleString() : pr.correctAnswer)}</strong>
      </div>
      <details>
        <summary style="cursor:pointer;font-size:12px;color:var(--primary);font-weight:500">Show model answer &amp; workings</summary>
        <div class="expl-content working" style="margin-top:8px">${escapeHtml(p.modelAnswer)}</div>
      </details>
    </div>`;
  }).join('');

  return `<div class="result-q ${cls}" id="rmtq_${mtq.qId}" style="background:var(--bg-card)">
    <div class="result-q-header" onclick="document.getElementById('rmtq_${mtq.qId}').classList.toggle('expanded')">
      <div class="result-q-left">
        <div class="result-q-num">MTQ ${mtq.displayIdx - 30}</div>
        <div class="result-q-summary"><strong>${escapeHtml(mtq.title.slice(0, 80))}${mtq.title.length > 80 ? '…' : ''}</strong></div>
      </div>
      <div class="result-q-marks ${mres.totalEarned === mres.totalPossible ? 'correct' : (mres.totalEarned === 0 ? 'wrong' : '')}">${mres.totalEarned}/${mres.totalPossible}</div>
    </div>
    <div class="result-q-body">
      ${mtq.scenario ? `<div class="expl-section"><div class="expl-label">Scenario</div><div class="q-scenario" style="margin:0">${escapeHtml(mtq.scenario)}</div></div>` : ''}
      ${state.mtqWorking[mtq.qId] ? `<div class="expl-section"><div class="expl-label">Your working notes</div><div class="expl-content working">${escapeHtml(state.mtqWorking[mtq.qId])}</div></div>` : ''}
      ${partsHtml}
      <div class="expl-section"><div class="expl-label">Examiner's note</div><div class="expl-content">${escapeHtml(mtq.examinerNote)}</div></div>
      <div class="expl-section"><div class="expl-label">Teacher's commentary</div><div class="expl-content">${escapeHtml(mtq.teacherCommentary)}</div></div>
    </div>
  </div>`;
}

// ---- Sync to dashboard ----
function buildAttemptJSON(s) {
  // Schema matches dashboard's expected single-topic attempt format
  return {
    topic: TOPIC_NAME,
    attempts: [{
      poolName: s.pool,
      attemptNum: s.attemptNum,
      startedAt: s.startedAt,
      completedAt: s.completedAt,
      totalScore: s.totalScore,
      totalPossible: s.totalPossible,
      totalMarks: s.totalMarks,
      sectionAScore: s.sectionAScore,
      sectionAPossible: s.sectionAPossible,
      sectionBScore: s.sectionBScore,
      sectionBPossible: s.sectionBPossible,
      timeUsed: TIME_LIMIT_SEC - s.timeRemaining,
      timedOut: !!s.timedOut,
      grade: s.grade,
      pct: s.pct,
      questions: s.questions,
      schemaVersion: 3
    }]
  };
}

function queueDashboardSync(s) {
  try {
    const queue = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]');
    queue.push(buildAttemptJSON(s));
    localStorage.setItem(PENDING_KEY, JSON.stringify(queue));
  } catch (e) {
    console.error('Sync queue failed', e);
  }
}

function manualSync() {
  // Re-queue everything in history that isn't already pending
  const hist = loadHistory();
  let count = 0;
  ['A', 'B'].forEach(pool => {
    (hist[pool] || []).forEach(h => {
      // For manual resync from summary history we have only basic data — but if state matches latest, push the full one.
      // To support full re-sync we'd need to keep full attempt details. For now, just inform user.
    });
  });
  // The current `state` if just-submitted is already queued. For history-only re-sync we'd need fuller data.
  toast('Sync queued. Open dashboard to import.', 'success');
}

function openDashboard() {
  window.open(DASHBOARD_URL, '_blank');
}

function downloadAttempts() {
  const hist = loadHistory();
  const out = { topic: TOPIC_NAME, history: hist, schemaVersion: 3 };
  // Include last completed full attempt if available
  if (state && state.submitted) {
    out.lastAttempt = buildAttemptJSON(state);
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `consolidation_attempts_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function confirmClearHistory() {
  showModal(`
    <h2>Clear local history?</h2>
    <p>This wipes all stored Consolidation attempts and in-progress drafts on THIS device. The dashboard's stored data is unaffected (sync there separately).</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="doClearHistory()">Clear all</button>
    </div>
  `);
}
function doClearHistory() {
  Object.keys(localStorage).filter(k => k.startsWith(STORAGE_PREFIX)).forEach(k => localStorage.removeItem(k));
  closeModal();
  toast('History cleared', 'warn');
  renderHome();
}

function printMistakes() {
  // Add class to body to scope @media print rules
  document.body.classList.add('printing-mistakes');
  // Expand all non-correct result-q items so explanations are visible
  document.querySelectorAll('.result-q').forEach(el => {
    if (!el.classList.contains('correct')) el.classList.add('expanded');
  });
  // Cleanup after print dialog closes
  const cleanup = () => {
    document.body.classList.remove('printing-mistakes');
    document.querySelectorAll('.result-q.expanded').forEach(el => el.classList.remove('expanded'));
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  // Small delay so DOM updates flush before print
  setTimeout(() => window.print(), 150);
}

// ---- Boot ----
window.addEventListener('DOMContentLoaded', () => {
  renderHome();
  // Click on backdrop to close modal
  $('#modal-backdrop').addEventListener('click', e => {
    if (e.target.id === 'modal-backdrop') closeModal();
  });
});


</script>
