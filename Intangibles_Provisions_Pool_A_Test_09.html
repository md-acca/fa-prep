const QBANK=[{"qId": "INTPROV_A_Q1", "displayIdx": 1, "type": "ot", "questionType": "mcq", "subTopic": "Intangible Asset Definition", "difficulty": "easy", "marks": 2, "timeIdeal": 80, "scenario": "Westfield Pharmaceuticals plc is reviewing its statement of financial position. The finance team must correctly identify which assets qualify as intangible non-current assets.", "questionText": "Which of the following BEST defines an intangible asset per IAS 38 Intangible Assets?", "options": [{"letter": "A", "text": "A non-current asset that has a limited physical life", "correct": false, "why": "This describes physical assets that wear out over time. Intangible assets by definition lack physical substance — this option confuses physical life with physical substance."}, {"letter": "B", "text": "An identifiable non-monetary asset without physical substance", "correct": true, "why": "CORRECT — Per IAS 38 para 8, an intangible asset is 'an identifiable non-monetary asset without physical substance'. The three key characteristics are: controlled from past events, lacks physical substance, and is identifiable (separately distinguishable from goodwill)."}, {"letter": "C", "text": "Any asset purchased for ongoing use in the business over multiple periods", "correct": false, "why": "This defines a non-current asset broadly — it would include tangible assets like machinery and vehicles. The absence of physical substance is the distinguishing feature of intangibles."}, {"letter": "D", "text": "A purchased asset that cannot be physically touched", "correct": false, "why": "This option implies only purchased assets qualify — incorrect. Internally generated development costs that meet IAS 38 criteria can also be recognised. The definition is not limited to purchased assets."}], "correctAnswer": "B", "explanationLayer1": "Tests the IAS 38 para 8 definition of an intangible asset. The three-part test — controlled, lacks physical substance, identifiable — distinguishes intangibles from tangible NCA and from goodwill.", "explanationLayer3": "IAS 38 para 8: 'an intangible asset is an identifiable non-monetary asset without physical substance'. Kaplan FA Study Text Ch 8, Section 2.", "workingShown": "IAS 38 definition breakdown:\n\n  Identifiable:         Separately distinguishable from goodwill\n                        Can be separated and sold, licensed, rented\n  Non-monetary:         Not cash or a claim to cash\n  Without physical      The asset has no physical form\n  substance:\n\nExamples:\n  Patents, licences, brands, franchises,\n  customer lists, development costs\n\nContrast with PPE (IAS 16):\n  PPE = tangible (has physical substance)\n  Intangibles = no physical form", "examinerNote": "The exam tests this by including option D ('purchased') as a trap. Many students think only purchased intangibles can be recognised, but internally generated development costs CAN be capitalised if the PIRATE criteria are met. Option A is the other common error — confusing physical life (depreciation concept) with physical substance.", "advanced": "IAS 38 prohibits recognition of internally generated goodwill, brands, mastheads, publishing titles, customer lists and similar items — even though they meet the broad definition. The standard takes a conservative view because their costs cannot be reliably measured separately from the business as a whole.", "teacherCommentary": {"concept": "Identifiable + non-monetary + no physical substance = intangible asset. All three parts needed.", "process": "Check: (1) Can it be separated/identified? (2) No cash/cash claim? (3) No physical form? All yes = intangible.", "everyday": "A patent (no physical form, identifiable right) = intangible. A machine (physical form) = tangible. A customer relationship that grew organically = not identifiable enough to capitalize."}}, {"qId": "INTPROV_A_Q2", "displayIdx": 2, "type": "ot", "questionType": "mcq", "subTopic": "Research Definition", "difficulty": "easy", "marks": 2, "timeIdeal": 80, "scenario": "Braynee Co is a technology firm engaged in a variety of scientific activities. The finance team must classify each activity as either research or development under IAS 38.", "questionText": "Which of the following activities BEST represents research as defined by IAS 38?", "options": [{"letter": "A", "text": "Applying research findings to design a prototype of a new product", "correct": false, "why": "Applying research findings to design a prototype is development, not research. Development = 'application of research findings...to a plan or design for production' (IAS 38 para 8)."}, {"letter": "B", "text": "Testing prototypes to confirm they work before commercial production begins", "correct": false, "why": "Testing prototypes is a development activity — it occurs after research findings have been applied to create a working model."}, {"letter": "C", "text": "Original investigation to gain new scientific or technical knowledge and understanding", "correct": true, "why": "CORRECT — IAS 38 para 8 defines research as 'original and planned investigation undertaken with the prospect of gaining new scientific or technical knowledge and understanding'. This is the foundational phase before any product or process is designed."}, {"letter": "D", "text": "Work undertaken once technical feasibility to complete a new product has been established", "correct": false, "why": "Technical feasibility being established is one of the IAS 38 PIRATE criteria for capitalising development costs. This describes a stage within development, not research."}], "correctAnswer": "C", "explanationLayer1": "Tests IAS 38 para 8 research definition. Research = pure investigation for new knowledge. Development = applying that knowledge to design/produce something specific.", "explanationLayer3": "IAS 38 para 8: Research = 'original and planned investigation undertaken with the prospect of gaining new scientific or technical knowledge and understanding'. Kaplan FA Study Text Ch 8, Section 3.", "workingShown": "IAS 38 definitions:\n\n  RESEARCH:\n    Original and planned investigation\n    Goal: gain new scientific/technical knowledge\n    Example: testing whether substance X has\n             heat-resistant properties (Kaplan TYU 2)\n    Treatment: ALWAYS expense to P/L\n\n  DEVELOPMENT:\n    Application of research findings to a plan/design\n    Goal: produce new/improved product/process\n    Example: using discovery to design a heat-resistant suit\n    Treatment: capitalize IF PIRATE criteria all met", "examinerNote": "The key distinguishing word is 'investigation' vs 'application'. Research = investigating for new knowledge. Development = applying that knowledge to build something. The Kaplan TYU 2 example (flubber investigation = research; using flubber to design stuntman suit = development) is a perfect exam-style distinction.", "advanced": "In practice the boundary between research and development can be blurred. IAS 38 requires the entity to use judgement. If it cannot reliably separate research and development expenditure in a mixed project, the entire amount is treated as research and expensed.", "teacherCommentary": {"concept": "Research = investigation for new knowledge. Development = applying knowledge to build/design.", "process": "Research: 'Can we?' Development: 'How do we?' If still asking 'can it be done?' = research. If building/designing = development.", "everyday": "Scientist testing whether compound X has heat resistance = research. Engineer using that discovery to design a new fire suit = development."}}, {"qId": "INTPROV_A_Q3", "displayIdx": 3, "type": "ot", "questionType": "mcq", "subTopic": "Research Expenditure Treatment", "difficulty": "easy", "marks": 2, "timeIdeal": 80, "scenario": "Cloverdale Biotech Ltd has incurred £480,000 in various scientific investigation activities during the year. None of the projects have yet reached the stage where technical feasibility has been demonstrated.", "questionText": "How must Cloverdale Biotech treat the £480,000 of research expenditure in its financial statements?", "options": [{"letter": "A", "text": "Capitalise as an intangible asset if the directors believe the research will lead to profitable products", "correct": false, "why": "Directors' belief is irrelevant to the accounting treatment of research. IAS 38 does not permit capitalisation of research expenditure under any circumstances — not even if management are convinced of success."}, {"letter": "B", "text": "Capitalise the portion that relates to projects which are technically feasible to complete", "correct": false, "why": "Technical feasibility is one of the PIRATE criteria for development costs — NOT for research. Research expenditure is always expensed regardless of technical feasibility."}, {"letter": "C", "text": "Expense the full £480,000 to the statement of profit or loss as incurred", "correct": true, "why": "CORRECT — Per IAS 38, ALL research expenditure must be written off to the statement of profit or loss as it is incurred. There are no exceptions and no conditions — research is never capitalised."}, {"letter": "D", "text": "Capitalise any research costs that will generate probable future economic benefits", "correct": false, "why": "Probable future economic benefits is a general asset recognition criterion, but IAS 38 specifically overrides this for research: research costs are always expensed. The probability of benefits does not change this."}], "correctAnswer": "C", "explanationLayer1": "Tests the absolute rule for research: always expense to P/L, no conditions, no exceptions. All four options test different misconceptions about potential capitalisation of research.", "explanationLayer3": "IAS 38: 'All research expenditure should be written off to the statement of profit or loss as it is incurred.' Kaplan FA Study Text Ch 8, Section 3. Complies with the prudence concept.", "workingShown": "Research expenditure rule (IAS 38) — ABSOLUTE:\n\n  Research = ALWAYS expense to P/L\n  No conditions. No exceptions.\n  Reason: prudence concept (cannot reliably\n          predict future benefits from research)\n\n  Even if directors are confident = expense\n  Even if technically feasible = expense\n  Even if company has resources to develop = expense\n\n  Journal:\n    Dr Research expense (P/L)    480,000\n      Cr Bank/Accruals                480,000\n\n  Note: Research EQUIPMENT (physical) is PPE,\n  depreciated per IAS 16 (not expensed under IAS 38)", "examinerNote": "All four wrong options test different 'conditional capitalisation' scenarios. The absolute nature of the rule is the key exam point: it does not matter how confident management are, how feasible the technology is, or how profitable the outcome might be. Research is ALWAYS expensed.", "advanced": "Once research costs have been expensed to the P/L, they cannot subsequently be reinstated as an asset even if the development later succeeds commercially (Kaplan ST Ch 8). This is different from other areas where estimates change.", "teacherCommentary": {"concept": "Research = always expense. Zero exceptions. This is one of IAS 38's hard rules.", "process": "No analysis needed for research. Identify it as research → expense immediately.", "everyday": "Drug company spends £1m investigating a new molecule. It goes to P/L. Simple. Even if they later discover it cures cancer, the original research costs cannot be put back on the balance sheet."}}, {"qId": "INTPROV_A_Q4", "displayIdx": 4, "type": "ot", "questionType": "mcq", "subTopic": "IAS 38 PIRATE Capitalisation Criteria", "difficulty": "medium", "marks": 2, "timeIdeal": 110, "scenario": "Ferndale Co is developing a new pharmaceutical drug. At the current year end, the following facts are established: the drug formulation is scientifically sound, clinical trials are underway, regulatory approval is expected, and Ferndale has funding secured. However, a competitor has filed a similar patent application.", "questionText": "Which of the following is a specific IAS 38 criterion that must be met for development costs to be capitalised?", "options": [{"letter": "A", "text": "Ferndale must have applied for and received patent protection for the product", "correct": false, "why": "IAS 38 does not require a patent to be filed or granted as a condition for capitalising development costs. Legal protection is not one of the six criteria."}, {"letter": "B", "text": "The project must have received formal board approval and a business case", "correct": false, "why": "Board approval and business cases are good governance practice but are not specified in IAS 38 as criteria for capitalisation. The standard focuses on technical, financial and commercial feasibility."}, {"letter": "C", "text": "It must be technically feasible to complete the asset so that it will be available for use or sale", "correct": true, "why": "CORRECT — Technical feasibility is one of the six IAS 38 (PIRATE) criteria: 'Technical feasibility to complete the asset, so that it will be available for use or sale'. All six must be met; if any one fails, development costs must be expensed."}, {"letter": "D", "text": "The project must demonstrate a return within two years of commercial production commencing", "correct": false, "why": "IAS 38 has no time limit for returns. The criterion is that the project is 'expected to be profitable' (benefits exceed costs) — with no specific timeframe attached."}], "correctAnswer": "C", "explanationLayer1": "Tests knowledge of the six PIRATE criteria for capitalising development costs per IAS 38. Technical feasibility is explicitly listed in IAS 38 and in the Kaplan Study Text Ch 8.", "explanationLayer3": "IAS 38 PIRATE criteria — Kaplan FA Study Text Ch 8, Section 3: Probable benefits, Intention to complete, Reliable measurement, Adequate resources, Technical feasibility, Expected to be profitable.", "workingShown": "IAS 38 Development capitalisation criteria — PIRATE:\n\n  P  Probable inflow of economic benefit\n     (sales or internal cost savings)\n  I  Intention to complete AND use/sell the asset\n  R  Reliable measurement of development costs\n  A  Adequate financial and other resources to complete\n  T  Technical feasibility to complete the asset\n  E  Expected to be profitable (benefits exceed costs)\n\nALL SIX must be met simultaneously.\n\nIf ANY one criterion is not met:\n  → Expense development cost to P/L immediately\n\nOnce costs are expensed:\n  → Cannot be re-capitalised later", "examinerNote": "The PIRATE mnemonic is from Kaplan and makes this manageable. In exams, questions typically ask either to identify which is NOT a criterion (e.g. 'board approval', 'patent filed') or to classify a project as capitalise/expense based on which criteria are and aren't met.", "advanced": "There is an important asymmetry: if criteria are met, development costs MUST be capitalised (not optional). If criteria are not met, they MUST be expensed. There is no choice — unlike some other standards where entities can choose a policy.", "teacherCommentary": {"concept": "PIRATE = 6 criteria, all must be met. Miss one = expense everything.", "process": "Run through PIRATE checklist. Each one: yes or no? All six yes = capitalize. Any no = expense.", "everyday": "Think of PIRATE as a 6-point checklist for a new product. Can we build it? Do we want to? Can we fund it? Will it make money? Yes to all = put it on the balance sheet. Any no = write it off now."}}, {"qId": "INTPROV_A_Q5", "displayIdx": 5, "type": "ot", "questionType": "mcq", "subTopic": "Internally Generated Intangibles", "difficulty": "medium", "marks": 2, "timeIdeal": 110, "scenario": "Linford Holdings plc has the following items in its asset portfolio. The finance director is determining which can be recognised as intangible assets in the statement of financial position.", "questionText": "Which of the following may NOT be recognised as an intangible asset per IAS 38?", "options": [{"letter": "A", "text": "A patent purchased from a third-party inventor for £200,000", "correct": false, "why": "A purchased patent CAN be recognised as an intangible asset. It meets the IAS 38 definition: identifiable, non-monetary, no physical substance, and its cost can be reliably measured at £200,000."}, {"letter": "B", "text": "Development costs of £350,000 meeting all six IAS 38 criteria", "correct": false, "why": "Development costs that satisfy ALL six PIRATE criteria MUST be capitalised as an intangible asset. The £350,000 should appear on the statement of financial position."}, {"letter": "C", "text": "A brand name developed internally by the business over 15 years", "correct": true, "why": "CORRECT — IAS 38 specifically prohibits the recognition of internally generated brands, mastheads, publishing titles, customer lists and similar items. Even though the brand has real value, its development costs cannot be separately identified from the general cost of running the business."}, {"letter": "D", "text": "A five-year software licence purchased from a vendor for £45,000", "correct": false, "why": "A purchased software licence CAN be recognised as an intangible asset. It is identifiable (specific contractual rights for 5 years), purchased at reliably measurable cost of £45,000."}], "correctAnswer": "C", "explanationLayer1": "Tests IAS 38's prohibition on internally generated intangibles. The standard specifically lists brands, mastheads, publishing titles and customer lists as items that cannot be capitalised even when internally generated.", "explanationLayer3": "IAS 38: Internally generated goodwill, brands, mastheads, publishing titles, customer lists and similar items cannot be recognised as intangible assets. Kaplan FA Study Text Ch 8, Section 4.", "workingShown": "Internally generated — IAS 38 prohibition:\n\n  CANNOT recognize (internally generated):\n    Brands\n    Mastheads\n    Publishing titles\n    Customer lists\n    Goodwill\n\n  Reason: Cannot reliably separate the cost of\n  developing the brand from the general cost of\n  running the business.\n\n  CAN recognize:\n    Purchased brands (acquired from third party)\n    Purchased goodwill (business combination)\n    Development costs meeting PIRATE criteria\n    Purchased patents, licences, franchises", "examinerNote": "The trap is option C — students often think that because a brand has obvious value, it can be recognised. IAS 38 says no: internally generated brands fail the reliable measurement criterion because you can't separate brand-building costs from general marketing/operations costs.", "advanced": "When a company buys another business (business combination), any brand acquired as part of that acquisition IS recognised as an intangible asset at fair value. The prohibition applies only to brands developed internally — not those acquired through purchase.", "teacherCommentary": {"concept": "Internally generated brands/goodwill = cannot capitalise. Purchased ones = can capitalise.", "process": "Ask: was it bought from outside? Yes = can capitalise. Was it built internally from nothing? If brand/goodwill/title = cannot capitalise.", "everyday": "Coca-Cola's brand built over 130 years = not on their balance sheet. If they bought a smaller brand from another company = that brand IS on the balance sheet at cost."}}, {"qId": "INTPROV_A_Q6", "displayIdx": 6, "type": "ot", "questionType": "number", "subTopic": "Amortisation Calculation", "difficulty": "medium", "marks": 2, "timeIdeal": 110, "scenario": "Glenfield Co purchased a patent on 1 January 20X6 for £36,000. The patent has an estimated useful life of 9 years and no residual value. Glenfield uses the straight-line amortisation method and charges a full year's amortisation in the year of purchase.", "questionText": "Calculate the amortisation charge to be included in Glenfield Co's statement of profit or loss for the year ended 31 December 20X6 (in £).", "numAns": 4000, "tol": 50, "prefix": "£", "correctAnswer": "4000", "explanationLayer1": "Tests the basic amortisation calculation for intangible assets. Mirrors Kaplan EK Q210-212 pattern and Kaplan ST TYU 1 (£20,000 patent over 10 years = £2,000/year).", "explanationLayer3": "IAS 38 para 74: Cost model — carry at cost less accumulated amortisation and impairment. Kaplan FA Study Text Ch 8, Section 3: amortise on straight-line basis if pattern of consumption cannot be determined reliably.", "workingShown": "Amortisation calculation (straight-line):\n\n  Cost:                    £36,000\n  Residual value:               £0\n  Useful life:              9 years\n\n  Annual charge = (Cost - Residual) / Useful life\n               = (£36,000 - £0) / 9\n               = £4,000 per year\n\n  SFP extract at 31 December 20X6:\n    Intangible asset (cost):    £36,000\n    Less: accumulated amort:    (£4,000)\n                               ────────\n    Carrying amount:            £32,000\n\n  Journal:\n    Dr Amortisation expense  4,000\n      Cr Accumulated amortisation  4,000", "examinerNote": "IAS 38 says to use the straight-line method where the pattern of consumption cannot be determined reliably — which is most cases for intangibles. Unlike depreciation (PPE), there is no choice between methods for most intangibles. The exam calculation is identical to straight-line depreciation.", "advanced": "Under the cost model (IAS 38 para 74), the carrying amount = cost - accumulated amortisation - accumulated impairment losses. If there is an indication of impairment, IAS 36 Impairment of Assets applies and the carrying amount may need to be written down further.", "teacherCommentary": {"concept": "Amortisation = cost / useful life (straight-line). Identical formula to depreciation.", "process": "£36,000 / 9 years = £4,000. Carrying amount = £36,000 - £4,000 = £32,000.", "everyday": "£36k patent lasts 9 years. Each year it 'uses up' £4,000 of value. After year 1: £32,000 left."}}, {"qId": "INTPROV_A_Q7", "displayIdx": 7, "type": "ot", "questionType": "mcq", "subTopic": "When Amortisation Begins", "difficulty": "medium", "marks": 2, "timeIdeal": 100, "scenario": "Drybrook Co capitalised £250,000 of qualifying development costs during the year ended 31 December 20X5. The developed product received regulatory approval and commercial production commenced on 1 March 20X6. The expected useful life of the product is four years.", "questionText": "In which period should Drybrook Co begin amortising the capitalised development costs?", "options": [{"letter": "A", "text": "Year ended 31 December 20X5 — when the costs were first capitalised", "correct": false, "why": "Amortisation does NOT begin when costs are first capitalised. The asset is still being developed and has not yet begun generating revenue. No amortisation is charged during the capitalisation period."}, {"letter": "B", "text": "Year ended 31 December 20X6 — when commercial production commenced", "correct": true, "why": "CORRECT — Per IAS 38, amortisation commences when the asset is available for use/commercial exploitation begins. Commercial production started 1 March 20X6, so amortisation begins in the year ended 31 December 20X6, covering 10 months (March to December)."}, {"letter": "C", "text": "Year ended 31 December 20X7 — to allow the product to establish market revenues first", "correct": false, "why": "There is no IAS 38 rule requiring a 'settling-in period' before amortisation begins. Amortisation starts from the first month of commercial production — there is no deferral allowed."}, {"letter": "D", "text": "The amortisation period should begin when the project criteria were first met, retrospectively", "correct": false, "why": "Retrospective amortisation is not required or permitted under IAS 38. Amortisation is prospective from the start of commercial production/availability for use."}], "correctAnswer": "B", "explanationLayer1": "Tests when amortisation of capitalised development costs commences. Kaplan ST Ch 8 worked example: 'Amortisation should commence with commercial production and charged over the period over which the business expects to generate economic benefits.'", "explanationLayer3": "IAS 38 / Kaplan FA Study Text Ch 8, Section 3: 'Amortisation should commence with commercial production and charged over the period over which the business expects to generate economic benefits.' TYU 3 answer: £250,000/5 years from 1 January 20X6.", "workingShown": "When does amortisation start?\n\n  Development phase:  capitalise costs, NO amortisation\n  Commercial prod starts: amortisation BEGINS\n\n  Drybrook example:\n    Capitalisation period: year ended 31 Dec 20X5\n    (no amortisation in 20X5)\n\n    Commercial production: 1 March 20X6\n    (amortisation starts March 20X6)\n\n  Amortisation charge for year ended 31 Dec 20X6:\n    £250,000 / 4 years x 10/12\n    = £52,083 (10 months March-December)\n\n  Note: amortised over PERIOD generating benefits,\n  not the full year if production starts mid-year", "examinerNote": "This is one of the most commonly tested amortisation rules. Students often charge amortisation in the year costs are capitalised (wrong) or from the year following production (also wrong). The rule is: the year commercial production BEGINS, pro-rated from the start date.", "advanced": "In the Kaplan ST Illustration 1 (Brightspark Co), widgets expected to sell over 3 years from 20X6. Development costs of £900,000 are amortised in 20X6, 20X7 and 20X8 at £300,000/year. Zero amortisation in 20X5 when costs were incurred.", "teacherCommentary": {"concept": "Amortisation starts when commercial production begins. Not when capitalised. Not the year after.", "process": "Identify start of commercial production. Calculate months from that date to year end. Apply pro-rata.", "everyday": "Like a new restaurant: you spent money fitting out the kitchen (capitalised). You only start 'using up' that investment once you open for business."}}, {"qId": "INTPROV_A_Q8", "displayIdx": 8, "type": "ot", "questionType": "mcq", "subTopic": "Indefinite Useful Life Intangible", "difficulty": "medium", "marks": 2, "timeIdeal": 100, "scenario": "Stanwick Media plc holds a media brand that was acquired five years ago. After a detailed review, management conclude that there is no foreseeable limit to the period over which the brand will generate cash inflows. The brand has never shown signs of impairment.", "questionText": "What is the correct accounting treatment for Stanwick's media brand in the current year?", "options": [{"letter": "A", "text": "Amortise over a period not exceeding 20 years, using the straight-line method", "correct": false, "why": "IAS 38 does not specify a 20-year maximum amortisation period for intangible assets (unlike old UK GAAP). If the useful life is assessed as indefinite, NO amortisation is charged."}, {"letter": "B", "text": "Do not amortise; the brand should be subject to an annual impairment review", "correct": true, "why": "CORRECT — IAS 38: 'An intangible asset with an indefinite useful life should not be amortised.' Instead, it must be tested for impairment annually. This is because with no foreseeable limit to useful life, no systematic allocation of cost makes sense."}, {"letter": "C", "text": "Amortise over a maximum of 40 years as there is no reliable estimate of useful life", "correct": false, "why": "IAS 38 does not impose a 40-year cap. This was a feature of older standards. Under current IAS 38, indefinite useful life means NO amortisation — a specific impairment test instead."}, {"letter": "D", "text": "Do not amortise; impairment reviews are not required for indefinite life intangibles", "correct": false, "why": "The annual impairment review is specifically REQUIRED for indefinite life intangibles — it compensates for the absence of annual amortisation. Skipping the impairment review is not permitted."}], "correctAnswer": "B", "explanationLayer1": "Tests the indefinite useful life rule from IAS 38 and Kaplan ST Ch 8 Section 3. The two-part answer is: (1) no amortisation, (2) annual impairment review instead.", "explanationLayer3": "IAS 38 / Kaplan FA Study Text Ch 8 Section 3: 'An intangible asset with an indefinite useful life should not be amortised. Instead, it should be subject to an annual impairment review.' Kaplan EK Q203.", "workingShown": "Indefinite useful life rule (IAS 38):\n\n  Finite useful life:\n    Amortise over estimated useful life\n    (straight-line unless better method)\n\n  Indefinite useful life:\n    NO amortisation\n    Annual impairment review required instead\n\n  Annual impairment review:\n    Compare carrying amount vs recoverable amount\n    If carrying amount > recoverable amount:\n      Recognise impairment loss in P/L\n\n  Note: 'indefinite' does NOT mean 'infinite'\n  It means: no foreseeable limit at present\n  If circumstances change, must reassess", "examinerNote": "Option A (20 years) and C (40 years) test knowledge of old UK GAAP vs current IFRS. IAS 38 removed the arbitrary cap. Exams frequently include these as wrong answers because many students vaguely remember 'there's a maximum number of years' — that's old UK GAAP, not IAS 38.", "advanced": "Under IAS 36, the annual impairment test for indefinite life intangibles compares the carrying amount with the recoverable amount (higher of fair value less costs to sell and value in use). If carrying amount exceeds recoverable amount, the excess is charged to P/L as an impairment loss.", "teacherCommentary": {"concept": "Indefinite life = no amortisation + annual impairment check instead.", "process": "Finite life: spread cost over years. Indefinite life: keep at cost, but check every year if it's still worth that much.", "everyday": "A famous brand acquired in 1990 for £5m. Still going strong with no end in sight. Don't spread the £5m over years — just check each year if it's still worth at least £5m."}}, {"qId": "INTPROV_A_Q9", "displayIdx": 9, "type": "ot", "questionType": "number", "subTopic": "Development Cost Split — Criteria Met Mid-Year", "difficulty": "medium", "marks": 2, "timeIdeal": 130, "scenario": "Brindley Co commenced a development project on 1 March 20X5. The six IAS 38 capitalisation criteria were all met on 1 July 20X5. Project costs were incurred evenly at the same rate throughout the period from March to December 20X5. Total costs incurred over these 10 months amounted to £120,000.", "questionText": "Calculate the amount of development costs that should be capitalised as an intangible asset in the year ended 31 December 20X5 (in £).", "numAns": 72000, "tol": 500, "prefix": "£", "correctAnswer": "72000", "explanationLayer1": "Tests the fundamental rule for development cost split: only costs incurred AFTER the PIRATE criteria are first met can be capitalised. Costs before the criteria date = expense. Mirrors Kaplan EK Q214 (Merlot Co Project B).", "explanationLayer3": "IAS 38 / Kaplan FA Study Text Ch 8 Section 3: 'If development expenditure does not meet the criteria, it must be written off to P/L as incurred.' Kaplan EK Q214 is the direct exam precedent for this type of split question.", "workingShown": "Development cost split — key rule:\n\n  Before criteria met:    EXPENSE to P/L\n  After criteria met:     CAPITALISE as intangible\n\n  Timeline:\n    1 Mar 20X5: project starts\n    1 Jul 20X5: PIRATE criteria all met (capitalise from here)\n    31 Dec 20X5: year end\n\n  Monthly cost: £120,000 / 10 months = £12,000/month\n\n  EXPENSE (1 Mar - 30 Jun = 4 months):\n    4 x £12,000 = £48,000 to P/L\n\n  CAPITALISE (1 Jul - 31 Dec = 6 months):\n    6 x £12,000 = £72,000 as intangible asset\n\n  Check: £48,000 + £72,000 = £120,000 total ✓", "examinerNote": "The critical word is AFTER the criteria date. Many students include the month when criteria are first met as 'before' (expense) — the rule is that from 1 July, all costs are capitalised. Also common: including ALL 10 months = wrong; only the months after criteria met date.", "advanced": "Kaplan EK Q214 (Merlot Co Project B): criteria met 31 August, costs Jan-Aug = expense, Sep-Dec = capitalize. The exam always tests the split calculation. No IAS 38 mechanism allows previously expensed costs to be reinstated — the split is permanent.", "teacherCommentary": {"concept": "Criteria not yet met = expense. Criteria met = capitalise from that point forward.", "process": "Monthly cost = total / total months. Months before criteria date x monthly = expense. Months from criteria date x monthly = capitalise.", "everyday": "Like a job application: costs before you get the job offer = wasted. Costs from the day you start = legitimate investment in your career."}}, {"qId": "INTPROV_A_Q10", "displayIdx": 10, "type": "ot", "questionType": "mcq", "subTopic": "Provision Definition", "difficulty": "medium", "marks": 2, "timeIdeal": 90, "scenario": "A company's audit committee is reviewing year-end liabilities. Several items of uncertain timing and amount have been identified and the committee must determine whether each constitutes a provision.", "questionText": "Which of the following BEST defines a provision per IAS 37 Provisions, Contingent Liabilities and Contingent Assets?", "options": [{"letter": "A", "text": "An amount set aside for a known future expense", "correct": false, "why": "'Known future expense' describes an accrual — an amount owed for a service already received where the invoice has not yet arrived. A provision involves UNCERTAINTY about the timing or amount, which distinguishes it from a straightforward accrual."}, {"letter": "B", "text": "A liability of uncertain timing or amount", "correct": true, "why": "CORRECT — IAS 37 para 10 defines a provision as 'a liability of uncertain timing or amount'. The uncertainty is what separates provisions from regular trade payables and accruals."}, {"letter": "C", "text": "An expense accrued but not yet invoiced", "correct": false, "why": "This defines an accrual. Under accrual accounting, we accrue known expenses not yet invoiced. A provision has greater uncertainty — the timing, the amount, or both may be uncertain."}, {"letter": "D", "text": "An amount owed to a third party where payment is due within 12 months", "correct": false, "why": "This describes a current trade payable. Payables are known amounts owed under specific invoices. Provisions involve genuine uncertainty about whether, when, and how much will be paid."}], "correctAnswer": "B", "explanationLayer1": "Tests the IAS 37 para 10 definition of a provision. The distinguishing characteristic vs accruals and payables is the UNCERTAINTY of timing or amount.", "explanationLayer3": "IAS 37 para 10: 'A provision is a liability of uncertain timing or amount.' Kaplan FA Study Text Ch 11, Section 5.", "workingShown": "Three types of liability — comparison:\n\n  Trade payable:\n    Known amount, known creditor, awaiting payment\n    Example: supplier invoice for £5,000 received\n\n  Accrual:\n    Known expense, known amount (estimated), no invoice\n    Example: electricity used but bill not yet received\n\n  Provision:\n    UNCERTAIN timing or amount (or both)\n    Example: legal claim — don't know if you'll lose\n    or how much the court will award if you do\n\n  Key: the UNCERTAINTY is what makes it a provision", "examinerNote": "The word 'uncertain' is central. If both the amount AND timing are known with certainty, it's not a provision. Kaplan TYU 1 Madras Co: the legal costs of £5,000 (whether case won or lost) are CERTAIN to be incurred = provision. The £15,000 settlement = uncertain (depends on outcome) = contingent liability.", "advanced": "The Conceptual Framework defines a liability as 'a present obligation of the entity to transfer an economic resource as a result of past events'. IAS 37 further specifies that provisions are liabilities where uncertainty exists — subdividing the broader liability category.", "teacherCommentary": {"concept": "Provision = liability where timing OR amount (or both) is uncertain.", "process": "Three questions: (1) Do we owe something? (2) Is the amount certain? (3) Is when we'll pay certain? If both 2 and 3 are no = provision.", "everyday": "You know you'll get fined for a health and safety breach but don't know if it'll be £10k or £50k = provision. You got the fine letter saying £25,000 = trade payable."}}, {"qId": "INTPROV_A_Q11", "displayIdx": 11, "type": "ot", "questionType": "mcq", "subTopic": "IAS 37 Three Criteria", "difficulty": "medium", "marks": 2, "timeIdeal": 100, "scenario": "Moorfield Co is reviewing whether to recognise a provision in its financial statements for a possible warranty claim. The legal team is assessing the relevant facts against the IAS 37 criteria.", "questionText": "Which of the following is NOT one of the three criteria required by IAS 37 for recognition of a provision?", "options": [{"letter": "A", "text": "The entity has a present obligation (legal or constructive) as a result of a past event", "correct": false, "why": "This IS one of the three criteria. IAS 37 para 14(a): there must be a present obligation (legal or constructive) arising from a past event as a precondition for recognising a provision."}, {"letter": "B", "text": "It is probable that an outflow of resources embodying economic benefits will be required", "correct": false, "why": "This IS one of the three criteria. IAS 37 para 14(b): it must be probable that an outflow of resources will be needed to settle the obligation."}, {"letter": "C", "text": "A reliable estimate can be made of the amount of the obligation", "correct": false, "why": "This IS one of the three criteria. IAS 37 para 14(c): the obligation amount must be capable of reliable estimation. Without this, only a contingent liability disclosure is possible."}, {"letter": "D", "text": "The entity has obtained external legal advice confirming that the claim will succeed", "correct": true, "why": "CORRECT — This is NOT an IAS 37 criterion. IAS 37 does not require external legal advice as a condition for recognising a provision. The three criteria focus on obligation, probability and measurement — not on legal confirmation."}], "correctAnswer": "D", "explanationLayer1": "Tests knowledge of the exact three IAS 37 para 14 criteria by including a plausible but incorrect fourth option. The Kaplan TYU 1 answer (Madras Co) applies all three criteria explicitly.", "explanationLayer3": "IAS 37 para 14: A provision shall be recognised when (a) present obligation from past event, (b) probable outflow of resources, (c) reliable estimate possible. Kaplan FA Study Text Ch 11, Section 5.", "workingShown": "IAS 37 — Three criteria for a provision:\n\n  1. PRESENT OBLIGATION from a past event\n     (legal obligation from contract/law OR\n      constructive obligation from past practice)\n\n  2. PROBABLE outflow of economic benefits\n     (more likely than not the obligation will\n      require resources to settle)\n\n  3. RELIABLE ESTIMATE of the obligation\n     (can make a reasonable estimate of amount;\n      only in extremely rare cases is this impossible)\n\nALL THREE must be met to recognise a provision.\n\n  NOT required:\n    External legal advice\n    Board approval\n    Documentation of the claim\n    The event to have occurred after year end", "examinerNote": "Kaplan TYU 1 Madras Co applies these three criteria to each scenario: (i) legal costs £5,000 — obligation exists, probable (certain to be paid), reliable estimate = provision; (ii) customer refund policy — constructive obligation, probable, reliable = provision; (iii) customer claim £100,000 — probable outflow = provision.", "advanced": "In the extremely rare case where a reliable estimate cannot be made (IAS 37 says this is 'very rare'), the item is disclosed as a contingent liability rather than recognised as a provision. The exception proves the rule — almost all provisions can be reliably estimated.", "teacherCommentary": {"concept": "Three criteria: obligation + probable + measurable. All three or no provision.", "process": "Run the three-question test: (1) Do we owe anything? (2) Will we probably have to pay? (3) Can we estimate how much? Yes to all = recognise provision.", "everyday": "Madras Co dismissed employee (obligation exists), lawyers say not likely to succeed (not probable) = no provision for the claim, only for legal costs which ARE certain."}}, {"qId": "INTPROV_A_Q12", "displayIdx": 12, "type": "ot", "questionType": "mcq", "subTopic": "Constructive Obligation", "difficulty": "medium", "marks": 2, "timeIdeal": 100, "scenario": "Whitmore Retail Ltd has for many years operated a policy of offering full refunds to customers who return goods within 60 days, even when goods are not defective. This policy is prominently displayed in all stores and on the website. The minimum legal obligation is to accept returns only for defective goods.", "questionText": "Which of the following is the correct accounting treatment at Whitmore's year end?", "options": [{"letter": "A", "text": "No provision is needed because there is no legal obligation to accept non-defective returns", "correct": false, "why": "Incorrect. IAS 37 recognises CONSTRUCTIVE obligations, not just legal obligations. A constructive obligation arises from an established pattern of past practice that creates a valid expectation. Whitmore's publicised policy is exactly this."}, {"letter": "B", "text": "A provision is required because Whitmore has a constructive obligation arising from its refund policy", "correct": true, "why": "CORRECT — IAS 37 defines a constructive obligation as arising when 'by an established pattern of past practice, published policies, or a sufficiently specific current statement, the entity has indicated that it will accept certain responsibilities' creating 'a valid expectation on the part of those other parties'. Whitmore's published refund policy creates this obligation."}, {"letter": "C", "text": "A provision is required only when customers actually present goods for refund after the year end", "correct": false, "why": "Incorrect timing. The IAS 37 three criteria are assessed at the year end: the obligating event (selling the goods) has already occurred. A provision must be recognised for the expected cost of future returns on pre-year-end sales."}, {"letter": "D", "text": "Only a contingent liability disclosure note is required as the obligation may never materialise", "correct": false, "why": "The obligation is not merely contingent — based on Whitmore's consistent past practice and published policy, it is probable that some refunds will be claimed. A full provision (not just disclosure) is required. Kaplan Illustration 3 directly addresses this exact scenario."}], "correctAnswer": "B", "explanationLayer1": "Tests constructive obligation recognition from IAS 37. This exact scenario (retail refund policy exceeding legal obligation) is Kaplan ST Ch 11 Illustration 3. It is one of the most commonly tested IAS 37 topics.", "explanationLayer3": "IAS 37 para 10: constructive obligation from 'established pattern of past practice, published policies, or a sufficiently specific current statement'. Kaplan FA Study Text Ch 11, Illustration 3 + Solution.", "workingShown": "Constructive obligation — Whitmore example:\n\n  Legal obligation (minimum):\n    Accept defective goods only\n\n  Constructive obligation (IAS 37):\n    Whitmore has:\n    - Established pattern of past practice\n    - Published policy (stores + website)\n    - Created valid expectation in customers\n    Therefore: constructive obligation exists\n\n  Provision required:\n    1. Present obligation: YES (constructive)\n    2. Probable outflow: YES (based on past refund rates)\n    3. Reliable estimate: YES (using past data)\n\n  Best estimate of provision:\n    Based on expected value of goods to be returned\n    (e.g., historical refund rate x year-end sales)", "examinerNote": "Kaplan Illustration 3 and its solution are directly reproduced in many exam questions. The key phrase is 'constructive obligation'. Candidates must know that constructive obligations (from practice/policy) are just as valid as legal obligations under IAS 37.", "advanced": "The provision amount uses the best estimate methodology (IAS 37 para 36): the best estimate of the expenditure required to settle the present obligation. For a portfolio of refund obligations, expected value (probability-weighted outcomes) is appropriate.", "teacherCommentary": {"concept": "Constructive obligation = created by published policy/past practice, not just law.", "process": "Does the entity have a published policy exceeding legal minimum? Has it created expectations? Yes to both = constructive obligation = provision needed.", "everyday": "Retailer never legally has to accept non-defective returns. But 10 years of advertising 'no questions asked' returns = constructive obligation. Customers expect it."}}, {"qId": "INTPROV_A_Q13", "displayIdx": 13, "type": "ot", "questionType": "mcq", "subTopic": "Provision Accounting Entries", "difficulty": "medium", "marks": 2, "timeIdeal": 90, "scenario": "Marshfield Co recognises a new provision of £15,000 for estimated legal costs in the year ended 31 December 20X6. This is the first year a provision for these costs has been recognised.", "questionText": "What are the correct accounting entries to recognise the provision?", "options": [{"letter": "A", "text": "Dr Legal expense £15,000 / Cr Bank £15,000", "correct": false, "why": "Incorrect. Crediting Bank implies cash has been paid. At the point of recognition, no cash has been paid — the provision represents a future liability. The credit entry should be to Provision (a liability account)."}, {"letter": "B", "text": "Dr Provision £15,000 / Cr Legal expense £15,000", "correct": false, "why": "The entries are reversed. Debiting the provision account would reduce an existing liability (which doesn't yet exist). When recognising a NEW provision, the debit goes to expense and the credit goes to provision."}, {"letter": "C", "text": "Dr Legal expense £15,000 / Cr Provision £15,000", "correct": true, "why": "CORRECT — Per Kaplan ST Ch 11: 'Dr Expenses, Cr Provision' is the standard journal for recognising a new provision. The debit increases the expense in the P/L; the credit creates the liability on the SFP. When paid later: Dr Provision, Cr Bank."}, {"letter": "D", "text": "Dr Bank £15,000 / Cr Provision £15,000", "correct": false, "why": "Debiting Bank would imply cash is being received — the opposite of what is happening. The debit must go to the relevant expense account, not Bank."}], "correctAnswer": "C", "explanationLayer1": "Tests the journal entry for recognising a new provision per IAS 37. The Kaplan ST Ch 11 states explicitly: 'Debit Expenses, Credit Provision'. The settlement entry later is the reverse of the credit: Dr Provision, Cr Bank.", "explanationLayer3": "IAS 37 / Kaplan FA Study Text Ch 11, Section 5: 'Debit: Expenses $X, Credit: Provision $X' for initial recognition. When settled: 'Debit: Provision, Credit: Bank'.", "workingShown": "Provision journal sequence:\n\n  STEP 1 — Recognise provision:\n    Dr Legal expense       15,000  (P/L impact)\n      Cr Provision (liability) 15,000  (SFP liability)\n\n  STEP 2 — When actually paid (future period):\n    Dr Provision           15,000  (removes liability)\n      Cr Bank                  15,000  (cash goes out)\n\n  Classification on SFP:\n    Expected within 12 months: current liability\n    Expected beyond 12 months: non-current liability\n\n  Movement entries:\n    Increase provision: Dr Expense / Cr Provision\n    Decrease provision: Dr Provision / Cr Expense", "examinerNote": "The two-step sequence (recognise then pay) is important. Many students confuse Step 1 (recognise) with Step 2 (pay). At recognition there is NO Bank entry — that comes only when cash is actually paid. The expense hits P/L immediately at Step 1.", "advanced": "If the provision is later found to be unnecessary (e.g., the legal case is dismissed), the journal is Dr Provision / Cr Expense — reversing the original entry. This release of provision increases profit in the year the reversal occurs.", "teacherCommentary": {"concept": "Recognise provision: Dr Expense / Cr Provision. Pay it later: Dr Provision / Cr Bank.", "process": "Two distinct events: (1) know you'll probably owe it = Dr expense, Cr provision. (2) Actually pay it = Dr provision, Cr bank.", "everyday": "Year 1: lawyer tells you about likely £15k fine. Dr legal expense £15k, Cr provision £15k. Year 2: you pay the fine. Dr provision £15k, Cr bank £15k."}}, {"qId": "INTPROV_A_Q14", "displayIdx": 14, "type": "ot", "questionType": "mcq", "subTopic": "Contingent Liability vs Provision", "difficulty": "medium", "marks": 2, "timeIdeal": 100, "scenario": "Cranford Co's legal team is reviewing two situations: (1) a lawsuit where the company's lawyers say it will probably lose, estimated at £80,000; (2) a separate claim where the lawyers say the outcome is uncertain and possible but not probable.", "questionText": "What is the KEY difference between a provision and a contingent liability?", "options": [{"letter": "A", "text": "A provision always involves a legal obligation; a contingent liability involves only a constructive obligation", "correct": false, "why": "Both provisions AND contingent liabilities can arise from either legal or constructive obligations. The type of obligation (legal vs constructive) does not determine whether it is a provision or contingent liability."}, {"letter": "B", "text": "A provision meets all three IAS 37 recognition criteria; a contingent liability does not meet all three criteria", "correct": true, "why": "CORRECT — This is the definitive IAS 37 distinction. A provision is recognised because it meets all three criteria (obligation + probable + measurable). A contingent liability is a possible obligation OR fails the 'probable' test OR cannot be reliably measured. Same event, different probability assessment."}, {"letter": "C", "text": "A provision appears in the notes only; a contingent liability appears on the face of the SFP", "correct": false, "why": "These are exactly reversed. A provision IS recognised on the face of the SFP (as a liability). A contingent liability is disclosed only in the NOTES to the financial statements (not on the face)."}, {"letter": "D", "text": "A provision relates to a legal dispute; a contingent liability relates to an expected warranty claim", "correct": false, "why": "Both provisions and contingent liabilities can arise from any type of obligation — legal disputes, warranties, environmental claims, refund policies, etc. The categorisation depends on the probability and reliability of measurement, not the nature of the obligation."}], "correctAnswer": "B", "explanationLayer1": "Tests the critical distinction between provision (all 3 criteria met = recognise) and contingent liability (not all 3 criteria met = disclose or ignore). This is the central organising framework of IAS 37.", "explanationLayer3": "IAS 37 / Kaplan FA Study Text Ch 11 Section 6: Contingent liability = 'possible obligation' or present obligation not meeting all criteria. Provisions meet all three criteria per IAS 37 para 14.", "workingShown": "Provision vs Contingent liability (IAS 37):\n\n  PROVISION (recognise on SFP):\n    All 3 criteria met:\n      Present obligation + probable + reliable estimate\n    Journal: Dr Expense / Cr Provision (SFP liability)\n\n  CONTINGENT LIABILITY (disclose in notes only):\n    Fails one or more criteria:\n      'Possible' not 'probable' obligation, OR\n      Cannot reliably estimate amount, OR\n      Only a possible obligation (may not arise)\n    Note: disclose nature + estimated financial effect\n\n  REMOTE (no action):\n    Probability is remote (<5%): ignore entirely\n\n  The dividing line:\n    Probable (>50%): provision\n    Possible (5-50%): contingent liability note\n    Remote (<5%): nothing", "examinerNote": "Option C is the classic wrong answer — students confuse where each goes. Provision = on the SFP face. Contingent liability = in the notes. This direction is frequently tested and frequently reversed by students.", "advanced": "IAS 37 says it is only in 'extremely rare cases' that a reliable estimate cannot be made. When that happens, the provision is not recognised and the contingent liability is disclosed. This extreme rarity means 'can't estimate' is almost never a valid reason to avoid a provision.", "teacherCommentary": {"concept": "Provision = all 3 criteria met, goes on SFP. Contingent = fails one test, goes in notes only.", "process": "Three criteria test first. All pass = provision on SFP. Any fail = contingent liability in notes. Remote = nothing.", "everyday": "Probable loss = provision on balance sheet. Possible loss = mention in footnotes. Remote loss = don't even mention it."}}, {"qId": "INTPROV_A_Q15", "displayIdx": 15, "type": "ot", "questionType": "number", "subTopic": "Development Cost Expensed — Pre-Criteria Period", "difficulty": "hard", "marks": 2, "timeIdeal": 130, "scenario": "Overdale Co commenced development of Product Z on 1 June 20X6, incurring costs at a consistent rate of £15,000 per month. The IAS 38 capitalisation criteria were all first met on 1 September 20X6. Overdale's accounting year ends on 31 December 20X6.", "questionText": "Calculate the total development cost that should be expensed to the statement of profit or loss for the year ended 31 December 20X6 (in £).", "numAns": 45000, "tol": 500, "prefix": "£", "correctAnswer": "45000", "explanationLayer1": "Tests the pre-criteria period expense calculation. Mirrors Kaplan EK Q214 (Merlot Project B pattern). The IAS 38 rule: costs incurred BEFORE criteria are met must be expensed — they cannot be retrospectively capitalised.", "explanationLayer3": "IAS 38 / Kaplan EK Q214: costs before criteria met date = expense. Only costs from criteria date onwards are capitalised. Research costs previously expensed cannot be re-capitalised.", "workingShown": "Development cost split — Year ended 31 Dec 20X6:\n\n  Project started:        1 June 20X6\n  Criteria first met:     1 September 20X6\n  Year end:               31 December 20X6\n  Monthly cost:           £15,000\n\n  EXPENSE (before criteria met):\n    June, July, August = 3 months\n    3 x £15,000 = £45,000 to P/L\n\n  CAPITALISE (criteria met onwards):\n    September, October, November, December = 4 months\n    4 x £15,000 = £60,000 as intangible asset\n\n  Total: £45,000 + £60,000 = £105,000 ✓\n  (6 months x £15,000/month from June-Nov... wait)\n\n  Recalculation (June to December = 7 months):\n    7 x £15,000 = £105,000 total\n    Expense: 3 months x £15,000 = £45,000\n    Capitalize: 4 months x £15,000 = £60,000", "examinerNote": "The question asks for the amount EXPENSED — the pre-criteria period. Students often calculate the capitalised amount instead. Read the question carefully: 'expensed' = before criteria date. Note also that previously expensed costs cannot be retroactively transferred to the intangible asset.", "advanced": "Kaplan EK Q215 (Merlot Project C): development completed 30 June 20X5, production starts 1 September. In year ended 31 December 20X5, amortisation = £309,800/36 months x 4 months. The exam chains criteria-met → capitalise → commercial production → amortise as a multi-step Q.", "teacherCommentary": {"concept": "Before criteria = expense. After criteria = capitalise. Simple rule, common trap.", "process": "Count months before 1 September: Jun, Jul, Aug = 3 months. 3 x £15k = £45,000 expensed.", "everyday": "Like renovating a flat: money spent before it becomes liveable = expense. Money spent after it's habitable = adds to the asset."}}, {"qId": "INTPROV_A_Q16", "displayIdx": 16, "type": "ot", "questionType": "mcq", "subTopic": "PIRATE Criteria No Longer Met", "difficulty": "hard", "marks": 2, "timeIdeal": 120, "scenario": "Ridgley Co capitalised £180,000 of development costs for a new industrial process (carrying amount £180,000 as amortisation had not yet commenced). At the current year end, the company's legal team advises that a competitor has acquired an exclusive patent over the core technology, making commercial production by Ridgley legally impossible.", "questionText": "What is the correct accounting treatment for the capitalised development costs at Ridgley's year end?", "options": [{"letter": "A", "text": "Continue amortising the £180,000 over the remaining estimated useful life", "correct": false, "why": "Amortisation cannot continue because the project no longer meets the IAS 38 criteria — specifically, it is no longer technically feasible or expected to be profitable. The asset must be written off immediately."}, {"letter": "B", "text": "Suspend amortisation and disclose the issue in the notes until the patent dispute is resolved", "correct": false, "why": "There is no 'suspension' option in IAS 38. If the criteria are no longer met, the previously capitalised amount must be written off immediately to the statement of profit or loss — there is no deferral."}, {"letter": "C", "text": "Write off the entire carrying amount of £180,000 immediately to the statement of profit or loss", "correct": true, "why": "CORRECT — Per IAS 38 and Kaplan ST Ch 8: 'If the PIRATE criteria are no longer met, the previously capitalised asset expenditure must be written off to the statement of profit or loss immediately.' The loss of £180,000 is charged to P/L in the current year."}, {"letter": "D", "text": "Transfer the £180,000 from non-current assets to current assets as the project may be resurrected", "correct": false, "why": "Reclassification to current assets is not the correct IAS 38 response. The specific rule is: if criteria no longer met, write off to P/L immediately. Transferring to current assets is not an option under IAS 38."}], "correctAnswer": "C", "explanationLayer1": "Tests the 'criteria no longer met' write-off rule from IAS 38. Kaplan ST Ch 8: 'Each project should be reviewed at the year end to ensure that the PIRATE criteria are still met. If they are no longer met, the previously capitalised asset expenditure must be written off to the P/L immediately.'", "explanationLayer3": "IAS 38 / Kaplan FA Study Text Ch 8 Section 3: 'If the criteria are no longer met, the previously capitalised asset expenditure must be written off to the statement of profit or loss immediately.' Kaplan EK Q213 true/false list.", "workingShown": "PIRATE criteria no longer met — IAS 38 rule:\n\n  At EVERY year end: review each project\n  Are ALL PIRATE criteria STILL met?\n\n  If YES: continue capitalising / amortising\n  If NO: WRITE OFF immediately to P/L\n\n  Ridgley example:\n    Carrying amount:          £180,000\n    Criteria no longer met:   competitor patent\n    (Technical feasibility criterion fails)\n\n  Journal:\n    Dr Development write-off (P/L)   180,000\n      Cr Development costs (SFP)         180,000\n\n  P/L impact: INCREASE in expenses by £180,000\n  SFP: development costs reduced to £0", "examinerNote": "Kaplan EK Q213 includes 'Capitalised development costs that no longer meet the criteria specified by IAS 38 must be written off to the statement of profit or loss' as a TRUE statement. The annual review requirement makes this a live risk at every year end.", "advanced": "Once written off, the costs cannot be reinstated as an asset if circumstances later improve. This mirrors the research rule: IAS 38 takes a conservative, irreversible approach to writing off failed development projects.", "teacherCommentary": {"concept": "Annual review: PIRATE still met? No = write off immediately. No half measures.", "process": "Check each criterion at year end. Any failure = Dr write-off P/L, Cr development costs SFP. All gone immediately.", "everyday": "You capitalised £180k developing a product. Competitor patents the tech. Your asset is now worthless. Write it all off this year — don't drag it out."}}, {"qId": "INTPROV_A_Q17", "displayIdx": 17, "type": "ot", "questionType": "mcq", "subTopic": "IAS 37 Probability Decision Table", "difficulty": "hard", "marks": 2, "timeIdeal": 130, "scenario": "Swinford Co is involved in a legal claim against it. Its lawyers advise the probability of losing is around 40% ('possible'). Swinford also has a counter-claim against its insurer. The probability of the counter-claim succeeding is assessed at 97% ('virtually certain').", "questionText": "Which of the following correctly describes the IAS 37 treatment of both items?", "options": [{"letter": "A", "text": "Disclose the claim as a contingent liability note; recognise the counter-claim as an asset", "correct": true, "why": "CORRECT — Claim at 40% probability (possible, not probable): disclose as a contingent liability in the notes. Counter-claim at 97% (virtually certain, >95%): recognise as an asset on the face of the SFP. Virtually certain = no longer contingent."}, {"letter": "B", "text": "Recognise a provision for the claim at 40% of the estimated amount; disclose the counter-claim in notes", "correct": false, "why": "A provision cannot be partial (40% of amount). IAS 37: if the probability is possible (not probable), the item is disclosed as a contingent liability — not recognised as a proportion. The counter-claim at 97% should be recognised, not just disclosed."}, {"letter": "C", "text": "Ignore the claim as it is below 50%; disclose the counter-claim as a contingent asset", "correct": false, "why": "40% is 'possible' — it requires DISCLOSURE as a contingent liability, not ignoring. Only 'remote' (<5%) outcomes are ignored. The counter-claim at 97% should be RECOGNISED (virtually certain), not merely disclosed."}, {"letter": "D", "text": "Recognise a provision for the claim; disclose the counter-claim as a contingent asset", "correct": false, "why": "A 40% probability is 'possible' not 'probable' — so no provision (provision requires probable, >50%). The counter-claim at 97% is virtually certain and should be recognised as an asset, not just disclosed."}], "correctAnswer": "A", "explanationLayer1": "Tests the full IAS 37 probability decision table across both liability (claim) and asset (counter-claim) sides. Kaplan ST Ch 11 table: probable vs possible vs remote for both sides.", "explanationLayer3": "IAS 37 / Kaplan FA Study Text Ch 11 Section 6: Probability table. Contingent liabilities: probable=provision; possible=disclose; remote=ignore. Contingent assets: virtually certain=recognise; probable=disclose; possible/remote=ignore.", "workingShown": "IAS 37 probability decision table:\n\n  LIABILITIES:\n    Probable (>50%):     Recognise PROVISION (on SFP)\n    Possible (5-50%):    DISCLOSE as contingent liability\n    Remote (<5%):        IGNORE\n\n  ASSETS:\n    Virtually certain (>95%): RECOGNISE as asset (on SFP)\n    Probable (51-95%):        DISCLOSE as contingent asset\n    Possible/Remote:          IGNORE\n\n  Swinford:\n    Claim at 40%   = possible = DISCLOSE (contingent liability)\n    Counter-claim at 97% = virtually certain = RECOGNISE (asset)\n\n  Note: asymmetry between liabilities and assets\n    Liabilities: probable (>50%) = provision\n    Assets: need VIRTUALLY CERTAIN (>95%) to recognise", "examinerNote": "The asymmetry between liabilities and assets is the hardest part: for liabilities, probable (>50%) = recognise as provision. For assets, you need VIRTUALLY CERTAIN (>95%) to recognise on the SFP. Kaplan EK Q259 tests this asymmetry directly.", "advanced": "The Kaplan ST notes that IAS 37 provides possible probability thresholds: virtually certain >95%, probable 51-95%, possible 5-50%, remote <5%. These are interpretive guidelines, not hard boundaries in the standard itself.", "teacherCommentary": {"concept": "Assets need virtually certain (>95%) to recognise. Liabilities only need probable (>50%). Conservative approach.", "process": "Claim at 40% = possible = disclose in notes. Counter at 97% = virtually certain = put on SFP as asset.", "everyday": "IFRS is conservative: very quick to recognize liabilities, slow to recognize assets. For a loss = 51% chance enough. For a gain = need 96%+ certainty."}}, {"qId": "INTPROV_A_Q18", "displayIdx": 18, "type": "ot", "questionType": "mcq", "subTopic": "Counter-Claim Separate Treatment", "difficulty": "hard", "marks": 2, "timeIdeal": 130, "scenario": "Stratton Engineering Co has been sued for £200,000 for breach of contract. The lawyers advise it is probable Stratton will have to pay the full amount. Stratton has made a counter-claim against the component supplier whose defective parts caused the problem. The lawyers assess the counter-claim as probably successful at £200,000.", "questionText": "How should Stratton Engineering account for BOTH items in its financial statements?", "options": [{"letter": "A", "text": "Net the provision and contingent asset; disclose net £nil in the notes as the two items cancel each other out", "correct": false, "why": "IAS 37 expressly prohibits netting: the provision and any potential reimbursement must be treated and presented separately. Even if they are economically equivalent in amount, they cannot be offset on the SFP."}, {"letter": "B", "text": "Recognise a provision of £200,000 on the SFP; recognise a £200,000 asset for the counter-claim on the SFP", "correct": false, "why": "The provision (£200,000, probable) IS recognised on the SFP. However, the counter-claim is PROBABLE (not virtually certain), so it should be disclosed in the notes as a contingent asset — NOT recognised on the face of the SFP."}, {"letter": "C", "text": "Recognise a provision of £200,000 on the SFP; disclose the counter-claim as a contingent asset in the notes", "correct": true, "why": "CORRECT — Per Kaplan ST Ch 11 TYU 1(iii): the £200,000 claim is probable = provision recognised. The counter-claim is also probable = contingent asset disclosed in notes (not recognised — would need virtually certain for SFP recognition). They must NOT be netted."}, {"letter": "D", "text": "Make no provision as the two claims cancel out; disclose both items in the notes", "correct": false, "why": "The provision must be recognised regardless of the counter-claim. IAS 37 requires the provision to be recognised on its own merits (probable outflow). The counter-claim is then considered SEPARATELY."}], "correctAnswer": "C", "explanationLayer1": "Tests the counter-claim scenario from Kaplan ST Ch 11 TYU 1(iii) — Madras Co. Directly sourced from the book: provision recognised, counter-claim disclosed as contingent asset (probable not virtually certain), no netting.", "explanationLayer3": "Kaplan FA Study Text Ch 11 TYU 1 answer: provision recognised for the customer claim (probable). Counter-claim = contingent asset disclosed as probable. 'The provision and contingent asset would be separately accounted for... they would not be netted off.'", "workingShown": "Counter-claim treatment — step by step:\n\n  STEP 1: Assess the provision (liability side)\n    Claim £200,000, probable\n    -> All 3 criteria met -> RECOGNISE provision\n    Dr Legal expense   200,000\n      Cr Provision         200,000\n\n  STEP 2: Assess the counter-claim (asset side)\n    Counter-claim £200,000, probable (65%)\n    Probable = 51-95%, NOT virtually certain\n    -> DISCLOSE in notes as contingent asset only\n    (Do NOT recognise on face of SFP)\n\n  STEP 3: Can we net them?\n    NO — IAS 37 prohibits netting\n    Provision on SFP: £200,000 liability\n    Notes disclosure: probable counter-claim £200,000", "examinerNote": "Kaplan TYU 1(iii) solution: 'Only if it were considered virtually certain would the counterclaim be recognised as an asset in the statement of financial position. Note that, even if that was the case, the provision and contingent asset would be separately accounted for — they would not be netted off.'", "advanced": "This scenario also tests the cascade: if the counter-claim were virtually certain (>95%), it would be recognised as an asset on the SFP, but STILL shown separately from the provision. No netting is a firm IAS 37 rule.", "teacherCommentary": {"concept": "Provision (probable liability) = SFP. Counter-claim (probable only) = notes disclosure. Never net them.", "process": "Assess each separately. Provision: probable = recognise on SFP. Counter-claim: probable but not virtually certain = disclose only. Strictly separate.", "everyday": "You owe £200k (provision), someone owes you £200k back (counter). Both must appear separately. IFRS doesn't let you say 'they cancel out'."}}, {"qId": "INTPROV_A_Q19", "displayIdx": 19, "type": "ot", "questionType": "mcq", "subTopic": "Post Year-End Events and Provisions", "difficulty": "hard", "marks": 2, "timeIdeal": 120, "scenario": "Thornbury Co's accounting year ends on 31 December 20X5. A customer was injured in an accident on Thornbury's premises on 10 October 20X5. On 15 January 20X6, the customer lodged a formal legal claim for £50,000 compensation. Thornbury's lawyers advise the claim will probably succeed.", "questionText": "What is the correct treatment at 31 December 20X5?", "options": [{"letter": "A", "text": "No provision needed at 31 December 20X5 — the claim was not made until after the year end", "correct": false, "why": "The timing of the formal CLAIM is irrelevant. What matters is when the OBLIGATING EVENT occurred. The accident happened on 10 October 20X5 — before the year end. The obligation exists at 31 December 20X5."}, {"letter": "B", "text": "Recognise a provision of £50,000 because the obligating event occurred before the year end", "correct": true, "why": "CORRECT — The accident (obligating event) occurred on 10 October 20X5 — within the reporting period. At 31 December 20X5, there is a present obligation from a past event. The lawyers say it is probable, and the amount can be reliably estimated. All three criteria met = provision £50,000."}, {"letter": "C", "text": "Disclose only as a contingent liability — the claim was not formally made until 20X6", "correct": false, "why": "The claim probability (probable) and the obligating event (accident before year end) both point to a provision, not just a disclosure. The formal lodging of the claim after year end does not reduce the obligation that already existed."}, {"letter": "D", "text": "Provision recognised only if the customer's lawyers submit their claim before financial statements are authorised", "correct": false, "why": "IAS 37 does not have a condition requiring the claim to be submitted before statements are authorised. The standard requires a provision based on the obligating event (the accident) being before the year end and the claim being probable."}], "correctAnswer": "B", "explanationLayer1": "Tests the obligating event principle from IAS 37 — directly from Kaplan ST Ch 11 Illustration 1. Smith Co example: employee dismissed in November 20X7 (before year end) = obligating event before year end = potential provision. Customer injured in February 20X8 (after year end) = no provision for 20X7.", "explanationLayer3": "Kaplan FA Study Text Ch 11 Illustration 1 + Solution: 'There is a potential obligation at the year-end for the employee claiming unfair dismissal. This is because the triggering event happened in November 20X7, which is before the year-end.' The obligating event determines which period the provision falls in.", "workingShown": "Obligating event timeline:\n\n  10 Oct 20X5: accident occurs (OBLIGATING EVENT)\n  31 Dec 20X5: year end\n  15 Jan 20X6: formal claim lodged\n\n  Key question: was the obligating event BEFORE year end?\n    YES (accident 10 Oct 20X5 is before 31 Dec 20X5)\n\n  Three criteria at 31 December 20X5:\n    1. Present obligation: YES (accident before year end)\n    2. Probable: YES (lawyers say probable)\n    3. Reliable estimate: YES (£50,000 claimed)\n\n  Result: Recognise provision £50,000 at 31 Dec 20X5\n\n  Compare: if accident had happened on 15 Feb 20X6:\n    No obligation at 31 Dec 20X5\n    No provision for year ended 31 Dec 20X5", "examinerNote": "Kaplan Illustration 1: the employee dismissed in November 20X7 (before year end) = potential provision at Dec 20X7. Customer injured in February 20X8 (after year end) = NO provision at Dec 20X7. The obligating event date relative to the year end is the decisive test.", "advanced": "This question is also linked to IAS 10 Events after the Reporting Period (Test #10). An adjusting event under IAS 10 is one that provides evidence of conditions existing at year end — consistent with an obligating event occurring before year end under IAS 37.", "teacherCommentary": {"concept": "Obligating event before year end = possible provision. After year end = next year's problem.", "process": "Identify when the accident/event happened. Before year end? Then check probability and estimate. All three met = provision.", "everyday": "Accident in October, claim in January. The accident is what creates the obligation. January is just when they formalised it."}}, {"qId": "INTPROV_A_Q20", "displayIdx": 20, "type": "ot", "questionType": "number", "subTopic": "Provision Movement Calculation", "difficulty": "hard", "marks": 2, "timeIdeal": 130, "scenario": "Cranbrook Co's provision account for legal costs shows an opening balance of £28,500 at 1 January 20X6. During the year: (1) the estimated cost of the main legal case was revised upward, requiring an increase in the provision of £8,200; (2) a smaller case that had been provided for was settled for £3,400 less than the amount provided (surplus released).", "questionText": "Calculate the closing balance on the provision account at 31 December 20X6 (in £).", "numAns": 33300, "tol": 100, "prefix": "£", "correctAnswer": "33300", "explanationLayer1": "Tests provision movement calculation with both an increase (revised estimate upward) and a decrease (case settled for less than provided). Directly applies Kaplan ST Ch 11 Section 5 movement rules and Illustration 2.", "explanationLayer3": "IAS 37 / Kaplan FA Study Text Ch 11 Section 5: 'Provisions should be reviewed at each SFP date and adjusted to reflect the current best estimate. Increase: Dr Relevant expense, Cr Provision. Decrease: Dr Provision, Cr Relevant expense.' Illustration 2 (quarrying entity) shows this pattern.", "workingShown": "Provision account movement:\n\n  Opening balance 1 Jan 20X6:     £28,500\n\n  Increase (revised estimate):\n    Dr Legal expense    8,200\n    Cr Provision        8,200     +£8,200\n\n  Release (settled for less):\n    Dr Provision        3,400\n    Cr Legal expense    3,400     -£3,400\n\n  Closing balance 31 Dec 20X6:\n    £28,500 + £8,200 - £3,400 = £33,300\n\n  Provision T-account:\n  ────────────────────────────────\n  Release      3,400  | Opening  28,500\n  Balance c/f 33,300  | Increase  8,200\n              ──────  |          ──────\n              36,700  |          36,700\n              ──────  |          ──────", "examinerNote": "Provision movements go through P/L both ways: increase = Dr expense (reduces profit); release = Cr expense (increases profit). The Kaplan ST Illustration 2 (quarry company, £80,000 provision, later revised to £85,000 = Dr P/L £5,000) is the exact template.", "advanced": "When a provision is settled exactly at the provision amount, the Dr Provision / Cr Bank nets to zero effect on P/L. Only when settlement differs from provision is there a further P/L impact (the surplus or deficit on settlement).", "teacherCommentary": {"concept": "Opening + increases - releases = closing. Both adjustments go through P/L.", "process": "£28,500 + £8,200 - £3,400 = £33,300. Increase = Dr P/L expense. Release = Cr P/L (reduces expense).", "everyday": "You provisioned £28.5k at start. Estimate went up £8.2k. Another case settled for £3.4k less than provided = release. Net balance: £33.3k."}}, {"qId": "INTPROV_A_Q21", "displayIdx": 21, "type": "ot", "questionType": "number", "subTopic": "Development Cost + Amortisation Same Year", "difficulty": "hard", "marks": 2, "timeIdeal": 150, "scenario": "Pembury Co successfully met all IAS 38 capitalisation criteria throughout a development project. By 30 September 20X5, total capitalised costs were £180,000. Commercial production of the new product commenced on 1 October 20X5. The product is expected to generate revenue for 5 years. Pembury's year ends on 31 December 20X5.", "questionText": "Calculate the amortisation charge to be included in Pembury Co's statement of profit or loss for the year ended 31 December 20X5 (in £).", "numAns": 9000, "tol": 100, "prefix": "£", "correctAnswer": "9000", "explanationLayer1": "Tests the pro-rata amortisation calculation from commercial production start date to year end. Mirrors Kaplan EK Q215 (Merlot Co Project C) and Kaplan ST TYU 3 (Deep Blue Sea). Production starts Oct = 3 months (Oct/Nov/Dec).", "explanationLayer3": "IAS 38 / Kaplan FA Study Text Ch 8 TYU 3: amortisation charged from date commercial production commences, pro-rated to year end. TYU 3: £250,000/5 years x 12/12 (full year from 1 Jan) = £50,000. Pembury: £180,000/5 x 3/12 (3 months) = £9,000.", "workingShown": "Amortisation calculation — pro-rated:\n\n  Capitalised costs:          £180,000\n  Commercial production:      1 October 20X5\n  Useful life:                5 years\n  Year end:                   31 December 20X5\n\n  Months of production in year:\n    October, November, December = 3 months\n\n  Annual amortisation rate:\n    £180,000 / 5 years = £36,000/year\n\n  Pro-rated to 3 months:\n    £36,000 x 3/12 = £9,000\n\n  SFP at 31 December 20X5:\n    Intangible asset (cost):    £180,000\n    Accumulated amortisation:    (£9,000)\n                                ────────\n    Carrying amount:            £171,000", "examinerNote": "Kaplan EK Q215 (Merlot Project C) chains the capitalisation and amortisation calculations in a single question. Production started 1 September, year ends December = 4 months. This question uses October start = 3 months. The formula is always: Annual rate x (months from production start to year end / 12).", "advanced": "Note: in year 20X5, both capitalisation (Jan-Sep) AND amortisation (Oct-Dec) happen. The net P/L impact in 20X5 is only the £9,000 amortisation charge — the £180,000 capitalisation goes directly to the SFP, not through P/L (unless it was research, which would be expensed).", "teacherCommentary": {"concept": "Amortisation starts from production date, pro-rated. £180k / 5yr x 3/12.", "process": "Annual charge = £180k / 5 = £36k. Months in year = 3 (Oct, Nov, Dec). 3/12 x £36k = £9k.", "everyday": "Like a new machine bought in October: full year depreciation = £36k, but only 3 months used this year so charge £9k."}}, {"qId": "INTPROV_A_Q22", "displayIdx": 22, "type": "ot", "questionType": "mcq", "subTopic": "Provision Classification Current vs Non-Current", "difficulty": "hard", "marks": 2, "timeIdeal": 110, "scenario": "Avonbridge Co has two provisions at its year end of 31 December 20X6: (1) estimated compensation for a minor workplace injury expected to be settled within 3 months = £8,000; (2) a provision to dismantle and remove specialist equipment at the end of its useful life in 6 years' time = £120,000.", "questionText": "How should these two provisions be classified in Avonbridge's statement of financial position?", "options": [{"letter": "A", "text": "Both as current liabilities — provisions are always classified as current", "correct": false, "why": "Provisions are NOT always classified as current. Classification depends on when settlement is expected. The 6-year dismantlement provision is clearly a non-current liability."}, {"letter": "B", "text": "£8,000 as current liability; £120,000 as non-current liability", "correct": true, "why": "CORRECT — Per Kaplan ST Ch 11: provisions are classified as current (settlement within 12 months) or non-current (settlement beyond 12 months). £8,000 settles within 3 months = current. £120,000 settles in 6 years = non-
