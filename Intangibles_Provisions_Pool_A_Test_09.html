current."}, {"letter": "C", "text": "Both as non-current liabilities — provisions always have uncertain timing", "correct": false, "why": "Non-current classification depends on when settlement is expected — not on the mere existence of uncertainty. The £8,000 is expected within 12 months, making it a current liability regardless of the uncertainty in the original amount."}, {"letter": "D", "text": "Both disclosed in notes only — provisions should never appear on the face of the SFP", "correct": false, "why": "Provisions that meet all three IAS 37 criteria ARE recognised on the face of the SFP. Only contingent liabilities (failing one or more criteria) are disclosed in notes only."}], "correctAnswer": "B", "explanationLayer1": "Tests the classification of provisions as current vs non-current. Kaplan ST Ch 11 states: 'provisions may be classified as either a current or non-current liability, depending upon the subject matter of the provision' — the test is the expected settlement date.", "explanationLayer3": "IAS 37 / Kaplan FA Study Text Ch 11 Section 5: 'The provision will need to be classified as either a current or non-current liability as befits the situation. The key issue is the date when the provision is likely to be settled.'", "workingShown": "Classification of provisions:\n\n  Current liability:\n    Expected settlement within 12 months of year end\n    Example: £8,000 compensation within 3 months\n\n  Non-current liability:\n    Expected settlement beyond 12 months\n    Example: £120,000 dismantlement in 6 years\n\n  SFP presentation:\n    Current liabilities:\n      Provision (injury compensation)     £8,000\n    Non-current liabilities:\n      Provision (dismantlement)         £120,000\n\n  Note: classification is reviewed each year.\n  If £120,000 moves within 12 months of SFP date,\n  it must be reclassified to current liabilities.", "examinerNote": "The dismantlement provision is a classic IAS 37 example. Many students assume all provisions are current because the amount is uncertain — wrong. Classification follows expected timing, not uncertainty of amount.", "advanced": "The dismantlement provision is also tested in connection with the initial capitalisation of an asset (a decommissioning provision). When the provision is recognised at the start of the asset's life, the debit goes not to expenses but to the COST of the asset (IAS 16), and the asset is then depreciated over its useful life.", "teacherCommentary": {"concept": "Current provision = settled within 12 months. Non-current = more than 12 months away.", "process": "For each provision: when will we pay? Within 12 months = current. Beyond 12 months = non-current.", "everyday": "Injury settlement in 3 months = current. Demolition bill in 6 years = non-current."}}, {"qId": "INTPROV_A_Q23", "displayIdx": 23, "type": "ot", "questionType": "multi", "subTopic": "IAS 38 True/False Statements", "difficulty": "hard", "marks": 2, "timeIdeal": 130, "scenario": "The following statements have been made about the accounting treatment of intangible assets under IAS 38. Each must be assessed as correct or incorrect.", "questionText": "Which TWO of the following statements about IAS 38 are CORRECT?", "options": [{"letter": "A", "text": "Development costs that have been written off to the P/L can be reinstated as an asset if the project later becomes commercially viable", "correct": false, "why": "INCORRECT — Per IAS 38 and Kaplan EK Q213: 'Research costs written off can be re-capitalised when the developed asset is feasible' is FALSE. Once costs are written off, they remain in the P/L. They cannot be reinstated as assets in any subsequent period."}, {"letter": "B", "text": "An intangible asset with an indefinite useful life must not be amortised but must be tested annually for impairment", "correct": true, "why": "CORRECT — Per IAS 38: intangible assets with indefinite useful lives are not amortised. Instead, they must be tested for impairment at least annually. This is explicitly confirmed in Kaplan EK Q203 and Kaplan ST Ch 8 Section 3."}, {"letter": "C", "text": "Internally generated goodwill may be recognised as an intangible asset if management can demonstrate its value", "correct": false, "why": "INCORRECT — IAS 38 specifically prohibits recognition of internally generated goodwill, regardless of management's ability to demonstrate value. Only goodwill arising from a business combination (purchased goodwill) may be recognised."}, {"letter": "D", "text": "Amortisation of capitalised development costs commences when the asset is available for use (commercial production starts)", "correct": true, "why": "CORRECT — Per IAS 38 and Kaplan ST Ch 8: 'Amortisation should commence with commercial production.' This is confirmed in TYU 3 (Deep Blue Sea) and Kaplan EK Q215 (Merlot Project C). Amortisation does not start during the capitalisation phase."}, {"letter": "E", "text": "Research equipment purchased to support scientific investigations should be expensed immediately under IAS 38", "correct": false, "why": "INCORRECT — Physical research equipment is a tangible asset (PPE) and is accounted for under IAS 16 Tangible non-current assets. It is capitalised and depreciated, not expensed. Only the research ACTIVITY costs are expensed under IAS 38."}], "correctOptions": ["B", "D"], "correctAnswer": "B,D", "explanationLayer1": "Tests five IAS 38 truths/falsehoods from the Kaplan EK Q213 list and Kaplan ST Ch 8. Multi-select requiring identification of exactly two correct statements out of five.", "explanationLayer3": "Kaplan EK Q213: true statements include 'Research costs should be expensed', 'Capitalised dev costs no longer meeting criteria must be written off', 'Capitalised dev costs amortised from available to use date', 'Research costs written off CANNOT be re-capitalised'. Kaplan ST Ch 8.", "workingShown": "IAS 38 statement analysis:\n\n  A: Can reinstate written-off dev costs? NO (FALSE)\n     Once expensed, permanent. Cannot reinstate.\n\n  B: Indefinite life: no amortisation, annual impairment? YES (TRUE)\n     IAS 38: no amortise, test for impairment annually.\n\n  C: Internally generated goodwill recognised? NO (FALSE)\n     IAS 38 prohibits internally generated goodwill.\n     Only purchased goodwill (from acquisition) allowed.\n\n  D: Amortisation starts at commercial production? YES (TRUE)\n     Not when capitalised. From production/use start.\n\n  E: Research equipment expensed under IAS 38? NO (FALSE)\n     Equipment = PPE (IAS 16), capitalized + depreciated.\n     Only research ACTIVITY costs are expensed.", "examinerNote": "Kaplan EK Q213 tests exactly these five types of statement. The 're-capitalise' trap (option A) is frequently chosen by students who think successful outcomes justify going back to the balance sheet. The equipment trap (option E) catches students who think everything related to research is immediately expensed.", "advanced": "The prohibition on reinstating costs applies equally to: (a) research costs written off that later contributed to a successful product; (b) development costs written off when criteria failed that later met criteria again. IAS 38 takes the conservative view: once written off, it stays written off.", "teacherCommentary": {"concept": "Two truths: (B) indefinite life = no amortisation + annual impairment. (D) amortisation starts at commercial production.", "process": "Check each: A = wrong (can't reinstate). B = correct. C = wrong (internal goodwill prohibited). D = correct. E = wrong (equipment = PPE, not R&D expense).", "everyday": "Once you write off a failed project, you can't bring it back to the balance sheet even if it eventually works. The kitchen reno you abandoned = sunk cost."}}, {"qId": "INTPROV_A_Q24", "displayIdx": 24, "type": "ot", "questionType": "number", "subTopic": "Expected Value Provision Calculation", "difficulty": "hard", "marks": 2, "timeIdeal": 150, "scenario": "Moorfield Co is defending a legal claim. Three possible outcomes have been assessed by the lawyers with the following probabilities and associated costs:\n   Scenario 1 (win case): 30% probability — legal costs only £10,000\n   Scenario 2 (partial loss): 45% probability — total cost £40,000\n   Scenario 3 (full loss): 25% probability — total cost £80,000", "questionText": "Using the expected value method, calculate the best estimate provision that Moorfield should recognise at the year end (in £).", "numAns": 41000, "tol": 500, "prefix": "£", "correctAnswer": "41000", "explanationLayer1": "Tests the expected value method for estimating provisions. Per IAS 37 para 39 and Kaplan ST Ch 11: for a large portfolio of similar obligations, or when multiple outcomes are possible, the expected value method (probability-weighted average) gives the best estimate.", "explanationLayer3": "IAS 37 para 36: 'best estimate of the expenditure required to settle the present obligation'. Para 39: where a range of possible outcomes exists, the expected value method is appropriate. Kaplan FA Study Text Ch 11.", "workingShown": "Expected value method:\n\n  Scenario 1: 30% probability x £10,000 = £3,000\n  Scenario 2: 45% probability x £40,000 = £18,000\n  Scenario 3: 25% probability x £80,000 = £20,000\n                                          ────────\n  Best estimate (expected value):          £41,000\n\n  Probability check:\n    30% + 45% + 25% = 100% ✓\n\n  Journal:\n    Dr Legal expense    41,000\n      Cr Provision          41,000\n\n  Note: the provision is NOT the most likely\n  individual outcome (which would be Scenario 2\n  at £40,000). The expected value aggregates\n  all probabilities.", "examinerNote": "The trap is to simply use the most likely outcome (Scenario 2, 45% x £40,000 = £18,000) rather than the probability-weighted expected value. IAS 37 says the best estimate should consider all possible outcomes weighted by probability.", "advanced": "For a single obligation, IAS 37 uses the 'most likely outcome' approach. For a range of ly certain to arise, it is no longer contingent and should be recognised as a liability or asset as appropriate.' At 97% (>95% = virtually certain), the £150,000 should be recognised on the SFP."}, {"letter": "D", "text": "Recognise the £150,000 only when the cash is actually received from the former supplier", "correct": false, "why": "Under accruals accounting, income is recognised when earned, not when received in cash. If receipt is virtually certain, the asset is recognised on the accruals basis — the same principle that drives IAS 37's requirement to recognise provisions before cash is paid."}], "correctAnswer": "C", "explanationLayer1": "Tests the top of the contingent asset scale — where probability is virtually certain (>95%) and the asset should be RECOGNISED on the SFP rather than merely disclosed. Kaplan ST Ch 11 states this explicitly.", "explanationLayer3": "Kaplan FA Study Text Ch 11 Section 6: 'when an item is assessed as being virtually certain to arise, it is no longer contingent and should be recognised as a liability or asset as appropriate.' Probability threshold: virtually certain >95%.", "workingShown": "Contingent asset scale (IAS 37):\n\n  Virtually certain (>95%):\n    No longer contingent\n    -> RECOGNISE as asset on face of SFP\n    97% falls here -> recognise £150,000\n\n  Probable (51-95%):\n    Disclose as contingent asset in NOTES\n\n  Possible (5-50%) or Remote (<5%):\n    IGNORE — no disclosure\n\n  Norwood at 97%:\n    Journal:\n      Dr Receivable (asset)    150,000\n        Cr Income (P/L)            150,000\n    SFP: Current asset £150,000\n\n  Compare: if probability was 70%:\n    -> Disclose in notes only (not on SFP)", "examinerNote": "The asymmetry between liabilities and assets is critical: for liabilities, probable (>50%) = provision on SFP. For assets, you need virtually certain (>95%) to put it on the SFP. At 97%, the threshold is crossed and recognition is required — not just disclosure.", "advanced": "The term 'virtually certain' is not defined in IAS 37 with a specific percentage. The Kaplan interpretation of >95% is a teaching aid. In practice, judgement is required. The standard uses 'virtually certain' to set a much higher bar than the 'probable' test for liabilities.", "teacherCommentary": {"concept": "Virtually certain (>95%) = recognise as asset. Probable = disclose. Possible/remote = ignore.", "process": "97% > 95% = virtually certain. Not contingent anymore. Recognise £150k on SFP as asset.", "everyday": "99% sure you'll win? Put the money on your balance sheet. 70% sure? Mention it in footnotes. 40% sure? Don't say anything."}}];

function beginTest() {
  const saved = loadState();
  if (saved && !saved.submitted) {
    const pct = Math.round(((TOTAL_MINUTES*60 - saved.timerRemaining)/(TOTAL_MINUTES*60))*100);
    document.getElementById('resumeBanner').innerHTML = `<div class="home-resume">&#9654; Resume in progress: ${pct}% elapsed, ${Object.keys(saved.answers).length} answered. <button onclick="resumeTest()" style="background:#7D5A00;border:none;color:white;padding:4px 10px;border-radius:4px;cursor:pointer;margin-left:8px;">Resume</button>&nbsp;<button onclick="localStorage.removeItem('${STORAGE_KEY}');document.getElementById('resumeBanner').innerHTML=''" style="background:#555;border:none;color:white;padding:4px 10px;border-radius:4px;cursor:pointer;">Start Fresh</button></div>`;
  }
}
function resumeTest() {
  const saved = loadState();
  if (saved) { state = saved; }

}
// ========== TIMER ==========
function startTimer() {
  state.timeStarted = Date.now();
  state.timerInterval = setInterval(tickTimer, 1000);
}
function rebuildTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(tickTimer, 1000);
}
function tickTimer() {
  if (state.pausedAt) return;
  if (state.timerRemaining <= 0) { clearInterval(state.timerInterval); autoSubmit(); return; }
  state.timerRemaining--;
  updateTimerDisplay();
  if (state.timerRemaining % 30 === 0) saveState();
}
function updateTimerDisplay() {
  const el = document.getElementById('timer');
  const m = Math.floor(state.timerRemaining / 60);
  const s = state.timerRemaining % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.className = 'timer' + (state.timerRemaining < 120 ? ' critical' : state.timerRemaining < 300 ? ' warning' : '');
}
function togglePause() {
  const btn = document.getElementById('pauseBtn');
  if (state.pausedAt) { state.pausedAt = null; btn.textContent = 'Pause'; }
  else { state.pausedAt = Date.now(); btn.textContent = 'Resume'; }
}
function autoSubmit() {
  document.getElementById('timeUpOverlay').classList.add('visible');

function dismissTimeUp() {
  document.getElementById('timeUpOverlay').classList.remove('visible');

function renderQuestion(idx) {
  state.currentQ = idx;
  const q = QBANK[idx];
  const container = document.getElementById('questionContainer');
  document.getElementById('qpos').textContent = `Question ${idx+1} of ${OT_COUNT}`;
  document.getElementById('qmarks').textContent = `${q.marks} marks · ${q.subTopic}`;
  document.getElementById('flagBtn').className = state.flags[idx] ? 'flagBtn flagged' : '';
  document.getElementById('flagBtn').textContent = state.flags[idx] ? '🚩 Flagged' : 'Flag';
  let html = `<div class="qcard">`;
  if (q.scenario) html += `<div class="scenario">${q.scenario}</div>`;
  html += `<div class="qprompt"><strong>Q${idx+1}.</strong> ${q.questionText}</div>`;
  if (q.questionType === 'mcq') html += buildMCQ(idx, q);
  else if (q.questionType === 'multi') html += buildMulti(idx, q);
  else if (q.questionType === 'number') html += buildNumber(idx, q);
  html += `<div class="guess-row"><label><input type="checkbox" id="guess_${idx}" ${state.guesses[idx]?'checked':''} onchange="toggleGuess(${idx})"> I'm guessing on this one</label></div>`;
  html += `</div>`;
  container.innerHTML = html;
  updateNavGrid();
}
function buildMCQ(idx, q) {
  return q.options.map((o,i) => {
    const sel = state.answers[idx] === o.letter;
    return `<div class="opt${sel?' selected':''}" onclick="selectMCQ(${idx},'${o.letter}',this)">
      <input type="radio" name="q${idx}" ${sel?'checked':''} readonly>
      <span class="opt-letter">${o.letter}</span><span class="opt-text">${o.text}</span></div>`;
  }).join('');
}
function buildMulti(idx, q) {
  const sel = state.answers[idx] ? state.answers[idx].split(',') : [];
  let html = `<div class="multi-instr">Select TWO answers</div>`;
  html += q.options.map((o,i) => {
    const checked = sel.includes(o.letter);
    return `<div class="opt${checked?' selected-multi':''}" onclick="toggleMulti(${idx},'${o.letter}',this)">
      <input type="checkbox" ${checked?'checked':''} readonly>
      <span class="opt-letter">${o.letter}</span><span class="opt-text">${o.text}</span></div>`;
  }).join('');
  return html;
}
function buildNumber(idx, q) {
  const val = state.answers[idx] !== undefined ? state.answers[idx] : '';
  return `<div class="num-entry"><span class="prefix">${q.prefix||''}  </span>
    <input type="number" id="numInput_${idx}" value="${val}" placeholder="Enter number" oninput="recordNumber(${idx},this.value)" step="any">
  </div><div class="num-instr">Enter numeric value only (no commas or currency symbols). Enter 0 if the answer is nil.</div>`;
}
function selectMCQ(idx, letter, el) {
  state.answers[idx] = letter;
  document.querySelectorAll(`#questionContainer .opt`).forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
  updateNavGrid(); saveState();
}
function toggleMulti(idx, letter, el) {
  let sel = state.answers[idx] ? state.answers[idx].split(',').filter(Boolean) : [];
  if (sel.includes(letter)) { sel = sel.filter(l => l !== letter); el.classList.remove('selected-multi'); }
  else if (sel.length < 2) { sel.push(letter); el.classList.add('selected-multi'); }
  state.answers[idx] = sel.join(',');
  updateNavGrid(); saveState();
}
function recordNumber(idx, val) { state.answers[idx] = val; updateNavGrid(); saveState(); }
function toggleFlag() {
  state.flags[state.currentQ] = !state.flags[state.currentQ];
  document.getElementById('flagBtn').className = state.flags[state.currentQ] ? 'flagBtn flagged' : '';
  document.getElementById('flagBtn').textContent = state.flags[state.currentQ] ? '🚩 Flagged' : 'Flag';
  updateNavGrid();
}
function toggleGuess(idx) { state.guesses[idx] = document.getElementById(`guess_${idx}`).checked; saveState(); }

  });
  html += `<div class="mtq-working-area"><div class="lbl">Working Space</div>

    <div><strong>Your answer:</strong> ${p.prefix}${userAns.toLocaleString()}</div>
    <div><strong>Model answer:</strong> ${p.prefix}${p.numAns.toLocaleString()}</div>
    <div class="model-answer-box"><div class="model-label">Working</div><pre>${p.modelAnswer}</pre></div>
    <div style="margin-top:12px;"><strong>Award yourself:</strong> &nbsp;
    <button onclick="selfMark(${i},${p.marks})" style="background:#28a745;color:white;border:none;padding:6px 16px;border-radius:4px;cursor:pointer;margin-right:8px;">Full (${p.marks})</button>
    <button onclick="selfMark(${i},${Math.floor(p.marks/2)})" style="background:#ffc107;color:#000;border:none;padding:6px 16px;border-radius:4px;cursor:pointer;margin-right:8px;">Partial (${Math.floor(p.marks/2)})</button>
    <button onclick="selfMark(${i},0)" style="background:#dc3545;color:white;border:none;padding:6px 16px;border-radius:4px;cursor:pointer;">Zero</button>
    <span id="markDisp_${i}" style="margin-left:14px;font-weight:700;color:#1a2a4a;">${state.mtqSelf[i]!==undefined?state.mtqSelf[i]+' pts':''}</span></div>
    </div>`;
  });
  html += `</div>`;
  document.getElementById('mtqMarkContainer').innerHTML = html;
}
function selfMark(idx, pts) { state.mtqSelf[idx] = pts; document.getElementById(`markDisp_${idx}`).textContent = pts + ' pts'; saveState(); }
function finalizeResults() {
  const missing = MTQ.parts.filter((p,i) => state.mtqSelf[i] === undefined);
  if (missing.length > 0) { alert('Please award marks for all MTQ parts first.'); return; }
  showSection('resultsView');
  buildResults();
}
// ========== RESULTS ==========
function buildResults() {
  let otCorrect=0, otWrong=0, otSkipped=0, otGuessCorrect=0, otMarks=0;
  QBANK.forEach((q,i) => {
    const userAns = state.answers[i];
    const correct = isCorrect(q, userAns);
    if (!userAns && userAns !== '0') otSkipped++;
    else if (correct) { otCorrect++; otMarks += q.marks; if(state.guesses[i]) otGuessCorrect++; }
    else otWrong++;
  });
  const mtqMarks = Object.values(state.mtqSelf).reduce((a,b) => a+b, 0);
  const totalMarks = otMarks + mtqMarks;
  const maxMarks = OT_COUNT*2 + 10;
  const pct = Math.round((totalMarks/maxMarks)*100);
  const timeTaken = TOTAL_MINUTES*60 - state.timerRemaining;
  const mins = Math.floor(timeTaken/60), secs = timeTaken%60;
  const grade = pct >= 70 ? '🏆 Pass+' : pct >= 50 ? '✅ Pass' : '⚠️ Below Pass';
  document.getElementById('scoreBanner').innerHTML = `
    <div class="score">${totalMarks}/${maxMarks}</div>
    <div class="pct">${pct}% &mdash; ${grade}</div>
    <div class="meta">OT: ${otMarks}/50 &nbsp;|&nbsp; MTQ: ${mtqMarks}/10 &nbsp;|&nbsp; Correct: ${otCorrect}/${OT_COUNT} &nbsp;|&nbsp; Time: ${mins}m ${secs}s</div>`;
  document.getElementById('metricGrid').innerHTML = [
    {label:'OT Score',value:`${otMarks}/50`},{label:'MTQ Score',value:`${mtqMarks}/10`},
    {label:'Correct',value:`${otCorrect}/${OT_COUNT}`},{label:'Wrong',value:otWrong},
    {label:'Skipped',value:otSkipped},{label:'True Accuracy',value:`${otCorrect-otGuessCorrect}/${OT_COUNT} non-guess`}
  ].map(m=>`<div class="metric-card"><div class="label">${m.label}</div><div class="value">${m.value}</div></div>`).join('');
  const subtopics = {};
  QBANK.forEach((q,i) => {
    const t = q.subTopic;
    if (!subtopics[t]) subtopics[t] = {correct:0,total:0};
    subtopics[t].total++;
    if (isCorrect(q, state.answers[i])) subtopics[t].correct++;
  });
  let tableHtml = `<table><tr><th>Sub-topic</th><th>Score</th><th>%</th></tr>`;
  Object.entries(subtopics).forEach(([t,d]) => {
    const p = Math.round(d.correct/d.total*100);
    const cls = p>=70?'':'low';
    tableHtml += `<tr><td>${t}</td><td>${d.correct}/${d.total}</td><td><span class="pct-bar"><span class="pct-bar-fill ${cls}" style="width:${p}%"></span></span>${p}%</td></tr>`;
  });
  tableHtml += `</table>`;
  document.getElementById('subtopicTable').innerHTML = `<h3 style="margin-top:0;color:#1a2a4a;">Sub-topic Breakdown</h3>${tableHtml}`;
  let cardsHtml = '<h3 style="color:#1a2a4a;">Question Review</h3>';
  QBANK.forEach((q,i) => {
    const userAns = state.answers[i];
    const correct = isCorrect(q, userAns);
    const status = !userAns && userAns !== '0' ? 'skipped' : correct ? 'correct' : 'wrong';
    const statusLabel = status==='correct'?'✓ Correct':status==='wrong'?'✗ Wrong':'— Skipped';
    let cardHtml = `<div class="result-card ${status==='correct'?'':'wrong'}">
      <div class="rc-header">
        <span class="rc-q">Q${i+1} — ${q.subTopic}</span>
        <div class="rc-tags">
          <span class="tag diff-${q.difficulty}">${q.difficulty}</span>
          <span class="tag status-${status}">${statusLabel}</span>
          ${state.guesses[i]?'<span class="tag guessed">Guessed</span>':''}
        </div>
      </div>
      <div style="font-size:14px;margin-bottom:12px;">${q.questionText}</div>`;
    if (q.questionType==='number') {
      cardHtml += `<div class="num-result">
        <div class="num-result-box ${status==='correct'?'user-correct':'user-wrong'}"><div class="lbl">Your Answer</div><div class="val">${q.prefix||''}${userAns||'—'}</div></div>
        <div class="num-result-box correct-ref"><div class="lbl">Correct Answer</div><div class="val">${q.prefix||''}${q.numAns.toLocaleString()}</div></div>
      </div>`;
    } else {
      const ansArr = (q.questionType==='multi'?q.correctOptions:[q.correctAnswer]);
      cardHtml += q.options.map(o => {
        const isCorrectOpt = ansArr.includes(o.letter);
        const isUser = q.questionType==='multi' ? (userAns||'').split(',').includes(o.letter) : userAns===o.letter;
        let cls = '';
        if (isCorrectOpt) cls = 'correct';
        else if (isUser && !isCorrectOpt) cls = 'user-wrong';
        return `<div class="result-opt ${cls}"><strong>${o.letter}.</strong> ${o.text}
          ${isCorrectOpt?'<span class="badge correct">✓ Correct</span>':''}
          ${isUser&&!isCorrectOpt?'<span class="badge user-wrong">✗ Your answer</span>':''}
          <div class="why">${o.why}</div></div>`;
      }).join('');
    }
    cardHtml += `<div class="what-tests"><div class="lbl">What this tests</div>${q.explanationLayer1}</div>`;
    cardHtml += `<div class="working-block">${q.workingShown}</div>`;
    if (q.standard_ref || q.explanationLayer3) cardHtml += `<div class="standard-ref"><div class="lbl">Standard Reference</div>${q.explanationLayer3||''}</div>`;
    if (q.examinerNote) cardHtml += `<div class="examiner-note"><div class="lbl">Examiner Note</div>${q.examinerNote}</div>`;
    if (q.advanced) cardHtml += `<div class="advanced-note"><div class="lbl">Advanced Context</div>${q.advanced}</div>`;
    if (q.teacherCommentary) {
      const tc = q.teacherCommentary;
      cardHtml += `<div class="teacher-commentary"><div class="lbl">Teacher Commentary</div>
        ${tc.concept?`<div class="tc-row"><span class="tc-label">Concept: </span>${tc.concept}</div>`:''}
        ${tc.process?`<div class="tc-row"><span class="tc-label">Process: </span>${tc.process}</div>`:''}
        ${tc.everyday?`<div class="tc-row"><span class="tc-label">Real-world: </span>${tc.everyday}</div>`:''}
      </div>`;
    }
    cardHtml += `</div>`;
    cardsHtml += cardHtml;
  });
  document.getElementById('resultsCardContainer').innerHTML = cardsHtml;
}
function isCorrect(q, userAns) {
  if (!userAns && userAns !== '0' && userAns !== 0) return false;
  if (q.questionType === 'number') {
    const ua = parseFloat(userAns);
    return !isNaN(ua) && Math.abs(ua - q.numAns) <= (q.tol || 0);
  }
  if (q.questionType === 'multi') {
    const ua = (userAns||'').split(',').filter(Boolean).sort().join(',');
    const ca = (q.correctOptions||[]).sort().join(',');
    return ua === ca;
  }
  return String(userAns).trim() === String(q.correctAnswer).trim();
}
// ========== NAV GRID ==========
function buildNavGrid() {
  const grid = document.getElementById('navGrid');
  let html = `<div class="nav-section-label">OT Questions</div>`;
  for (let i=0; i<OT_COUNT; i++) html += `<div class="nav-cell" id="nc_${i}" onclick="jumpTo(${i})">${i+1}</div>`;
  html += `<div class="nav-section-label">MTQ</div>`;
  html += `<div class="nav-cell" id="nc_mtq" onclick="goToMTQ()" style="grid-column:span 4;font-size:11px;">MTQ (10 marks)</div>`;
  grid.innerHTML = html;
  updateNavGrid();
}
function updateNavGrid() {
  for (let i=0; i<OT_COUNT; i++) {
    const el = document.getElementById(`nc_${i}`);
    if (!el) continue;
    let cls = 'nav-cell';
    if (state.answers[i] !== undefined && state.answers[i] !== '') cls += ' answered';
    if (state.flags[i]) cls += ' flagged';
    if (i === state.currentQ) cls += ' current';
    el.className = cls;
  }
  const answered = Object.keys(state.answers).length;
  document.getElementById('navCount').textContent = `${answered}/${OT_COUNT}`;
}
function jumpTo(idx) {
  showOTView();
  document.getElementById('subBar').style.display = 'flex';
  state.currentQ = idx;
  renderQuestion(idx);
}
// ========== CALCULATOR ==========
let calcExpr = '';
function toggleCalc() { document.getElementById('calcWidget').classList.toggle('visible'); }
function calcInput(val) {
  const d = document.getElementById('calcDisplay');
  if (val === 'C') { calcExpr = ''; d.value = '0'; return; }
  if (val === '=') {
    try { calcExpr = String(eval(calcExpr)); d.value = calcExpr; }
    catch(e) { d.value = 'Error'; calcExpr = ''; }
    return;
  }
  calcExpr += val;
  d.value = calcExpr;
}
// ========== PERSISTENCE ==========
function saveState() {
  if (state.mtqWorking) { const el = document.getElementById('mtqWorking'); if(el) state.mtqWorking = el.value; }
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function loadState() {
  try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : null; }
  catch(e) { return null; }
}
function restartTest() { localStorage.removeItem(STORAGE_KEY); location.reload(); }
// ========== DOWNLOAD / SYNC ==========
function downloadJSON() {
  const results = buildResultsObj();
  const blob = new Blob([JSON.stringify(results, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `fa_intangibles_provisions_pool_a_${Date.now()}.json`; a.click();
}
function buildResultsObj() {
  let otCorrect=0, otMarks=0;
  QBANK.forEach((q,i) => { if(isCorrect(q,state.answers[i])) { otCorrect++; otMarks += q.marks; } });
  const mtqMarks = Object.values(state.mtqSelf||{}).reduce((a,b)=>a+b,0);
  return { topic: TOPIC_NAME, pool: POOL_NAME, storageKey: STORAGE_KEY,
    date: new Date().toISOString(), totalMarks: otMarks+mtqMarks, maxMarks: OT_COUNT*2+10,
    otMarks, mtqMarks, otCorrect, answers: state.answers, mtqSelf: state.mtqSelf,
    timeTaken: TOTAL_MINUTES*60-state.timerRemaining };
}
function syncToDashboard() {
  const results = buildResultsObj();
  const DASHBOARD_KEY = 'fa_dashboard_pending_imports';
  const pending = JSON.parse(localStorage.getItem(DASHBOARD_KEY) || '[]');
  pending.push(results);
  localStorage.setItem(DASHBOARD_KEY, JSON.stringify(pending));
  alert('Synced to Dashboard! Open FA_Master_Dashboard_v3_1.html on md-acca.github.io to import.');
}
function downloadPDF() {
  document.querySelectorAll('.result-card:not(.wrong)').forEach(el => el.style.display='none');
  window.print();
  document.querySelectorAll('.result-card').forEach(el => el.style.display='block');
}
// ========== INIT ==========
window.addEventListener('load', () => {
  document.getElementById('homeScreen').style.display = 'flex';
});
</script>
